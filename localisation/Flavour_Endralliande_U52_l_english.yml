  #modifiers
  end_factionalism_6:0 "Factionalism: Apocalyptic"
  desc_end_factionalism_6:0 "The government so to say is simply a collection of professional believers and known opinion havers at the best of times, as it relates to enforcing laws, implementing policy, administering far-flung reaches of our nation, or regulating the markets, the government is powerless."
  end_factionalism_5:0 "Factionalism: Disasterous"
  desc_end_factionalism_5:0 "Internal factions within Endralliande are in a state of chaotic struggle which poses a considerable risk to cabinet stability and has disasterous effects on our ability to implement policy."
  end_factionalism_4:0 "Factionalism: Crisis-ridden"
  desc_end_factionalism_4:0 "The factions within our nation constantly undermine our administration's ability to govern the land and cripple its ability to implement new policies."
  end_factionalism_3:0 "Factionalism: Fractured"
  desc_end_factionalism_3:0 "Experts on domestic politics and enlightened individuals alike warn against the fracturous state of our internal politics and how it reduces our ability to govern the land."
  end_factionalism_2:0 "Factionalism: Troubled"
  desc_end_factionalism_2:0 "Current level of factionalism is tangibly affecting our ability to administer the country."
  end_factionalism_1:0 "Factionalism"
  desc_end_factionalism_1:0 "Factionalism in Endralliande is currently as expected in the early stages of a republic."
  end_noble_ruler_modifier:0 "Foreign Nobles In Office"
  end_local_ruler_modifier:0 "Local Elites In Office"
  end_elven_ruler_modifier:0 "Elven Military Administration"
  end_mistmancer_ruler_modifier:0 "Conclave of the Mistmancers In Power"
  end_agrarian_ruler_modifier:0 "New Agrarian Class Administration"
  end_industrialist_ruler_modifier:0 "West Coaster Industrialist-Technocratic Alliance"
  end_imperialist_ruler_modifier:0 "Imperialist Administration"
  end_increase_trade_tariffs_modifier:0 "Increased Trade Tariffs"
  desc_end_increase_trade_tariffs_modifier:0 "Using our superior bargaining position and chokehold on maritime trade, we've forced foreign merchants to accept paying higher trade tariffs."
  end_increase_trade_tariffs_modifier_local:0 "Increased Tariffs Hit Trade Centers"
  desc_end_increase_trade_tariffs_modifier_local:0 "The increased tariffs have made it more difficult to attract foreign investors."
  end_empower_westport_modifier:0 "Empowered The Westport Office"
  desc_end_empower_westport_modifier:0 "Our trade office in Westport has been given sweeping authority to persue favorable trade deals abroad and give shipping permits independently of central government."
  end_empower_westport_modifier_local:0 "Investment Surge"
  desc_end_empower_westport_modifier_local:0 "Greater freedom of trade and navigation has attracted an unprecedented level of interest from foreign merchants and governments who wish to acquire property and trade rights within our trade centers."
  end_mistmancer_ruler_inland_modifier:0 "Lack of Lighthouse Coverage"
  desc_end_mistmancer_ruler_inland_modifier:0 "Without proper Lighthouse coverage, this province remains hard to access."
