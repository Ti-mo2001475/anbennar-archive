l_english:

  #events
  flavour_endralliande.1.t:0 "Call for Elections!"
  flavour_endralliande.1.d:0 "placeholder"
  flavour_endralliande.1.c:0 "We must push for a re-election!"
  flavour_endralliande.1.a:0 "We need fair and free elections!"
  flavour_endralliande.1.b:0 "We must help our favorite faction win!"

  flavour_endralliande.2.t:0 "Public Debate Held"
  flavour_endralliande.2.d:0 "placeholder"
  flavour_endralliande.2.a:0 "The winner is quite obvious."

  flavour_endralliande.3.t:0 "Faction Gains Public Endorsment"
  flavour_endralliande.3.d:0 "placeholder"
  flavour_endralliande.3.a:0 "The Old Guard holds much sway..."

  flavour_endralliande.4.t:0 "Massive Scandal!"
  flavour_endralliande.4.d:0 "placeholder"
  flavour_endralliande.4.a:0 "Shameful, shameful I say!"

  flavour_endralliande.5.t:0 "State Revises Election Law"
  flavour_endralliande.5.d:0 "placeholder"
  flavour_endralliande.5.a:0 "Convinient timing innit?"

  flavour_endralliande.6.t:0 "News From Abroad"
  flavour_endralliande.6.d:0 "placeholder"
  flavour_endralliande.6.a:0 "Uncertain times."

  flavour_endralliande.7.t:0 "Mass Hysteria!"
  flavour_endralliande.7.d:0 "placeholder"
  flavour_endralliande.7.a:0 "There are patterns we do not yet understand."
  flavour_endralliande.7.b:0 "The land has always spoken."

  flavour_endralliande.8.t:0 "Public Demonstrations"
  flavour_endralliande.8.d:0 "placeholder"
  flavour_endralliande.8.a:0 "We need a responsible government!"

  flavour_endralliande.9.t:0 "Faction Grand Congress Held!"
  flavour_endralliande.9.d:0 "placeholder"
  flavour_endralliande.9.a:0 "An impressive show of unity indeed."

  flavour_endralliande.10.t:0 "Ballots Reveal A Winner!"
  flavour_endralliande.10.d:0 "placeholder"
  flavour_endralliande.10.a:0 "Have the people finally spoken?"

  flavour_endralliande.11.t:0 "Factions Call for a United Government"
  flavour_endralliande.11.d:0 "placeholder"
  flavour_endralliande.11.a:0 "Let us form a united front."
  flavour_endralliande.11.b:0 "A United Opposition topples the current government!"
  flavour_endralliande.11.c:0 "And fracture the status quo? Never!"

  flavour_endralliande.12.t:0 "Forming The Cabinet"
  flavour_endralliande.12.d:0 "We can invite other factions to fill up some powerful cabinet positions, or refuse and staff the cabinet with our own party members"
  flavour_endralliande.12.a:0 "Offer Ministery of the Treasury to the Aristocrats."
  flavour_endralliande.12.b:0 "Offer Ministery of the Interior to the Local Elites."
  flavour_endralliande.12.c:0 "Offer Ministery of Defence to the Standard Elven Army."
  flavour_endralliande.12.e:0 "Offer Ministery of the Arcane to the Mistmancers."
  flavour_endralliande.12.f:0 "Offer Ministery of Agriculture to the Agrarian faction."
  flavour_endralliande.12.g:0 "Offer Ministery of Science and Education to the Technocrats."
  flavour_endralliande.12.h:0 "Offer Ministery of the Extraterritorial to the Trade Company Representatives."
  flavour_endralliande.12.i:0 "It is done."

  flavour_endralliande.13.t:0 "Factions Lobby for Support"
  flavour_endralliande.13.d:0 "placeholder"
  flavour_endralliande.13.a:0 "We shall back the Aristocrat"
  flavour_endralliande.13.b:0 "We shall back the Local Elite"
  flavour_endralliande.13.c:0 "We shall back the Elven Officer"
  flavour_endralliande.13.e:0 "We shall back the Mistmancer"
  flavour_endralliande.13.f:0 "We shall back the East Coaster Agrarian"
  flavour_endralliande.13.g:0 "We shall back the West Coaster Indusrialist"
  flavour_endralliande.13.h:0 "We shall back the Trade Company Representative"

  #government
  overseas_governorate:0 "Overseas Governorate"
  overseas_governorate_desc:0 "A newborn republic located far away from the rusty institutions of the old world. Reflecting the will of its elites more than the average population, Endrallianders believe this form of government is capable of democratizing power over time while being representative enough not to descend towards autocratic rule."
  ability_end_overseas_governorate:0 "Endralliander Overseas Governorship"
  foreign_dependency:0 "Foreign Dependency"
  foreign_dependency_gain_modifier:0 "Foreign Dependency Gain"

  #estates
  estate_burghers_end_progressive_factions:0 "Political Organization: Progressive Factions"
  estate_nobles_end_conservative_factions:0 "Political Organization: Conservative Factions"
  estate_burghers_end_progressive_factions_desc:0 "Representing Endralliande-born elite factions, this broad categorization includes factions that despite starkly different approaches, advocate for moving beyond traditional means of republican administration and push for adopting new, often radical, policies.\n\n§TFaction Attitudes towards current administration§!:\n\n[Root.end_agrarian_happiness_loc]\n\n[Root.end_industrialist_happiness_loc]\n\n[Root.end_imperialist_happiness_loc].\n\n§OUnhappy factions directly increase Factionalism level!§!"
  end_agrarian_happiness_loc_locked:0 "The New Agrarian Class is not a significant force within national politics yet."
  end_agrarian_happiness_loc_unhappy:0 "The New Agrarian Class is considered an §ROpposition Group§!! Giving the following malus:\nRandom Candidate Bonus: §R-1§!"
  end_agrarian_happiness_loc_neutral:0 "The New Agrarian Class is currently §gNon-Aligned§!! Granting no bonus or maluses."
  end_agrarian_happiness_loc_happy:0 "The New Agrarian Class is currently §GGovernment-Aligned§!! Granting the following bonuses:\nEstate Loyalty Change on Privilege Revoked: §G+5%§!\nRandom Candidate Bonus: §G+1§!"
  end_industrialist_happiness_loc_locked:0 "The West-Coaster Industialists and Technocrats are not a significant force within national politics yet."
  end_industrialist_happiness_loc_unhappy:0 "The Industrialist-Technocrat Alliance is considered an §ROpposition Group§!! Giving the following malus:\n Random Candidate Bonus: §R-1§!"
  end_industrialist_happiness_loc_neutral:0 "The Industrialist-Technocrat Alliance is currently §gNon-Aligned§!! Granting no bonus or maluses."
  end_industrialist_happiness_loc_happy:0 "The Industrialist-Technocrat Alliance is currently §GGovernment-Aligned§!! Granting the following bonuses:\nArtificer Capacity §G+10§!\nRandom Candidate Bonus: §G+1§!"
  end_imperialist_happiness_loc_locked:0 "The Trade Company Representatives are not a significant force within national politics yet."
  end_imperialist_happiness_loc_unhappy:0 "Trade Company Representatives are considered an §ROpposition Group§!! Giving the following malus:\nRandom Candidate Bonus: §R-1§!"
  end_imperialist_happiness_loc_neutral:0 "Trade Company Representatives are currently §gNon-Aligned§!! Granting no bonus or maluses."
  end_imperialist_happiness_loc_happy:0 "Trade Company Representatives are currently §GGovernment-Aligned§!! Granting the following bonuses: Liberty Desire From Subjects Development: §G-10%§!\nRandom Candidate Bonus §G+1§!"
  estate_nobles_end_conservative_factions_desc:0 "Originating from the old world elite who invested in the dream of a new beginning, these factions would also bring the old world's traditions and ideas with them. Despite their many differences, they believe success stems from correct implementation of the true and tested methods, rather than radical changes that would upset society.\n\n§TFaction Attitudes towards current administration§!:\n\n[Root.end_local_happiness_loc]\n\n[Root.end_noble_happiness_loc]\n\n[Root.end_elven_happiness_loc]\n\n§OUnhappy factions directly increase Factionalism level!§!"
  end_noble_happiness_loc_unhappy:0 "The Foreign Nobility is considered an §ROpposition Group§!! Giving the following malus:\nRandom Candidate Bonus: §R-1§!"
  end_noble_happiness_loc_neutral:0 "The Foreign Nobility are currently §gNon-Aligned§!! Granting no bonus or maluses."
  end_noble_happiness_loc_happy:0 "The Foreign Nobility is currently §GGovernment-Aligned§!! Granting the following bonuses:\n:Diplomatic Advisor Costs §G-15%§!\nRandom Candidate Bonus: §G+1§!"
  end_local_happiness_loc_unhappy:0 "The Local Merchants are considered an §ROpposition Group§!! Giving the following malus:\nRandom Candidate Bonus: §R-1§!"
  end_local_happiness_loc_neutral:0 "The Local Merchants are currently §gNon-Aligned§!! Granting no bonus or maluses."
  end_local_happiness_loc_happy:0 "The Local Merchants are currently §GGovernment-Aligned§!! Granting the following bonuses:\n:Provencial Trade Power Modifier §G+10%§!\nRandom Candidate Bonus: §G+1§!"
  end_elven_happiness_loc_locked:0 "The Standard Elven Army is not a significant force within national politics yet."
  end_elven_happiness_loc_unhappy:0 "The Standard Elven Army is considered an §ROpposition Group§!! Giving the following malus:\nRandom Candidate Bonus: §R-1§!"
  end_elven_happiness_loc_neutral:0 "The Standard Elven Army is currently §gNon-Aligned§!! Granting no bonus or maluses."
  end_elven_happiness_loc_happy:0 "The Standard Elven Army is currently §GGovernment-Aligned§!! Granting the following bonuses:\nReinforce Speed §G+10%§!\nRandom Candidate Bonus: §G+1§!"
  estate_mages_end_political_apparatus:0 "Mistmancers Political Apparatus"
  estate_mages_end_political_apparatus_desc:0 "The Mistmancers, seeing their interests threatened by merchants and other elite, have banded together with other mages to form a grand covenant of mages, hoping to advocate for their own interests in the country.\n\n§TFaction Attitudes towards current administration§!:\n\n[Root.end_mistmancer_happiness_loc]\n\n§OUnhappy factions directly increase Factionalism level!§!"
  end_mistmancer_happiness_loc_unhappy:0 "The Mistmancers are considered an §ROpposition Group§!! Giving the following malus:\nRandom Candidate Bonus: §R-1§!"
  end_mistmancer_happiness_loc_neutral:0 "The Mistmancers are currently §gNon-Aligned§!! Granting no bonus or maluses."
  end_mistmancer_happiness_loc_happy:0 "The Mistmancers are currently §GGovernment-Aligned§!! Granting the following bonuses:\n:Mana Regeneration Modifier §G+10%§!\nRandom Candidate Bonus: §G+1§!"

  #tooltips
  end_flavour_11_shownumber_tt:0 "Overall, [Root.end_total_vote_count.GetValue] election favors were earned, the winner having earned [Root.end_winner_vote_count.GetValue] of them."
  end_can_form_coalition:0 "The winning faction earned less than half of total election favors."
  end_flavour_11_majority_tt:0 "Since the winning faction has a comfortable majority, they can form a government all on their own."
  end_flavour_11_nomajority_tt:0 "Since the winning faction does not enjoy a majority, they can exploit infighting within other factions to form a government, but the opposition will be immense."
  end_refund_rt_from_totalvotes:0 "Some amount of Republican Tradition will be added to our republic based on the number of total votes and current coalition's popularity."
  end_nobles_happy_with_choice_tt:0 "Other Foreign Aristocrats are delighted by our decision and have chosen to provide our campaign efforts with a generous donation."
  end_local_happy_with_choice_tt:0 "Local Elites have pledged to help organize rallies, gatherings, and events meant to boost our campaign efforts."
  end_elven_happy_with_choice_tt:0 "The Standard Elven Army will organize prades and equip our republican guards in order to show their presence and support our campaigning efforts."
  end_mistmancer_happy_with_choice_tt:0 "A group of particularly opinionated mystics have promised to help us govern the land and tend to arcane matters if we help their candidate with their campaigning efforts!"
  end_agrarian_happy_with_choice_tt:0 "The New Agrarians promise to fully cover our campaign expenses and convince the clergy to lend our efforts legitimacy, essentially validating our call for an East Coaster New Agrarian to be elected."
  end_industrialist_happy_with_choice_tt:0 "An alliance of Technocrats and Industrialists has formed with the aim to lobby on behalf of a West Coaster industrial magnate. They promise us their full intellectual support should we back this candidate."
  end_imperialist_happy_with_choice_tt:0 "Our overseas provinces have sent a note promising full co-operation should we back the Trade Company Representative. This includes anything from generous "donations" to holding local elections to "de-emphasizing" demands for more autonomy.\nAdd 1 year of trade income."
  end_noble_candidate_ruler_infdesc:0 "Aristocrats Win the Elections"
  end_local_candidate_ruler_infdesc:0 "Local Elites Win the Elections"
  end_mage_candidate_ruler_infdesc:0 "The Mistmancers Win the Elections"
  end_industrialist_candidate_ruler_infdesc:0 "The Industrialists and Technocrats Win"
  end_flavour_11_coalitionpossible_tt:0 "The winning faction did not gain a majority and the opposition can topple them."
  end_flavour_11_foropposition_shownumber_tt:0 "Overall, [Root.end_total_vote_count.GetValue] election favors were earned, the winner having earned [Root.end_winner_vote_count.GetValue] of them - meaning they did not gain a majority and we can topple them if an opposition coalition was to form."
  end_random_1_favor_tt:0 "A random faction gains §G1§! election favor."
  end_random_2_favor_tt:0 "A random faction gains §G2§! election favor."
  end_assembly_of_the_elite_manuevering:0 "The Assembly of the Elite has a §Y50%§! chance to be a wider alliance, gaining an additional §G2§! £adm£ and §G2§! £mil£, in return for §YReducing Mercantilism§! by §R3§! and §YMerchant Guild§! Estate loyalty by §R10§!!"

