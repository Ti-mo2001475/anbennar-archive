  end_assembly_of_the_elite_manuevering:0 "The Assembly of the Elite has a §Y50%§! chance to be a wider alliance, gaining an additional §G2§! £adm£ and §G2§! £mil£, in return for §YReducing Mercantilism§! by §R3§! and §YMerchant Guild§! Estate loyalty by §R10§!!"
  end_can_form_coalition_tt:0 "It is possible for us to form a Coalition Government"
  end_mistmancer_ruling_ability_tt:0 "§YEvery Owned Province§! with a §YMage Tower§! gains §G-10%§! Development Cost for §Y5 Years§!.\n\n§YEvery Inland Province without a Mage Tower§! gains §R+5%§! Development Cost for §Y5 Years§!."
  end_agrarian_ruler_modifier_2_tt:0 "§YEvery Owned Province§! with §YSlaves§! as its trade good receives §G+15%§! Trade Value for §Y5 Years§!, §Rthis effect will no longer be available if we abolish slavery!§!"
  end_agrarian_ruler_modifier_tt:0 "§YEvery Owned Province§! with a §YFarm Estate§! or §YPlantation§! manufactury receives §G+25%§! Local Production Efficiency for §Y5 Years§!."
  end_agrarian_coalition_ability_tt:0 "§YEvery Owned Province§! with a §YLarge Orcish Minority§! or an §YOrcish Majority§! has a §Y15% chance§! to gain §G1§! Random Development"
  end_industrialist_coalition_ability_tt:0 "§YDeduct§! §R1§! §YYear of Tax Income§! and Gain §G2§! §YYears of Production Income from Provinces§!."
  end_imperialist_ruling_ability_tt:0 "Gain §G10§! Power Projection, being §YNaval Hegemon§! or §YEconomic Hegemon§! increases this amount to §G25§!."
  end_imperialist_coalition_ability_tt:0 "Up to §Y5 Trade Company Provinces§! that do not already have the modifier gain:"
  end_maximum_influence_tooltip_tt:0 "§RReaching Maximum Foreign Influence risks subjugating ourselves to foreign powers!§!\n\nThis can be avoided by completing the mission §Y"Bride of Lencenor"§!, or alternarively with §YNo Countries with Capital located in the Lencenor Region§!."
  end_impending_subjugation_tooltip_tt:0 "In §Y5 Years§!, we will become a §YSubject§! of the §YCountry with the highest amount of development in Lencenor§!. Disaster may still be avoided by §Yreducing foreign influence below 90§!, or alternatively by §Yno countries having a capital in Lencenor Region§!."
  end_sovereingty_crisis_active_tt:0 "§REndralliande's Sovereignty Crisis is currently active, must reduce foreign dependency to a value below 85 as soon as possible!§!"
  end_add_trade_tariffs_province_tt:0 "Every province with a §YCenter of Trade§! gets §YIncreased Trade Tariffs Hit Trade Centers§! until this government ability is revoked, giving the following effects:\nLocal Development Cost:§R +10%§!"
  end_remove_trade_tariffs_province_tt:0 "§YIncreased Trade Tariffs Hit Trade Centers§! will be removed from every province with a §YCenter of Trade§!."
  end_remove_empower_westport_local_modifier_tt:0 "§YInvestment Surge§! will be removed from every province with a §YCenter of Trade§!."
  end_empower_westport_local_modifier_tt:0 "Every province with a §YCenter of Trade§! gets §YInvestment Surge§! until this government ability is revoked, giving the following effects:\nLocal Development Cost:§G -10%§!"
  end_mistmancer_coalition_ability_tt:0 "Up to §Y2§! owned provinces producing §YDamestear§! will receive '§YRich Damestear Deposit§!', giving the following effects:\nLocal Goods Produced:§G +3§!\nIf Rich Damestear Deposit already present, gain §G+20%§! Local Production Efficiency for §Y5§! years instead.\nEvery owned province producing Damestear will receive §G1§! £GFX_text_icon_production_in_text£ Development.\n\nAlternatively, if no Damestear producing provinces are owned, restore §G30§! Mana."
