############
##DECISIONS#
############

 serpentshead_straits_decision_title:0 "Enforce the Frostbridges Toll"
 serpentshead_straits_decision_desc:0 "For as long as can be remembered, the Frostbridges Strait has been taxed by who can control it. However, throughout the years none have attained complete control, with Reachmen sailors in Eyegard contending with Gerudian reavers in Sporreyn for control of the Straits. With a weak control over the straits, powers in the Giant's Grave Sea have gotten away with free access in and out to the greater world. No longer! With our mighty realm controlling the islands and lands at the bottleneck of the Serpentshead, our fleets can tax all the trade entering in and out, and starve our enemies in the Giant's Grave Sea!"

############
###EVENTS###
############

 gerudia.1.t:0 "Plots of the Reaver Port"
 gerudia.1.d:0 "In the years following Bjarnrík's ban of raiding, Revrhavn has become the principal port of raiders from the Dalr valley. Revrhavn was already the preferred port of Reavers, allowing for vast hoards to be kept lawfully. Although allowed by a provision from the crown, many Revrhavnic fear that their way of life is being threatened.\n\nA council of the most influential Reavers, merchants and burghers have convened during the invasion of Obrtrol to decide what can be done. Some say that we should directly demand autonomy and privileges from the King Sven II Bjarnnson, while others are cautious and warn that antagonizing him will bring us ruin. What should we do, [Root.Monarch.GetTitle]?"
 gerudia.1.a:0 "Confront King Sven II Bjarnnson, he must hear our demands!"
 gerudia.1.b:0 "Perhaps this is not a good idea."
 gerudia.2.t:0 "Revrhavn Demands Privileges!"
 gerudia.2.d:0 "Representatives from Revrhavn have approached King Sven II Bjarnnson, demanding further protection of the raiding way of life. They cite that the kingdom of Bjarnrík has encroached upon their ancient and sovereign way of life, and they think that they can dare make such demands during wartime against our primordial enemies, the Trolls. Little do they know that it is in our best interests to maintain friendly relations with outside nations, and that Revrhavn's right to raid is well protected under our laws and clauses. \n\nHow should we deal with these insubordinates, my liege?"
 gerudia.2.a:0 "I'll sign their demands, we need their support against the Trolls."
 gerudia.2.b:0 "They're no better than the Trolls, Bring me my axe, now!"
 gerudia.3.t:0 "Consult with the Skalds"
 gerudia.3.d:0 "Our officials have arrived in the city-temple of Skaldol and begun conversing with the Skalds on what can be done. Many of the Skalds have recited ancient tales as talking points or even as direct proof of their opinion, but others remain grounded and aware of the political reality faced. Both our representatives and the Skalds agree that something must be done to contain the Gray Orcs of Frozenmaw, and combat the Alenic peoples, most notably the Gawedi. Some suggest the Council of Skalds should unite with Bjarnrík like in the time of Bera, while others claim that no authority is above the Skalds and that their independence is paramount. \n\nWhat proposal should our diplomats suggest? According to ancient law the Skalds should be subservient to the Konungr, if they will not listen then they forfeit their right to their lands. The decision lies to you, Konungr."
 gerudia.3.a:0 "The Council of Skalds will be subservient to the Konungr."
 gerudia.3.b:0 "If they will not accept our deal, we will force them to!"
 gerudia.3.c:0 "All this dialogue is exhausting, let it end!"
 gerudia.4.t:0 "An Offer of Subservience"
 gerudia.4.d:0 "The Council of Skalds has discussed indepth whether or not to unify with Bjarnrík, concerned that in these times our holy city runs the risk of falling into Orcish hands. Some say that our safety lies best with Bjarnrík, while others claim that none have authority of the Skalds and we should remain independent. As Master Skald, you have the final decision: what will it be?"
 gerudia.4.a:0 "Once we served Bera against the Trolls; we will do so again."
 gerudia.4.b:0 "None have the authority to command us, not even a Konungr!"
 gerudia.5.t:0 "The Council of Skalds Accepts of Offer"
 gerudia.5.d:0 "To much relief, the Master Skald and the Council have accepted our offer to protect the Skalds in exchange for their subservience to the Konungrdom of Bjarnrík. All of Gerudia may rest easy now that the holy city of Skaldol is safe!"
 gerudia.5.a:0 "Let us make a toast with the finest mead!"
 gerudia.6.t:0 "The Skalds Refuse our Offer"
 gerudia.6.d:0 "The Council of Skalds remains defiant in these times: none may order them, none are above the supremacy of the Master Skald. They have asked our diplomats to leave, politely."
 gerudia.6.a:0 "Betrayal, what Skalds are these to question Me!?"
 gerudia.7.t:0 "Bjarnrík Pushes Claims"
 gerudia.7.d:0 "The Bjarnríki diplomats have thought on our discussion, and have decided that they do not value our decision. Claiming that the Skalds are to be subservient to the Konungr, they have declared that our Council is unfit to serve and lands our unrightfully held."
 gerudia.7.a:0 "But it was a generous offer!"
 gerudia.8.t:0 "Principality of Celmaldor"
 gerudia.8.d:0 "The fair city of Maldarion the Navigator thought they could unite the Reachmen to stop our expansion and take the Jotunsglotta, but they have failed. Their armies have surrendered, the city is ours. However, they still hold great influence across the cities and trading fleets. It may be wise to allow them some autonomy and utilize their connections, or should be seize their port directly? The Gerudians have long been envious of Celmaldor's extensive and beautiful docks, our shipwrights eager to utilize them."
 gerudia.8.a:0 "Celmaldor's assets and connections will serve us."
 gerudia.8.b:0 "What wondrous ships can we make now?"
 gerudia.9.t:0 "Derhilde Reaverqueen's Legacy"
 gerudia.9.d:0 "It has been many years since Deranne has been conquered and integrated, with new generations being born and raised under the Crown of Bera. The Derannic people were once like Gerudians before becoming a shade of the Lorentish, but over these new generations the people have begun to adopt their Gerudian roots again. Once and now known as the Talderannics, this country has become an integral part of Gerudian culture oncemore."
 gerudia.9.a:0 "A new tale shall be written for this!"
 gerudia.9.b:0 "But they still are Derannic - no?"
 gerudia.10.t:0 "Children of Henrik Divenscourge"
 gerudia.10.d:0 "Henrik Divenscourge conquered modern Pearlsedge from the old Tretunic Kingdom, a realm wedged between the then faltering kingdoms of Lorent and Dameria. His son Harald founded the Pearlman dynasty by marrying with the local Andarta Tretunis, whose bloodline continued all the way to the modern síl na Trísfers. The Reaver settlers of this land became the Pearlsedgers, and have over time become more and more like their Damerian neighbours. After the reclamation of Henrik's kingdom, the people of this land have returned the practices of their founder, becoming known as the Perlatter."
 gerudia.10.a:0 "May Henrik's sons have many more children!"
 gerudia.10.b:0 "They are just Damerians with bald heads!"
 gerudia.11.t:0 "Artificers and Skalds"
 gerudia.11.d:0 "The hum and churn of the furnaces threaten to overtake the chanting and singing of the Skalds in this industrial age. Both see each other as enemies, either as reactionary or radical, unwilling to make compromise. Both offer a vision for the Bjarnrík's future: the Skalds wish to spread the tales throughout the world so that Elkaesal will never wake, and the Artificers wish to be rid of the shackles of the past and enter a new age of gears, smoke, and iron."
 gerudia.11.a:0 "The Skalds have never failed us!"
 gerudia.11.b:0 "Now is the age of industry, not of old tales!"
 gerudia.12.t:0 "The Crown of Bera"
 gerudia.12.d:0 "The Konungdomr of Bjarnrík has seen more stable and prosperous times. In the far north of Cannor, Gerudia has always been a cold and difficult place to live. Plagued with regional warlords for most of recorded history, many Gerudians had migrated overseas during the Era of Black Ice. However, with the return of Bera Bjarnsson in 882 AA, the Dalr Valley was united for the first time under the Crown of Bera. Under her kingdom, the disparate regions of the Dalr Valley were forced to cooperate for the first time.\n\nDuring the rise and fall of Black Castanor, Bjarnrík expanded it's influence across the Giant's Grave Sea. Only concerted efforts by the plucky Reachmen stopped permanent conquest of the southern coastline, with our greatest defeat at the hands of the Serpentgarders. With Black Castanorian cooperation, the konungdomr was able to send warriors and unwanted troublemakers overseas, and enjoyed favorable trade and raiding rights as far as the Bulwari coast. However, with the fall of Black Castanor and the defeat of the Sorcerer King, Bjarnrík found itself isolated and with its once valuable trade routes cut off.\n\nWithout the support of Black Castanor, the binding of the regions of Bjarnrík began to unravel. During the War of the Bears, brother was pitted against brother for the throne, nearly ending the rule of the Bjarnsson dynasty. In the end, the Sidaett-backed Totil Bjarnsson took the throne from the sitting Konungr Gunnarr. From then on, the authority of the crown dwindled and instead collected in the outlying regions, primarily Sidaett and Revrhavn.\n\nIn an attempt to modernize Bjarnrík and end the decentralized stranglehold, the act of reaving was outlawed in the early 15th century. However, from the port of Revrhavn reaving is still permitted, due to the long-standing power and wealth of it's captains. Half of Bjarnrík stands opposed to raiding and the practice of thralldom, while others profit from it. And meanwhile, brother steals land from brother, and Trolls continue to murder our people and ravage the land."
 gerudia.12.a:0 "Uneasy sits the head on which the crown sits..."
 gerudia.13.t:0 "Crown of Bera - Thralldom"
 gerudia.13.d:0 "While raiding has been banned in most of Bjarnrík, raiders of Revrhavn are still permitted. This has allowed them a monopoly of stolen goods, including thralls - enslaved peoples.\n\nRepresentatives from Sidaett and Várheim have come forward to protest the act of thralldom. They see it as a backward practice only done by those who cannot guide their people in the most menial tasks. Meanwhile, the Blodfjellers have backed up Revrhavn, themselves depending on thralls for their mines."
 gerudia.13.a:0 "It is time to end thralldom, once and for all!"
 gerudia.13.b:0 "A bit of compensation should ease tensions..."
 gerudia.13.c:0 "Thralldom is the way of our ancestors - I see no reason for that to change!"
 gerudia.14.t:0 "Crown of Bera - Troll Raids"
 gerudia.14.d:0 "The northwestern reaches of Bjarnrík border the treacherous Dalrfjall Mountains. The clans of Blodfjell and Sidaett have bought their land with the blood of their ancestors, and there is not a day without word of another massacre and raid by the accursed trolls.\n\nBlodfjell and Sidaett both feel that their role as the shield against the trolls has gone unappreciated, and that their fortresses rot even before their deaths. They call for the Konungr to renew our support of them, and gather a grand warchest to defend our lands again!"
 gerudia.14.a:0 "Blodfjell deserves our aid!"
 gerudia.14.b:0 "The Sidaetti are most deserving of our support!"
 gerudia.14.c:0 "Why won't anyone think of the treasury?!"
 gerudia.15.t:0 "Crown of Bera - Marital Issues"
 gerudia.15.d:0 "While the world toils away and wars cost families their sons and daughters, the nobles bicker and gossip. There is word at the court that the Drottning has been unfaithful, and that the Konungsson is no cub of the bear.\n\nThe Sidaetti urge you to publicly disown these rumors as a falsehood. However, something of doubt lingers in your mind. Could my son and heir be a wild oat of another man?\n\nSome have whispered that perhaps your own bastard is of greater royal blood, and that the house of Sidaett should be discarded in dishonor in place of a more faithful wife."
 gerudia.15.a:0 "Damn them and their rumours - she is our Drottning!"
 gerudia.15.b:0 "I cannot allow for disloyalty in my own household!"
 gerudia.15.c:0 "Dismiss the disloyal hag and her spawn! The Frondvagr lass will make a fine Drottning!"
 gerudia.16.t:0 "Crown of Bera - Strife in Várheim"
 gerudia.16.d:0 "A seemingly wild land of wind-blown grass and even less tamed people, Várheim has only begrudgingly bowed to the Crown of Bera. Their history with Bjarnland is one filled with contempt, but yet today the heirs of Torbjold petition you.\n\nThey claim that Revrhavn has been stealing their land through the settlement of their supposedly-retired reaver captains. Naturally, the Revrhavnic deny this allegation.\n\nThe Várheimers demand that you bring and end to this encroachment and theft, and also demand the right to protect their own autonomy."
 gerudia.16.a:0 "I want the meddling Revrhavnics out of Várheim!"
 gerudia.16.b:0 "Let the Várheimers know they have the full support of the Konungr in defending their lands!"
 gerudia.16.c:0 "Why should I care? The Revrhavnics should take what they want."
 gerudia.17.t:0 "Crown of Bera - Raiding"
 gerudia.17.d:0 "Lastly, it is clear that Bjarnrík cannot remain in a state of half-hearted prohibition of raiding. To the principalities of Cannor, we are nothing but weak-willed shadows of our ancestors who let thieves plunder their lands. To the Olavish, we are seen as cowards who reject the ways of our forebears.\n\nThe house of Sidaett is aligned with the Crown in ending the practice of raiding for good. Várheim and Frostbrygja are yet to openly declare, yet both have already followed our lead of ending raiding. Revrhavn has vigorously defended their right to raid, claiming that ending this will deprive us of everything that makes us Gerudians. The Blodfjellers shake their heads at this mess, insisting that we should be united in dealing with the Trolls, not infighting."
 gerudia.17.a:0 "From henceforth on, there will be no protection for Reavers and their thieving ilk!"
 gerudia.17.b:0 "Our contract with Revrhavn will continue to stand, as long as I am Konungr!"
 gerudia.20.t:0 "Crown of Bera - Schemes"
 gerudia.20.d:0 "It is undeniable that there have been tensions in Bjarnrík as of late. From the high halls in Konungrhavn, a tyrannical ruler has decided our fate without even a scruple for our wishes. The clans have gathered: they cannot stand for the Konungr's decisions, and urge we show him our strength!"
 gerudia.20.a:0 "Let us plot the demise of the Bear..."
 gerudia.20.b:0 "No, we will remain loyal to the Crown of Bera!"
 gerudia.21.t:0 "Crown of Bera - Storm Clouds"
 gerudia.21.d:0 "It has only been a few months since the last moot gathered, but its effects have been felt across Bjarnrík. Grumblings and whispers spoken behind backs, axes have been sharpened, and armies gathered. It seems that not all are happy with the proclamations of the Konungr."
 gerudia.21.a:0 "Most troubling news..."
 gerudia.21.b:0 "Carry out the fate of Revrhavn..."
 gerudia.21.c:0 "Carry out the fate of Sidaett"
 gerudia.21.dd:0 "Carry out the fate of Blodfjell"
 gerudia.21.e:0 "Carry out the fate of Várheim"
 gerudia.21.f:0 "Carry out the fate of Frostbrygja"
 gerudia.22.t:0 "Crown of Bera - Revolt!"
 gerudia.22.d:0 "Behind the scenes, disgruntled jarls of Bjarnrík have gathered their resources to fight against the tyranny of the Konungr. Axes sharpened, shields raised, it is time to take back what is deserved, and tear down the corrupt Crown of Bera!"
 gerudia.22.a:0 "To Arms!"
 gerudia.22.b:0 "On second thought..."
 gerudia.23.t:0 "Crown of Bera - Revolt!"
 gerudia.23.d:0 "Behind the scenes, disgruntled jarls of Bjarnrík have gathered their resources to fight against the tyranny of the Konungr. The calls for rebellion have reached your chambers, inviting you and your people and the quest for freedom. Axes sharpened, shields raised, it is time to take back what is deserved, and tear down the corrupt Crown of Bera!"
 gerudia.23.a:0 "To Arms!"
 gerudia.23.b:0 "On second thought..."
 gerudia.24.t:0 "Crown of Bera - Second War of the Bears"
 gerudia.24.d:0 "Treachery! Written on a blood-stained scroll, the dissenters have declared their independence from the Konungdomr! Not since the first War of the Bears have so many denied the authority of the Crown of Bera... and that resulted in the deposing of the sitting konungr. One thing is for certain: the Konungr must restore royal authority, and that will only be with blood spilt and bones broken!"
 gerudia.24.a:0 "By the Skald's One Broken Arm, I will not rest my axe until the traitors are dead!"
 gerudia.25.t:0 "The Crown of Bera - Broken"
 gerudia.25.d:0 "Victory! The throne of Konungrhavn sits empty, the crowned coward quivering in fear. No more will the Crown of Bera control our clans, our people. Our future is our own, forevermore!"
 gerudia.25.a:0 "Freedom from the beasts claws at last!"
 gerudia.26.t:0 "The Crown of Bera - Bloodied"
 gerudia.26.d:0 "Victory! The halls of the traitors are scoured, their heads taken. The opinions of the dissenters is forever silenced with their silenced lips. Let this be a reminder for all - the Crown of Bera is supreme!"
 gerudia.26.a:0 "There will be no room for dissent evermore!"
 gerudia.27.t:0 "The End of Bera's Kingdom"
 gerudia.27.d:0 "Shame. The traitors have ransacked Konungrhavn and forced the Konungr into hiding. The Crown of Bera is meaningless, powerless. Already our vassals split off, each jarl it's own liege. Soon there will be nothing left of Bjarnrík..."
 gerudia.27.a:0 "Our grip is fading..."

 gerudia.29.t:0 "The Taric Exodus"
 gerudia.29.d:0 "Every day, our subjects report more and more wagons stocking up on essentials and belongings, more and more families heading out across the horizon. It seems the Tarics, who have been our neighbours for so long, have set out for greener pastures. This has led to some less complaining from our subjects about their various misgivings towards them, but also less economic activity. Only time will tell what this will mean for the Tarics and the communities they leave behind."
 gerudia.29.a:0 "Whatever."

 gerudia.30.t:0 "The Cagodic Exodus"
 gerudia.30.d:0 "Every day, our subjects report more and more wagons stocking up on essentials and belongings, more and more families heading out across the horizon. It seems the Cagodics, who have been our neighbours for so long, have set out for greener pastures. This has led to some less complaining from our subjects about their various misgivings towards them, but also less economic activity. Only time will tell what this will mean for the Cagodics and the communities they leave behind."
 gerudia.30.a:0 "Very Well."

 gerudia.31.t:0 "Homecoming"
 gerudia.31.d:0 "At dawn, the two parties met upon the western banks of the mighty Vroren which once marked the northern edge of the world, at least for the Cannorians. One group: the soldiers of [Root.Country.GetName], their banners held high and accompanied by their [Root.Monarch.GetTitle]. The other group: a band of men on horseback, at the front a man draped in furs both foreign and familiar to the [Root.Monarch.GetTitle], a knife on his belt and a flatbow over his shoulder.\n\n“[Root.Monarch.GetTitle], we come in hope of righting a great and terrible wrong imposed upon our people. Many years ago, we were forced from our lands by the orcish menace you vanquished.” The man gestured to his people as he continued, “Some of my kin wish for autonomy and the right to rule ourselves, but I humbly accept the rule of your grace. I do not aspire for kingship, I simply want my sons and daughters to know the homeland of our forefathers.”\n\nA moment passes, and the [Root.Monarch.GetTitle] makes [Root.Monarch.GetHerHis] choice"
 gerudia.31.a:0 "We have other plans for the land."
 gerudia.31.b:0 "Very well, at least the land will be put to good use."
 gerudia.31.c:0 "A loyal vassal to tame these far-flung lands would not hurt…"
 gerudia.31.1:0 "I wonder what they will accomplish there…"

 gerudia.32.t:0 "Tarics No More"
 gerudia.32.d:0 "It started slowly, as most things do. Words and phrases, foods, various baubles and trinkets from the communities they stayed with. But over the years, the foreign influence on the Tarics increased. Marriages between the Tarics and others resulted in children of two worlds, and some chose to stay behind in the villages, towns, and cities that had captured their heart. As for the remaining nomads: clothing, art, music; every stop kept changing them little by little.\n\nEventually, they stopped speaking of their homeland with sadness and reverence, and instead more of nostalgia and wonder, like the elves and their once-lost Aelantir. And now, so many years after they came, the Tarics have ceased to be more than one of our own with a curious origin story."
 gerudia.32.a:0 "Sad, perhaps, but just the way of things."

 gerudia.33.t:0 "An Oath Fulfilled"
 gerudia.33.d:0 "At dawn, the two parties met upon the western banks of the mighty Vroren which once marked the northern edge of the world, at least for the Cannorians. One group: the soldiers of [Root.Country.GetName], their banners held high and led by their [Root.Monarch.GetTitle]. The other group: men and women who despite wearing furs and leather like common Tarics, carry the measure of their supposed Castanorian forebears.\n\n“[Root.Monarch.GetTitle] [Root.Monarch.GetName], we come in the name of an ancient oath we made with the Empire of Castanor, to forever guard the North from the monsters that lurk beyond Cannor. With your victories against the orcs which threw us back from our home, we humbly ask that we be allowed to return to our lands, so that we may defend the Pass once more.”\n\nA moment passes, and the [Root.Monarch.GetTitle] makes [Root.Monarch.GetHerHis] choice."
 gerudia.33.a:0 "We have other plans for the land."
 gerudia.33.b:0 "Very well, at least the land will be put to good use."
 gerudia.33.c:0 "A loyal vassal to tame these far-flung lands would not hurt…"
 gerudia.33.1:0 "I wonder what they will accomplish there…"

 gerudia.34.t:0 "An Oath Abandoned"
 gerudia.34.d:0 "It started slowly, as most things do. Words and phrases, foods, various baubles and trinkets from the communities they stayed with. But over the years, the foreign influence on the Cagodics increased. Marriages between the Cagodics and others resulted in children of two worlds, and some of them chose to stay behind in the villages, towns, and cities that had captured their heart. As for the remaining nomads: clothing, art, music; every stop changing them, little by little.\n\nEventually, they stopped speaking of their ancient oath with Castanor the same way, with duty and a longing for a chance to fulfil it once more. To them, it was just something their ancestors believed in. And now, so many years after they came, the Cagodics have ceased to be more than one of our own with a curious origin story."
 gerudia.34.a:0 "Sad, perhaps, but just the way of things."

 gerudia.38.t:0 "The Second War of the Bears"
 gerudia.38.d:0 "Magnificent news - our enemies in Bjarnrik have devolved into civil war! Whilst a united Bjarnrik was previously too strong for us to even countenance attacking, their division presents us an opportunity to deal with them all whilst they are divided and weak. Should we seize this opportunity to strike down the other squabbling Gerudians, or focus our efforts on the true enemy in Konungrhavn?"
 gerudia.38.a:0 "Now is the time, we shall strike them all!"
 gerudia.38.b:0 "Defeating Bjarnrik is all that interests us."

 gerudia.100.t:0 "Call of the Frontier!"
 gerudia.100.d:0 "The people of Gerudia are known to be naturally adventurous. Perhaps it is the history of reaving far-off lands, perhaps it is the allure of ancient giant relics just waiting to be discovered, or perhaps the cold weather simply encourages them to get up and move every once in a while. Whatever the reason, the eyes of Gerudia have once again turned to the cold forests of the Frontier, seeking to make it their own.\n\nOnce, the cold ranges of the Icereach were thought to be uninhabitable for all but the giants of old. Yet, life perseveres, and the land is now home to a sparse scattering of frozen settlements. Despite the harsh conditions, the tents and taverns have grown full to the brim with adventurers and pioneers from across the region, hoping to carve their way through the snow and claim the freezing lands of the far north for [Root.Owner.GetName]. The lands are harsh and unforgiving, yes - but the promise of ancient giant artifacts hidden beneath the ice is enough to ignite the fires of passion in the hearts of all gathered there. May that fire be enough to keep them warm in the eternal winter they face ahead."
 gerudia.102.d:0 "The people of Gerudia are known to be naturally adventurous. Perhaps it is the history of reaving far-off lands, perhaps it is the allure of ancient giant relics just waiting to be discovered, or perhaps the cold weather simply encourages them to get up and move every once in a while. Whatever the reason, the eyes of Gerudia have once again turned to the cold forests of the Frontier, seeking to make it their own.\n\nThe bustling markets of Sidaett open to cheers and stampedes as adventurers from every corner of Dalr rush to stock up on supplies for the journey ahead. The rolling hills of Gullmork, nestled in between the harpy roosts of the Titan’s Rest and the Black Frost Mountains to the north, have always called to the Dalric - but now, they seem closer than ever before. The pioneers make a final stop at the frontier town of Grymskali for a round of mead before setting off into the cold unknown, with spirits higher than the peaks above. The chant of “[Root.Owner.GetName]! [Root.Owner.GetName]! [Root.Owner.GetName]!” can be heard throughout all Gerudia."
 gerudia.104.d:0 "The people of Gerudia are known to be naturally adventurous. Perhaps it is the history of reaving far-off lands, perhaps it is the allure of ancient giant relics just waiting to be discovered, or perhaps the cold weather simply encourages them to get up and move every once in a while. Whatever the reason, the eyes of Gerudia have once again turned to the cold forests of the Frontier, seeking to make it their own.\n\nMany things can be seen from the heights of Vaengheim, if one cares to look. To the north is an endless, cold expanse that stretches far beyond the edge of one’s view, filled with little but ice and snow. To the south are the clear waters of the Giant’s Grave Sea, its shores sprinkled with settlements and the waves bearing a plethora of ships. To the west are the fertile farms and grasslands of the Dalric Valley, a pleasant reprieve from the harsher climes of Gerudia proper. To the east, however, lies a land obscured by a thick, dense forest, untamed and unclaimed, simply waiting for its mysteries to be revealed. It is no surprise, then, in which direction the adventurers of Vaengheim prefer to look. And today, perhaps, the secrets of the Frontier may at long last be uncovered - and claimed for [Root.Owner.GetName], of course."
 gerudia.106.d:0 "The people of Gerudia are known to be naturally adventurous. Perhaps it is the history of reaving far-off lands, perhaps it is the allure of ancient giant relics just waiting to be discovered, or perhaps the cold weather simply encourages them to get up and move every once in a while. Whatever the reason, the eyes of Gerudia have once again turned to the cold forests of the Frontier, seeking to make it their own.\n\nThe Great Ebonforge of Urviksten looms tall beneath the shadow of the Titan’s Rest mountains, a constant reminder to the Olavish of their ancestral legacy. It was here where Urvik and Olav once landed, a pair of brave pioneers setting foot upon a harsh and unfamiliar land. How far Gerudia had come since those ancient days! The Ebonforge is just a speck on the horizon now, compared to the wide, far-reaching taigas of the Gerudian Frontier. The adventurers watch it slowly disappear behind the hills as they march east to Esvjall, already dreaming of the untamed lands that lie beyond the southern pass. Perhaps their descendants will have a new manmade marvel to look upon, far in the future. Perhaps the lands of the east will one day be just as familiar to them as Urviksten is now. Just as Olav and Urvik once did, these pioneers venture into the harsh unknown for the glory of [Root.Owner.GetName], with only a bright dream to guide them."
 gerudia.100.a:0 "The North beckons!"