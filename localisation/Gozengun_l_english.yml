l_english:
  #events

  gozengun.1.t: "A Galumphing Curiosity"
  gozengun.1.desc: "The wintry forests of Moduk hold many different creatures, but perhaps one of the most beloved is the Kokesal Seal, a grey-spotted beast that inhabits the freezing waters of the great Lake Kokesal, the deepest lake in all Halcann. One such seal has somehow stowed away from the freezing depths, carried along by a deeply attached merchant and a makeshift tank of water.\n\nThis animal is extremely peculiar, but many of those who live in Moduk consider such animals sacred due to their rare sightings. Many have called for the seal to be returned to the lake, but others in the court have taken an extreme interest in the creature, and wish to keep it within the capital for a variety of different reasons."
  gozengun.1.a: "Return the beast to Lake Kokesal."
  gozengun.1.b: "Keep the seal at court."
  gozengun.1.c: "Offer the seal to a local menagerie."
  gozengun.1.d: "Examine the seal to learn more of these creatures."

  gozengun.2.t: "Snowy Surprise"
  gozengun.2.desc: "Lurking on the edge of the forests of Moduk, Portorran’s cat (known by the Khudi as the manul) is a squat predator that hunts small animals in the winter months. These furry creatures rarely stray far from their woodland homes, but one has made its way into the court! The courtiers are mesmerized by the adorable nature of the cat, and have begun protesting that the animal remain within the court as a mascot of sorts. While the beast is cute, it is also rather distracting, and many people within the administration have let their responsibilities slip to spend time with their new furry friend."
  gozengun.2.a: "Lovingly pet the cat’s fur."
  gozengun.2.b: "Recruit the manul as an honorary court member!"
  gozengun.2.c: "Send the manul back to the wilds."
  gozengun.2.d: "Offer the creature a bountiful feast."

  gozengun.3.t: "Demands of the Dead"
  gozengun.3.desc: "With the boundary between the physical and the spirit realm being so thin in Gozengun, the spirits of those who have recently departed tend to find their way back into the world if their will is strong enough. One such spirit has been causing problems recently, demanding that his rights to the lands he owned when he was alive are respected now that he’s returned in spiritual form. This poses an issue to us, given that the spirit is not capable of actually tending to the land now that he’s deceased. We can try to play along, but others will quickly catch onto the farce."
  gozengun.3.a: "Go along with his demands."
  gozengun.3.b: "Send him back to his lands."
  gozengun.3.c: "He’s dead! He won’t miss his property!"

  gozengun.4.t: "Soldiers of the Wastes"
  gozengun.4.desc: "There are many fighting forces out in the rough wilds of Gozengun, hailing from the desolate wastes of Nomsyulhan to the heavily forested lands of Moduk. Many of these soldiers have banded together into a number of mercenary companies, and now offer their services to us in exchange for payment. We have many different options available to us, each serving to elevate a different section of our military force. Who shall we choose to recruit?"
  gozengun.4.a: "The Rünsukhi of Khaashalg!"
  gozengun.4.b: "The centaur and harpy companies!"
  gozengun.4.c: "The hobgoblins of Nomsyulhan!"
  gozengun.4.d: "The trolls and the ogres of the hills!"
  gozengun.4.e: "Pfah! We need no help!"

  gozengun.5.t: "A Rite for Those Who Must be Forgotten"
  gozengun.5.desc: "If your face is stolen from your self, you no longer exist.\n\nThis mantra, repeated by those who walk the lands infested by the Facestealers, has been used to keep their numbers in check for generations. Victims of the malevolent beings that steal the very flesh from their visage are immediately struck from the record of history; paintings are burned, belongings are destroyed, and the family moves on as if they never existed in the first place. But some keep their memories alive in a foolish attempt to remember what no longer exists. One such shrine has been discovered in [Root.GetName], and the perpetrators have been captured and brought before [Root.Monarch.GetName]."
  gozengun.5.a: "Reprimand them and move on."
  gozengun.5.b: "Execute the perpetrators for such dangerous actions."
  gozengun.5.c: "Make sure all know the consequences of remembrance."

  gozengun.6.t: "Afterlife Advisors"
  gozengun.6.desc: "Spirits of those who pass tend to appear in locations that were significant to them in life. It should come as no surprise, then, that the spirit of an old advisor has begun to haunt sites around [Root.Capital.GetName]. This spirit claims that with its knowledge from ages long past, it would serve well in a new capacity in the court. While this claim could hold water, it could also be a massive waste of time and cause the court to be bogged down even more."
  gozengun.6.a: "Grant them a position in court."
  gozengun.6.b: "Tell the spirit their services are not required."
  gozengun.6.c: "Consume the spirit before it gets a chance to escape."
  gozengun.6.d: "Spirits? Advisors? Don’t make me laugh!"

  gozengun.7.t: "Spiritual Bounty"
  gozengun.7.desc: "As a stroke of luck, the spirit we allowed to serve within our court turned out to be a very capable advisor! We have gained quite noticeable benefits from keeping them around, and their knowledge of the past has served us well in the everyday governance of [Root.GetName]."
  gozengun.7.a: "Excellent news!"
  gozengun.7.tt: "A random skill §Y3§! advisor joins our court. This advisor is §G50%§! cheaper to employ."

  gozengun.8.t: "Spiritual Frustration"
  gozengun.8.desc: "Unfortunately, it seems the spirit we agreed to let serve in our court has turned out to be little more than a snake oil salesman. The knowledge of the spirit is similar if not identical to what we already know, and their capability as an advisor was wildly oversold. It appears the court will have a drain on its resources for a while."
  gozengun.8.a: "Never trust a ghost."

  gozengun.9.t: "The Feral Spirits"
  gozengun.9.desc: "Throughout the lands of Gowon, the capricious spirits that run the land have banded together in a loose confederation to push back against any whose rule they deem unsavory. These are the Gumiho, powerful foxlike spirits who have been terrorizing our people ever since we settled within these lands. These spirits now come to us with their demands, declaring their intention to consume a large portion of the population if we do not leave their lands.\n\nThe presumptuousness of these spirits is absolutely ridiculous, but these are powerful beings we should not treat lightly. But acquiescing to their demands would put many of our citizens in harm's way."
  gozengun.9.a: "We will not bow down to these spirits!"
  gozengun.9.b: "We have no other choice but to give in."
  gozengun.9.c: "I will never bow again"

  gozengun.10.t: "The Spirit of the Builder"
  gozengun.10.desc: "Very few structures exist in the deserts of Gozengun, with the harsh elements tearing down any buildings and monuments that any attempt to build. But new reports tell of several different structures taking shape within the wastes, usually small and squat in their construction and typically made with basic materials such as stone and mud. This is not an everyday occurrence, and looking further into this anomaly could reveal the existence of a friendly spirit in the area."
  gozengun.10.a: "Investigate at once!"
  gozengun.10.b: "Who cares?"
  gozengun.10.c: "Destroy them all!"

  gozengun.11.t: "Simple Realities"
  gozengun.11.desc: "It turns out the desert builder was in reality a regular human, hiding in the desert from some unknown threat. In his spare time, he has taken to building structures in the desert to shelter himself, or to honour a local spirit who nobody seems to recognize. Either way, his skills at construction cannot be denied, given that his structures have withstood the elements until this point."
  gozengun.11.a: "Sometimes the mundane is still remarkable."

