l_english:
  #events

  gozengun.1.t: "seal!"
  gozengun.1.desc: "seal event temp loc"
  gozengun.1.a: "return it"
  gozengun.1.b: "keep it"
  gozengun.1.c: "sell it"
  gozengun.1.d: "study it"

  gozengun.2.t: "a seal's life"
  gozengun.2.desc: "the seal has lived in a capital for a joyous five years now"
  gozengun.2.a: "let it stay"
  gozengun.2.b: "return it home"

  gozengun.3.t: "Mesmerizing Majestic Manul"
  gozengun.3.desc: "a Manul has ended up in our capital what shall we do about it?"
  gozengun.3.a: "pet the Manul"
  gozengun.3.b: "recruit the Manul"
  gozengun.3.c: "get rid of the Manul"
  gozengun.3.d: "let the Manul feast"

  gozengun.4.t: "Dead Man Demanding"
  gozengun.4.desc: "The spirit of an old man has returned to see his will carried out"
  gozengun.4.a: "carry out the man's will"
  gozengun.4.b: "leave the it to the family"
  gozengun.4.c: "keep it for the state"

  gozengun.5.t: "Gozengooner Mercenaries"
  gozengun.5.desc: "We have the opportunity to have different races from around Gozengun help our army"
  gozengun.5.a: "Hire Some Boring Old Humans"
  gozengun.5.b: "Hire Some Centaurs"
  gozengun.5.c: "Hire Some Eagles"
  gozengun.5.d: "Hire Some Soulseekers"
  gozengun.5.e: "Hire Some Hill Trolls"
  gozengun.5.f: "Hire Some Nuzenapu Harpies"
  gozengun.5.g: "We do not need any help!"

  gozengun.6.t: "A Rite for Those Who Must be Forgotten"
  gozengun.6.desc: "Despite our culture demanding that the victims of Facestealers must be forgotten about, a group of people have decided to organize a rite for those killed in the latest facestealer attack. What shall we do?"
  gozengun.6.a: "It is far too late to do anything"
  gozengun.6.b: "We must find and execute the organizers"
  gozengun.6.c: "Make an example out of them"

  gozengun.7.t: "Spirit demands to join our court"
  gozengun.7.desc: "A spirit has arrived in our capital claiming to be a great advisor of a past age. The spirit could very well be lying or telling the truth."
  gozengun.7.a: "allow the spirit into our court"
  gozengun.7.b: "send the spirit away"
  gozengun.7.c: "eat the spirit. Yum!"
  gozengun.7.d: "the spirit has left of its own volition"

  gozengun.8.t: "The Spirit is a great advisor"
  gozengun.8.desc: "the spirit that demanded a position in out court is actually who they claimed to be."
  gozengun.8.a: ":koboldyippee:"
  gozengun.8.tt: "A skill 3 advisor joins our court. This advisor is 50% chaeper to employ"

  gozengun.9.t: "the spirit was a liar!"
  gozengun.9.desc: "the spirit lied to us and now our capital is in disarray!"
  gozengun.9.a: "Oh no!"

  gozengun.10.t: "Restless Gumiho"
  gozengun.10.desc: "Ever since we conquered Gowon the Gumiho have not taken kindly to our presence."
  gozengun.10.a: "Tell the Gumiho to fuck off"
  gozengun.10.b: "Appease the Gumiho"
  gozengun.10.c: "eat the Gumiho!"
  gozengun.10.d: "We must adopt the religion of the locals"

  gozengun.11.t: "Strange buildings and statues"
  gozengun.11.desc: "recently there have been buildings and statues appearing in [province]. some speculate that it is the doing of a spirit"
  gozengun.11.a: "investigate at once!"
  gozengun.11.b: "who cares?"
  gozengun.11.c: "destroy them all!"

  gozengun.12.t: "we have found the culprit"
  gozengun.12.desc: "turns out it was just some guy doing it"
  gozengun.12.a: "oh..."

