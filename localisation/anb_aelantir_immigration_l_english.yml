aelantir_immigration.0.t:0 "Moon Elves Seek Path to Citizenship"
aelantir_immigration.0.d:0 "To the most gracious [Root.Monarch.GetTitle] [Root.Monarch.GetName],\n\nI write to you today, not as a representative of the CLSTC, but as an elf. My people have long yearned to return to Aelantir, to feel its wind in our hair, to feel its soil beneath our feet, and to be participants in its nations. As of yet, however, we have remained in diaspora (bar the extremists of Venail). I seek to rectify this, and if your majesty would be so inclined, I would have your nation be the primary focus of our efforts.\n\nYou will find enclosed a five-hundred-and-fifty-three (553) page treatise on the boons, benefits, and admittedly, maluses of allowing my people to form a protected settlement within your borders. To surmise, this will be modelled after the enclave of “Moonhaven” within the Anbennarian Empire. I will provide the funding for this endeavor from my own coffers; I simply seek assent to begin the migration and find a home inside our ancient home. \n\nWith bated breath,\nNesterian Songwater"
aelantir_immigration.0.1:0 "His manuscript was convincing, found the enclave"
aelantir_immigration.0.2:0 "The elves had their chance, they ruined it."
aelantir_immigration.0.3:0 "Found Little Moonhaven, but scrape some off the top."
aelantir_immigration.0.4:0 "[Root.Consort.GetTitle] [Root.Consort.GetTitle] rallies the court in favour of the proposal."
aelantir_immigration.0.5:0 "Found Little Moonhaven, and empower them to succeed"

aelantir_immigration.2.t:0 "Enclaves Foster Ties with Cannorian Elves"
aelantir_immigration.2.d:0 "Oh Nesterian!\n\nWhat a wonderful place Aelantir has become, the [Root.Culture.GetName] have treated us so well! Little Moonhaven thrives, and Evindal and I have begun considering having one or two children of our own. \n\nIt is strange to us now, that we could have ever lived anywhere else. Whilst I obviously never lived in Moonhaven proper, I simply can't imagine they enjoy the same freedoms and protections we do. We pay our taxes to an elven tax collector, we build our houses following traditional elven styles, and our salons sell tea - not that wretched stuff you trade to the humans, brother. \n\nIt's just so… perfect. We’re not an oddity here, not outsiders, or strange tales, or any other list of fanciful things as we were back in Cannor, we are just elves. Free to live our elvish lives, practicing our elvish culture, living amongst those doing the same. In fact, and I know I said I never would, but I’ve taken on an apprentice! A young girl not much older than eighty. She shows a keen deftness in her weaving and has begun experimenting with mixing a more [Root.Culture.GetAdjective] style into her pieces; it's a rather exciting time. \n\nRegardless of my jubilation, I mainly wrote to inform you that we have settled in nicely - and that you are welcome to stay should you be in the country. \n\nLovingly from your sister,\nImariel \n\nP.S. Evindal sends his kindest regards and thanks you for the wine you sent."
aelantir_immigration.2.1:0 "Cannorian Elves view us in a better light."
aelantir_immigration.2.2:0 "Ensure the timely delivery of all letters back to Cannor."

aelantir_immigration.3.t:0 "Promises Broken to the Enclaves"
aelantir_immigration.3.d:0 "Special Report dating [GetDate]\n\nTopic: The Diplomatic Fallout Following the Dissolution of the Elvish Enclave “Little Moonhaven”\n\nMy [Root.Monarch.GetTitle],\n\nOn the situation: Dire news. All reports say the same: the Cannorian elves are in uproar, following our failure to maintain the rights of the elvish people living within the bounds of “Little Moonhaven” as initially promised.\n\nOn the response to our actions: We have received condemnations from every Wescanni nation ruled by elves, with a formal and united letter having been issued by the Prince-Elector of Moonhaven and his council. Following on from this, the Ibevari Council of Elders have decried us as an “Anathema” to the elvish way of life and have urged all elves and their sympathisers to cease trade with us immediately.\n\nOn our relationship going forward: Naturally, our relations have been strongly strained, with many of our diplomats and attaches having been expelled. It is unlikely any talk of deepened relations with the elves will be entertained. \n\nOn the whispers of war & organised embargo: Some extremist elves are calling for punitive measures to be taken against us - though our spies report there appears to be little real desire amongst the ruling bodies of Cannor.\n\nOn the seditious newspapers: More concerningly, newspapers are flying off the presses with a simple headline: “[Root.Monarch.GetName], the Liar of Little Moonhaven”. The implications of this are worrying, as it appears the elves coordinated well in advance to announce our failings to their people. Further measures to crack down on this are advised.\n\nWe should tread lightly."
aelantir_immigration.3.1:0 "Damned elves!"
aelantir_immigration.3.2:0 "Make concessions, I’ll handle the response myself."

