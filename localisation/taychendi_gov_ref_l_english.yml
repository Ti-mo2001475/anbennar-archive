l_english:
#First Among Heroes
 lesser_heroes_state: "First Among Heroes"
 lesser_heroes_state_desc: "Is there a greater display of power of one elf being over another than to force them to serve you? Is there a greater joy for a warlord walking the path of the Hero than to impose their will upon a rival who walked that same path? \nNo, of course not — for to break an equal is to rise above them, and to place one foot on their neck and one on the path to eternity."
 yearly_glory_tt: "Each year, gain §YGlory§! based on the number of subjects:\n§Y+5 Glory§! per subject\nCapped at §Y5 subjects§! (§Y+25 Glory§! maximum)"

#Kalavendy regional gos reform
 kalavendy_gos_ref: "Rule of Water-lords"
 kalavendy_gos_ref_desc: "Kalavend is rightly regarded as the cultural and economic heart of all Taychend, and has always been the crown jewel of every empire that has risen in the region. This is hardly surprising: Kalavend is the most densely populated region in Taychend, its rich lands irrigated by the river Kalavend, yielding multiple harvests each year and sustaining a population so vast it rivals the most crowded provinces of Cannor. Indeed, such is the region's fertility that Kalavend's harvests can effortlessly feed even the less fruitful lands of the wider Taychendi realm."
 kalavendy_gos_ref_tt: "Every province with §YPlant§! goods in the Kalavend region receives a province modifier:\n§Y+15% local manpower§! \n§Y+20% Trade Value modifier§!"
 kalavendy_population: "Rule of Water-lords"
 kalavendy_population_desc: ""

#Relic lord of taychend
 relic_lords_of_taychend: "The Relic-Lords of Taychend"
 relic_lords_of_taychend_desc: "Since the Day of Ashen Skies, the relics of the Precursors have shaped Taychend's fate. Those who could turn their power to their own ends have invariably risen above their peers — whether great conquerors like Ebenanth Starshear, whose staff channeled the power of the Astral Sky, or obscure lords of backwater keeps, whose authority rested upon a single enchanted blade. One truth holds above all: whoever holds the relics of the Precursors holds their destiny itself in their fist — and, most importantly, the destiny of Taychend. \n\n \n\n§YThe greater the ruler's share of the world's Precursor relic trade, the higher his maximum absolutism§! — up to §Y+25%§! at §Y40%§! of the world market."
 relic_lords_absolutism_1: "The Relic-Lords of Taychend"
 relic_lords_absolutism_2: "The Relic-Lords of Taychend"
 relic_lords_absolutism_3: "The Relic-Lords of Taychend"
 relic_lords_absolutism_4: "The Relic-Lords of Taychend"
 relic_lords_absolutism_5: "The Relic-Lords of Taychend"

#Age of glory
 Age_of_glory: "Age of Glory"
 Age_of_glory_desc: "At the heart of Taychendi Hero Worship lies a simple truth: death is not the end, but merely a threshold. Only those whose deeds are great enough to be remembered cross it as gods; all others return, again and again, in the nameless churn of reincarnation. \nFor a ruler walking the path of the hero, every year offers a chance to draw nearer to that threshold — victories in war, patronage of hero-cults, raised monuments, deeds of legend, all woven into everlasting glory. The more subjects who remember a nascent hero’s name, the more assured his recognition among the pantheon of God-Heroes."
 mechanic_taych_taking_age_rewards_gives_glory_yes: "Taking an Age Ability grants:\n  §Y100 Glory§! if your country follows Taychendi Hero Worship and is not reformed\n  §Y25 Vainglory§! if it has the Taychend Vainglory mechanic\n  §Y7 Power Projection§! if your country doesn't follow Taychendi Hero Worship or reformed religion, and doesn't have the Taychend Vainglory mechanic"

#larankarha regional gos reform
 larankarha_gos_ref: "Rule of Hill-lords"
 larankarha_gos_ref_desc: "The harsh lands of the Larankar Highlands were long considered a backwater of Taychend, but the fall of the Gophiran Empire gave them the chance to rise above the other warlords. To this day, the Highlands remain one of Taychend's least urbanized regions: rather than great cities, it is the smaller settlements clustered around major mines or the most fertile ground that hold sway here, each settlement bound closely to the clan whose territory it sits within. This very insularity long kept the hill-lords from acting as one, but the growing productivity of hill farming and the abundance of pastureland have built the foundation that will carry Larankarha forward."
 larankarha_mountain_expansion_mountains: "Rule of Hill-lords"
 larankarha_mountain_expansion_highlands: "Rule of Hill-lords"
 larankarha_mountain_expansion_hills: "Rule of Hill-lords"
 larankarha_gos_ref_tt: "Reduce the Development Cost Penalty caused by Terrain type of every owned §YMountains§!, §YHighlands§! and §YHills§! province by §G50%§! in Larankarha Highlands region"

#yodhanpir regional gos reform
 yodhanpir_gos_ref: "Rule of true Warlords"
 yodhanpir_gos_ref_desc: "Named for the Warlord-Emperor Yodhan, the Yodhanpir are regarded as the most martial of the Taychendi ruinborn. Their lands have always served as the chief wellspring of military might for Taychend's rising empires, and more than once those empires themselves were founded in these hills — the two Gophiran Empires chief among them."
 yodhanpir_gos_regiment: "Rule of true Warlords"
 yodhanpir_gos_tax: "Rule of true Warlords"
 yodhanpir_gos_ref_tt: "Provinces of yodhanpir culture in the Taychend superregion gain:\n §G+10% Regiment Recruitment Speed§!\nOther provinces in Taychend superregion gain:\n §G+10% Local Tax Modifier§! "

#thekvrystana regional gos reform
 thekvrystana_gos_ref: "Rule of Trade-Lords"
 thekvrystana_gos_ref_desc: "The Thekvrystana people inhabit Thektoram and the adjacent lands, fulfilling a vital function for Taychendi society: trade. Members of this enterprising people can be found in every major trade hub, and aboard ship the Thekvrystana feel more at ease than any other Taychendi, though they still fall short of the Kheionai interlopers. This mercantile bent has made the Thekvrystana arguably the wealthiest people in Taychend, a wealth they frequently direct toward the patronage of arts and culture."
 thekvrystana_gos_ref_tt: "Provinces with a port, a center of trade, and a river estuary gain:\n §Y+6 Local Trade Power§!"
 thekvrystana_coastal_trade_modifier: "Rule of Trade-Lords"

#sarihaddhi regional gos reform
 sarihaddhi_gos_ref: "Rule of Sand-Lords"
 sarihaddhi_gos_ref_desc: "The Sarihaddhi are often viewed by other Taychendi as a fundamentally foreign people, and many deny their claim to a Taychendi identity, not entirely without reason. Taychendi society and economy traditionally revolve around city-states, and the nomadic and semi-nomadic ways of the Sarihaddhi stand sharply apart from this custom. Their language, heavily marked by the influence of their western Chendhyan neighbors, does little to narrow the gap. \nAnd yet, despite all this, the Sarihaddhi hold an important place in Taychend's patchwork of peoples. They are renowned as exceptional horse-riders, and as expert relic-scavengers who know the sands of the Sarihaddu better than anyone else."
 sarihaddhi_gos_ref_tt: "Provinces with §Ylivestock§! trade good will give §Y-2% cavalry cost§!"
 sarihaddhi_lives_mod: "Rule of Sand-Lords"