#First Among Heroes
 lesser_heroes_state: "First Among Heroes"
 lesser_heroes_state_desc: "Is there a greater display of power of one elf being over another than to make them serve you? Is there greater joy for a warlord walking the path of the Hero than to impose his will upon one who walked that same path?\nNo, of course not — for to break an equal is to rise above him, and to place one foot into eternity."
 yearly_glory_tt: "Each year, gain §YGlory§! based on the number of subjects:\n§Y+5 Glory§! per subject\nCapped at §Y5 subjects§! (§Y+25 Glory§! maximum)"

#Kalavendy regional gos reform
 kalavendy_gos_ref: "Rule of Water-lords"
 kalavendy_gos_ref_desc: "«Many of my Cannorian countrymen picture Aelantir as an empty land, dotted with small tribes of Ruinborn scattered across the colossal expanses of that ancient continent. Nowhere will they be more grievously mistaken than here, in the Kalavend — a region whose cities rival my native Esmaria in size, and whose population density is perhaps matched only by the lowlands of the great river Suran. That alone speaks to the magnitude and importance of these lands to the peoples who call them home.\nI think it no exaggeration to say that the Kalavend has been the beating heart of every Taychendi empire that has risen on the tides of history — and that more often than not, it was the lords of the Kalavend who wrote the final chapter of most of them.\nCurious, too, is the sacred, one might say ritual, role of the river itself: local lords frequently seek to assert control over irrigation, laying canal systems into their cities and directing water for domestic use, raising elaborate bathhouse complexes within their residences — and in doing so, ritually cementing their authority over rural communities and landed estates and river itself. All of this is deeply bound up in the Taychendi tradition of sacralising power and dominion, and the lords of the Kalavend have long been known as the Water-Lords.»\n\n— 'Peoples and Powers of Southern Aelantir', Simon Vellardi, member of the Order of Chroniclers, c. 1571"
 kalavendy_gos_ref_tt: "Every province with §YPlant§! goods in the Kalavend region receives a province modifier:\n§Y+15% local manpower§! \n§Y+20% Trade Value modifier§!"
 kalavendy_population: "Rule of Water-lords"
 kalavendy_population_desc: ""

#Relic lord of taychend
 relic_lords_of_taychend: "The Relic-Lords of Taychend"
 relic_lords_of_taychend_desc: "Since the Day of Ashen Skies, the relics of the Precursors have shaped the fate of Taychend. Those who could turn their power to their own ends have invariably risen above their peers — whether great conquerors like Ebenanth Starshear, whose staff could call down fire from the Astral Sky upon enemy armies, or obscure lords of backwater keeps, whose authority rested upon a single enchanted blade.\nAmong the Great Relic-Lords, those who stand apart are not merely those who possessed an artefact, but those who built an entire architecture of power around it. Yodhan ruled for sixty years clad in living armour fashioned from the flesh of a dragon. Kadradar Blood-Hand drowned Andeios in plague, driven not by a hunger for conquest but by the very nature of the relic he held. The Kamrayakval raised the scattered cells of the Oren Nayiru and cast them into holy war — all by the power of an armour found upon a rotting corpse.\n\nRelic-Lords rule not so much by the sword as by the fear of what that sword can do. The greater the concentration of such artefacts in a ruler's hands — the tighter his grip, and the less room remains for defiance.\n\n \n\n§YThe greater the ruler's share of the world's Precursor relic trade, the higher his maximum absolutism§! — up to §Y+25%§! at §Y40%§! of the world market."
 relic_lords_absolutism_1: "The Relic-Lords of Taychend"
 relic_lords_absolutism_2: "The Relic-Lords of Taychend"
 relic_lords_absolutism_3: "The Relic-Lords of Taychend"
 relic_lords_absolutism_4: "The Relic-Lords of Taychend"
 relic_lords_absolutism_5: "The Relic-Lords of Taychend"

#Age of glory
 Age_of_glory: "Age of Glory"
 Age_of_glory_desc: "At the heart of Taychendi Hero Worship lies a simple truth: death is not an end, but a threshold. Only those whose deeds are great enough to be remembered cross it as gods. All others return — again and again, in the nameless churn of reincarnation.\n\nFor a ruler walking the path of the hero, every year is an opportunity to draw closer to that threshold. Victories in war, patronage of hero-cults, raising of monuments, performance of legendary deeds — all are threads from which glory is woven. More subjects who remember a ruler's name and honour his deeds, the more certain it becomes that the God-Heroes will recognise him as their equal.\n\nThis logic runs through every layer of Taychendi life. Rulers sponsor statues, songs and chronicles while still living: a cult takes shape long before its hero's death. Priests keep records, poets compose epics, and subjects who honour a living lord are already laying the foundations of his future pantheon. So did Laskaris the Conqueror, who watched his cult spread across Taychend while he yet breathed. So did those who ruled before him."
 mechanic_taych_taking_age_rewards_gives_glory_yes: "Taking an Age Ability grants:\n  §Y100 Glory§! if your country follows Taychendi Hero Worship and is not reformed\n  §Y25 Vainglory§! if it has the Taychend Vainglory mechanic\n  §Y7 Power Projection§! if your country doesn't follow Taychendi Hero Worship or reformed religion, and doesn't have the Taychend Vainglory mechanic"

#larankarha regional gos reform
 larankarha_gos_ref: "Rule of Hill-lords"
 larankarha_gos_ref_desc: "«Ask anyone with even a passing familiarity with Taychend what Larankar is, and they will recall first the chronicles of the Jaherian Exemplars — and through them, chiefly the Larankarha Empire: the great traditionalist bulwark that stood against Ameion's advance and proclaimed itself the last guardian of Taychend's ancient liberties. The simplification is understandable. Erankar the Defiant is the youngest god-hero in the Taychendi pantheon to have achieved truly wide worship, and the story of his deeds lends itself precisely to the kind of heroic narrative that travels well across the sea.\nAnd yet to reduce Larankar to the empire is to miss the very thing that made the empire possible. Long before Erankar, Larankar was a land of hills, mines, and the lords who ruled them. The region's broken terrain denied any single city the kind of dominance that Nanru Nakar exercised over the Upper Kalavend — here, power rested on the control of shafts and roads and people who controlled them.\nThe Death Throes of Gophira left the region hollowed out for generations. Recovery came slowly — and it came on the backs of slaves. It was the expansion of mining and the influx of captives from the border wars that allowed the hill-lords to rebuild their cities, and later gave Erankar the resources without which his empire would have remained the dream of an ambitious warlord. In Larankar, war quite literally feeds war: victorious campaigns fill the mines with slaves, the mines feed the treasury and the army, and the army marches out again. The cities of the Larankarha hills grew on this cycle — and they turn on it still.»\n\n— 'Peoples and Powers of Southern Aelantir', Simon Vellardi, member of the Order of Chroniclers, c. 1571"
 larankarha_mountain_expansion_mountains: "Rule of Hill-lords"
 larankarha_mountain_expansion_highlands: "Rule of Hill-lords"
 larankarha_mountain_expansion_hills: "Rule of Hill-lords"
 larankarha_gos_ref_tt: "Reduce the Development Cost Penalty caused by Terrain type of every owned §YMountains§!, §YHighlands§! and §YHills§! province by §G50.0%§! in Larankarha Highlands region"

#yodhanpir regional gos reform
 yodhanpir_gos_ref: "Rule of true Warlords"
 yodhanpir_gos_ref_desc: "«Among all the peoples of Taychend, the Yodhanpir stand apart at first glance — and not merely because warriors seem to make up a greater share of the population here than anywhere else. It is the way they understand the very nature of power. The Yodhanpir warlord asserts his authority through the one thing considered here an indisputable proof of the right to rule: personal martial prowess.\nIn large part, this traces back to the legacy of Yodhan, after whom the people are named. Here he is venerated as the paramount god-hero, embodying what a warlord ought to be in his prime — or so the Yodhanpir themselves would have it. For sixty years he ruled clad in armour fashioned from the flesh of a dragon, and every Yodhanpir chieftain who dons his armour before battle in some sense reproduces that image — if without the Precursor magic to back it.\nIt was among the Yodhanpir peoples that both Gophiran Empires rose — and much of the local economy still bears their imprint. The Gophiran Sangamars built here an economy founded on unfree labour: the mines of the Katalmarai and the empire's great construction projects consumed slaves by the thousand, while laws curtailing the paths to freedom turned this into a self-perpetuating, if precarious, system. The private estates that emerged under the shelter of imperial stability embedded this logic into the very structure of landholding.\nYet Yodhanchend was to Gophira foremost a source of soldiers and recruits, while the empire's wealth was fed by the conquered lands of the south and west. When the empire fell, it was Yodhanchend that found itself in the most dire straits: stripped of the centralised economy and imperial markets that had sustained it, the region sank into a desolation from which it could not recover even in the span of a full century. Fragmented and exhausted, its petty princes became easy prey for Laskaris the Conqueror, and Yodhanchend its first conquests.»\n\n— 'Peoples and Powers of Southern Aelantir', Simon Vellardi, member of the Order of Chroniclers, c. 1571"
 yodhanpir_gos_regiment: "Rule of true Warlords"
 yodhanpir_gos_tax: "Rule of true Warlords"
 yodhanpir_gos_ref_tt: "Provinces of yodhanpir culture in the Taychend superregion gain:\n §G+10% Regiment Recruitment Speed§!\nOther provinces in Taychend superregion gain:\n §G+10% Local Tax Modifier§! "

#thekvrystana regional gos reform
 thekvrystana_gos_ref: "Rule of Trade-Lords"
 thekvrystana_gos_ref_desc: "«History of the Thekvrystana is as tragic as it is instructive, and may well be of interest to my readers across the sea. This mercantile people are little known to the average Cannorian — even to those who regularly call at the ports of Taychend: so thoroughly do the Kheionai dominate the region and maritime trade in general. Yet the Thekvrystana were once, by right, considered the most commercially oriented people in Taychend. Though they lagged behind the Kheionai in long-distance seafaring, they were the dominant force in the coastal and river trade of the continent — and it was through wealth that they asserted their power. The great warlord who holds the southern port cities in his grip seeks above all to fill his coffers and display his influence and glory to all — and in this he is very much the heir to the old Thekvrystana tradition.\nPatronage of the arts and culture is an inseparable part of this people: a wealthy lord who finances poets, writers and architects can rival in fame a mighty commander who has covered himself in a dozen victories. Though this patronage has not always taken benign forms — one need only recall the Cennayakuta, of whom more will be said in the following chapter.\nKheionisation, brought by the Ambhen Empire, changed much here. Language, customs, the very name of the people — all were methodically displaced by a Klereyen identity across most of Thektoram. The Thekvrystana survived only in the lands of old Vuls Tenvach, now known as Degítheion.»\n\n— 'Peoples and Powers of Southern Aelantir', Simon Vellardi, member of the Order of Chroniclers, c. 1571"
 thekvrystana_gos_ref_tt: "Provinces with a port, a center of trade, and a river estuary gain:\n §Y+5 Local Trade Power§!"
 thekvrystana_coastal_trade_modifier: "Rule of Trade-Lords"

#sarihaddhi regional gos reform
 sarihaddhi_gos_ref: "Rule of Sand-Lords"
 sarihaddhi_gos_ref_desc: "«The more urbanised ruinborns of Taychend not infrequently see the Sarihaddhi as Chendhyans rather than Taychendi in any full sense — and there is a certain logic to it. The culture, politics and daily life of Taychendi have always revolved around city-states, great and small, with which this continent is abundantly supplied, and the nomadic and semi-nomadic Sarihaddhi are, to the settled townsman, a foreign and largely incomprehensible element.\nThere is some truth in such judgements. The Sarihaddhi language bears a colossal imprint from the Chendhyan tongue, and their material and oral traditions have likewise felt the strong influence of their western neighbours — though their roots are, without question, Taychendi. Noteworthy, too, is the fact that it is here, in the Sarihaddu, that one may encounter jaguar-riders and even enter into contact with them without any great likelihood of being maimed — an outcome considerably less certain on the Chendhyan steppe.\nNonetheless, this people occupies an important place in the motley tapestry we call Taychend. Sarihaddhi are the first bulwark against the frequent incursions of Chendhyan hordes from the west. They are likewise the foremost suppliers of Precursor relics from the depths of their deserts: reaching those ruins by any other means, without knowing the sands as the Sarihaddhi know them, strikes me as a near-impossible undertaking.»\n\n— 'Peoples and Powers of Southern Aelantir', Simon Vellardi, member of the Order of Chroniclers, c. 1571"
 sarihaddhi_gos_ref_tt: "Provinces with §Ylivestock§! trade good will give §Y-2% cavalry cost§!"
 sarihaddhi_lives_mod: "Rule of Sand-Lords"