 personal_mask_upgraded:0 "Yourself"
 personal_mask_upgraded_desc:0 "While clan heads will wear family masks, and consult the spirits of all previous clan heads, they are not the only ones with masks. Each tribe member has their own personal mask, whether made by themselves or by a family member. Carved out of wood, a rare commodity in the steppes, and bleached white with bone ash, the masks serve important social and survival functions. At a glance, they tell you someone's rank, potentially the clan they head, and if they are a death-priest. They protect against the assaults of the Facestealers. And they make you easier to forget upon death. To die without your mask on is a sure sign of having perished to a Facestealer, and no rites are conducted for these individuals."
 personal_mask_upgraded_full:0 "Your Personal Mask"

 nurgai_upgraded:0 "Nurgai"
 nurgai_upgraded_desc:0 "Nurgai the Faceless Queen, commonly abbreviated as the Faceless or the Faceless One, was known in her mortal life as Nurgai Bagaatun. Before her ascension to godhood she was a legendary Kusheng who united the Shuvüüsh people under one banner for the first time in over 400 years. In life, she wore the mask of Tsagaan only when she tried to gain his counsel, opting to keep her white featureless personal mask and openly declaring that a new lineage would start with her. After her death, the mask was maintained with minimal modifications - just enough to distinguish her features. When the mask is not being worn by a monarch it is returned to its resting place in her family's grave-shrine at Hogunuug, where her descendants watch over it during their annual migrations.\n\nShe is considered the patron of all Saanorgegh women and through her message of unity and strength she is likely to be called upon when a compromise is negotiated or before a cavalry charge is performed. If you hear "For the Faceless Queen" in a room, be at ease, for an agreement has been struck, but if you hear it in a field, run, for a charge is coming."
 nurgai_upgraded_full:0 "Nurgai the Faceless"