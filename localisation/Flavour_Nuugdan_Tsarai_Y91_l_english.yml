l_english:
 y91_infiltrate_the_frontier_title:0 "Infiltrate the Frontier"
 y91_infiltrate_the_frontier_desc:0 "As our understanding of Yanshen deepened, we took the opportunity during our last incursion to secretly plant agents throughout the settlements of the Yansheni frontier just beyond our grasp. For years they have remained hidden among townsfolk, garrisons, and local officials, gathering intelligence, cultivating contacts, and preparing the way for our return. Their efforts have finally borne fruit. A series of carefully coordinated acts of sabotage has severed communications, disrupted supply lines, and thrown the frontier's defenses into disarray. The border that once held back the Shuvüüsh now stands weakened, and the road into the heart of Yanshen finally lies open before us."

 Y91_terror_over_yanshen_title:0 "Terror Over Yanshen"
 Y91_terror_over_yanshen_desc:0 "We have finally breached the fortified frontier of Yanshen, opening the road into their rich heartlands. The barrier that once shielded the rich lands of the south from our raids has been shattered, and nothing now stands between our brave Shuvüüsh warriors and their hearts' desire. The time has come to spread fear across every city and village of Yanshen. Let our terrorbird riders announce their arrival with thunderous fury, and let every corner of the land tremble beneath their iron talons. For the conquest of Yanshen has only just begun."

 y91_advance_on_tianlou_title:0 "Advance on Tianlou"
 y91_advance_on_tianlou_desc:0 "With the troublesome mercenary league of Gushuokguan finally crushed, the armies of the Shuvüüsh have at last reached the gates of Tianlou. The greatest treasure of Yanshen now lies before us. The time has come to seize the brightest pearl of Yanshen and prove that no city, however rich or mighty, can withstand the iron talons of the Shuvüüsh terrorbirds. When word of Tianlou's fall will spread across the land, the inevitable fate of Yanshen will no longer be in doubt. All will know that no force remains capable of halting the advance of the Shuvüüsh horde."

 y91_crush_the_pearl_of_yanshen_title:0 "Crush the Pearl"
 y91_crush_the_pearl_of_yanshen_desc:0 "At long last, Tianlou is ours. This priceless pearl of Yanshen resides now firmly within the grasp of the iron talons of our terrorbirds. Yet even as celebrations of victory sweep across the realm, a most grave matter troubles the thoughts of [Root.Monarch.GetName]. The great conquest that carried Nuugdan Tsarai from the steppes into the heart of Yanshen has reached its end, at least for now, but a far greater question now stands before the Shuvüüsh people: how shall we rule these lands, and what future shall we forge for our people?"

 y91_imperial_foundations_title:0 "Imperial Foundations"
 y91_imperial_foundations_desc:0 "It is time to leave a more lasting mark on these lands than short-lived conquest and plundering raids. Though our terrorbird riders have won victory after victory for our people, swords alone cannot secure all that we have conquered. If we are to truly take root in Yanshen and ensure that our rule endures for generations to come, much work still lies ahead. Those we have conquered must become our subjects in truth, accepting their role in the new order, the spoils of war must be funneled to built the foundations of prosperity, and order must follow in the wake of conquest. By consolidating our hold over the Yanshen territories already under our control we shall lay the foundations of a stable and enduring realm."

 y91_conquest_of_the_tribes_title:0 "Conquest of the Tribes"
 y91_conquest_of_the_tribes_desc:0 "Before the time comes to march south once more, we must first secure our own rear guard. The Shuvüüsh clans that remain outside the Nuugdan Tsarai confederation must be brought back into alignment by force, so that their warriors and herds may once again strengthen the Shuvüüsh as a whole. Every tribe brought beneath our banner swells our ranks and secures our homeland, ensuring that when the call to invade Yanshen sounds once again, our terrorbird riders will thunder south stronger than ever before."

 y91_defeat_gowon_title:0 "Defeat Danggun"
 y91_defeat_gowon_desc:0 "To completely sever Danggun's access to Yanshen, we must deliver a decisive blow to their ambitions and force them to abandon all of their remaining holdings along the Yansheni coast. In addition to such strategic considerations, this campaign presents a rare opportunity for [Root.Monarch.GetName] to journey to the Temple of Bhengudak. Among the Shuvüüsh tribes, it is said that should an Izhuun return from such a pilgrimage bearing the Great Conqueror's blessing - or even don his Mask - their authority among the tribes would become unquestionable."

 Y91_court_the_warlords_title:0 "Court the Warlords"
 Y91_court_the_warlords_desc:0 "The defeated warlords of Jiangdu stand on the brink of utter defeat, and risk succumbing to the peasant armies of the Lanjinhui republic. We could come to their aid, help them reclaim their homeland, and demand their oath of loyalty to the Faceless Queen of Nuugdan Tsarai in return, gaining a faithful bulwark along our western frontier. Or we could simply sweep aside the rulers of this land long plagued by the acrimonious struggles of warlords and peasants alike, bringing it in its entirety under our rule. The decision whether these lands are to be governed by loyal local subjects or by our own tribes ultimately rests with [Root.Monarch.GetName]."


 flavor_nuugdan_tsarai.1.t:0 "A Great Victory"
 flavor_nuugdan_tsarai.1.d:0 "At last, we have crossed beyond the mighty gates of the Yanshen frontier wall - this is a great victory.\n\nFor generations, the passes of Jiantsiang and Zhiqian have stood between the steppe and Yanshen. The people of Yanshen believed that their towering walls and mighty fortifications would forever keep us beyond their borders. Yet while they placed their faith in walls and ramparts, the Faceless Queen's agents had already uncovered the weaknesses hidden within.\n\nNow the gates of the frontier stand open. Our warriors and terrorbird riders ride through the passes, carrying the banners of the tribes deep into the heart of Yanshen. This victory is more than the fall of a single stronghold - it proves that Yanshen is not beyond our reach. Ahead lie richer lands, greater foes, and new glories waiting to be claimed."
 flavor_nuugdan_tsarai.1.a:0 "Let Yanshen tremble at the sound of the terrorbird cries!"

 flavor_nuugdan_tsarai.2.t:0 "Negotiations with the Gowon"
 flavor_nuugdan_tsarai.2.d:0 "The war between Nuugdan Tsarai and the Gowon realm to the east is drawing to a close.\n\nThe loss of their ill-gotten Shuvüüshudi lands has made it clear to the haughty lords of the Gowon that they can no longer maintain their rule over the steppe. And as Shuvüüsh riders crossed the border into the fertile heartland of Gowon, the war had finally reached a stage they had long hoped to avoid.\n\nIt was then that a messenger mounted upon a terror bird arrived at the Gowon camp.\n\n“[Root.Monarch.GetTitle] [Root.Monarch.GetName] in [Root.Monarch.GetHerHis] magnaminity has no desire to lay claim to the Gowon heartlands at this time.”\n\n“In exchange for this generous act of forbearance, the lords of Gowon will relinquish all lands, rights, and claims they hold in Shuvüüshudi and Yanshen in perpetuity.”\n\nFor a long while, no one spoke.\n\nThe loss of their possessions in Shuvüüshudi and Yanshen was undoubtedly a heavy price to pay, but when compared to the cost of allowing this disastrous war to continue spreading, it was perhaps the best outcome they could still hope for."
 flavor_nuugdan_tsarai.2.a:0 "When the terror bird rider departed, no one voiced any objection."

 flavor_nuugdan_tsarai.3.t:0 "A Visit to the Temple of Bhengudak"
 flavor_nuugdan_tsarai.3.d:0 "[Root.Monarch.GetName] had reunited the fractured Shuvüüsh tribes beneath a single banner and defeated the mighty Gowon lords to the east. With the Crane Throne relinquishing its holdings in both Shuvüüshudi and Yanshen, the gates of the Temple of Bhengudak were once again opened to the Shuvüüsh. Though she had long refused to wear the Mask of any of the Three Brothers, many believed this would finally change. It was said that the Faceless Queen would journey to the Temple of Bhengudak, earn the Great Conqueror's blessing, and emerge wearing his Mask, further cementing her authority over the tribes.\n\nNot long after the war's end, however, the Faceless Queen traveled to the temple in secret. There, she removed her white mask and donned the Mask of Bhengudak. At that very moment, she heard a voice.\n\n"Chagan, Ulaan, Altan, and I have watched you for a long time. Our duty is to guide the leaders of our people until the day we rejoin with the Supreme Spirit. Many come here seeking our approval, hoping to walk the paths we once chose. But you are different, Nurgai. You have no need of our guidance. Go and forge a legend of your own."\n\nWhen Nurgai removed the Mask of Bhengudak, the voice faded away. No one knows what transpired within the temple that day. Neither the priests nor the Faceless Queen ever spoke of it. The only thing known for certain is that when Nurgai emerged from the Temple of Bhengudak, she wore not Bhengudak's Mask, but her own white one."
 flavor_nuugdan_tsarai.3.a:0 "The Faceless Queen walks her own path."

 flavor_nuugdan_tsarai.4.t:0 "Celebration and Reflection"
 flavor_nuugdan_tsarai.4.d:0 "After years of conquest, the banners of Nuugdan Tsarai now fly high above Tianlou. The city resounds with celebration as songs of triumph and jubilant cries echo through its streets. For the countless proud clan warriors who followed the great march south, this day marks the fulfillment of a dream chased by generations of their ancestors but which they could scarcely have imagined to see fulfilled in such a glorious fashion. The Pearl of Yanshen, once thought forever beyond the reach of the steppe, is now the crown jewel of our realm.\n\nYet as the celebrations start to fade, [Root.Monarch.GetName]'s thoughts begin to turn toward a more distant future. Years spent campaigning across Yanshen have changed the Shuvüüsh as surely as they have changed the land itself. Our people have begun to understand the customs of Yanshen, reluctantly accepted its institutions, and made use of its unique systems of governance. We are no longer merely conquerors riding forth from the steppes, but rulers of a realm greater than any our ancestors could have imagined. What we build from this victory will define the destiny of the Shuvüüsh for generations to come."
 flavor_nuugdan_tsarai.4.a:0 "We must change if we are to truly rule the people of Yanshen."

 flavor_nuugdan_tsarai.5.t:0 "Cooperation with the Warlords"
 flavor_nuugdan_tsarai.5.d:0 "The fall of the Lanjinhui was not won by the might of the Shuvüüsh horde alone. Before the war began, the warlords of Jiangdu secretly allied with [Root.Monarch.GetName], hoping to reclaim the homeland they had lost to the peasant republic. Their knowledge of the terrain, Lanjinhui defenses, and local garrisons proved invaluable in planning the campaign, allowing the war to progress swiftly.\n\nOnce the last resistance of the republic was broken, the warlords honored their bargain. With their homeland restored through Shuvüüsh arms, they pledged their loyalty to [Root.Monarch.GetName] and entered into the service of Nuugdan Tsarai. They were entrusted with governing the newly conquered lands, where their familiarity with local affairs would help secure our rule.\n\nCharged with governing and defending these lands, the Jiangdu warlords now stand ready to secure the western frontier of Nuugdan Tsarai. With its rear protected, the horde is now free to continue its advance deeper into Yanshen."
 flavor_nuugdan_tsarai.5.a:0 "They shall govern in our name."

 flavor_nuugdan_tsarai.6.t:0 "Carrot and the Stick"
 flavor_nuugdan_tsarai.6.d:0 "Conquering the lands of the peasants and warlords was only the beginning. When Lanjincun fell to our terrorbird riders, [Root.Monarch.GetName] ordered the arrest of the members of the Ningchi, the secretive organization that had long hidden behind the banners of the Lanjinhui republic while quietly guiding the peasant revolution from the shadows. Before the assembled crowds, the Ningchi were publicly denounced as the true architects of the revolution. Their members were executed one by one, and with their destruction, the organization that had long operated within the peasant republic collapsed, serving as a warning to all who would dare resist their new Shuvüüsh rulers.\n\nThe common peasants, however, met a different fate. Most who laid down their arms and swore obedience were granted mercy and sent back to their fields. To their new masters, the wealth their labor could bring was worth far more than another season of needless bloodshed. Thus, by punishing the leaders of the peasant revolution while showing mercy to the common folk, [Root.Monarch.GetName] had taken the first important step towards bringing these newly conquered lands firmly under Shuvüüsh rule."
 flavor_nuugdan_tsarai.6.a:0 "Fear of retribution and yearning for mercy must coexist."

 flavor_nuugdan_tsarai.7.t:0 "The Death of the Faceless Queen"
 flavor_nuugdan_tsarai.7.d:0 "The death of the Faceless Queen sent shockwaves through the many clans of the Shuvüüsh. As the invasion pressed ever deeper into foreign lands, the woman who had united the countless tribes beneath a single banner was suddenly gone. Bereft of the by now unquestioned authority that had kept the awed clan leaders in check, old rivalries resurfaced almost overnight. Chieftains who had once marched side by side now quarreled over the division of conquered lands, the wealth of the conquered cities, and the just rewards each tribe believed it had earned for its contributions during the invasion.\n\nWhispers swiftly began to spread among the camps. Some claimed that, through rites and divinations, certain shamans had come to believe that the Three Brothers no longer looked upon the invasion with favor. Whether these rumors held any truth mattered little; they spread rapidly from camp to camp, deepening uncertainty and suspicion among the clans. What had once seemed an unstoppable host began to fracture, and the unity forged by the Faceless Queen began to show its first signs of strain."
 flavor_nuugdan_tsarai.7.a:0 "Cracks begin to form among the clans."
 
 flavor_nuugdan_tsarai.8.t:0 "The Death of the Faceless Queen"
 flavor_nuugdan_tsarai.8.d:0 "The death of the Faceless Queen sent shockwaves throughout the realm. By the time of her passing, the clans stood united beneath a single banner, and the lands she had won were enough to lay the foundations of a new empire. In the years that followed her conquests, she set about forging institutions that would bind conqueror and conquered alike, ensuring that the Shuvüüsh would rule for generations to come - not merely through fear, but through enduring order. The woman who had led her people from the steppes to the richest lands of Haless would no longer be remembered merely as a conqueror, but as the sovereign who transformed a host of tribal clans into a true empire. Her name had become legend, forever bound to the great invasion that reshaped the destiny of both the Shuvüüsh and Yanshen."
 flavor_nuugdan_tsarai.8.a:0 "Nurgai, the Faceless Queen, Nightmare of Yanshen"

 flavor_nuugdan_tsarai.9.t:0 "The Eunuchs’ Proposal"
 flavor_nuugdan_tsarai.9.d:0 "The talons of our terrorbirds have brought us victories unlike any before. Town after town has submitted to [Root.Monarch.GetName], and ever more of Yanshen now falls under our rule. Yet as our domains expand, it becomes increasingly clear that tribal chiefs and warriors alone cannot govern the densely populated settled lands with their intricate social hierarchies we have conquered.\n\nRecently, a group of eunuchs from across Yanshen arrived at our court. They offered their administrative expertise, local connections, and networks of officials in service to [Root.Monarch.GetTitle]. In return for a place within our governing structure and authority over local affairs, they promise to help integrate newly conquered territories, maintain order, and ease the fears of the Yansheni regarding their new overlords by portraying us as rulers rather than mere conquerors.\n\nMany Shuvüüsh find these eunuchs difficult to understand. Their customs and devotion to documentation and regulations are far removed from our own traditions. Yet the truth is plain: terrorbird riders may conquer Yanshen, but they cannot govern it alone. After much deliberation, [Root.Monarch.GetName] has accepted their proposal, and these Yansheni bureaucrats shall henceforth serve as part of our rule."
 flavor_nuugdan_tsarai.9.a:0 "Let them govern these crowded cities for us."


