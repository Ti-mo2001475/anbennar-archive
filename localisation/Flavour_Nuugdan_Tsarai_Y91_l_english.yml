l_english:
 y91_infiltrate_the_frontier_title:0 "Infiltrate the Frontier"
 y91_infiltrate_the_frontier_desc:0 "As our understanding of Yanshen has deepened, we planted spies in Zhiqian and Jiantsiang during our last incursion. Now, with the passage of time, they can be called upon to help us break through the Yanshen frontier."

 Y91_terror_over_yanshen_title:0 "Terror Over Yanshen"
 Y91_terror_over_yanshen_desc:0 "We have finally breached the Yanshen frontier, and our long campaign has achieved a decisive breakthrough. The time has come to spread fear among the people of Yanshen and make them tremble beneath the iron talons of our terrorbirds. "

 y91_advance_on_tianlou_title:0 "Advance on Tianlou"
 y91_advance_on_tianlou_desc:0 "With the troublesome mercenary league finally crushed, we have at last advanced all the way to the gates of Tianlou. Now is the time to reach for the brightest pearl of Yanshen. Once Tianlou falls into our hands, all of Yanshen will tremble at the news."

 y91_crush_the_pearl_of_yanshen_title:0 "Crush the Pearl of Yanshen"
 y91_crush_the_pearl_of_yanshen_desc:0 "At last, we have taken Tianlou. This priceless treasure of Yanshen now lies firmly within the iron grasp of our terror birds. Amid the celebrations of our triumph, however, our ruler seems lost in thought, contemplating what the end of this great campaign truly means for our people and for the future that lies ahead."

 y91_imperial_foundations_title:0 "Imperial Foundations"
 y91_imperial_foundations_desc:0 "It is time to bring something more than conquest and plunder. If we are to secure our place and put down lasting roots in this land, much work still lies ahead. Let us consolidate our control over the Yanshen territories we already hold and lay the foundations of a stable and enduring rule."

 y91_conquest_of_the_tribes_title:0 "Conquest of the Tribes"
 y91_conquest_of_the_tribes_desc:0 "While awaiting the opportunity to march south, we must also strengthen our power by conquering the surrounding nomadic tribes and expanding our armies."

 y91_defeat_gowon_title:0 "Defeat Gowon"
 y91_defeat_gowon_desc:0 "To completely sever Guwon’s access to Yanshen, we must deliver a decisive military blow and force them to abandon their holdings in Yanshen. Now is also the perfect moment for the Faceless Queen to march upon the Temple of Bhengudak and assert her rightful dominion."

 Y91_court_the_warlords_title:0 "Court the Warlords"
 Y91_court_the_warlords_desc:0 "The people of Jiangdu, these defeated warlords, stand on the brink of being overrun by the peasant armies of the Lanjinhui. We could aid them in reclaiming their lands and demand their submission in return, or we could conquer both Jiangdu and the Lanjinhui ourselves, bringing the peasants and their lands directly under our rule."


 flavor_nuugdan_tsarai.1.t:0 "A Great Victory"
 flavor_nuugdan_tsarai.1.d:0 "At last, we have crossed the mighty gates of the Yanshen frontier—this is a great victory.\n\nFor generations, the passes of Jiantsiang and Zhiqian have stood between the steppe and Yanshen. The people of Yanshen believed that their towering walls and mighty fortifications would forever keep us beyond their borders. Yet while they placed their faith in walls and ramparts, the Faceless Queen's agents had already uncovered the weaknesses hidden beneath them.\n\nNow the gates of the frontier stand open. Our warriors and terrorbird riders ride through the passes, carrying the banners of the tribes deep into the heart of Yanshen. This victory is more than the fall of a single stronghold—it proves that Yanshen is not beyond our reach. Ahead lie richer lands, greater foes, and new glories waiting to be claimed."
 flavor_nuugdan_tsarai.1.a:0 "Let Yanshen hear the cries of the terrorbirds!"

 flavor_nuugdan_tsarai.2.t:0 "Negotiations with the Guwon"
 flavor_nuugdan_tsarai.2.d:0 "The war between Nuugdan Tsarai and Guwon is drawing to a close.\n\nThe loss of Shuvushdi has made it clear to the Guwon that they can no longer maintain their rule over these lands. And as Shuvush riders crossed the border, the war had finally reached a stage they had long hoped to avoid.\n\nIt was at this moment that a messenger mounted upon a terror bird arrived at the Guwon camp.\n\n“[Root.Monarch.GetTitle] has no desire to lay claim to the Guwon heartlands at this time.”\n\n“In exchange, the Guwon will relinquish all lands, rights, and claims they hold in Shuvuushdi and Yanshen.”\n\nFor a long while, no one spoke.\n\nThe loss of their possessions in Shuvuushdi and Yanshen was undoubtedly a heavy price to pay, but compared to allowing the war to continue spreading, it was perhaps the best outcome the Guwon could still hope for."
 flavor_nuugdan_tsarai.2.a:0 "When the terror bird rider departed, no one voiced any objection."

 flavor_nuugdan_tsarai.3.t:0 "Visitors to the Bhengudak Temple"
 flavor_nuugdan_tsarai.3.d:0 "Nurgai reunited the fractured Shuvuush tribes beneath a single banner and defeated the mighty Guwon. With the Guwon relinquishing their holdings in Shuvushdi and Yanshen, the gates of the Temple of Bhengudak were once again opened to the Shuvuush people. Not long after the war's end, the Faceless Queen secretly journeyed to the temple. There, she removed her white mask and donned the Mask of Bhengudak. At that very moment, she heard a voice.\n\n“Chagan, Ulaan, Altan, and I have watched you for a long time. Our duty is to guide the followers of the Three Brothers until the day we return to the High Spirit. Many come here seeking our approval and walk the paths we once chose. But you are different, Nurgai. You have no need of our guidance. Go and forge a legend of your own.”\n\nWhen Nurgai removed the mask, the voice faded away. No one knows what transpired within the temple that day. The priests never spoke of it, nor did the Faceless Queen. The only thing known for certain is that when Nurgai left the Temple of Bhengudak, she wore not Bhengudak's mask, but her own white one."
 flavor_nuugdan_tsarai.3.a:0 "The Faceless Queen embarks upon her own path."

 flavor_nuugdan_tsarai.4.t:0 "Celebration and Reflection"
 flavor_nuugdan_tsarai.4.d:0 "Tianlou is finally ours. The city resounds with Shuvuush celebrations, as songs of triumph and jubilant cries echo through its streets. For the countless tribesmen who followed the great march, this moment marks the fulfillment of an achievement that generations of their ancestors could never have imagined.\n\nYet as the celebrations begin to fade, our ruler's thoughts turn toward a more distant future. The conquest of Tianlou is not the end of our journey, but the beginning of a new era. The Shuvuush are no longer merely conquerors riding forth from the steppes—they are now the rulers of Yanshen. How we will govern this land, and what path we shall lead the Shuvuush down next, will be the question that defines the years to come."
 flavor_nuugdan_tsarai.4.a:0 "We must change if we are to truly rule the people of Yanshen."

 flavor_nuugdan_tsarai.5.t:0 "Cooperation with the Warlords"
 flavor_nuugdan_tsarai.5.d:0 "Through cooperation with the warlords, we have successfully conquered this fertile land. While taking control of the territory, the Queen is also planning to deploy these warlords to administer other lands."
 flavor_nuugdan_tsarai.5.a:0 "They shall govern in our name."

 flavor_nuugdan_tsarai.6.t:0 "Carrot and the Stick"
 flavor_nuugdan_tsarai.6.d:0 "The Faceless Queen executed the Ningchi clan leaders of the Lanjinhui, while moving to pacify the remaining peasant population."
 flavor_nuugdan_tsarai.6.a:0 "“We must change if we are to truly rule the people of Yanshen.”"

 flavor_nuugdan_tsarai.7.t:0 "The Death of the Faceless Queen"
 flavor_nuugdan_tsarai.7.d:0 "The death of the Faceless Queen sent shockwaves through the Shuvuush tribes as they continued their great march. Bereft of the mighty monarch who had held them together beneath a single banner, the tribes quickly fell into disarray, their unity unraveling into chaos."
 flavor_nuugdan_tsarai.7.a:0 "Cracks begin to form among the tribes."
 
 flavor_nuugdan_tsarai.8.t:0 "The Death of the Faceless Queen"
 flavor_nuugdan_tsarai.8.d:0 "The death of the Faceless Queen sent shockwaves throughout the Shuvuush. Yet unlike before, she left behind no unfinished conquest. Having united the tribes and conquered Yanshen, she would no longer be remembered merely as a conqueror, but as the ruler who fulfilled the destiny of the Shuvuush."
 flavor_nuugdan_tsarai.8.a:0 "Nurgai, the Faceless Queen, Nightmare of Yanshen"

 flavor_nuugdan_tsarai.9.t:0 "The Eunuchs’ Proposal"
 flavor_nuugdan_tsarai.9.d:0 "The talons of our terrorbirds have brought us victories unlike any before. Town after town has submitted to [Root.Monarch.GetTitle], and ever more of Yanshen now falls under our rule. Yet as our domains expand, it becomes increasingly clear that tribal chiefs and warriors alone cannot govern the densely populated and intricate settled lands we have conquered.\n\nRecently, a group of eunuchs from across Yanshen arrived at our court. They offered their administrative expertise, local connections, and networks of officials in service to [Root.Monarch.GetTitle]. In return for a place within our governing structure and authority over local affairs, they promise to help integrate newly conquered territories, maintain order, and ease the fears of Yanshen's peoples and states by presenting us as rulers rather than mere conquerors.\n\nMany Shuvuush find these eunuchs difficult to understand. Their customs and devotion to documents and regulations are far removed from our own traditions. Yet the truth is plain: terrorbird riders may conquer Yanshen, but they cannot govern it alone. After much deliberation, [Root.Monarch.GetTitle] has accepted their proposal, and these Yanshen bureaucrats shall henceforth serve as part of our rule."
 flavor_nuugdan_tsarai.9.a:0 "Let them govern these cities for us"


