 #Government Reforms
 kheionai_the_kheionolyklos: "The Kheionolyklos"
 kheionai_the_kheionolyklos_desc: "To hold office for one’s Kheion is a glory beyond all others - grown men have broken down in tears of gratitude when taking their oath of office. It is obvious that there is no shortage of talented and willing politicians. To give these able administrators the chance to represent their local constituencies in a nationwide forum will not only lead to the more efficient allocation of resources, but to an entirely new class of officeholders who are grateful to us for providing them with a chance to shine."
 kheionai_the_kheionolyklos_effect_tt: "Parliament Seats on either §YUrban§! Terrain or have §Y20§! Development gain Monthly Devastation: §G-0.1§!, Local Production Efficiency: §G+10.0%§!, Local Tax Modifier: §G+15.0%§!, Local Manpower Modifier: §G+10.0%§!, Local Sailors Modifier: §G+10.0%§!\n\nAll other Parliament Seats gain Local Development Cost: §G-10.0%§!, Local Production Efficiency: §R-5.0%§!, Local Tax Modifier: §R-5.0%§!, Local Manpower Modifier: §R-10.0%§!, Local Sailors Modifier: §R-10.0%§!"
