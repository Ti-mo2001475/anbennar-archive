 aPUI_deathwinds_bar_tt: "The §aDeathwinds§! are [2936.getDeathwindsBarActivity]\n-------------------------------------------------------------------\nDeathwinds last for §Y2 years§!\n\nWhile active, Every province affected will gain increasing amounts of §YAttrition§!, §YDevelopment Cost§!, §YDevastation§!, reduced §YMovement Speed§!, and reduced §YTrade Power§!\n§Y1 year§! into the storm, every affected province will also gain §YDevastation§!, and lose §YRegiments§! and a §YBuilding§! if the intensity is at least §Y4§! and §Y7§! respectively\n\nThe previous §aDeathwind§! intensity was §Y[2936.deathwinds_previous_var.GetValue]§! before external effects\n\nThe next §aDeathwind§! will be between intensities §Y[2936.deathwinds_low_level_var.GetValue]§! and §Y[2936.deathwinds_high_level_var.GetValue]§!"
