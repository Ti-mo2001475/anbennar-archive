 kheionai_the_urban_litea: "The Urban Litéa"
 kheionai_the_urban_litea_desc: "Our population has always been centered around the cities - if only for the simple reason that the windwards can be found there. This concentration of people offers us the opportunity to similarly centralize our bureaucracy - it is only natural that a government of the people should rule from where the people are. The administration of the countryside may suffer from this policy of centralization, but the discontented among their dwindling numbers can always move to the city."
