 kheionai_the_schaal_oritheia: "The Schaal Ónítheia"
 kheionai_the_schaal_oritheia_desc: "To bring order from chaos is the highest purpose one can achieve. It is the state’s most important duty to ensure this, and yet the state has only limited resources. Therefore, waste - whether of time, money, or resources - is not only deplorable in itself, but a denigration of the highest good, and therefore a crime of the greatest magnitude. This is the contention of the philosophers of the Schaal Onitheia, and to bring their influence into the administration would consequently radically reduce the amount of waste, bureaucracy, and obstruction in our government if we can meet their exacting standards."
 
 kheionai_gelmonian_rule: "Gelmonian Rule"
 kheionai_gelmonian_rule_desc: "The public square is a raucous place filled with members of any number of competing philosophical schools and political factions seeking to enact their vision of the common good. What if these squabbling factions were to be swept away by a singular mind with the vision and drive to do so? What if the people were to unify under one man, and cry out with one voice in support for his rule? Every vote counts, after all."

 ######################################### KHEIONAI SYSTEM EVENTS #################################################
 kheionai.3.t: "Six Months until the Deathwinds"
 kheionai.3.desc: "The time before a Deathwind arrives, known as the Fophoúióm by the Kheionai and the Nébidí by the Eltibhar, is terribly apprehensive, and. Defined by fearful preparation, so ingrained is this period in the consciousness of the Alecandi that references to it can be found in all aspects of culture, from art to language. And how could it not? Six months to the Deathwinds, six months til annihilation, seems but the thinnest veil between normal life and the Millennium Scourge."
 kheionai.3.a: "I hope we prepared well."
 kheionai.3.b: "Do not inform me of the Deathwinds anymore"

 kheionai.4.t: "The Deathwinds Begin"
 kheionai.4.desc: "The night sky fills with aurora winds, and when day comes the different tones of shining violet and swirling and rushing clouds of sand become a cosmic tapestry which fills the sky. But will it ever be worth the fear? Can one forget the roaring of the Deathwind at night, when uncounted gusts blow with such ferocity as to produce a cacophonous symphony of howling? Or the ruin which the small respites between the storms bring. The sweltering heat which radiates from the sandy ground. And how the Deathwind kills! It fills every crack and dip, and breaks and shifts every piece of furniture, and as for the body – it fills every orifice. What more terrible fate can be imagined? No hearts are ever hardened enough for such an ordeal."
 kheionai.4.a: "The Deathwinds have begun."

 kheionai.5.t: "Destruction"
 kheionai.5.desc: "We build, and the cold hands of the Deathwinds take. Sometimes it takes months of persistent battering for the scintillating winds to destroy. Sometimes, it only takes a single night. Either way, what was once a productive complex for the state has been rendered a tragic ruin. We could rebuild it, or we could just leave it be, and let it join the blue-tinged ruins which dot Alecand – a brutal reminder of the mistakes of the past."
 kheionai.5.a: "So be it."
 kheionai.5.b: "But the cold hands did not take this time"

 kheionai.6.t: "The Deathwinds End"
 kheionai.6.desc: "At last, no swirling abyss consumes the night sky, the shining stars and baleful moon return to light the ruinous vistas where life once existed. To you who dwell in the Kheions, who drink wine below your invincible shields and heed not the Deathwinds – remember the suffering, we, the people of the countryside have to endure. What you view as a spectacle we experience as annihilation. Is Alecand truly the immortal towers of the shielded cities, or is it rather the wasted landscapes and weathered toilers broken and reforged by every cycle of obliteration?"
 kheionai.6.a: "The Deathwinds have ended."

 kheionai.7.t: "The Deathwinds"
 kheionai.7.descKheionai: "As long as they can remember, the Kheionai have looked to the bright blue sea. It was the one companion to the condemned prisoners in the black bastions of elder times, and when it all collapsed, the freed people surely gazed at that infinite expanse and marvelled at a world which was now theirs. But this was not to be. For as long as the Kheionai have been navigators of their own destinies, their proud lands on Alecand have been battered by the ultramarine Death, terrible winds from irradiated Kaydhano which come every ninth year and stay for two years.\n\nAt first, they could only huddle in the ruins of their overlords, whose enormous wards now served to protect its inhabitants from the caustic sandstorms which raged everywhere. And though the Kheionai have grown used to the deathwinds after over a millenium, these original seven Windwards, known as the Zopedan, continue to be the only true bulwarks from the Deathwinds.\n\nBut the days which the Kheionai huddled in fear from the Deathwinds are coming to an end. With great sacrifice, it has become possible to expand defenses outside the Windwards permanently. And indeed, with enough investigation and investment into the great technologies of past and present, even the great Boogeyman of the Kheionai may be rendered utterly impotent."
 kheionai.7.k: "The Deathwinds come and go. But the Kheionai will remain!"
 kheionai.7.descEltikan: "As long as the island of Alecand has existed, so have the Fasiri. They remember the expansion of the blue-skinned elves, they remember when the emperors of the world died, they remember when the golden-eyed ones came and built terrible black fortresses for their condemned. And through it all, the Fasiri have endured, protected by the great mountain Meteí. Indeed, the Deathwinds are just another weight carried by the hard-bodied Fasiri.\n\nEvery ninth year, these violet-hued irradiated winds from the northeast scour Alecand, and the Fasiri huddle beneath the great Mother Meteí, whose panoramic peaks and foothills cover the lands of the Fasiri, providing much needed relief for the two tempestuous years which the Deathwinds blow. But times are changing, and even the bronze-souled Fasiri have grown tired of the brutal blue scourge. It will take much effort and learning, but the Fasiri of the future may at last overcome the Deathwinds permanently, as they have done with so many other enemies thought invincible."
 kheionai.7.e: "Praise Meteí!"

 kheionai.8.t: "The Deathwinds of Alecand"
 kheionai.8.desc: "Every ninth year, terrible winds of irradiated sand from the KaydhanoKadyhano “Sea” ravage the fair island of Alecand. The blue-hued storms devastate the island for two years, rendering life a constant struggle outside of the seven ancient Kheions with their precursor shields. Obviously, the suffering of the Alecandi is of little concern to our grand empire, but as the administrators of their island, we do bear some responsibility for their wellbeing. We are not as invested or knowledgeable about the Deathwind problem, but we may still be able to help from afar."
 kheionai.8.a: "Fine"

 #Kheion and Kaydhano Magical Project
  #Stage 1
 kheionai.50.t: "Dalónoi Arpetria"
 kheionai.50.desc: "The violet winds gilded the glowing blue substratum of the Windward as the scholars worked under the watchful eye of $RULER$. And what work it was! They were clearing the ground, shoveling dirt, and laying down the foundation of a new Windward projector. Sweat covered their faces, creating a mirror upon which the glittering Deathwinds were reflected. The foundation was laid with a learned precision by weary faces whose dull countenances indicated decades of experience turning every task into mindless automation. What scholars were these! They did not look like learned people. It seemed as if long years of regular routine and numbing drudgery could turn even the most talented of scholars into the most common of laborers. How discomforting a realization! Even looking at the construction site made $RULER$ sweaty. \n\nBut it was the way of the Kheionai. It was how they had evolved from simple huts which had to be rebuilt after each Deathwind to the mass dissemination of Windwards which, while still only a pale shadow of the mighty Kheions, at least allowed the common folk to live in relative comfort. Perhaps the story of science, the figure of the genius and the inventor, conjuring technological wonders from the legendary partnership of the intellect and the imagination, was a mere fantasy when contrasted with the toil of practical reality.\n\nA crouched silhouette, black and featureless before the aurora of the Deathwinds, stood up and approached $RULER$.\n\n“If you’re wondering what we’re working on…” Of course $RULER$ knew, but [Root.Monarch.GetSheHe] stayed silent, if only to follow the scholar’s words. “This is the base. It contains an engraved pattern, which accommodates the shaking of the projector.” $RULER$ stayed silent.\n\n“It isn’t the most efficient, as you can probably tell…”\n\n“Efficient!” A slip of the tongue. $RULER$ inwardly cursed [Root.Monarch.GetHerHis] inability to suppress  [Root.Monarch.GetHerHis] surprise, and looked to see how the scholar had reacted.\n\n“Well, the machine isn’t that well designed; many components are bad and ineffective when paired with each other, so even more components and parts need to be added to prevent them from tearing each other apart–” $RULER$ stopped listening. This was all [Root.Monarch.GetSheHe] needed, growth was possible!\n\n“And what is your name, scholar?”\n\n“Tò Schaalir.”"
 kheionai.50.a: "“Well, Schaalir, do you want to be the lead of a special new project?”"
#  kheionai.50.t: "Dalónoi Arpetria" - Old loc
#  kheionai.50.desc: "25 Triáselun\n…Chiding, pleading, condemning. This is the first great step towards our final overcoming, but the people wail as if we were holding a funeral for the entire Kheion. Silently we walked with the great Arpetria the distance from the central assembly house, where it lay for countless millenia, to our open-air workshop. It seemed that the whole city moved with us: men, women, and children staring at the thing, so mythicized as the heart of the city, yet hidden away and never seen by any except the most important scientists and leaders.\n\nAnd what a heart it was! 300 laborers pushed it along, yet by the day’s end we had only gone 50 meters. It looked like a spider transposed onto a caldron, and mysterious pillars surrounded it, penetrating and passing through, like damestear fumes. The whole was engraved with arcane tesselations, and from the hexagonal top projected a translucent beam from which the whole Zopedan was generated.\n\n26 Triáselun\nGreat mistake! But our first discovery.\n\nAs we were wheeling the Arpetria to the courtyard where we shall study it, it passed under a gate of scarcely 5 meters in length. At first all was well and all were jovial. But as it arrived at the middle of the gate, there came a great screeching noise, as if the whole settlement were screaming at once. We felt a great heat come from the machine, and its beam disappeared, and with it the whole Zopedan.\n\nNever had the bare sky felt so terrible! The laborers, the scientists, and the citizens, all panicked. Men ran about madly without aim, until in the midst of it someone shouted to destroy it, destroy the gate. And so we all did, using anything we had available until it was all debris, and the ghostly beam again reached into the sky and enveloped it with the violet Zopedan.\n\nSo it can be blocked and reactivated. A dynamic thing. Now it lays in the center of our courtyard, humming like a sleeping beast, and as I gaze at it I feel as if imitation is possible."
#  kheionai.50.a: "Indeed"

 kheionai.51.t: "Meer Imitation"
 kheionai.51.desc: "Tò Schaalir stood looking at the monstrous thing for a long time. Indeed, one needed a few minutes to even make out the details of the machine, so blackened with dust from centuries of usage was it. It was a vertical stack of corrugated shapes and trembling smokestacks through which smoking pipes intertwined, appearing more like ropes of twine restraining some tough beast. Schaalir turned away for a second, so abstruse and uncanny was it to even his scholarly eye, that any attempt at understanding was invariably drowned out by an internal wave of disgust and an external assault of the moaning and screaming originating from who knew where on the enormous construct. Alas, he had been spoiled by the elegant design of the Arpetria. This thing would have to be taken apart and looked at piece by piece, and he would have to take to those people who called themselves “engineers” who built and maintained them.\n\nHow inefficient this thing was… instead of a single unifying beam of arcane energy, it projected three waves of dull blue. Furthermore, one of these machines was not enough. Three others needed to be placed in a square configuration stretching many kilometers in order to adequately reinforce each other to produce an effective Windward. This was a system of idiocy, which cost the state enormously every month and whose mechanisms could even be understood by the simplest Eltibhar, as repulsive as its appearance was. The whole thing would need to be thrown out, and rebuilt from scratch. The little they had learned from the Arpetria communicated to Tò Schaalir the need for elegance and cleverness, as vulgar as those words would be to his conventional-minded colleagues.\n\nSchaalir silently walked away from the windward, to the confusion of the workers surrounding it. Schaalir had scheduled a week-long tour, but now he had already called it off."
 kheionai.51.a: "The path of innovation is impossible to reach through lumping convention onto convention."

 kheionai.52.t: "Obliteration"
 kheionai.52.desc: "$RULER$ sat in [Root.Monarch.GetHerHis] office in [Root.Capital.GetName]. The swirling fog of the Deathwinds pounded against the gossamer Windward, illuminating the open room with a dazzling light which cast long violet-tinged shadows. In [Root.Monarch.GetHerHis] heart $RULER$ felt a boundless satisfaction which absorbed [Root.Monarch.GetHerHim] to such an extent that [Root.Monarch.GetHerHis] focus was nearly drawn away from the cacophonous roar of the scintillating sand.\n\nWas it done? The Kheionai had leapt from corrugated convenience to elegant effectiveness in a single stride. The masses no longer knew any fear of the Deathwinds, except for the rare annoyance of sweeping away the few gusts of Deathsand which penetrated through the Windwards during the strongest cyclones– storms which in past times would have leveled an entire city. \n\n$RULER$ opened [Root.Monarch.GetHerHis] eyes. At that instant, a great glowing torrent, so dense that it seemed to be the blunt blade of a cyclopean god, cleaved into the Windward with such force that it shattered the Deathglass window into a thousand flying fragments. The gust birthed such violent light which refracted through the sapphire shards that it was as if the Clómrad and her many moons had been transported from the dark blurry vistas of a telescope into the lurid brightness of the room in which $RULER$ sat. \n\n[Root.Monarch.GetSheHeCap] gripped [Root.Monarch.GetHerHis] face. It was not done! [Root.Monarch.GetHerHisCap] satisfaction metamorphosed in an instant into fear and contempt. How could [Root.Monarch.GetSheHe] have been so arrogant to think that one step was all it took to conquer the Deathwinds? No – the Kheionai were dancing children, abject in their ignorance and absolute in their confidence. "
 kheionai.52.a: "Onwards, then!"
#  kheionai.52.t: "The New Arpetria" - Old loc
#  kheionai.52.desc: "In the middle of the town square there looked to be a contraption not quite like a monument or a machine, but a strange mixture of both, or something else entirely. Slick and featureless blue-tinted metal covered its entire exterior, and few recognizable shapes could be made out from its continuous smooth shell. If not for the beam of bright blue energy streaming out from a circular orifice on its top, it would not have been identifiable as an Arpetria.\n\nUnlike the old Arpetria, no maintenance crew was needed for its upkeep. And indeed, if one had been hired, they certainly would have done nothing but sit around and scratch their heads, so alien was the design. Once every week, a scientist and his assistant would arrive for its inspection and refueling. While the assistant would dump some unidentifiable material into a nearly invisible hatch on the side of the machine, the scientist would poke here and there, occasionally pulling on his ear or stroking his chin, in a manner which was highly humorous to the townspeople. (And in those days a countryside idiom was coined, “circling with an inspector’s gait,” after this common occurrence.)\n\nAlthough many laughed or gazed with curiosity at the new Arpetria, no complaints came from the townspeople, except from the now idle maintenance workers."
#  kheionai.52.a: "Elegance and success go hand in hand."

  #Stage 2
 kheionai.53.t: "Anéorsois Epodrésos"
 kheionai.53.desc: "8 Socíaselun\n…Have returned to the Kheion, and given much thought to the use of Épodrésos when the Arpetria was first moved. The method was positively barbarous. We took some of the precursor Épodrésos lines and hacked it into many smaller pieces, then linked them together with a few metallic joints of the traditional design, in order to ensure continuous power to the Arpetria while it was being moved. What a waste of good Épodrésos, they said. Perhaps at the time this was true, but we shall create new Épodrésos then. Especially if that means scrapping our old and inefficient imitations.\n\n15 Socíaselun\n…Experimented with pure damestear. This is only an intermediary, resources are scarce. Proved to be far too volatile, theoretically able to transport enormous quantities of energy but radiated most of it. One prized scientist was killed by a sudden bolt, next time will request prison laborers. Alloy hypothesis proving likely. Probably damestear combined with a stabilizing material.\n\n12 Rekóselun\n…Alloy entirely abandoned. Scientists experimenting with the line-cord theory managed to contain 84% of energy over 100 meters. A microfilament of pure damestear was strung through a hollow tube composed of lead and rubber. Damestear is believed to act as a base in this situation, allowing magical energy to remain in the air while maintaining a stable current. Some proposed that the ground could also act as an inert container, making this strategy economically viable.\n\n27 Triáselun\n…Underground lines have been set 150 kilometers to a remote area by the sea. Similar others are planned near Deathwind heavy areas."
 kheionai.53.a: "At last we research on our own foundation."

 kheionai.54.t: "Annihilation"
 kheionai.54.desc: "One evening, Tò Schaalir sat on the shore watching the speckled tides flow as the Deathwinds roared above. The only consistent light came from the dim blue glow which the Deathsands radiated, which made the churning sea appear like the night sky as thousands of scintillating particulates rushed and swirled within it. Occasionally, an especially large gust would collide with the windward, generating a weighty boom which rebounded through the small enclosure, accompanied by a scorching light which splashed across the transparent magical shield and illuminated the few buildings which composed the compound, which at that brief moment was entirely entrapped within the impenetrable storm just beyond the invisible dome. It was these moments which captivated Schaalir.\n\nIt was beautiful, no doubt. But it was also the collision of life and death; without the protection of the windward, Schaalir would undoubtedly only last for a few seconds before being swept up by the irradiated hurricane, and indeed some primal part of his mind still trembled at that possibility. \n\nSchaalir stepped into glittering tides. They were warm during the Deathwinds, and the sand particles stung as they touched his legs. Schaalir scooped a pool of the ocean water into his cupped hands. Its innate power was evident, and yet all of it was wasted and feared. \n\nHow ridiculous it all was. The Windwards weren’t even built to resist the Deathwinds. Their mutual annihilation of energy was a complete waste. There was no doubt in his mind that the Deathwinds could be used to power the Windwards. Schaalir would be laughed at for the idea, but its potency, the potency which he felt in his hands now, energized him in a way no idea had before. Yes, tomorrow, he would announce to the scientists their new path of research…"
 kheionai.54.a: "And so they got to work."

 kheionai.55.t: "Deathly Energy"
 kheionai.55.desc: "When the Deathwinds came, the townspeople, instead of experiencing their usual apprehension, looked with curiosity at the structure which circled their village. And it was strange indeed: a maze of channels, pipes, and boilers, all exposed to the open air, and forged in a leaden material which was cold to touch even on the sunniest of days. It was placed outside of the range of the Arpetria, quite deliberately, surrounding the forcefield in a ring.\n\nWhen the Deathwinds came, no terrible cracks and booms, the traditional sounds of the conflict between the Deathsand gusts and the Arpetria’s dome, were heard. Instead, the most unusual phenomena were observed. When the sand collided with the forcefield, it dissolved rather than exploding, assuming the form of what the townspeople could only describe as a glowing teal raindrop, which slid down the spherical dome into the open channels with a speed uncharacteristic of any kind of liquid. And at this time the contraption circling the town became like an unmanned forge, with pathways of the glowing liquid, resembling some kind of molten metal, flowing this way and that, filling every channel, pipe, and boiler - although they never overflowed. And even from within the forcefield, such an enormous heat could be felt radiating from the liquid that during the winter many would sit next to the edge of the Arpetria dome, and some would even sleep there. \n\nHow they slept is unknown, for during a Deathwind the energy field shown so brightly that lanternlight was no longer needed at night."
 kheionai.55.a: "All things will be used, nothing will be wasted."

  #Stage 3
 kheionai.56.t: "Madokton Kaimída"
 kheionai.56.desc: "Enalun 9\n…Left Empkeios, sailing north alongside the sea. Soldiers and scientists both in high spirits. Clear skies.\n\nEnalun 12\n…Docked alongside the shore. The sand here is an even mixture of KaydhanoKadyhano and normal. Trekking southeast until a Bharbhen camp is encountered. Protective suits worn as a precaution. Clear skies.\n\nEnalun 20\n…Bharbhen encountered today. Initial meeting was friendly, despite our interpreter being unable to understand their dialect. We brought the Bharbhen gifts and they seem to be willing to let us accompany us. I split the group into two: a small selection of scientists and myself to directly live alongside the Bharbhen, and the larger mixed group of soldiers and scientists to camp further away, but still follow from afar, so as not to overwhelm the Bharbhen. Somewhat windy.\n\nEnalun 22\n…The skin of the Bharbhen here is smoother than that of the Bharbhen down south. It also seems to exhibit a bluish tint, recalling that of the Kheionai. Perhaps a sample can be taken, but that will have to wait. What interests myself and my scientists more at the moment is the lifestyle of the Bharbhen. The Bharbhen are herders, something thought impossible this close to the KaydhanoKadyhano, and the livestock are protected much like the Bharbhen themselves, with layers of thick cloth. The Bharbhen have also created filters to drink the contaminated water. Nothing suggests much of an innate biological advantage, to our dismay. Cloudy skies.\n\nEnalun 23\n…Tensions rising. As the cultural study has produced nothing, one of the Bharbhen needs to be brought back, for further tests, especially on their skin. The Bharbhen seem to have caught onto this somewhat. The soldier contingent was camping a day’s walk behind us, waiting on them to arrive. Light rain.\n\nEnalun 24\n…Big battle. Bharbhen refused to be captured, instead committing suicide. Only a male and a female child were left alive. Heading back with subjects now. Cloudy Skies."
 kheionai.56.a: "What a productive expedition."

 kheionai.57.t: "The Scholar"
 kheionai.57.desc: "The Scholar approaches the two children, who sit on the ground awkwardly, although to them their discomfort is a sign of courage. He takes a seat in front of them, and indicates for them to do the same, but they do not move. The Scholar signals for one of his men to bring a platter of food, and as the man does so the Scholar smiles at the children, but when it arrives they do not eat. The Scholar stands up and shuffles to a chest near the corner of the room, which the children stare at suspiciously. The Scholar takes from it an arrangement of items which seem to be taken from the Chendhyan family, clothes, idols, and all sorts of miscellaneous things which the children wonder why are worth keeping around. The Scholar sits back down, and places some of the things onto the table.\n\nThe Scholar begins talking, and although the children do not understand what is being spoken, they recognize the body language of the Scholar, which seems strangely rigid. The Scholar picks up a shirt and gesticulates, and the boy at last obliges and shakes his head. The Scholar, seeing this, picks up a grape and offers it to the boy, but he laughs and tosses it back at the Scholar. The Scholar sits for a while agitated and eventually picks up a few more garments. The Scholar walks around the table, making the children stand up. The Scholar brandishes the clothing at the children, hoping to get some kind of reaction. The boy becomes angry, recognizing the dress which his mother wore, and spits on the Scholar. The Scholar, in a fit of rage, tosses the clothes away and knocks the boy to the ground. The girl, seeing this, takes from her pocket a packet, filled with Deathsand, and tosses it onto the Scholar, who shivers in pain and runs from the room. Guards soon enter and take them to their cell.\n\nThe next day, the Scholar returns, accompanied by guards. The Scholar pushes the girl down and reaches into her pocket and retrieves the bag, examining it and laughing. The Scholar leaves without looking back, clutching the bag earnestly."
 kheionai.57.a: "The savages are cleverer than I thought."

 kheionai.58.t: "The End of a New Beginning"
 kheionai.58.desc: "Tò Schaalir stood alongside $RULER$ one morning in a Deathsand laboratory constructed on the slopes of Meteí.\n\n“The Bharbhen expedition was even more successful than initially thought. When we searched the bodies of the Bharbhen, we discovered a few pouches made up of a previously unknown substance, containing Deathsand. We brought that, along with everything else the savages possessed, back. But a month or so ago, when we were reassessing these pouches, it was discovered that the Deathsand within them was still entirely potent. Who knew that the Bharbhen possessed such devices!”\n\n“Truly impressive. And what of this? I presume they can be replicated?”\n\n“Of course. It took only a week for the material to be identified, it was crudely knit with a thread of damestear and wool, and an abjuration spell was then placed upon it, which our mages were easily able to reproduce with some success. In this facility here we have been mass producing it to major success – although our method is not perfect, we have still been able to extend the natural lifespan of Deathsand by many months, enough for prolonged use and export.”\n\n“The military applications alone will be endless… What a capable scientist you are. Indeed, Schaalir, your exploits are uncounted and will stand for centuries. Forgive me, as I presume you too know this, but your program is no longer needed, as it has achieved its goal, which was to deepen our understanding of the Deathwinds. For a man of your stature, the money and land I have set aside for your retirement is enormous, and I hope it will entertain you for the rest of your days.”\n\n“Well… Hmmm. I still have value to you, surely? Innovation has produced so much already, can it not produce more?”\n\n“Perhaps, but our Windwards are invincible now. Innovation has borne much fruit, but like any tree it must fade and rot. Look at the windswept mountain with your puny laboratory – the sun has burned through it, consuming. Yet it remains. No one force can conquer completely, not even your science. Is it not so reasonable that we have moved on?”"
 kheionai.58.a: "“Well, so long, my friend.”"

 kheionai.100.t:0 "A New People?"
 kheionai.100.d:0 "For years now we have lost the ties to our Alecandi overlords, as time passes people change and some no longer consider us to be the same as our cousins that never left the island."
 kheionai.100.a:0 "We are Alecandi no longer!"
 kheionai.100.b:0 "We are still of the blood of Alecand!"

 kheionai.102.t: "Cultural Drift In Devand"
 kheionai.102.d: "While settling the interior of Devand, the settlers have come to grow distant from their parent cities, developing new traditions and customs separate from those of Alecand. These peoples now identify more strongly with their nékhei than the parent city that may rule over them. From now on, this distinction means the Kheionai of Devand can no longer be called the same as they were before."
 kheionai.102.a: "We forge our own path now!"

 kheionai.103.t: "Cultural Drift In Devand"
 kheionai.103.d: "While settling the interior of Devand, the settlers have come to grow distant from their parent cities, developing new traditions and customs separate from those of Alecand. These peoples now identify more strongly with their nékhei than the parent city that may rule over them. From now on, this distinction means the Kheionai of Devand can no longer be called the same as they were before."
 kheionai.103.a: "As long as they still bend the knee"

 kheionai.104.t: "Growth of our Nékheis"
 kheionai.104.d: "Due to the steady growth of our nékheis, we are now able to pull more trade from them and the mainland for us."
 kheionai.104.a: "Let's hope they don't get any ideas"

 kheionai.105.t: "Growth of our Country"
 kheionai.105.d: "Due to our steady growth we are now able to put more resources into our colonization efforts, while our Alecandi overlord reaps more benefits to their trade."
 kheionai.105.a: "Perhaps it's time to forge our own path..."

 kheionai.106.t: "A New Subject"
 kheionai.106.desc: "While we were expanding we managed to get control over a country, what should we do with it?"
 kheionai.106.a: "Proclaim them our vassal"
 kheionai.106.b: "Let them keep some of their autonomy"
 kheionai.106.c: "Free them, they're not worth the effort"
 kheionai.106.dd: "Integrate them into our other Nékheis"

 kheionai.107.t: "[From.GetName] Requests War Rights"
 kheionai.107.d: "Today our [Root.Monarch.GetTitle] got a letter from [From.GetName] requesting the right to go to war. While this would help our colonization of the mainland, it will also hurt our trade until the war has finished and if they get too big they might start thinking about independence."
 kheionai.107.a: "Grant War Rights"
 kheionai.107.b: "Refuse the Request"

 kheionai.108.t: "War Rights Granted"
 kheionai.108.d: "Our diplomat has come back to us with great news, [From.GetName] has accepted our request for war rights! We can now declare one war for the next 5 years."
 kheionai.108.a: "Prepare the Troops!"

 kheionai.109.t: "War Rights Denied"
 kheionai.109.d: "Our diplomat has come back to us with bad news, [From.GetName] has refused our request for war rights!"
 kheionai.109.a: "Maybe we should go our own path then"
 
################################ KHEIONAI FLAVOUR EVENTS ###################################

 # events
 
 kheionai_flavour.1.t:0 "The Hounds of Askóvoinos"
 kheionai_flavour.1.d:0 "Though the wealth of Kimánis has long been sourced from its silk rather than its wine, they still have a proud winemaking heritage – every year, when a new vintage is brought in to the Kheion, the Kimabhen hold the “Askóvoinos Festival”, a grand celebration with much theatre, feasting, and, naturally, the drinking of diluted Askóvoinos wine, as is the Kheionai’s custom. But for as long as the Kimabhen have drunk diluted wine, there have been salacious rumours of underground cults that indulge in the drink at its full strength and in great quantity – they are rumours, of course, but they seem the most obvious culprit for what has recently transpired.\n\nIt started as a normal festival, the feasting tables, arrayed through the city, full of Kimabhen citizens, eagerly indulging in the meat and wine doled out so freely. But the drink was stronger than usual – only after much of the Kimabhen mob were deep in their cups was it realised that someone had swapped the diluted wine for the undiluted wine. The Kimabhen mob is accustomed to being pulled to and fro by populist, nativist demagogues – when drunk, they can be pulled to any extreme one desires. When the first cries of grievance against [Root.GetName] began to ring through the city, the garrison’s fate was sealed. The Hounds of Askóvoinos were unleashed, and Kimánis gave itself to madness.\n\nThe Kimabhen, quite literally, tore our troops apart in the streets. Now, even as they recover from what must be the mother of all hangovers, they have already made plans for independence, seizing the city’s armoury and outfitting every willing citizen they can find. The Kimánis Revolt has begun – now, we must reclaim our wayward territory!"
 kheionai_flavour.1.a:0 "Destroy the drunken upstarts!"
 kheionai_flavour.1.b:0 "Kimábhen liberty will not be crushed!"
 
 kheionai_flavour.2.t: "Kimánis Calls for Aid"
 kheionai_flavour.2.d: "The Hounds of Askóvoinos run rabid through the streets of the city of silk, as the Kimabhen throw off their oppressors! But the tide is turning against them even now. Kimánis calls for aid..."
 kheionai_flavour.2.a: "And this Kheion will answer!"
 kheionai_flavour.2.b: "But where was Kimánis when Empkeios fell?"

 kheionai_flavour.3.t:0 "Kheionai Left Behind"
 kheionai_flavour.3.d:0 "When the Kaydhano stirs, the islands of Anisídhan are the first to notice – the arrival of a fleet of ships bearing Anisídhan’s population in Arpedifér heralds a wave of activity across Alecand, as the Kheionai prepare to endure what would break most other societies. Sometimes, Anisídhan notices too late, and their hurried escape leaves the people of Alecand less time to make it to the Kheions – should our prognosticators also fail to predict the Kaydhano through other means, the results can be disastrous.\n\nUnfortunately, this worst case scenario has come true. Our people have been rushing to the safety of [Root.Capital.GetName] – but it seems that not all may make it in time. One of the strongest taboos in Kheionai culture is to deny someone shelter in a Kaydhano – but it was not so long ago that, during the Slave Revolt, the city of Kimánis was left devastated as a small gap in the city’s ward allowed the Kaydhano to lash at the streets below. Tens of thousands died – surely we cannot risk such a thing again?\n\nThe news that a large train of people from the edge of our territory is rushing to our gates – and is predicted to arrive just as the Kaydhano does as well – has brought that question to the fore once more. Our decision may have grave consequences…"
 kheionai_flavour.3.a: "Let them in, quickly!"
 kheionai_flavour.3.b: "We can't risk opening the ward."

 kheionai_flavour.4.t: "Was it Worth it?"
 kheionai_flavour.4.d:0 "The aftermath of a Kaydhano has become rote for the Kheionai. Wait for the Kaydhano sand’s lethality to diminish, sending out abjuration-protected workers if that does not work, clear the roads leading out of the Kheion, then return those who had come from out of town back to their homes, as quickly and efficiently as possible.\n\nThey found the bodies in that second stage, as a group of sand-clearers stumbled on a cave they had claimed as their shelter. As the wall of death drew perilously close, they had been turned away, the train of people and the goods they brought with them deemed too large to process in time – though they had sought shelter underground, they had already been exposed to the winds for too long.\n\nThe news has spread quickly through our people, and they are not happy. All over, people speak of the mothers dying with their children in their arms, the children of [Root.Capital.GetName] abandoned by their state, and they say that it is our misjudgement that killed them. Already, the mob demands the fall of our government, as they besiege our capital’s Oúraskheion – if we do not put down this revolution soon, they may get what they want."
 kheionai_flavour.4.a: "We did what we could."

 kheionai_flavour.5.t:0 "A Troublesome Debater"
 kheionai_flavour.5.d:0 "The Kheionai love a good debate – in fact, it is one of the foundations of their culture, the crucible in which philosophy is forged. It's just that they generally like debate in the symposium, over a few cups of wine, or in the halls of the philosophical schools, or in the assembly chamber. Most do not like to debate as they are trying to buy or sell at the market, as they are trying to relax at the baths, as they are going about their daily life and public business. Nobody – not nobody – likes debating the fundamental questions of life while sitting in the public toilets.\n\nOne philosopher, however, did not get this memo. One moment you are strolling to collect some papers from your business associate – the next, you are being ambushed with questions about the nature of life and death, or the role of magic in society, or “whether you can call a chicken an elf.” Some members of our government have been having mental breakdowns – nowhere in the Kheion is safe! And to make matters worse, he has managed to amass a cohort of people who actually like him! If we put an end to this madness, there will be some who call it an “infringement on freedom of debate.” On the other hand, it would make tending to your business – of any kind – a lot less annoying."
 kheionai_flavour.5.a:0 "Stop him immediately!"
 kheionai_flavour.5.b:0 "We have no right to interfere."
 kheionai_flavour.5.c:0 "Invite him into government!"

 kheionai_flavour.6.t:0 "Conflicting Ways of Governing"
 kheionai_flavour.6.d:0 "To the Kheionai, philosophical schools – organised teachings on both how to see the world and act within it – are the bedrock of society, government and culture. Each Kheion has been moulded by the philosophies its citizens adhere to, and that means that the interaction between different cities is analogous to the interaction of different philosophies. Normally those differences can be overcome through debate, consensus and concession – but, as is common to philosophers, there can be a tendency to entrench one’s own values in response to opposition.\n\nThis has recently happened in our Kheion’s relationship with our subjects – and unfortunately, it seems we may be to blame. Our Kylakas and their advisors’ steadfast beliefs about how government and governance should operate have resulted in complete deadlock, as much of our subjects’ local leadership now refuses to work with us, believing that as we will never give, neither should they.\n\nThere seems to be only two options available to us – either we finally retreat from our position, or we use force to impose our own will on the cities."
 kheionai_flavour.6.a:0 "Retreat from our position to appease the cities."
 kheionai_flavour.6.b:0 "We will open their eyes ourselves!"
 kheionai_flavour.6.c:0 "The resignation of our Kylakas will placate them."

 kheionai_flavour.7.t: "In the Streets and Halls"
 kheionai_flavour.7.d: "A few days ago, a simple scuffle between a group of Taychendi and [Root.Culture.GetName] merchants turned into a bloody street fight, which has seen the Taychendi either killed or heavily wounded at the hands of a superstitious mob. This issue has not only aroused the attention of the authorities in our city but also that of our countries philosophers.\n\nEven now, shouting can be heard all across the city, as Philosophers from multiple schools and academies are arguing over this recent violence. Many of the arguments are different from school to school, however a group of Archatiradians, a school from Lokemeion who are known for expending great effort to document and understand the ways of Barbhen peoples, are outraged. They say that violence is not the way to dispute the Taychendi and other foreign peoples, and that instead you must engage them with reasoned debate to show them the error of their ways.\n\nThey are demanding our government to punish the mob that has lead to the death of several taychendi and issue an apology."
 kheionai_flavour.7.a: "Issue an apology and punish the wrongdoers"
 kheionai_flavour.7.b: "Never trust a Taychendi!"
 kheionai_flavour.7.c: "We cannot punish our people, we need to compromise"

 kheionai_flavour.8.t: "Strange thoughts of a strange man"
 kheionai_flavour.8.d: "Though known for his leadership, a former Kylakas has ended up living in a barrel. This sight brought many to question the state of our city, though as it had turned out he chose to live in that barrel. Nowadays he is known for openly preaching his way of thinking, he calls himself a ‘Ulótholist’, which is in reference to a centuries old philosopher known as ‘Ulóthopholes’ whose work is still studied to this day.\n\nThe man living in a barrel believes that to live a fully good and honest life, one must reject the material and live a life devoid of material possessions. Although crude and offensive, this man would prove to be a boon for the state and could bring with him much experience. The problem with this is however that he won’t accept employment, thus we’ll need to send advisors and bureaucrats to ‘just ask him questions’."
 kheionai_flavour.8.a: "This mastery in Philosophy shall not go to waste!"

 kheionai_flavour.9.t: "Ormabhen upstart"
 kheionai_flavour.9.d: "In a University in Ormam, one known for its expertise in studying trade and economics, has seen a specially talented class who have made a name for themselves for employing new strategies in trade and economics. Though their unorthodox strategies have made them disliked by many old fashioned traders."
 kheionai_flavour.9.a: "Run a test and hire their best student"
 kheionai_flavour.9.b: "Let the class run its course, they’ve got enough work already"

 kheionai_flavour.10.t: "A peculiar lifestyle"
 kheionai_flavour.10.d: "People in our cities seem to enjoy a more free life, free of material possessions that is. They follow Ulótholism, though not many are concerned with the original philosophical idea of Ulóthopholes and rather just enjoy what they consider a free life.\n\nWhen asked, many of these people will not be deterred by any arguments and simply go on with their day. Some have also been seen walking through the wild completely naked, though such cases are rare, it could be a bad look on the state if we keep allowing this kind of behaviour."
 kheionai_flavour.10.a: "Our people should be able to live their lives as they please"
 kheionai_flavour.10.b: "This is verging on debauchery, shut them down already!"

 kheionai_flavour.11.t: "Scéposmatists Question the Franchise"
 kheionai_flavour.11.d: "Scéposmatism, a school born in Lokemeion, has long been at the forefront of questioning the pre-existing ideals and taboos of our society and openly criticize philosophical ideas that have been viewed as standard in our society. Though many see them as little more than public nuisances, one area in which their views stir up the most trouble is their views on the political rights of minorities, particularly women and non-citizens.\n\nRecently the Scéposmatists of your capital have been pushing for the extension of certain political rights to these people, though such an act would certainly be extremely de-stabilising."
 kheionai_flavour.11.a: "This is an offense to our values, we will not be accepting this"
 kheionai_flavour.11.b: "Women have been oppressed long enough in our society, we need this to end"

 kheionai_flavour.12.t: "Muístaxia"
 kheionai_flavour.12.d: "Muístaxia, a woman who is well knowledged in the fields of Philosophy and has had great success studying at the Scéposmatist school in Lokemeion. She embodies the Scéposmatist ideals to the fullest and openly debates people, as well as commenting on many political issues, mostly of those concerning the rights of women and minorities."
 kheionai_flavour.12.a: "Her exceptional talent in debate will prove useful"
 kheionai_flavour.12.b: "She’s over her head, we don’t need another big mouth in our government"

 #flavor events by valera
 kheionai_flavour.15.t: "Breaking Down Walls"
 kheionai_flavour.15.d: "Throughout the past few months, it has become increasingly evident that a woman of immense talent and ambition from one of our more prestigious lower families is making a name for herself. She has inspired her own movement in our political scene, with supporters rallying to her for breaking down walls in the more entrenched parts of society. Her very status embodies the values we have seen reflected in Maedritic thought, an idea that many cannot ignore, despite it drawing the ire of her patriarchal superiors. An option has presented itself, however, to endorse her movement as part of our administration. Welcoming her to our court could be a boon in terms of introducing new perspectives, but it may seriously upset more traditional elements of our city."
 kheionai_flavour.15.a: "We can’t just turn away from such talent!"
 kheionai_flavour.15.b: "She seems to be doing fine on her own."
 kheionai_flavour.15.c: "Her message resonates with Maedritic philosophy; she will help us practice it."
 
 kheionai_flavour.16.t: "Politeia"
 kheionai_flavour.16.d: "A question that began as a simple philosophical debate between two well-respected elves has begun to take on a life of its own. The debate has swept throughout our society and captured the minds of our most prestigious scholars. The scale of such a philosophical inquiry will surely be remembered for centuries to come. While there is a wealth of discourse being conducted high and low, one facet of the debate has played out in our own halls of government. Various philosophers attempt to court the favor of our administration, which they seek the prestige and patronage of. As the crowd ripples with philosophical fervor, surely one speaker stands out among the rest?"
 kheionai_flavour.16.a: "A Maedritic philosopher managed to sway the crowd."
 kheionai_flavour.16.b: "A follower of Isparokaeus managed to sway the crowd."
 kheionai_flavour.16.c: "An Axierophonic philosopher managed to sway the crowd."
 kheionai_flavour.16.dd: "We all have something to learn from today’s debate."

 kheionai_flavour.17.t: "Feeding the Famished"
 kheionai_flavour.17.d: "Following the recent Deathwind, it was discovered that significant portions of our grain fields now lay fallow, the year’s harvest utterly devastated by the all-destroying dust storms that care for neither animal nor plant. Though we have yet to actually deplete our existing stores, it is evident that there will be grain shortages unless we act to ensure that what little remains is kept for the people who are already left to recover from the devastation of the Deathwind. The most drastic option proposed would be forbidding grain exports until the supply is manageable once more. However, this would severely impact our trading interests for the time being, requiring several harvests to pass before permitting grain to flow outward as it once did."
 kheionai_flavour.17.a: "Impose autarky to keep extra grain on our markets."
 kheionai_flavour.17.b: "The situation does not merit such a response. The market will regulate itself."
 kheionai_flavour.17.c: "Initiate reforms to ensure farmers' land for future grain production."
 kheionai_flavour.17.dd: "Enact legislation to help our farmers expand their grain production."

 kheionai_flavour.18.t: "Changes in Warfare"
 kheionai_flavour.18.d: "With a thundering crackle and rising smoke, the firearms hit their expected targets several fields away. The officers glance at one another and then at the Cannorian merchants standing behind them, their arms crossed with a grin. One of them speaks, and our translator steps in. “Impressive, are they not? It is exactly as advertised. Death-from-afar. Surely you see the benefits of such a weapon?” The officers once again exchange looks and turn to our court officials. Such a weapon would indeed be devastating on the battlefield, able to cut down enemies faster than they can react. However, this begs the question of what happens when our soldiers must face these firearms, bullets ripping through our own. As the merchants return to their vessels, our leadership must decide how to adapt to what is undeniably the future of warfare."
 kheionai_flavour.18.a: "Have our existing formations receive a gunnery division."
 kheionai_flavour.18.b: "Summon the mages; we must armor ourselves against these guns."
 kheionai_flavour.18.c: "Death-from-afar indeed! Have the entire army outfitted immediately."
 
 kheionai_flavour.19.t: "Wild, Wild Magic"
 kheionai_flavour.19.d: "One of our braver merchants has returned after braving the waters off the Kaydhano Sea to do business in Amadia, a land our scholars have not recorded in some time. Along with sizable cargo, the merchant is accompanied by a group of tall, pale-skinned elves adorned with peculiar scars. They are evidently Amadians, masters of wild magic. What was once a subject of sailors’ stories now stands outside our city with our Kheionai captain. He refuses to dock elsewhere or abandon his crew, claiming they are the finest sailors he has ever had. As many of our citizens panic, recalling past records of wild magic and what it could cause for the windward, others admire the captain’s tenacity, saying it would be uncivilized to deny him and his crew hospitality."
 kheionai_flavour.19.a: "It is too great of a risk to our Kheion’s infrastructure. They must go."
 kheionai_flavour.19.b: "We can’t just refuse the captain and his goods. We’ll watch the Amadians."
 kheionai_flavour.19.c: "An excellent opportunity to study Amadian culture and customs!"

 kheionai_flavour.20.t: "A Question of Love"
 kheionai_flavour.20.d: "A scandal has rocked the court of $COUNTRY$. A prominent political leader from one of our noble houses has been exposed for an extensive love affair after decades of a seemingly happy marriage. The stories are already running wild on the streets, with rumors about everything from the noble’s personal life to our own administration being involved in the affair. The very moral standards of our Kheinsí are now subject to public scrutiny that has not been seen for some time now, and people from all parts of society clamor for our Kylakas to intervene personally and give judgment on the affair. While it may be one of our nobles, the backlash from the sheer taboo and his status may prove overwhelming."
 kheionai_flavour.20.a: "Heavily fine the unfortunate lover."
 kheionai_flavour.20.b: "Helping this politician will improve our standing amongst the nobility."
 kheionai_flavour.20.c: "Perhaps we could strike a compromise that satisfies both sides?"
 
 kheionai_flavour.21.t: "Too close for Comfort"
 kheionai_flavour.21.d: "As regular surveying is being conducted in the urban centers surrounding our windward, it has become apparent that there is an overcrowding problem. People are living in spaces that simply cannot properly accommodate their needs, all in order to live in close proximity to the most reliable shelter. While renovations could be undertaken to accommodate these citizens within the windward, it would require evictions in existing portions of the Kheion to reconstruct them properly, which would certainly upset those within the walls already. Regardless, our policy must be decided upon for these citizens in order to protect them from the coming Deathwind, inside or outside of the city."
 kheionai_flavour.21.a: "Clearly some renovation plans are in order. "
 kheionai_flavour.21.b: "Refugees from a countryside will have to get comfortable in the streets."
 kheionai_flavour.21.c: "Our Kheion cannot fit these refugees. We shall make new shelters."
 kheionai_flavour.21.dd: "We must make a perfect plan to satisfy everyone!"

 kheionai_flavour.22.t: "Sheltering their Faith"
 kheionai_flavour.22.d: "Following our recent subjugation of the neighboring Eltibhen, the local militia has reported that a passage near the Meteí would make for an ideal shelter against the Deathwinds. The militia has preemptively marched into the pass, constructing the beginnings of shelters for future use. The local Eltibhen chieftain, however, was outraged when he arrived to find part of the sacred pilgrimage route to the Meteí being blocked off by these easterners. Today, the chieftain himself arrived in a fury at the gates of our Kheion. He is beseeching our administration to order the militia out of the pass to respect their customs as lawful subjects, appealing to our faith of reason. We must respond soon, lest the tensions escalate."
 kheionai_flavour.22.a: "Don't they understand they will get to use this shelter too?"
 kheionai_flavour.22.b: "It would be an ethically correct thing to respect the local beliefs for the time being."
 kheionai_flavour.22.c: "If they don't like our militia, they are welcome to move somewhere else."

 kheionai_flavour.23.t: "To Serve or to Protect?"
 kheionai_flavour.23.d: "It is said of the office of Kylakas that he, who has a mighty army, is capable of protecting both his kheion and his nékheis. Such a philosophy has been put to the test with a recent proposal in our governmental policy. Some of our council members argue that we should neglect to fund our nékheis’ military in favor of our levies on Alecand. The members aligned with the nékheis, however, have loudly objected to such a proposal. They argue that to maintain and expand our presence in Devand, it's prudent to send additional funding and resources to the nékheis at once. One way or another, one of these factions may walk out dissatisfied."
 kheionai_flavour.23.a: "We must invest more resources in our presence on Alecand."
 kheionai_flavour.23.b: "We shall listen to the nékheis and fund their expansion efforts."
 kheionai_flavour.23.c: "Remind the nékheis that defense of the realm is, without question, a joint effort."

 kheionai_flavour.24.t: "The Legend of Seven Seas"
 kheionai_flavour.24.d: "A captain of an ambitious trading fleet has returned after some years, bringing with him tales of a faraway land recorded as “Haraf”. He describes adventures that seem almost fantastical, from evading titanic worms that burrow through the sands to defending his crew against twisted elves that carve their skin into eerie works of art. He also carries with him an ornate mask that he claims is imbued with the spirits of fallen warriors and speaks of a ritual that allows him to commune with his ancestors from centuries past through the very currents of water itself. Many of our people find his stories unbelievable, but regardless, he has decided to donate some of his wealth acquired while on this wild journey."
 kheionai_flavour.24.a: "Regardless of his stories, his donation is most certainly welcomed."
 kheionai_flavour.24.b: "We could use a scoundrel like him."
 kheionai_flavour.24.c: "You know what? His stories aren’t half bad for a privateer. Let’s make this story official."

 kheionai_flavour.25.t: "Inept Philosophers"
 kheionai_flavour.25.d: "As another day arises, the schools that work so diligently to cultivate the best minds in our realm open once more. Students and public audiences alike trickle in to watch our philosophers debate and give speeches. To outside observers, though, it is apparent that the crowds have been dwindling in the past few months. Even those who watch do not appear remotely captivated by what our once-revered philosophers have to say, and students are showing up in lesser numbers with each session. It is increasingly evident that even the masses believe dark times are upon our people, with the foundations of our very culture in decay."
 kheionai_flavour.25.a: "It is the truth. Our culture has seen brighter times."
 kheionai_flavour.25.b: "Any historian would know such small matters plague every state through time."

 kheionai_flavour.26.t: "Akratos"
 kheionai_flavour.26.d: "A tradition of the kheion of Kimánis, the yearly festival seems to have grown out of control this time around. The local militia commander we had appointed has been seen to drink so much Kimánis wine that he rode his chariot through a local school repeatedly. Worse still, the militia itself also took the excuse to drink themselves into a stupor. Becoming more of an unruly mob, they reportedly have been seen using windows as target practice, stumbling off dangerous heights, and harassing the local merchants. Some Kimabhen have declared that this is a plot by our administration to ruin their city, but it is difficult to address the locals. They too are drunk from the same festival wine, causing the people to similarly become a drunken crowd. Unless we intervene somehow, Kimánis will be out of control soon enough."
 kheionai_flavour.26.a: "Stop the militias and the crowds; cease the chaos however necessary."
 kheionai_flavour.26.b: "We mustn’t provoke the Kimabhen any further."

 kheionai_flavour.27.t: "Unruly Nékheis"
 kheionai_flavour.27.d: "Yet another messenger has arrived today from our Nékheis, delivering a firm denial of our recent policy decisions. This is yet another incident in a long line of refusals by our subordinate governors to cooperate with the administration from the Kheion itself. Even when they do acquiesce to our requests, they are fulfilled in such a manner that almost comes across as sabotage to our administrators. More often than not, though, the backlash is so obstructive it prevents any meaningful progress. It has become apparent to both administrations that we simply lack many of the bonds that once drew our Nékheis to prosper under our rule."
 kheionai_flavour.27.a: "It is regrettable, but undeniable."
 kheionai_flavour.27.b: "We just need to find the right approach to them."

 kheionai_flavour.28.t: "The Man Who Bought the World"
 kheionai_flavour.28.d: "A troubling report sits on the table of the Kylakas. A local and powerful aristocrat is quickly on his way to becoming the richest man in the known world. Alongside his wealth, he has begun to exert his influence on the politics of our Kheinsí. He rallies support from the common populace, arguing for a more powerful executive, even implying he himself may run for Kylakas to make it happen! This could be the man that brings our Kheinsí to its knees with the terrible plague of tyranny. We could investigate the doings of this man, but it may prompt him to act. Must we intervene for the sake of the Kheinsí?"
 kheionai_flavour.28.a: "Surely, one man cannot corrupt our entire republic?"
 kheionai_flavour.28.b: "Order a spy sent to his estate; we must know his intentions!"

 kheionai_flavour.29.t: "Investigation Results"
 kheionai_flavour.29.d: "The messenger runs desperately into the council hall of the Kheinsí, waving his arms and bringing word from the estate of the prospective tyrant. He collapses to his knees, out of breath from the run. His message reverberates throughout the chamber. Our spies sent to infiltrate the man’s home were apprehended outside of his villa. The tyrant has taken this as a chance to act prematurely, declaring his civil rights to be violated by our illegitimate regime. He now amasses his supporters across the realm, ordering them to march against our armies! We must act quickly to prevent their success, hasty as it may be."
 kheionai_flavour.29.a: "At least we forced their hand. Disperse this rabble!"

 kheionai_flavour.30.t: "Grand Feast"
 kheionai_flavour.30.d: "The messenger returns to our council hall at a brisk walk, still with a sense of purpose, but not even a hint of panic about the situation with the prospective tyrant. The advisors immediately lay into him, demanding an update on this rich upstart. He begins his message. The attitude of the room shifts away from worry as he continues. Yesterday, the tyrant was hosting a grand banquet with his supporters, before intending to have them march on our Kheion. This meal, however, proved to be his last, as he suddenly doubled over while choking on the leg of a roasted boar! Such a man was doomed to have his greed consume him!"
 kheionai_flavour.30.a: "It seems that fate was on our side this time!"

 kheionai_flavour.31.t: "The Tyrant Acts!"
 kheionai_flavour.31.d: "The messenger stumbles into our council hall, out of breath from avoiding the army approaching the gates of the city. The council is outraged, not knowing there even was such an army outside until now. The messenger explains that communication has broken down outside the capital. The tyrant has seized on our ignorance to amass an army of mercenaries, pirates, and fellow aristocrats to rebel for the office of Kylakas! We must act swiftly to put this revolt down, though the army is lesser due to his supporters being pacified by our leniency. It leaves the remaining populace baffled by our incompetency and permitting such a revolt to arise, questioning our legitimacy in the face of such actions."
 kheionai_flavour.31.a: "How could we have let this come to pass?"

 kheionai_flavour.32.t: "Lions in the Hills"
 kheionai_flavour.32.d: "As our colonies in Devand grow, so do tensions with Basobhar natives. Seeing our colonists as nothing more than foreigners encroaching on their sacred land, the tribes of [Root.GetName] have formed a confederation to fight and resist our efforts.\n\nMounted atop their fearsome mountain lions, their warriors raid our colony’s supply carriages, ambush merchant caravans, and kill anyone who dares wander the hills alone.\n\nThe colonists have sent an envoy to our [Root.Owner.Monarch.GetTitle], begging us for aid in dealing with the natives."
 kheionai_flavour.32.a: "Archatirades showed they can be reasoned with, if approached with respect."
 kheionai_flavour.32.b: "We will make them pay dearly for the blood they spilled!"
 kheionai_flavour.32.c: "The colonists can figure it out on their own."

 kheionai_flavour.33.t: "Merchants from the Lands of Summer"
 kheionai_flavour.33.d: "It was all quite unexpected. The council halls of [Root.Capital.GetCapitalName] were brimming with merchants, diplomats, officials, and servants, all scrambling to accommodate our curious guests. Tall, red-haired, and orange-skinned, the Caamasi merchants were bringing in gifts and goods they wished to showcase to the [Root.Monarch.GetTitle].\n\nWhile the occasional Caamasi vessel is not an uncommon sight in our harbours, our officials were completely baffled when they learned a trade fleet thirty ships strong had appeared on the northern horizon, each ship loaded with treasures and armed to the teeth.\n\nAfter the initial commotion had settled, their delegates, each dressed in fine silks and smelling of summer flowers, met with [Root.Monarch.GetName] and [Root.Monarch.GetHerHis] advisors. An older Caamasi merchant who spoke a broken pidgin of our two tongues started listing the wares they had to offer - trinkets, magical relics, and exotic goods, all precious and coveted by our merchants.\n\nAnd all at the symbolic price of …\n\nOur [Root.Monarch.GetTitle] turned to his advisor in disbelief as Caamasi merchants started to smirk. “They want that much in return?”, [Root.Monarch.GetSheHe] said, and the translator nodded. It was then [Root.Monarch.GetSheHe] realised these negotiations would take a while.\n\nAfter hours had passed, and the setting sun was the color of Caamasi merchant’s eyes, the negotiations finally came to an end. [Root.Monarch.GetName] gave the merchant one last look and said…"
 kheionai_flavour.33.a: "“You just can't scam the scammer.”"
 kheionai_flavour.33.b: "“Nice try, but we too know how to haggle.”"
 kheionai_flavour.33.c: "“Ok, fine, you win. That’s an honest price.”"
 kheionai_flavour.33.dd: "“No deal. Get out and don't ever come back.”"

 kheionai_flavour.34.t: "Influx of Taychendi Slaves"
 kheionai_flavour.34.d: "Taychend is a land of perpetual conflict, its people always embroiled in yet another brutal war of some would-be god-king.\n\nBut one elf’s misery is another elf's fortune, and a shrewd merchant sees opportunity in such chaos. The sack of a populous city means a sudden influx of affordable slaves - as their numbers rise, prices plummet.\n\nAs their most recent conflict draws to a close, our slavers have begun to visit Taychendi markets to assess the new batch of war prisoners. While it is true that these new slaves are often malnourished, miserable, and require a lot of “encouragement” to become useful assets, they are dirt cheap.\n\nShould we take the discount?"
 kheionai_flavour.34.a: "We have a deal!"
 kheionai_flavour.34.b: "These are of no use to us."

 kheionai_flavour.35.t: "Devandi Slaves Rise in Revolt"
 kheionai_flavour.35.d: "The elves of Devand are strong and dexterous people, and as such make for excellent slave labor. But no matter how hard we try to teach them the ways of civilization, their proud hearts desire only one thing - freedom.\n\nWith the help of warriors from a neighboring tribe, a group of slaves in [event_province.GetName] managed to break free and rise in revolt. They slayed their masters, set free any slave they could find, and torched the fields they once worked.\n\nMost slaves have already fled into the forests, but some still prowl the area to take revenge and wreak as much havoc as they can before we can respond."
 kheionai_flavour.35.a: "Damn barbarians!"

