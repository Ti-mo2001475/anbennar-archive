 deathwinds_intro_tt: "§aDeathwinds§! will come every §Y9§! years and last §Y2§! years, in which they will provide provinces with varying maladies depending on their intensity, which range from intensities §Y1-10§!. They only affect region of Alecand.\n\nProvince interactions can be viewed through the §YProvince-Level Button§! in the custom province interface. Province defenses may be temporarily increased through the use of manpower or mana. Local §TWindwards§! can also be permanently increased, albeit at a significant cost which will change for each new level reached. Alternatively, they can be downgraded for a temporary boon.\n\nThe intensity of the §aDeathwind§! which affects a province is subtracted from the level of the local §TWindwards§!. Certain provinces have natural defenses, which are permanent and cannot be destroyed. These include provinces which are geographically further to the §RKaydhano Sea§! and those which are shielded by mountains.\n\nThe seven great §TKheions§! are immune to Deathwinds, owing to their Zopedan."
