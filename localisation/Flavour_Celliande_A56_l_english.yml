l_english:

#Missions


 celliande_knights_serondor_title: "The Knights of Serondor"
 celliande_knights_serondor_desc: "  Serondor sìl Sorncell was the greatest captain of Celliander history. His life's work was to rid the Divenhal of the plague of piracy, but he disappeared before he was finished. Now, a vile contingent of scoundrels fester in the gaping wound that is Nathalaire. They raid our ships; they pillage our villages. It is a disgrace to Serondor’s honor, to his memory, to allow them to live."
 celliande_knights_serondor.tt: "Nathalaire has shown their true colors"

 celliande_shadows_light_title: "Shadows Into Light"
 celliande_shadows_light_desc: "  People are sold in Nathalaire. Prisoners from battle, captives from raids. Even orcs, shipped down the Dostaneck from Escann. Monsters though they may be, nobody deserves this fate.\n  This is the first declaration of the Knights of Serondor: Nathalaire is no more. The Nathalairey are no more. All that remains is Serondorunizam: the Isle of Serondor, in old Milcori. And in it, all people will be free.”\n  -Camir sìl Serondor, First Grandmaster of the Serondoruni"

 celliande_future_borders_title: "The Future of the Borders"
 celliande_future_borders_desc: "  Blood. Death. Salt. These things define the history of the Borders. The Salt Lion, its people. Death, the fate of its enemies. Blood, its language. It is time to prove your fluency."
 celliande_future_borders_unrest: "\nIf §YSugamber§! is in any §YDisaster§! or at §YWar§! with someone other than us: "
 celliande_future_borders_unrest2: "§YSugamber§! will have no other option than to accept our demands."
 celliande_future_borders_bisan: "\nIf §YBisan§! is our ally:"
 celliande_future_borders_bisan2: "We may be able to negotiate their lawful corelands back to them, if they are still owned by §YSugamber§!."
 celliande_future_borders.tt: "\nAfter question of Hawfields is resolved we will issue an ultimatum to §YTellum§!."

 celliande_eagle_lion_title: "The Eagle Over The Lion"
 celliande_eagle_lion_desc: "  Arannen, Marquisate of the East. The Salt Lion of the Borders. A title usurped. The Arannese are a mockery of your heritage, a false culture set upon this land like the lid on a casket. Who were you before the Aldresian Crusade?\n  Milcorissia once ruled these lands. The people here were Milcori. This can be so again."
 celliande_eagle_lion.tt: "\nCelliande gets '§YMilcori Spite§!'\n Until the end of the game, when exploiting §YTax§! development of provinces with §YArannen§! cores, gain §G2.25§! §YCrowns§! per development of province and lose additional point of §YTax§! development."

 celliande_castellan_problems_title: "The Castellan's Problems"
 celliande_castellan_problems_desc: "  “To the Castellan of Bal Ourd,\n  You have fallen. No longer do you suckle at the teat of Castanor, the old empire of man. You pronounce yourself independent. A kingdom, even. And yet, you have failed in your charge. Your people suffer. Savage beasts clamour at the walls of your castle. Bal Ourd itself suffers, and you do nothing.\n  All is not lost, of course. The great Duchy of Celliande, your friend across the Flooded Coast, brings you an offer. Swear fealty, and we will save you. A simple choice, is it not?”\n  -Missive from Sorncell, found stained with blood on the beheaded corpse of a courier"
 celliande_castellan_problems.tt: "§Y[Root.GetName]§! gains a permanent claim on every province not owned by §YOurdia§!."
 celliande_castellan_problems.tt1: "If we complete this mission through the §YAlliance§!:"
 celliande_castellan_problems.tt2: "If we complete this mission through §YInsulting§! them:"
 celliande_castellan_problems.tt3: "If we complete this mission because there is no §YOurdia§! or they are our subject:"
 celliande_castellan_problems.crashingeffect: "§Y[Root.GetName]§! gain §YSubjugation§! Casus Belli on §YOurdia§!.\nThis Casus Belli will last for §G30§! years."

 celliande_beyond_coast_title: "Beyond Our Coast"
 celliande_beyond_coast_desc: "  “Piracy is a plague. A crime so vile that it twists the very nature of humanity. It starts out small. Plunder here, plunder there. The merchants have plenty of wealth; surely they won’t miss a shipment or two. But soon enough, you begin to see people as a commodity. At this point, you’re too far gone. You’re no longer a human, but an animal. A monster. No better than the Greentide, than the goblins who pillage Bulwar at this very moment.”\n  A pause. Metal rings against metal as the heavy blade of an executioner leaves its sheath. The Serondoruni Grandmaster hefts the blade, raising it level to their eyes.\n  “To honor that part of you, that last human piece, I sentence you to death.”"
 celliande_beyond_coast.tt1: "\nIf any province in §YFlooded Coast§! area is uncolonized:"
 celliande_beyond_coast.tt2: "Every current and future owned province in the §YFlooded Coast§! Area get '§YSerondoruni Governance§!' until the end of the game, giving the following effects:\nLocal Trade Power Modifier: §G+25.0%§!\nLocal Manpower Modifier: §G+50.0%§!\nLocal Sailors Modifier: §G+50.0%§!\nMinimum Local Autonomy: §R+25.00§!"

 celliande_serondor_expedition_title: "The Serondor Expedition"
 celliande_serondor_expedition_desc: "  “Our order was founded in the name of Serondor, the greatest captain the Borders has ever known. For years, we have lived our lives in service to him, to chivalry on the seas, to see the end of piracy in our waters.\n  One question remains. What happened to our namesake— what was this great man’s ultimate fate? I give you the answer, my fellow Serondoruni. This diary, this weathered book, once belonged to Serondor himself. With it, we may finally find his fate and put him to rest with honor.”\n  -Aldres Serondoruni, Knight-Captain of the Serondoruni Order"
 celliande_serondor_expedition.tt: "Had the modifier §YA Wayward Order§!"

 celliande_the_thorns_title: "The Thorns"
 celliande_the_thorns_desc: "  The boisterous Toarnese. The last of the crusaders still clinging to the coattails of the Roilsardi. They love their wine, their parties, and bragging. The duchess, Adélaïde, boasts loudly of her plans to unite the Borders. We could, with a provocation or two, take advantage of this…"
 celliande_the_thorns.tt1: "\nIf we complete this mission while having §Y20§! spy network in §YToarnen§!:"
 celliande_the_thorns.tt2: "If we complete this mission while having §YMilitary Advisor§! employed:"

 celliande_fall_rhinmond_title: "Fall of Rhinmond"
 celliande_fall_rhinmond_desc: "  The dogs in Sugamber tell stories of their old king, Rhinn II “Lichbane”. They say he bested a Milcori Lich-King in battle, earning his moniker. This is, of course, a lie, like every other word spoken by these barbarians.\n  Burn Rhinmond to the ground. Leave no survivors. Prove that you will not tolerate their ilk. The world has no place for them."

 celliande_stewards_history_title: "Stewards of History"
 celliande_stewards_history_desc: "  “My liege, you call yourself the heir of Milcorissia, do you not? You have cast off the shackles of the Arannese, sought truth in the ruins of the past, and now drape yourself in the tongue of the forgotten.\n  You have done so much, so well. Alas, your next steps require guidance. We have waited in the shadows, all this time, for you. We are the stewards of your history. We are the Nameless.”"
 celliande_stewards_history.tt2: "\nUnlock the Magical Project '§YLabyrinth of Sorncell§!'"

 celliande_first_many_title: "The First of Many"
 celliande_first_many_desc: "  You open your eyes, and you are in the labyrinth. You have never left the labyrinth. The labyrinth is your home. The dark shadows and winding passages are a comfort to you.\n  Why, then, do the shadows clutch at your heart? Your pulse quickens; you can hear it in your ears. Your eyes cloud with darkness as the silence grows deafening, snuffing out your consciousness.\n  The labyrinth is your home. You will never leave the labyrinth."
 celliande_first_many.tt2: "\nUnlock §YLabyrinth Exploration§! province button for Varlosen and Rhinmond."

 celliande_second_bout_title: "A Second Bout"
 celliande_second_bout_desc: "  The labyrinth calls to you. Every night you close your eyes and wake up inside it. You see the fog of your breath in the cold, underground air despite the darkness. A voice calls to you, speaking in a tongue you cannot quite understand. Each syllable is a scraping, screaming sound that sends a shiver down your spine.\n  Yet you know.\n  It calls you to serve. And serve you shall."
 celliande_second_bout.tt1: "Completed §YLabyrinth Exploration§! of Varlosen"
 celliande_second_bout.tt2: "Completed §YLabyrinth Exploration§! of Rhinmond"
 celliande_second_bout.tt3: "\nUnlock second stage of the Magical Project '§YLabyrinth of Sorncell§!'"

 celliande_treachery_gisdenese_title: "Treachery of the Gisdensese"
 celliande_treachery_gisdenese_desc: "  Of all the Arannese, none are more detestable than the Gisdenese. They are little more than a glorified puppet, a dog begging for scraps at Wex’s table. Their actions besmirch the legacy of the Borders. Wipe their disgrace from the face of Halann. Crush all resistance."
 celliande_treachery_gisdenese.tt: "\nUnlock §YLabyrinth Exploration§! province button for Quintenbury."

 celliande_final_depth_title: "A Third And Final Depth"
 celliande_final_depth_desc: "  You open your eyes. You are in the labyrinth, but you are not alone. A wispy silhouette stands beside you. For the first time, you are not afraid. You turn your hand over, conjuring a light. The face of death greets you.\n  “WAS IT WORTH IT?” Death asks you.\n  Your lips move on their own.\n  “Any price is worth the honor of serving.”"
 celliande_final_depth.tt1: "Completed §YLabyrinth Exploration§! of Quintenbury"
 celliande_final_depth.tt2: "Completed §YLabyrinth Exploration§! of Corseton"
 celliande_final_depth.tt3: "The Magical Project '§YThe Labyrinth of Sorncell§!' is complete"

 celliande_milcorissia_rises_title: "...Milcorissia Rises"
 celliande_milcorissia_rises_desc: "   “My Emperor,\n  The Borders, once a disparate, unruly place, have finally been unified in purpose. The Arannese, pretenders to the legacy of the land, have been destroyed. The Wexonards, barbaric Alenic invaders, cower before us. Our legacy, hidden from us by the Magisterium, has been reclaimed.\n  The Milcori have returned, and we bring with us news: Milcorissia rises again. And with it, the true King of the Borders.”\n  -Missive to the Emperor of Anbennar"
 celliande_milcorissia_rises.tt: "Uncovered fate of §YSerondor sil Sorncell§!"

 celliande_moon_party_title: "Leverage the Moon Party"
 celliande_moon_party_desc: "  Pearlsedge, our kin. Turncoats who fought alongside the Rose Party, but our kin nonetheless. If we are to reclaim what is rightfully ours, it will be vital to leverage this relationship. Perhaps, even in defeat, our loyalty to the Moon will mean something as well."
 celliande_moon_party.tt1: "Pearlsedge and one former member of the Moon Party must be our §YAllies§! and have §YRoyal marriage§! with us."
 celliande_moon_party.tt2: " former member's of the Moon Party with more than §Y50§! total development must be our §YAllies§! and have §YRoyal Marriage§! with us."
 celliande_moon_party.tt3: "If we complete this mission while having §YAlliance§! and §YRoyal Marriage§! with Pearlsedge:"

 celliande_deep_waterharbor_title: "The Deepwater Harbor"
 celliande_deep_waterharbor_desc: "  Just as Anbenncóst is the heart of the Empire, Sorncell shall become the heart of the Borders. Trade will be the blood that flows through its veins, and glorious will be the sight of it. Sorncell shall become the greatest harbor in all of Anbennar, and all the world’s riches shall be ours. Or, at least, the riches of Bulwar."

 celliande_bulwari_textile_title: "Bulwari Textile Exchange"
 celliande_bulwari_textile_desc: "  “Master, what do we need all this silk for? Surely the cloth of Doveswall is plenty for our needs.”\n\n  “Once again, my apprentice, you prove yourself to be an idiot. Truly, I wonder if you learn anything at all? Have you ever had a thought in that tiny little head of yours?\n  As artisans, we must be able to appreciate great work. Certainly, the cloths of Doveswall are impressive… but this, boy, this is silk! These, here, are the first bolts of true Milcori silk, produced in Doveswall itself! This is our future, my boy!”\n  -Exchange between the great Celliander tailor Aistern of Doveswall and his apprentice"
 celliande_bulwari_textile.tt: "Any known country with their capital in §YBulwar§!:\n  Any owned province produces §YSilk§!\n  Has §G100§! Improved Relations from §Y[Root.GetName]§!\n  Has §G25§! Send Gift modifier from §Y[Root.GetName]§! "
 celliande_bulwari_textile_fct: "\nIf we complete this mission while having an alliance with country that has capital in §YBulwar§! superregion:"
 celliande_bulwari_textile_fe: "§YBulwari Ally§!: Add §G15§! Trust with §Y[Root.GetName]§!"

 celliande_necromantic_fashion_title: "Necromantic Fashions"
 celliande_necromantic_fashion_desc: "  “Look at the craftsmanship! The detail! By Nerat, these are exquisite!”\n\n  “What’s so exciting about a bunch of dusty rags plucked from centuries-old corpses?”\n\n  “You fool. You absolute buffoon. Our work is to restore Milcorissia. Do you think that is something done with just a handwave and the conquest of states? No, no. We are tailors, boy. We hold history in our hands, and with it, we can do something great. Something unheard of. Any mage can raise the dead, but to revive a culture? That is a much more involved process.” \n  -Exchange between the great Milcori tailor Aistern Osunkosovuni and his apprentice"

 celliande_brief_reprieve_title: "A Brief Reprieve"
 celliande_brief_reprieve_desc: "  The Duke’s castle in Sorncell was heavily damaged during the Lilac Wars. Its crumbling walls are ill-maintained, a symbol that degrades the respect we ought to command. This cannot stand. A widespread renovation effort of the castle and its surrounds will restore Sorncell to its former glory— no, even beyond."

 celliande_new_story_title: "A New Story"
 celliande_new_story_desc: "  “The history of the Borders lies below our feet. Every day you take a step, and hundreds of feet below lies a story never told. But today? Today, those stories are told. Today, a new story begins.”\n  -Adria sìl Sorncell, sponsored adventurer"

 celliande_from_grave_title: "From Beyond The Grave..."
 celliande_from_grave_desc: "  “Though many nobles in the Borders claim heritage from the various former tribes and kingdoms of the land, there remains little evidence in favor of this. The most concrete evidence exists in the physical appearance of the region’s denizens— black hair and pale skin are common among the people of the Borders, and accounts from the past do also confirm the Milcori to have had a similar appearance. Of course, none of this matters to the enterprising noble who claims heritage from some old Milcori king or noble— facts are but a minor inconvenience to those of finer birth.”\n  -Excerpt from “Lineage of the Borders, Vol. 1” by Rogier of Konwell"
 celliande_from_grave_tt: "\nThe [Root.GetClergyName] privilege '§YReligious Culture§!' will no longer reduce maximum §GAbsolutism§!.\n§gThis effect is removed if §YState Religion§! is not §YRegent Court§!.§!\n\nFor each §YCountry§! that fulfills the requirements we will gain §Y25§! of each §YMonarch Point§!."
 celliande_from_grave_custom_tt: "\nOne of the following must be true:\n  Have a Spy Network of at least size §Y25§! from §YCelliande§!.\n  Have opinion of §YCelliande§! at least §Y120§!.\n  [Root.celliande_from_grave_wex]\n  [Root.celliande_from_grave_verne]\n  [Root.celliande_from_grave_anben]\n  [Root.celliande_from_grave_konwell]\n  [Root.celliande_from_grave_menibor]\n  [Root.celliande_from_grave_magisterium]"
 yes_wex: "£yes£ Wex"
 no_wex: "£no£ Wex"
 yes_verne: "£yes£ Verne"
 no_verne: "£no£ Verne"
 yes_anbenncost: "£yes£ Anbenncóst"
 no_anbenncost: "£no£ Anbenncóst"
 yes_konwell: "£yes£ Konwell"
 no_konwell: "£no£ Konwell"
 yes_menibor: "£yes£ Menibór"
 no_menibor: "£no£ Menibór"
 yes_magisterium: "£yes£ Magisterium"
 no_magisterium: "£no£ Magisterium"

 celliande_great_necropolis_title: "The Great Necropolis"
 celliande_great_necropolis_desc: "  The Necropolis of Nerat. Perhaps the greatest standing monument of Milcorissia. Yet it lies not in the hands of its sons and daughters, but in the hands of usurpers. Wrest your history from the hands of these defiant, unworthy dogs.\n  Descend."
 celliande_great_necropolis.tt1: "§Y[Root.GetName]§! gains permanent claims on every province with §YArannese§! culture."
 celliande_great_necropolis.tt2: "\nUnlock §YLabyrinth Exploration§! province button for Corseton."

 celliande_last_arannese_title: "The Last of the Arannese"
 celliande_last_arannese_desc: "  Your work is nearly complete. The usurpers, the Arannese, are nearly destroyed. The Milcori rise once more. In your resilience, in your ruthlessness, in your glory, you have created something great. Rejoice, child. You have served."
 celliande_last_arannese_tt: "All owned provinces of §YArannese§! culture will lose §G10§! years of separatism."

#Events
 celliande.1.t: "Looming Shadows"
 celliande.1.d: "Chaos. Bloodshed. Burnt harvests, plundered catches. Numerous reports cross the [Root.Monarch.GetTitle]’s desk detailing the atrocities committed by the Nathalairey to their people. The [Root.Monarch.GetTitle] has convened a council of admirals and generals to address the problem. A solution has been found: the state will commission a new fleet of galleys, manned with specially trained sailors."
 celliande.1.a: "They will rue this day!"

 celliande.2.t: "The Hawkfields Ultimatum"
 celliande.2.d: "Sire! We have a missive from Celliande! It seems the Duke is threatening us with war if we do not return the Hawkfields to them. What shall we do?"
 celliande.2.a: "Absolutely not!"
 celliande.2.b: "In our present turmoil, we have no choice but to capitulate."

 celliande.3.t: "The Tellum Accord"
 celliande.3.d: "A group of mailed knights walk brazenly down the Tellum streets. Criers break their calls, mid-sentence, as a dozen metal footsteps resound together. Finally, they come to a halt, as the town’s Mayor appears before them.\n\n“Ah, so good of you to show up.” A man, obviously the captain, says. The green-and-gold eagle of Celliande is emblazoned on the tabard he wears over his armor. “Your city is surrounded, Mayor. Sugamber falters before the might of Celliande. Will Tellum resist, or will you swear fealty to the true scion of the borders?”"
 celliande.3.a: "“You leave me no choice.”"

 celliande.4.t: "On the Trail of a Hero: Ourdia"
 celliande.4.d: "A Serondoruni knight plucks her pike from the corpse of a goblin. The countryside here swarmed with them, and she fears her work would never be done. She looks out across the small fishing village and smiles. Even in the face of such devastation, life goes on. People keep living. She found their tenacity impressive.\n\nThe rest of her company had already returned to the ships, but she wanted to take the time to enjoy the sunset on land for once. Settling down to the ground, she leans back and rests against a small, young tree.\n\n“Hi, Miss Knight!”\n\nA voice calls out to her, a little girl from the village.\n\n“Hello, young miss,” she says, her earlier smile returning to her face.\n\n“You killed all those goblins, huh?” The girl sits down next to the Serondoruni, pointing at her pike.\n\n“Indeed, I did. Me and my company.”\n\nThe girl sits there quietly for a moment, then pulls out a little doll. It’s crude, clearly a toy for a child, and made rather than purchased. It’s grey all over, except for a green shape on its chest.\n\n“This is the Eagle Knight! A long time ago, he saved our village, just like you did! He was a boy, but, are you the Eagle Knight now, miss?”\n\nThe Serondoruni laughs. “I suppose I am, young miss. Me and all my company, we’re all the Eagle Knights.”\n\nThe girl’s eyes light with excitement."
 celliande.4.a: "“When I grow up, I wanna be an Eagle Knight too!”"

 celliande.5.t: "On the Trail of a Hero: Shadows"
 celliande.5.d: "Five knights gather in Serondorunizam. The room is scarcely lit, and no light pours in from the grandiose window at the end of the room. The shadows seem to lap at the edges of the light, encroaching ever deeper. A similar darkness pours over the knights themselves.\n\n“We have seen evidence of Serondor, my friends,” one abnormally-enthused knight says. His comrades all look at him, the light drained from their eyes.\n\n“Yes…” one says, trailing off.\n\n“But…” continues another.\n\n“We have found nothing since then!” a fourth exclaims, his mechanism anger rather than sorrow.\n\nThe fifth knight sits silent with his eyes closed. The rest stare to him, as though awaiting his answer. The light flickers as the brazier dies down, barely more than the warm glow of coal."
 celliande.5.a: "We are a wayward order, without purpose."

 celliande.6.t: "On the Trail of a Hero: Light"
 celliande.6.d: "Five knights have gathered in Serondorunizam. They sit, near-silent, in the Grandmaster’s chamber. The fire in the brazier has nearly died out, naught left but a few smoldering embers.\n\nIf one did not know better, they might think they had stayed in these same positions the last three years. Their demeanor has, if anything, changed for the worse. Despair drips from their shadowed forms.\n\nIron-clad footsteps echo from the hall outside the grand double-doors, accompanied by a flurry of shouts. The knights all turn their heads, just as the doors fling open. Light pours into the room, a shadow cut into it by the interloping knight.\n\n“Hark, brothers!” He shouts, thrusting a weathered diary into the light above his head.\n\nThe Grandmaster shoots to his feet, slamming his fist on the table. “Who do you think you are—“\n\nThe newcomer gives no regard to his superior’s words, cutting him off as though he were naught but a squire. “I am Aldres Serondoruni, and I have brought you our purpose! Behold, the captain’s log of Serondor himself!”\n\nGasps resound around the room. The knights behind him, who just moments ago were trying to apprehend him, stand slack-jawed. The Grandmaster steps around the table and snatches the book from Aldres’ hand, flipping open to a random page. A look of disbelief spreads across his face as he flips from page to page, rapidly reading the contents, until he breaks into a smile.\n\n“Do you know what this means, boy?”\n\n“It’s time for a journey, sir.” Aldres says, offering some manner of respect for the grizzled veteran now. The Grandmaster laughs."
 celliande.6.a: "It’s time for a promotion, son! You’re a Captain now!"

 celliande.7.t: "To Raise a Hero"
 celliande.7.d: "Incense fills the room, barely covering the scent of death that permeates the tower of Varlosen. Formerly a seat of the Magisterium, the place has been taken over by the Lodge of the Nameless, and they have not dallied in making themselves at home. A mask-clad mage turns their head, looking to the [Root.Monarch.GetTitle].\n\n“Here for a 'hero', Your Grace?”"
 celliande.7.a: "Aran sil Varlosen"
 celliande.7.b: "Bull of Kwinteme"
 celliande.7.c: "Serondor sil Sorncell"
 celliande.7.exit: "I'm just looking around"

 celliande.8.t: "On the Trail of a Hero: Homecoming"
 celliande.8.d: "The past two years had not been kind to the Serondoruni. Aldres, now a respected Knight-Captain, had been following the trail left in Serondor’s logbook all across the Divenhal. The journey brought him to Port Jurith, Pearlsedge, even Kheterata!\n\nAlas, his journey had been fruitless. The knights had retraced Serondor’s steps perfectly, and now all that was left in the logbook were blank pages. Now he had retired to his quarters to contemplate in silence.\n\nHe paces back and forth, organizing his thoughts. This, surely, could not be the end of Serondor’s tale. A hero does not simply fade into obscurity. They are remembered.\n\n“Ashen skies!” He pounds his fist on the table. He could not return like this, with the shame of having failed in his charge. He needed something, a discovery—\n\nA flash of lightning illuminates the deck of the ship, and a wave crashes into it, shifting it off-kilter for a moment. The contents of the desk slide off, and with it, Serondor’s logbook. Aldres’ eyes open wide with shock, as buried deep within the blank pages was the hastily scrawled print of another writer. He hobbles to his feet before picking up the book, running his finger along the text as he reads it.\n\n“The black sails come. Captain says we won’t run anymore.”\n\nRelief washes over the Knight-Captain as he walks out of his quarters, shouting to his men, “We’ve found him, lads! We’re going home!”\n\nDeep beneath the former City of Shadows, a grisly sight unfolds before Aldres, the Grandmaster, and a small entourage of knights. A mass grave, full of bodies in various states of decay, stretching out for dozens of meters. One by one, the knights file into the room; ready, if hesitant, to search through the hundreds of corpses for Serondor.\n\n“Wait,” Aldres says, then motions at the wall across the pit. “Is that… the Celliander Eagle?”\n\nThe Grandmaster crosses the room, motioning for the rest to remain in place except for Aldres, the one responsible for this discovery. Together, the two examine the body, finding the tattered remnants of a Celliander tabard.\n\n“Despicable pirates…” the Grandmaster mutters, shaking his head. “Their punishment wasn’t nearly harsh enough.”\n\n“He can rest easy now, sir.”"
 celliande.8.a: "“He can finally go home, to Sorncell.”"
 celliande.8.b: "“Let him rest among our dead, those who followed him.”"

 celliande.9.t: "A Public Outcry"
 celliande.9.d: "“Your Grace, we have received yet another… dozen letters from the nobility. It seems they are displeased with the company you keep.” The advisor shuffles his feet, flipping through the papers in his hand. “Specifically, err, the Wexonards, Your Grace. They liken them to rabid dogs. One baron says ‘the world will not be a safe place for our children until there remains not a single Wexonard in the Borders’. It has a slew of signatures added to the bottom… as though drafted publicly.”\n\nHe pauses again, averting his gaze from the [Root.Monarch.GetTitle]’s.\n\n“It’s become somewhat of an issue, Your Grace.”"
 celliande.9.a: "“The petty nobility do not dictate our diplomacy.”"
 celliande.9.b: "“They’re right, Wexonards ARE dogs!”"

 celliande.10.t: "From Beyond The Grave..."
 celliande.10.d: "The [Root.Monarch.GetTitle] stirs restlessly on their throne. The head of each noble family of Celliande had gathered, seemingly united in purpose— whatever purpose that may be.\n\n“Well? Out with it.”\n\nOne of them steps forward. A lesser noble, of the [Root.Monarch.GetTitle]’s family.\n\n“Your Grace, we come before you in search of recognition.”\n\n“…Recognition?”\n\n“Yes, Your Grace. We belong to a society, the New Milcori Society. We have gathered tomes from across the Empire that support our claims.”\n\n“And these claims are…?”\n\n“That we are, in truth, of Milcori heritage, Your Grace. Naturally, that includes you, Your Grace.”"
 celliande.10.a: "I always knew I was Milcori. I could feel it."
 celliande.10.tt: "Henceforth, every Arannese or Wexonard province gets '§YMilcori Revival§!', giving the following effects:\nCulture Conversion Cost: §G-50.0%§!\nCulture Conversion Speed: §G-50.0%§!\n"

 celliande.11.t: "Enter, the Nameless"
 celliande.11.d: "It had been a long day. The [Root.Monarch.GetTitle] had issued another dozen orders enforcing the adoption of Milcori cultural laws, based on a… liberal interpretation of some excavated tomes. Now, they had retired to their quarters, settled into a soft chair with a book and spirits.\n\n“You seem comfortable, Your Grace.”\n\nIn an instant, they shoot up to their feet. The glass drops from their hand, shattering against the floor.\n\n“There’s no need to be alarmed, Your Grace. We are here to serve.”\n\nThe [Root.Monarch.GetTitle] turns, slowly, to face the voice. Their hand quivers at their waist, eager to reach for the dagger atop the nearby table. They freeze, face-to-face with thirteen masked, robed individuals.\n\n“Who… who are you?”\n\n“We are the Nameless, Your Grace.” One of the figures steps forward, dropping to his knees before the [Root.Monarch.GetTitle]. “We are a group of mages who harbor the secrets of Milcorissia, protecting them until a worthy heir shows themself. We are here to serve, Your Grace.”\n\nThe rest of the figures follow suit, kneeling before the [Root.Monarch.GetTitle].\n\n"
 celliande.11.a: "You may serve, but you still answer to the Magisterium."
 celliande.11.b: "I accept your fealty. You serve me and me alone."

 celliande.13.t: "...Milcorissia Rises"
 celliande.13.d: "The [Root.Monarch.GetTitle]'s return from the Labyrinth is heralded with great fanfare. After a day's rest, they are paraded through the streets of Sorncell accompanied by a grand entourage. Then, they depart on a journey through the realm, to eventually culminate in Corseton where they will be crowned in the manner of the Milcori kings of old, in the depths of the Necropolis.\n\nCelebrations erupt in every city they pass through, first Sorncell, then Varlosen, Gisden, Ashfields, and even Rhinmond, all home to proud Milcori. The uproarious celebrations are enough that nobody even notices that the [Root.Monarch.GetTitle] emerges from the Necropolis days later, alone, a weary look in their eyes.\n\nIn Sorncell, the sun sets. A rough-cast swordswoman sits in a dress she isn't quite comfortable in, across from a woman she desperately doesn't want to know this. The woman, of course, presents a confident exterior, but deep down, she feels far luckier than she ought to be. Years ago, they were both Arannese, but now? Now they were Milcori, and nobody even remembers who the Arannese were meant to be."
 celliande.13.a: "Milcorissia will live forever! The Milcori will never die!"

 celliande.14.t: "On the Trail of a Hero: Brasan"
 celliande.14.d: "One after another, crates of Bulwari silkworms are loaded onto the deck of the ship, carried by deckhands down into the cargo bay below. The captain overlooks the work off to the side, with the harbormaster, an elf.\n\n“Where are you bound?”\n\nThe captain turns his gaze to the harbormaster. The elf had barely spoken any more than necessary until now. Of course, despite his surprise, he had no reason to turn down an opportunity to spread the glory of Celliande.\n\n“Sorncell, in the Duchy of Celliande. The finest city in all the Borders.”\n\n“The eagle, there. That’s the flag of Celliande, then?”\n\nThe captain nods. The elf closes his eyes, recalling a distant memory.\n\n“I’ve seen it before,” he says, turning his gaze across the Divenhal. Somewhere, beyond the horizon, lies the city of Sorncell. “When I was a boy I would stow away on my father’s ship. He was a merchant, ferrying goods between here and Port Jaher. Once, our ship was beset by pirates…”\n\nHe recalls the story calmly, as though reading from a book, or speaking of things that happened to someone else.\n\n“But that eagle came. A ship flew that flag, sailing directly between us and the pirates. If it wasn’t for them, I wouldn’t be here this day.”\n\n“Serondor…” The captain’s voice escapes immediately, involuntarily. The elf turns to him and smiles."
 celliande.14.a: "Your docking fees are on me today, Celliander."
 
 celliande.15.t: "Necromantic Fashions"
 celliande.15.d: "“I'm not sure such a garment suits me.”\n\nLissa wraps her arms around Adria from behind, fingers twining with the laces of her new clothes. The two had gone to the tailor, weeks ago, when they received an invitation to a 'Traditional Milcori Ball', hosted by Adria's parents, a side-branch of the sil Sorncell. The invitation was accompanied with a garment, a stuffy suit typical for Celliander noblemen. Originally, they had not planned to attend, but Lissa had made a sound argument: “Show them,” she had said, “Show them how happy you are, show them the joy they miss out on. If it doesn't change their mind, then at least we know; we did everything we could. They will be the ones who failed you, the way my fellow priests failed me.”\n\n“Nonsense,” Lissa says, her hands wandering to the inner lace of the corset. Her hands are always cold, Adria thinks, and resists her impulse to draw away from them. “You're beautiful.”\n\nAdria looks to the dress on the bed beside them, adorned as it is with frills, lace skulls and ivory ribbings. The motifs had gained popularity lately. Something about imitating traditional Milcori designs, discovered in Corseton. The garment around her waist that so infatuated her companion was the same, a 'corset', they called it. It's a rigid thing, the insides lined with bone to hold one's torso upright, and the laces on front allow it to be tightened, helping to maintain one's figure. She was unsure about it, but she couldn't deny its value.\n\n“Thank you,” Adria says, finally, her voice shaking\n\n.“For what?” Lissa laughs softly, like music in Adria's ears.\n\n“For being with me.”\n\n“Always,” Lissa's response comes, accompanied by a tug on the laces of the corset. “Now let's get you dressed. I've a ball to show you off at, don't I?”"
 celliande.15.a: "The birth of the corset was a wondrous thing, for some."

 celliande.16.t: "Labyrinthine Discoveries"
 celliande.16.d: "Adria had woken up that morning with no particular expectations for the day. She was still coasting off the payment from her last jaunt into the Sorncell labyrinth, having hawked some jewelry for gold. The last thing she had expected was for the street outside the inn to collapse. Let alone for it to reveal a new, deeper entrance to the labyrinth. She stepped out of the inn, making her way into the crowd of bystanders— almost entirely made up of adventurers who had heard the news.\n\n“Adria!” A familiar voice called out to her, and she turned her head.\n\n“Lissa,” she said, fond recollection in her voice. The two had gone on numerous adventures together, and it seemed today would be the start of yet another.\n\n“Ready to get rich, Adria?”"
 celliande.16.a: "Milcori culture reigns supreme."

 celliande.17.t: "Milcorissia?"
 celliande.17.d: "“My liege… this is incredible! Dozens of Milcori tomes, fresh from the labyrinth! Do you know what this means, Your Grace?”\n\nThe [Root.Monarch.GetTitle] nods. “Indeed,” they say, flipping a book open to its middle. Their finger runs down the page, stopping seemingly at random. “The people of Celliande are the true children of the Borders.”\n\nThe scholar pauses. His stare, saturated in confusion, remains trained on the [Root.Monarch.GetTitle]. Silence brews between the two, and the scholar glances down at the page; indeed, the [Root.Monarch.GetTitle] had stopped their finger at a random word. “I’m sorry, Your Grace?”\n\n“We are descended from the Milcori. How else could you explain what lies below our fair city?”\n\n“…It is exactly as you say, Your Grace.”"
 celliande.17.b: "As their heirs, we have a rightful claim to all the Borders."
 celliande.17.tt: "[Root.GetName] gets '§YKings of the Borders§!' until formation of §YMilcorissia§!, giving the following effects:\nNational Manpower Modifier: §G+10%§!\nReasons to Elect: §R-400§!"

 celliande.18.t: "Nameless Tutors"
 celliande.18.d: "“It really is most unfortunate,” the Nameless said, reclining in his seat. “[Root.Heir.GetName] shows so much potential to be a truly impressive mage, and what does [Root.Heir.GetSheHe] have to show for it? Nothing. [Root.Heir.GetSheHeCap] is a failure.” \n\nThe [Root.Monarch.GetTitle] shot up. “How DARE you say such a thing! Why, I should have you execut-” \n\nThe Nameless put up a hand to hush the [Root.Monarch.GetTitle]. “Please, Your Grace, calm yourself. It was not my intention to insult the character of your heir in such a fashion— you see, we have a solution to this dilemma. It must be said, however, that our solution is a little… alternative. It defies conventional practice, one might say. I can promise you, though, that the results are simply exceptional.”\n\n“What is this solution, exactly? Speak plainly. Is there a cost?” The [Root.Monarch.GetTitle] asked. The Nameless reclined in his seat even more, to the precipice of sliding off of it.\n\n“Tsk, tsk, Your Grace. So impatient. So knowledge-hungry. I assure you, the cost is truly insignificant compared to the rewards.” The Nameless steepled his fingers. “What do you say?”"
 celliande.18.a: "“I will hear you out.”"
 celliande.18.b: "The Nameless cannot be trusted."

 celliande.100.t: "Guidance of the Nameless"
 celliande.100.d: "“Your Grace, I represent the interests of the Nameless. I understand you are embarking, personally, on an expedition to the Labyrinth of Sorncell?”\n\nThe [Root.Monarch.GetTitle] looks the mage up and down. She is on the shorter side, her face framed by blonde locks on either side of the bone-white mask of the Nameless. That always unnerved the [Root.Monarch.GetTitle].\n\n“Indeed,” they respond, hopefully betraying no hint of their thoughts. “What of it?”\n\n“The Nameless,” she says, dropping to one reverent knee, “the Lodge of the Nameless offers their services. We are familiar with the ways of the labyrinths, and it would be to your benefit.” She pauses. “Your Grace.”\n\nThe [Root.Monarch.GetTitle] considers their options for a moment, then says:"
 celliande.100.a: "Prepare your delegation to lead."
 celliande.100.b: "I will permit a few Nameless to join the expedition."

 celliande.101.t: "The Trek Deeper"
 celliande.101.d: "The principle concept was simple, in theory: using the most up-to-date maps, delve to the deepest explored point so far. From there, the expedition would begin in earnest. Unfortunately, reality is not so simple. The expedition found that walls would appear in places the map marked passages, leading to dead-end after dead-end. A new route would be drawn, a new dead-end would be found. Soon enough, the expedition's supplies began to run short. A decision would have to be made, and quick.\n\nThe simplest answer is to press on, ration supplies, and hope for the best. It is an ill thought-out plan, to say the least, but it is certainly simple."
 celliande.101.a: "Careful rationing and willpower will see us through."
 celliande.101.b: "The Nameless can conjure up some supplies for us."
 celliande.101.c: "It may be crude, but this stone can be transmuted to flesh."

 celliande.102.t: "The Diary of Aran sil Varlosen"
 celliande.102.d: "Day 49, the Diary of Aran sil Varlosen:\nI ran out of rations yesterday. I think. I don't exactly know when a day passes, down here. I mention this every entry. I just write one whenever I wake up. Maybe it's been more. Maybe I'm losing my mind, and it's only been a couple weeks. Who knows.\n\nI should have listened to Allan. These labyrinths are death traps. Oh well. Since I'm trapped down here, I've decided to make a drawing of the room, to see if it changes at all while I sleep. Like the entryway did.\n\n<a crude sketch of a circular chamber, with lines running chaotically across>\n\nYes. That looks right. The hardest part is these channels, they all connect to a pedestal in the center… I wonder what purpose they serve.\n\nI'll draw what I see tomorrow, next.\n\nDay 50, the Diary of Aran sil Varlosen:\nI think I've lost my mind. I looked at the drawing I made yesterday, and I can't even tell what the markings are meant to be. I've decided to draw another sketch of what I see today.\n\n<a crude sketch of a circular chamber, with lines collected chaotically towards one edge>\n\nIf I can't make sense of it tomorrow, I won't bother leaving another entry.\n\n"
 celliande.102.a: "This hero paved the way for our understanding, let us honor his memory."

 celliande.103.t: "The Empty Channels"
 celliande.103.d: "The channels in the death-chamber of Aran sil Varlosen continue to perplex the [Root.Monarch.GetTitle] and their advisors. The Nameless pore over their tomes. Engineers inspect every nook and cranny of the rotunda, hoping to glean some sort of use from the channels that fill every inch of the room.\n\nAlas, it is all to no avail. No report comes in claiming to have discovered the secret of the chamber. Days, weeks, months pass and the [Root.Monarch.GetTitle] is no closer to its secrets than before. It was time for them to take matters into their own hands, but how?"
 celliande.103.a: "Meditation in the Milcori shrine under Rhinmond will reveal the answer."
 celliande.103.b: "The greatest archives in the land are sure to hold the answer we seek."

 celliande.104.t: "It Came to Me in a Dream"
 celliande.104.d: "The [Root.Monarch.GetTitle] turns in their bed. Their search bore no fruit, and the prospect of failure eats away at them. How long can they keep people searching for an answer they do not even know exists? They close their eyes, letting out a sigh, and when they open them, they find themselves surrounded by pitch-black darkness. They know they are in the Labyrinth, but they do not know how they got here. A voice, deep and scratching, like heavy stones being dragged across the ground, resounds throughout their mind.\n\n"LOOK AT YOU. MEAGRE LITTLE THING, LOST AND AFRAID IN THE STONE AND SALT."\n\nThey open their mouth to speak, but no words come out.\n\n"I AM THE ONE WHO SPEAKS. I AM THE SHADOW OF THE LABYRINTH. I AM THAT THING YOU FEARED THAT LURKED IN THE DARK, [Root.Monarch.GetName]. YOU DID NOT ESCAPE ME. NOBODY ESCAPES ME."\n\n"AND NOW, YOU ARE THE ONE WHO LISTENS. YOU ARE AN INSECT, HOPING ONE DAY TO BECOME SOMETHING MORE."\n\n"SHALL I HELP YOU, INSECT? SHALL I GIVE YOU THE THING YOU LACK?"\n\nThe ruler swallows, their limbs paralyzed with fear, but their eyes stare straight ahead into the shadow. A creaking sound echoes through their ears, and the [Root.Monarch.GetTitle] swears they feel eyes burrowing into the back of their skull.\n\n"THE ANSWER IS BLOOD. WHET THE LANDS WITH BLOOD AND YOU MAY CLAIM YOUR… 'BIRTHRIGHT'."\n\nAn almost mocking tone permeates the last word. The [Root.Monarch.GetTitle] feels their eyes shut, forcibly, and the next time they open them they are back in their bed. They sit up."
 celliande.104.a: "I understand."
 celliande.104.b: "Some costs are too great."

 celliande.105.t: "A Sacrifice Worth the World"
 celliande.105.d: "Something stirs in Sorncell, tonight. The moon, the only witness to the things that happen in the shadows of night, turns her face away from Halann. The streets are pitch-black, save for the swaying lantern light of the city watch. In the castle, newly renovated with a passage leading down to the Labyrinth, the rustling clink-clank of chains is the only sound filling the halls.\n\nUnusually, the castle's internal guards were given the night off. The [Root.Monarch.GetTitle] cited some Milcori holiday, and the men were too excited to notice anything amiss. The only souls within the halls tonight were the [Root.Monarch.GetTitle], a handful of Nameless, and the fifty-odd prisoners marching single-file from the dungeon down into the labyrinth.\n\nA price must be paid for anything of real value. This is a concept the [Root.Monarch.GetTitle] understands well. Their crown, the various jewelry adorning their form, even the silks draped around their body. All of these held great value, and commanded an equal price. This, they told themself, looking to the march of prisoners, was no different.\n\nThe ritual, the deed itself, was short. The round chamber, its mess of channels, the basin in the center. All of it fills easily, gaining an eerie glow accompanied by the pungent scent of iron and meat. The [Root.Monarch.GetTitle] stoically stares ahead, their gaze empty. They're surprised to find themself unfazed by the sight. They thought, at least, they might have to repress the urge to vomit.\n\nInstead, they feel nothing."
 celliande.105.a: "Sacrifice is inevitable."

 celliande.106.t: "What Lies Below"
 celliande.106.d: "A Nameless approaches the [Root.Monarch.GetTitle], slightly inclining their head in deference. Pale blue eyes peer out from behind their pale mask, and the [Root.Monarch.GetTitle] almost feels a hint of pity, or condescension, in their gaze.\n\n“Your Grace, the ritual was a success. The path ahead lies open.”\n\nThe [Root.Monarch.GetTitle] doesn't respond immediately, instead turning their gaze to the spiral staircase now revealed in the center of the room.\n\n“We can begin preparations for the expedition immediately, Your Grace.”\n\n“No,” the [Root.Monarch.GetTitle] says. “I… require rest.”\n\nThe dozen or so Nameless in the room all turn at once to look at them. A lump catches in the throat of the [Root.Monarch.GetTitle], a shiver runs down their spine, and they feel the first thing they've felt since their dream the other day. Fear. The feeling subsides as quickly as it appeared, and the Nameless each continue their task, as though they had never stopped.\n\n“As you say, Your Grace.”"
 celliande.106.a: "The dead do tell tales, but only some have the right to listen."
 celliande.106.tt: "'§YSpeak With Dead§!' Monthly Magic Experience penalty reduced to §Y0§!"

 celliande.107.t: "Sacrifice Upon Sacrifice"
 celliande.107.d: "It's been days since the [Root.Monarch.GetTitle] and their entourage descended into the Labyrinth once more. The party, which initially numbered fifty, was now comprised of only thirty-eight. The traps beyond the staircase, in these yet-unexplored depths, were far deadlier than those above. A feeling of unease spreads across the party as they make camp, with many of the expeditioners realising that they very likely will not live to return to the surface."
 celliande.107.a: "A rousing speech will surely restore morale."
 celliande.107.b: "Sacrifice upon sacrifice, we will reach the root."

 celliande.108.t: "The Hallowed Halls 'Neath Us'"
 celliande.108.d: "An echo of gasps resounds throughout the hall as the party's torches extinguish themself one after another. The [Root.Monarch.GetTitle] has their lantern go last, its light lingering in a mockery of hope. Pitch-black shadow wraps around them all, the silence broken up only by the fast-paced breaths of the expeditionaries.\n\nA scream resounds through the hall, from the back of the party. Scale clatters, iron rings, and… a chandelier lights above. The expeditionaries hold their positions, looking around frightfully, but the [Root.Monarch.GetTitle] calmly scans their gaze across them all. Thirty-seven, now.\n\nA few dozen feet ahead, another chandelier lights. The one above flickers– once, then twice. A third flicker, then darkness again. In a panic, the group rushes to the next chandelier, just in time for it to flicker once. The expeditionaries all look to each other, then to the [Root.Monarch.GetTitle], seeking the guidance of their ruler and leader."
 celliande.108.a: "Surrender to the darkness, embrace the guidance of the light."
 celliande.108.b: "Cling to the light, and let shadow lap at our minds."

 celliande.109.t: "The Sanctum of the Last"
 celliande.109.d: "A final chandelier alights the end of the hallway. A large stone door is illuminated, bearing the Black Lion of Milcorissia, its face scratched out with a rough "X" mark. As the expeditionaries stop in front of it, the door lowers, revealing a familiar, round chamber. Stepping in, the [Root.Monarch.GetTitle] notices channels running chaotically through the room, all funneling into a large round door at the other end. In the center of the room is a deep indentation, like a dry pool.\n\nThe expeditionaries follow in, one at a time, spreading out across the room to investigate its secrets.\n\n"YOU ALREADY KNOW."\n\nThe [Root.Monarch.GetTitle] looks around, but the voice's origin is nowhere to be seen. A cold, ivory hand clutches their heart as they remember. They remember their dream, the voice, the labyrinths. They look down at their hands, expecting to see them trembling, but they are as steady as they've ever been. The light dims in their eyes."
 celliande.109.a: "OBEY."
 celliande.109.att: "Any worthy task requires a sacrifice."

 celliande.110.t: "Heir to Milcorissia"
 celliande.110.d: "It is done. Blood fills the pool, flowing around the room through the channels. Only one member of the expedition remains, the [Root.Monarch.GetTitle]. The precious ichor of their comrades drips from their fingertips, stains their clothes, splashes across their skin. Slowly, they raise their hand to their face, touching fingertips sticky with blood to a cheek drenched in it.\n\nThey run their hand across their face, but they wear no expression to betray their feelings. Their face is empty, like their heart. So much death, so much blood. They regret nothing.\n\nThey did only as they had to.\n\nThe door ahead splits as the channels across it run red.\n\n"YOU HAVE DONE WELL."\n\nThe [Root.Monarch.GetTitle] steps forward, into the gaping maw of shadow.\n\n"OBEDIENCE HAS EARNED YOU A REWARD.""
 celliande.110.a: "RISE, HARBINGER OF THE NAMELESS."
 celliande.110.tt: "'§YSteal Vitality§!' now gives permanent §G150%§! Monarch Lifespan and temporary §G+1§! Hostile Attrition."
 
 celliande.150.t: "The Tower of Varlosen"
 celliande.150.d: "“I understand it’s an official request of the [Root.Monarch.GetTitle] of Celliande, ma’am, but I can’t allow you entry to the lower levels without a writ from the Grand Magister.”\n\nAdria sighs. It was noontime, now, and she was no closer to the secrets of the Varlosen labyrinth than she was hours ago. The guard, who was a rather chunky, misshapen sort of man, had spent the entire morning refuting all of her requests for access. It was enough to drive her mad, if she did not have the tempering presence of her close friend Lissa.\n\n“Now, listen, ‘magister’,” she says, pointing her finger accusatorily in his face, “you’ve misunderstood something important here.”\n\n“Adria,” Lissa starts, placing her hand on her friend’s plate-clad shoulder.\n\nAdria sighs, again. “Temperance, right…”\n\nLissa smiles in response. “That’s right.” She turns to the guard— wearing a different, much less genuine smile— and offers a hollow apology. “Pardon us, we have to discuss something privately for a moment.”\n\nThe two shuffle off to a corner, whispering between each other.\n\n“It’s hopeless,” Adria says, dejected.\n\n“It’s only hopeless if we give up, Adria.”\n\nAdria sighs, a third time. “The [Root.Monarch.GetTitle] was clear: if we don’t have entry by tomorrow, we’ll have to take the tower by force…”\n\n“Yes, [Root.Monarch.GetSheHe] did.” Lissa’s voice is soft and low, a gentle hum to soothe Adria’s troubled spirit. Adria was ever the more anxious and impulsive of the two, leaving Lissa to be her voice of reason. “You’ve had your try, Adria. Mind if I have a go?”\n\nAdria stares into the younger woman’s eyes. She was as inscrutable as ever, which told Adria everything she needed to know. “You know, you’d think a warrior of the faith might be a little more… scrupulous.”\n\n“I do not believe a little bit of harmless bribery to be in conflict with Nerat’s teachings, my lady.”\n\nThe two share a laugh, then agree on a plan."
 celliande.150.a: "A little bit of harmless bribery, in the right place."
 celliande.150.b: "Their price is too steep; thus it must be paid in blood."

 celliande.151.t: "The Abandoned Laboratory"
 celliande.151.d: "Having secured their entry, one way or another, the expedition begins in earnest. It was nobody’s first time in a Milcori labyrinth; the adventurers of the Borders make their living off plumbing their depths, after all. Adria leads the way, a flickering torch raised in front of her, accompanied by Lissa. Behind them trails an assortment of mages, scholars, and a couple of Celliander soldiers.\n\nTime has a way of getting away from one, down in the depths; the absence of natural light, the creeping shadows that seem to eat away at your torchlight, diminishing it further and further as you descend. The shadows are reluctant, at times, to give up their place in the halls. They linger unnaturally, obscuring the crumbled stone and salt of this ancient place as though they themselves are the secrets of the Milcori.\n\nEventually, the expedition comes to a halt. Adria points, down, at a large clump of salt.\n\n“We just passed that, didn’t we?”\n\nLissa stares down, studying the clump, before nodding. “Indeed,” she says, “but from our path, we shouldn’t have looped around…”\n\nShe points at one of the scholars, then motions for them to pass along their in-progress map. She looks it over briefly, then…\n\n“Gods damn it. We’ve been walking in a straight line…”\n\nAn uncomfortable look flashes across Adria’s face, and she meets Lissa’s gaze. The two nod.\n\n“We’re turning around,” Adria shouts, pushing past the rest of the expedition, to lead the way, before stopping suddenly.\n\nThe path behind them, which one would expect to be a straight line, had changed. Instead, what they found was a nearly pristine wooden door, its visage marred only by the massive, imposing cast-iron figure of a lion. One of her hands drops, gripping the handle of her sword tightly, as the other slowly, hesitantly, pushes the door open. The hinges creak loudly. The torchlight fights its way inward, dispelling the shadows that cling to the chamber’s innards.\n\nDecrepit tomes— nearly dust, in truth— litter the surfaces within, accompanied by mechanisms and glassworks which wear their age plainly. It is an ancient Milcori laboratory, one that the Magisterium never found."
 celliande.151.a: "The Nameless shall study this place, revitalizing the work done here."
 celliande.151.b: "Some nobles would pay quite the price for these relics…"

 celliande.152.t: "Underground Resistance"
 celliande.152.d: "The Rhinmond Labyrinth is, perhaps, the most well-known among the old Milcori ruins. It crawls with undead, surging through its ever-shifting corridors like blood through one’s veins. None, perhaps, know this better than those who plumb its depths for secrets.\n\n“Ugh,” Adria says, flicking the congealed rot-blood of a zombie off her longsword with a strong, measured motion. “I hate zombies.”\n\nLissa laughs. “Ever thought about joining the cloth?”\n\nAdria opens her mouth to respond, but closes it abruptly. A shuffling sound comes from behind her, beyond the wall, and she turns to face it. The earth below rumbles, and the party loses its footing. Packs spill over, adventurers stumble into small piles. Adria moves without thought, near-tackling Lissa and shielding the cleric’s body with her own.\n\nIn a few short moments, the rumbling subsides. Adria raises her head and looks side-to-side; nobody was injured, it seems. She looks back down, to Lissa, only to be met with the woman’s blushing face.\n\n“S-sorry,” she stammers, before getting up and offering a hand to the still-prone cleric.\n\n“It’s… fine.”\n\nThe two dust themselves off, then look back to the wall, the source of the quake, only to find it no longer there. In its place, instead, was a room. Sugambrian banners hang from the walls. A small group of people, emaciated and ill, sit within, wearing terrified looks on their faces.\n\nRebels."
 celliande.152.a: "They could know their way around this place…"
 celliande.152.b: "The Milcori brook no dissent. Kill them."

 celliande.153.t: "Shadow-Wrought Corridor"
 celliande.153.d: "The darkness in the labyrinths is different. It clings to you, soaking into your very being. It resists the advance of light, pushing back against one’s attempts to know it. The deeper one goes, the darker it gets, the more sinister its secrets grow.\n\nThe halls under Rhinmond are no exception. The expedition finds itself halted, a vast corridor of shadow before them. It stands impenetrable to their torchlight; a wall of true darkness that snuffs out any hint of light or hope within. No doubt, it conceals great secrets and greater danger."
 celliande.153.a: "Our mages and trapfinders will guide the way."
 celliande.153.b: "Those rebels can be useful to us, in death."
 celliande.153.c: "Our new recruits know of another path."

 celliande.154.t: "The Abyss Stares"
 celliande.154.d: "Above, the shadows proved an impenetrable wall. Led by the malnourished Sugambrians, the expedition follows a winding path of corridors and stairwells, eventually coming to a massive, cavernous chamber. A half-dozen feet ahead, the ground crumbles away to a seemingly bottomless pit; save for a narrow bridge of rough-hewn stone.\n\nHere, the shadows seem to reach upwards, grasping at the edges of the pit, at the cracks and crevices along the bridge. Worst of all, the shadows are not silent. They whisper in one’s ears, a maddening litany of voices. One wonders, perhaps, if these are the voices of the lives claimed by the labyrinth? Or, indeed, that of the labyrinth itself?\n\nAdria hesitates, standing just before the bridge. She knows she must proceed, that the only path is forward. The labyrinth shifts constantly, and it is impossible to know if the path back even remains still.\n\nA smaller hand takes hold of hers."
 celliande.154.a: "We’ll go together, Adria."
 celliande.154.b: "Nerat protects his faithful."

 celliande.155.t: "A Beast Within the Shadows"
 celliande.155.d: "The work proceeds apace, clearing sections of the darkness each day. The expedition’s rations begin to deplete. It is taking longer than expected, they note. This is fine, they think. An experienced adventurer always brings more than they need.\n\nThe wall of shadows proves a greater foe than expected. The darkness, all-consuming of light, was fine. They dealt with that, slowly, methodically. The traps, too, were no great barrier. The mechanisms were old, decrepit, and ill-maintained.\n\nThe mages complain of eyes in the dark. It is watching, they say. Two enormous eyes, unblinking, until you look into them. It feels as though they peer into one’s soul, they claim.\n\nAdria sits, taking the role of the night’s watch. Lissa sits beside her, resting lightly. That is when she sees it— no, them. Two hulking beasts step forth from the shadows, a single eye taking up the bulk of their faces.\n\nNothics. Adria had read about them in a book, in the Tower of Sorncell. Beasts born from mages who went too far, cursed by their own work. They are dangerous and completely lacking in morality. At the same time, however… They know the secrets of the arcane, of this place."
 celliande.155.a: "Perhaps they will share their knowledge."
 celliande.155.b: "Adria draws her blade: it isn’t worth the risk."

 celliande.156.t: "An Old, Crumbled Place"
 celliande.156.d: "Even depth has a way of getting away from one in this forsaken place. How many feet above them was that forsaken city, Rhinmond? Hundreds? A thousand? These were the thoughts that went through Adria’s mind as the expedition descended yet another staircase.\n\nFinally, she sees the end— or, what she hopes to be the end. Steps give way to a flat landing, or perhaps a foyer? Stone benches rest to either side, flanking a massive set of stone doors. Each one bears the Black Lion, the sigil of Milcorissia. Faded, crumbling hieroglyphs run across the door, just below. Lissa steps forward; her education as a priestess of Nerat taught her to read some Milcori.\n\nShe runs her finger along the symbols, mouthing words, but stops at the last symbol. It is half-faded, half-crumbled, and even besides, it is a symbol she does not know.\n\n“It seems to be a shrine of some kind,” she says, stepping back again. “This last one, though, I don’t know. Sorry, Adria.”\n\nAdria drops a leather-clad hand onto the cleric’s head, ruffling her cowl a bit. “No worries. Whatever’s inside, we’ll manage.”\n\nThe doors are heavy. Adria wonders if they were originally opened by a mechanism of some kind, or if there was some other trick. Whatever it was, the secrets lie as dead as the people who built it. With the help of the rest of the expedition she forces the door open, and lays bare the heart of this labyrinth.\n\nA long room extends before them, hewn roughly out of the stone-salt walls. Stone benches— no, pews— fill the dust-laden chamber. A plain altar sits across from the entryway, a little bit wider than Adria was tall. Finally, at the very end lay a staircase, accompanied by hieroglyphs that Lissa translates as ‘tomb of faith’.\n\nThe bulk of the expedition remains above, while Lissa and Adria descend to the ‘tomb of faith’. Adria’s grip remains tight on her blade, still sheathed though it is. The staircase is shorter than the prior one, for which she silently thanks Nerat. She wasn’t particularly pious, but Lissa’s faith was rubbing off on her somewhat.\n\nThe landing approaches. Torchlight dispels the shadows that have clouded this place for the first time in hundreds of years, revealing the uncountable remains of generations past."
 celliande.156.a: "This was a place of the faith, and it shall be so again."
 celliande.156.b: "The Milcori of today will be eager to rehome their ancestors."

 celliande.157.t: "The Tomb of Stone"
 celliande.157.d: "The [Root.Monarch.GetTitle] runs their hand along the smooth stone walls. A couple of Nameless mages speak, their words blending inaudibly as the [Root.Monarch.GetTitle] becomes engrossed in thought. How had the Milcori of old hewn such perfect surfaces from the solid stone of the Borders? Were they all skilled in magics, such that they could give even a rough cavern a surface that would drive river rocks to envy? It is truly awe-inspiring to behold, they think.\n\n“Your Grace,” a voice calls, cutting through the thoughts that entangled the [Root.Monarch.GetTitle]’s mind.\n\n“Hmm?”\n\n“The artisanry is, of course, peerless. Of this, we have no doubt.”\n\nThe [Root.Monarch.GetTitle] nods. It seems their thoughts were legible on their face, and the Nameless read them as one would a tome.\n\n“Alas, we must gain entry to the chamber beyond. How shall we proceed, Your Grace?”\n\n"
 celliande.157.a: "You Nameless ought to be able to find a way."
 celliande.157.b: "Send out the call of adventure!"
 celliande.157.c: "It’s nothing our augurs can’t handle."

 celliande.158.t: "The Sepulcher of the Bull"
 celliande.158.d: "Adria strides into the chamber with Lissa following shortly behind her, along with a dozen other adventurers. The first thing that struck the group was the sheer size of the room, easily the size of the market square of Sorncell. The bulk of the space lies empty; shattered stone tiles across the floor make out half of a lion’s visage, the rest lost to time. Dozens of sarcophagi line the walls, roughly hewn from salt.\n\nMost imposing of all, perhaps, was what lay clear across the chamber: the gilded skull of a minotaur, hanging above a descending staircase.\n\n“The Old Milcori certainly had a taste, huh?” Adria laughs, leading the group across the room with one hand on her hilt. She stops, just a few feet shy of the stairs, and turns to Lissa. “Anything catch your eye, my lady?”\n\nLissa rolls her eyes, but fails to conceal her smile. Without a word, she steps forward, running her hand along the ornate stone trim of the staircase’s entryway. The carvings have long since smoothed, but one can still make out a scant few details.\n\n“’Queen of Bulls…’ and ‘maze’ are all that I can read, I’m afraid.” She glances upwards at the minotaur skull that hangs above. “An ill omen.”\n\nAdria shrugs. “Please, what are the odds a minotaur is still alive down here?” With a confident laugh, she advances, descending down the stairs.\n\nLissa and the rest follow shortly behind her, and soon the staircase ends in a flat corridor, nearly five men wide and four men tall. Ahead, the corridor twists and turns; the aforementioned maze, Adria presumes. To advance without a plan would be folly; and the group comes up with two viable options."
 celliande.158.a: "Leaving manned checkpoints will be useful to maintain supplies."
 celliande.158.b: "A series of magical lights can be left, marking the return path."

 celliande.159.t: "A Golden Bull"
 celliande.159.d: "The path through the maze is rather uneventful; there are no shifting walls, no traps, not a single shambling corpse. Despite this, tensions among the expedition have grown evermore taut. Finally, a faint light glows from the end of a corridor, and the group breathes a collective sigh of relief.\n\nStep by apprehensive step, they enter the chamber ahead. Immediately, they are struck by its opulence. Piles of gold, jewels, and relics fill the chamber, placed deliberately around the ornate sarcophagus in the center. The sarcophagus itself is hewn from salt, like the others, but it is unique for its gold and silver trimmings, as well as the hefty blue gemstone placed in its center.\n\n“Who do yo—“ Adria starts, but her words are cut off by an abrupt rumbling in the piles of treasure around them. Coins, necklaces, and the like clatter to the ground as gilded bones emerge from each pile, coalescing together with the skull of a bull— no, a minotaur, cracked in two but re-fused with gold. It heaves an axe from the ground behind it, and a guttural roar resounds throughout the chamber."
 celliande.159.a: "Let’s hope it doesn’t damage the tomb…"

 celliande.160.t: "Triumph in the Dark"
 celliande.160.d: "The tightly-packed maze is filled with the sound of exhausted breaths. The expeditionaries fought in the dark, the light of the tomb ahead barely reaching this place. The minotaur’s axe sparks as it glances off Adria’s shield. She slides backwards, the force nearly knocking her off balance. Her arm rings with pain; she can no longer feel her hand. She lets out a long breath, and Lissa lays her hand on her back.\n\n“Nerat, guide the blades of your faithful,” she prays, magic glowing from her hand, “May they strike true against this evil, that we might all live to serve you another day.”\n\nSuddenly, the pain was gone. Adria wriggled the fingers on her shield hand before clutching tightly to its handhold. She turns to Lissa and nods, receiving one in return. The two turn their attention back to the minotaur, just in time for it to cleave another expeditioner in twain. Its axe lodges into the rough stone of the maze wall, and Adria sees her chance. She dashes forward, doffing her shield and the excess weight it brings. The minotaur is slow, unreactive. She jumps, landing on the axehead. It is slick with the blood and viscera of her companions, but she has no time to think about it. She leaps once more, driving her blade into the crack of the skull, and pries it in two.\n\nThe minotaur collapses. The lack of fanfare is nearly disappointing, but she prefers that over another life lost. The group takes a moment to recover, then turns back to the tomb ahead. Adria braces herself against a wall, and Lissa approaches her. She looks to the room ahead, gleaming with treasures.\n\n“What do you think the [Root.Monarch.GetTitle] will do with all that?”"
 celliande.160.a: "That minotaur would do wonders for my foyer."
 celliande.160.b: "The treasures shall be sold to compensate the families of the dead."
 celliande.160.c: "Perhaps the Nameless can make the Golden Bull walk again?"

 celliande.161.t: "The Great Necropolis of Nerat"
 celliande.161.d: "“Your Grace, it seems that Nerat’s Council has… objections about your latest expeditionary orders.”\n\nThe [Root.Monarch.GetTitle] stares coldly, giving the messenger no indication of their feelings. After a moment, they return their attention to their meal. The messenger awkwardly continues.\n\n“They… err, they have barred the way, Your Grace. They say it is a holy place. Only the devout may enter.”\n\nThe [Root.Monarch.GetTitle] chews, slowly, then cuts another piece from their bloody steak. They swallow."
 celliande.161.a: "We are the devout. Prove it to them."
 celliande.161.b: "We are the devout. Cast them from our path and be done with it."

 celliande.162.t: "Secrets of the Catacombs"
 celliande.162.d: "The descent through the lower levels of the Necropolis passes quickly. The tunnels are well-maintained by the followers of Nerat, and thus the traps and beasts that plagued the other Milcori labyrinths have no place here. Adria, for once, feels somewhat relieved this far below ground; she fears, perhaps, that she has grown used to the weight of a hundred feet of dirt above her.\n\nLissa follows along beside her, just a footstep behind. Every so often, she casts a curious gaze behind her, at the new member of the expedition party: a Kheteratan adventurer, who claimed to be seeking some relic or another of Elikhet's. The [Root.Monarch.GetTitle]'s captain hired him, seeing the cheap buy-in price as an opportunity too good to pass up. Lissa, however, finds herself unable to fully trust him. There is a certain feeling she finds in his eyes, a scorn for her, her beloved, for everything they hold dear. She watches him carefully.\n\nThis doesn't go unnoticed, for the Kheteratan seems to treat her with near the same degree of scrutiny.\n\nThe party comes to a halt, the hall ahead of them ending in a grand relief-carved mural of a pyramid— the Necropolis, most likely. Below, it depicts a figure with its arms crossed on its chest, in some sort of repose deep below. Milcori hieroglyphs run below the length of the mural, and Lissa steps forward, to translate, as she has so many times before.\n\n“Speak the name of the Greatest King,” she says.\n\n“Elikhet,” the Kheteratan responds.\n\nThe group stares at him, dumbfounded. Lissa lets out a sigh.\n\n“Adria?”\n\nThe leader smiles at her closest friend."
 celliande.162.a: "Morgurax, the First."
 celliande.162.tt: "The stone wall recedes, and the path opens."

 celliande.163.t: "Deeds of the Lich-Kings"
 celliande.163.d: "Adria glances to either side, eyes wide with wonder. The hall ahead was lined with carved murals, depicting the ancient deeds of the Milcori Lich-Kings. One is shown repelling a horde of gnolls, while another piles bodies against the walls of a fortress. The Kheteratan scoffs, earning glares from the rest of the party.\n\nEventually, the corridor empties into a large, round room. In the middle lies a basin, around the rim of which is carved “That Which Begets Death From Life”. A single channel runs from it to the wall, where an evermore grand mural depicts the story of yet another king.\n\nThe story begins to the left of the door, where a gaunt figure is shown holding a small box before him, inside of which lies a coiled wisp. The next scene depicts the same figure above a crowd of people, who all prostrate themselves before him. A third scene shows him doing battle with a cat-faced man, presumably the Kheteratan Elikhet. The two are depicted slinging spells at each other, and in a fifth, final scene, Elikhet is shown kneeling before him. Written vertically beside the scene is a word, a name.\n\n“Morgurax,” Lissa says. She gestures at the final scene. “It appears that he defeated Elikhet in a duel.”\n\nThe Kheteratan adventurer laughs derisively. “Blasphemy. Elikhet would never lose to a malformed skeleton.” He steps forward, hefting his mace, but finds his path blocked by Adria, hand on her blade.\n\n“Put that away before you do something you regret.”\n\nHe looks around, seeing the rest of the party in a similarly combat-ready stance, then lowers it. “You lot are pathetic. Clinging to these lies from the past, when the truth is in front of you. Kheterata lives. Milcorissia is dead. Gone.” He walks away, leaning against one of the carved walls.\n\nLissa and Adria convene at the basin, to contemplate the meaning of its inscription. Before long, they believe to have deciphered the meaning; the basin must be fed blood, for that is what begets death from life."
 celliande.163.a: "Together, we can feed the basin without harm."
 celliande.163.b: "The Kheteratan has blood, you know."

 celliande.164.t: "The Antechamber of Nerat"
 celliande.164.d: "The basin, once fed with blood, opens a spiral staircase below it. After a short descent, the party finds themselves in a large, crumbling, square chamber. The other end of the chamber is fully collapsed, but even those not magically attuned can feel a great power from beyond the rubble. More carved murals line the walls on either side, depicting a figure consistent with other Milcori depictions of Nerat. Together, Lissa and Adria approach one, examining it further.\n\nNerat, the large figure depicted in robes, reaches his arms outward, holding a crown which he appears to be bestowing upon a bowed, nearly-skeletal head. The rest of the mural is crumbled beyond recognition, fading into the mess of rubble ahead. Milcori hieroglyphs line the bottom of the mural. Adria runs her fingers along them, turning her head to look at Lissa.\n\n“What do they say?”\n\nLissa takes Adria's hand in her own, then guides her fingers along the words.\n\n“The Favoured,” she says, carefully tracing Adria's fingers along the shape of the first hieroglyph. Adria feels her face grow somewhat flush, but she doesn't complain. “of Kuradas,” she says, tracing the next set of hieroglyphs.\n\n“Kuradas?”\n\nLissa nods. “I think… it must be what they called Nerat.”\n\nThe two continued to speak for a while, indifferent to the rest of the expedition's investigations."
 celliande.164.a: "The [Root.Monarch.GetTitle] decrees this the first Temple of Kuradas."
 celliande.164.b: "The royal family of Celliande shall be interred here, alongside these legends."

 celliande.165.t: "The Riddle"
 celliande.165.desc: "While descending through the catacombs, the party finds a hidden chamber off the side of the main path. In it, a single pedestal of rough-hewn salt rises from the center, and atop it, lies the calcified skull of a kobold. As the party enters the room, the skull animates, its eyes glowing with a soft purple light. A deep voice booms throughout the room, somehow understandable despite the ancient tongue it speaks in.\n\n“You seek the treasures of Zoladax?\n\nThey can be yours, if you but answer his riddle.”\n\nThe party hesitates, but eventually one among them steps forward. The skull speaks again.\n\n“I am the prelude of finality.\nPeasants hold me, but in the end relinquish me.\nKings relinquish me, but hold me forevermore.\nWhat am I?”"
 celliande.165.a: "Magic."
 celliande.165.b: "Salt."
 celliande.165.c: "Sleep."
 celliande.165.d: "Wealth."
 celliande.165.e: "Life."

 celliande.166.t: "The Riddle: Wrong Answer"
 celliande.166.d: "The skull lets out a wry laugh as the light fades from its eyes, the treasure of this enigmatic Zoladax lost forever."
 celliande.166.a: "Damn."

 celliande.167.t: "The Riddle: Correct Answer"
 celliande.167.d: "The pedestal slides backwards, revealing a cache of gems and other treasures below it. The party divvies it up, with a majority share— the talking skull included, of course— set aside for the [Root.Monarch.GetTitle], as the expedition's sponsor."
 celliande.167.a: "Excellent."

 celliande.1000.t: "Bounce back"
 celliande.1000.d: "There is Kobold behind me, isnt he?"
 celliande.1000.a: "Always has been."

