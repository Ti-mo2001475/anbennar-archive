l_english:

 # MISSIONS
 olavish_minor_enter_the_fray_title:0 "Enter The Fray"
 olavish_minor_enter_the_fray_desc:0 "Only one king can rule them all"
 olavish_minor_olavish_dominance_title:0 "Olavish Dominance"
 olavish_minor_olavish_dominance_desc:0 "We've forced the other petty kings into submission, now we must prove ourselves worthy of their loyalty."
 olavish_minor_secure_our_grip_title:0 "Secure Our Grip"
 olavish_minor_secure_our_grip_desc:0 "We must secure our hold on Olavish hegemony."
 olavish_minor_take_to_the_sea_title:0 "Take to the Sea"
 olavish_minor_take_to_the_sea_desc:0 "Our reavers are raring to fight, let us set them on our coastal neighbors and show them the might of our navy."
 olavish_minor_modern_olavish_city_title:0 "A Modern Olavish City"
 olavish_minor_modern_olavish_city_desc:0 "Our most important cities have fallen behind the times. Now that we have established our authority over Olavlund, it's time to build a capital we can be proud of."
 olavish_minor_in_search_of_new_ideas_title:0 "In Search of New Ideas"
 olavish_minor_in_search_of_new_ideas_desc:0 "We must embrace innovation and progress to secure our future."
 olavish_minor_city_built_on_plunder_title:0 "A City Built on Plunder"
 olavish_minor_city_built_on_plunder_desc:0 "We have conquered and pillaged our way to prosperity."
 olavish_minor_unite_olavlund_title:0 "Unite Olavlund"
 olavish_minor_unite_olavlund_desc:0 "It's time to bring the petty kingdoms together. We've long proven ourselves fit to rule over all Olavlund."

 naugsvol_construct_larger_pastures_title:0 "Build Larger Pastures"
 naugsvol_construct_larger_pastures_desc:0 "Naugsvol cannot rely on exporting naval supplies forever. We need to pivot our economy in a more sustainable direction. Only we have mastered the art of raising gerudian cattle, so perhaps we should lean more into our strength."
 naugsvol_turning_the_tide_title:0 "Turning The Tide"
 naugsvol_turning_the_tide_desc:0 "We have reclaimed our lost territory, now to rebuild."
 naugsvol_establish_the_menskgaetr_title:0 "Establish The Menskgaetr"
 naugsvol_establish_the_menskgaetr_desc:0 "We learned the hard way that our army was nothing more than rabble. We have since recovered from the Ebonfrosts' invasion, but there is much work to be done in improving our army."
 naugsvol_secure_cattle_pathways_title:0 "Secure Cattle Pathways"
 naugsvol_secure_cattle_pathways_desc:0 "With all of our territorial gains, the thought has begun to form that we could use cattle to transport goods to the far reaches of the realm. We'll need to secure their path first."

 redgarhavn_poke_the_bear_title:0 "Poke The Bear"
 redgarhavn_poke_the_bear_desc:0 "With the entangling of our merchants in Bjarnrik's ports, the kings coffers look all too tempting."
 redgarhavn_dealing_with_league_title:0 "Dealing With The League"
 redgarhavn_dealing_with_league_desc:0 "Celmaldor's Vic league has grown quite the large treasury from their business. Let's cash in on our share."
 redgarhavn_to_bal_vroren_title:0 "To Bal Vroren"
 redgarhavn_to_bal_vroren_desc:0 "There is weakness in the orcish kingdom to our south, weakness that can be exploited for gold."
 redgarhavn_cruelheart_title:0 "Cruelheart"
 redgarhavn_cruelheart_desc:0 "The name Redgarhavn is feared throughout all Giant's Grave."

 # EVENTS
 olavish_minor.1.t:0 "New Level of Olavish Dominance!"
 olavish_minor.1.d:0 "We have proven our might in battle, and earned the respect of our subjects."
 olavish_minor.1.a:0 "Bow before your king!"

 olavish_minor.2.t:0 "Crowning of The Olavish King"
 olavish_minor.2.d:0 "The Olavish people do not bow easily, and yet only one remains who can call themselves king. One who has not just laid claim to the land, but proven his worthiness in battle. The seat of the Kraken Throne is filled at long last."
 olavish_minor.2.a:0 "All hail the king!"

 redgarhavn.1.t:0 "Ultimatum From Redgarhavn"
 redgarhavn.1.d:0 "Redgarhavn wants our stuff."
 redgarhavn.1.a:0 "Never!"
 redgarhavn.1.b:0 "Just business, right?"

 redgarhavn.2.t:0 "[plunder_victim.GetName] accepts our offer"
 redgarhavn.2.d:0 "[plunder_victim.GetName] received our letter detailing the most generous terms to the spare the lives of their people in return for a fattened purse. They are quite reasonable, and have accepted our offer."
 redgarhavn.2.a:0 "Pleasure doing business with you."

 redgarhavn.3.t:0 "[plunder_victim.GetName] refuses our offer"
 redgarhavn.3.d:0 "[plunder_victim.GetName] received our letter detailing the most generous terms to the spare the lives of their people in return for a fattened purse. However, they have so brazenly declined our offer."
 redgarhavn.3.a:0 "Let us teach them fear."

 redgarhavn.5.t:0 "Paying With Steel"
 redgarhavn.5.d:0 "Our reavers infiltrated Konungrhavn as merchants, and have now seized control of the city."
 redgarhavn.5.a:0 "All according to plan."

 redgarhavn.6.t:0 "Konungrhavn Plundered!"
 redgarhavn.6.d:0 "We plundered Konungrhavn for everything it had, including plenty of ships and building materials to expand our harbor. With all the chaos ensuing, the king of Bjarnrik offered our reavers the town of Drekkodr to settle in, just to make them leave."
 redgarhavn.6.a:0 "What a bargain!"

 redgarhavn.7.t:0 "Bal Vroren Plundered!"
 redgarhavn.7.d:0 "We plundered Bal Vroren for everything it had, including entire armories worth of military supplies. They have ceded Isle Vroren to us in a desparate attempt to get our reavers to leave and settle there."
 redgarhavn.7.a:0 "What a bargain!"

 redgarhavn.8.t:0 "Celmaldor Plundered!"
 redgarhavn.8.d:0 "We plundered Celmaldor for everything it had, including many trade routes and secrets they had hidden away in vaults. They have ceded Eyegard to us in a desparate attempt to get our reavers to leave and settle there."
 redgarhavn.8.a:0 "What a bargain!"

