l_english:

 # MISSIONS
 olavish_minor_enter_the_fray_title:0 "Enter The Fray"
 olavish_minor_enter_the_fray_desc:0 "The king of Bjarnrik to our west plans to outright ban reaving. The grey orcs to our east have toppled the reach, and threaten to move further west into our homeland. It seems the men around us are all cowards… weaklings racing to jump upon the swords of outsiders. Someone must stand above the rest and fight, not just to live, but to rule. Let it be us. While the rest of Gerudia may lay complacent, let us bare our fangs! We shall submit to neither orc nor southerner, and we will never abandon our ways!"
 olavish_minor_olavish_dominance_title:0 "Olavish Dominance"
 olavish_minor_olavish_dominance_desc:0 "The Olavish Jarldoms have long been disunited, suspended in a long standstill with none of the Jarls clearly surpassing any other. To break this balance is a task that has been attempted time and time again to no avail, and yet we must try to achieve it all the same. The other Jarls will strike at any sign of weakness, so we must show them none! Our claim to leadership shall be undisputable!"
 olavish_minor_secure_our_grip_title:0 "Secure Our Grip"
 olavish_minor_secure_our_grip_desc:0 "We have upset the precarious balance between the Olavish Jarldoms. Our neighbors look upon us filled with fear and contempt. And their fears are well justified. Our vassals support us only as long as they feel our superior strength, and we will not keep their loyalty by sitting idly by. We must raise our army and make an example out of everyone who dares to resist us."
 olavish_minor_take_to_the_sea_title:0 "Born of the Sea"
 olavish_minor_take_to_the_sea_desc:0 "The Olavish Jarls all pride themselves on their navies, and for good reason. After all, all we call ours was built on the back of our mighty reavers and their utter domination of the Giant’s Grave. While our reach has spread far on land, our fleet remains contested at sea. Should this situation persist, not only will we be unable to rally the other Jarls to our cause, impeding our goal of unification, but the ones who have already pledged loyalty to us may turn against us."
 olavish_minor_modern_olavish_city_title:0 "A Modern Olavish City"
 olavish_minor_modern_olavish_city_desc:0 "We have secured the heart of Olavlund, but now we face another problem. We require a proper capital from which to exert our influence. Many of the most important settlements in Olavlund pale in comparison to the sprawling cities of the south. Even Olavsborg, the great hall founded by Olav, has fallen into genteel obscurity. Yet we have the means, and good reason, to change this now. Let us build a capital city we can be proud of."
 olavish_minor_in_search_of_new_ideas_title:0 "In Search of New Ideas"
 olavish_minor_in_search_of_new_ideas_desc:0 "A new age has dawned in the south, one in which the arts and scholarship are flourishing, and new thoughts are permeating every aspect of society. Previously, we dismissed such endeavours as soft platitudes fit only for the weak-willed southerners, but as this renaissance movement has grown, its effects have become clear. The southerners have begun to rapidly advance in their innovations, while we have stagnated. This will not do. Set forth the reaver fleet. We have much to learn."
 olavish_minor_city_built_on_plunder_title:0 "A City Built on Plunder"
 olavish_minor_city_built_on_plunder_desc:0 "The world thought us gone, but a remote remnant of a bygone age. The Era of Black Ice became nothing more than a distant memory, and our heroes were remembered only by us. Now, our ships rule the waves of the Giant’s Grave once more. Every few years, reavers return home in ships filled with gold, artwork, and scientific wonders from all across Cannor, and foreign merchants follow, seeking to pay gold for what we bought with steel. The city of [Root.Capital.GetName] has become a shining beacon of prosperity throughout Gerudia."
 olavish_minor_unite_olavlund_title:0 "All Under The Kraken Throne"
 olavish_minor_unite_olavlund_desc:0 "All the Olavish Jarls have sworn their unwavering fealty to us. Our dominance of both land and sea is undeniable, and we have raised our people out of obscurity. With our present secured, there is but one thing left to do. It is time to discuss our shared path towards the future, the matter of unification into a single country. There will be no more fragile oaths of allegiance, nor petty internal disputes among Jarls. Olavlund will be a land of one united people, answering to but one Jarl."

 naugsvol_construct_larger_pastures_title:0 "Build Larger Pastures"
 naugsvol_construct_larger_pastures_desc:0 "We alone know the secrets to raising cattle in the harsh climate of Gerudia. Ours grow extraordinarily large and strong, more so than any other cattle in all of Cannor. Throughout most of our history, these cattle herds composed the bulk of our economy, serving both as efficient meat sources, and excellent hauling beasts. However, in the wake of the recent invasion by the Ebonfrosts, most of our livestock was taken and either slaughtered or sold off to fill the invader’s pockets. For a while, this has left us reliant on the sale of lumber to sustain us, but the remaining cattle herds are finally starting to recover. It is time to rebuild the pastures, and return to our cattle ranching ways."
 naugsvol_turning_the_tide_title:0 "Turning The Tide"
 naugsvol_turning_the_tide_desc:0 "We faced an existential crisis recently when the Ebonfrosts invaded our land. We managed to hole up in Naugsvol, but lost much of our core territory. Now we must fight back against them with renewed vigor, and recover our lost homes, or die trying."
 naugsvol_establish_the_menskgaetir_title:0 "Establish The Menskgaetir"
 naugsvol_establish_the_menskgaetir_desc:0 "We learned the hard way that our army was nothing more than rabble. Although we managed to defeat the Ebonfrosts in the end, the fact remains that we are clearly not prepared for the challenges of this new age. Seeing this, many of our veterans have volunteered to become Menskgaetir, warriors who train full-time for battle during peacetime instead of taking on other professions. With just a bit of support from the Jarl, their training regimen has produced remarkable results. Our soldiers look stronger and healthier, and can be seen practicing drills every day in the hills."
 naugsvol_secure_cattle_pathways_title:0 "Secure Cattle Pathways"
 naugsvol_secure_cattle_pathways_desc:0 "Our territory has grown significantly in recent years. While the Ebonfrosts threatened to seize what little we had left not too long ago, we have since absorbed their territories into our own. Yet surprisingly, this has not been as beneficial to the Jarldom as we had initially thought. The mountains have proven treacherous, filled with bandits, which has compounded the sheer difficulty of moving heavy cargo through them. This issue was brought up in the Jarl’s hall, and discussed at length. It was decided that fortifications should be built and patrols sent out to ensure the safety of those traveling in the mountains. Furthermore, it was suggested that the hulking Naugsvoler cattle could be used to ease the burden of transporting goods so long as their pathways are properly secured."

 redgarhavn_poke_the_bear_title:0 "Poke The Bear"
 redgarhavn_poke_the_bear_desc:0 "Every child in Redgarhavn grows up hearing the tale of Redgar Cruelheart, the legendary reaver who sailed along the coasts of Cannor and the Divenhal before returning to Gerudia and founding the city of Redgarhavn. However, the Konungr in Bjarnrik has banned the practice of reaving everywhere except in Revrhavn, leading many to believe that the age of reavers is coming to an end. We must remind the Konungr, and all Gerudia, of the might of reavers, lest our legacy fade into obscurity. Our merchant families have deep roots in Konungrhavn, and it would be a trivial task to smuggle some weapons and soldiers into the city. We shall send the Konungr an ultimatum, a demand for tribute to keep reavers from pilfering his ports. And by the time the letter arrives, our warriors will have already infiltrated Konungrhavn."
 redgarhavn_dealing_with_league_title:0 "Dealing With The League"
 redgarhavn_dealing_with_league_desc:0 "The Vic Leagues along the southern shore of the Giant’s Grave have been a thorn in the side of many reavers. Their large navies protect their merchant vessels and patrol the seas, hunting down reavers who stay in the south for too long. The largest among them is the Celmaldor league. Following our victory over Bjarnrik, they have grown more aggressive in order to quell the resurgence of reavers. This is a battle we cannot avoid. We will have to eventually face their navy and destroy it, though no one said we have to do so fairly. The night we move our ships out to blockade the enemy ports, our spies in the league’s cities will torch the enemy navy, preventing them from sailing forth to break our blockade. Then, all we have to do is send the ruler a letter with our ultimatum."
 redgarhavn_to_bal_vroren_title:0 "To Bal Vroren"
 redgarhavn_to_bal_vroren_desc:0 "The White Reachmen sent us a letter after the raid on Bjarnrik, inviting us to come to Bal Vroren. The opportunity is quite enticing, as the orcs currently residing in its halls have stockpiled a veritable gold hoard in old Bal Vroren, yet we must not be hasty. The orcs are formidable brutes, though it is irksome to admit. We shall task the reachmen with poisoning the orcish food supply, and only if they are successful will we send the ultimatum. The orcs are simple-minded and warmongering. They will fight in spite of their impaired condition, and we will easily slaughter them."
 redgarhavn_cruelheart_title:0 "Cruelheart"
 redgarhavn_cruelheart_desc:0 "We made a fool of the Konungr in Bjarnrik, slaughtered the grey orcs in Bal Vroren, and humiliated the Vic league navy of Celmaldor. The reavers of Redgarhavn once again strike fear across the Giant’s Grave. We have amassed wealth, and [Root.Capital.GetName] has grown into the jewel of Gerudia. but that is not all we fought for. The legacy of Redgar Cruelheart… Our legacy lives on. The world will not forget us any time soon."

 avnkaup_find_new_recruits_title:0 "Find New Recruits"
 avnkaup_find_new_recruits_desc:0 "The Saga Guild has long been a core part of Avnkaup identity. Their efforts in slaying the trolls in the north have made Gerudia safer for all. The guild is always looking for new recruits, typically drawn from veteran warriors. While this has always been enough to hold off the trolls just beyond the mountains, with a bit more direct support from the crown, perhaps more large-scale endeavours would be possible."
 avnkaup_frontier_settlement_initiative_title:0 "Settle The Frontier"
 avnkaup_frontier_settlement_initiative_desc:0 "Recent expeditions to the north have been wildly successful. The Saga Guild managed to thoroughly map out the Kronetindur Pass through the Titan’s Rest Mountains, and the forests just beyond it. As a result of the guild’s activity, what trolls remain in the area have begun to flee further north. Enthusiasm is high among the Saga Guild’s new recruits. If we provide further funding, it may be possible to settle this newly explored land."
 avnkaup_ruins_in_raudrsten_title:0 "Ruins in Raudrsten"
 avnkaup_ruins_in_raudrsten_desc:0 "The Saga Guild has been busy exploring the frontier and clearing out the trolls. For the most part, the wastes have contained nothing of note. However, after dispatching a particularly large group of trolls, the explorers discovered evidence of a ruined human settlement nearby. The precise location of these ruins was discovered by a scouting party, who reported that they belonged to an ancient city called Raudrsten. Yet before the guild can further explore the ruins, the trolls who have settled there will have to be eliminated once and for all."
 avnkaup_a_quest_complete_title:0 "A Quest Complete"
 avnkaup_a_quest_complete_desc:0 "Our brave explorers of the Saga Guild have made discovery after discovery in their exploration of the frozen north. We have mapped the land, uncovered old ruins, and slain the foul monsters who got in the way. However, some mysteries still elude us. There are obstacles the guild faces that simply cannot be overcome with the abilities of the adventurers alone. We will need to use magic in order to move forward."

 # EVENTS
 olavish_minor.1.t:0 "Olavish Dominance Increased!"
 olavish_minor.1.d:0 "We have proven our might in battle, and earned the respect of our subjects."
 olavish_minor.1.a:0 "Bow before your king!"

 olavish_minor.2.t:0 "Crowning of The Olavish King"
 olavish_minor.2.d:0 "The Olavish people do not bow easily, and yet only one remains who can call themselves king. One who has not just laid claim to the land, but proven his worthiness in battle. The seat of the Kraken Throne is filled at long last."
 olavish_minor.2.a:0 "All hail the king!"

 olavish_minor.3.t:0 "Olavsborg Reborn"
 olavish_minor.3.d:0 "Olavsborg has been raised from obscurity, and is now a bustling city. The ancient capital of Olavlund is reborn, but what now?"
 olavish_minor.3.a:0 "It shall be the centerpiece of our empire!"
 olavish_minor.3.b:0 "Great work everyone! Now to return home."

 redgarhavn.1.t:0 "Ultimatum From Redgarhavn"
 redgarhavn.1.d:0 "Redgarhavn wants our stuff."
 redgarhavn.1.a:0 "Never!"
 redgarhavn.1.b:0 "Just business, right?"

 redgarhavn.2.t:0 "[plunder_victim.GetName] accepts our offer"
 redgarhavn.2.d:0 "[plunder_victim.GetName] received our letter detailing the most generous terms to the spare the lives of their people in return for a fattened purse. They are quite reasonable, and have accepted our offer."
 redgarhavn.2.a:0 "Pleasure doing business with you."

 redgarhavn.3.t:0 "[plunder_victim.GetName] refuses our offer"
 redgarhavn.3.d:0 "[plunder_victim.GetName] received our letter detailing the most generous terms to the spare the lives of their people in return for a fattened purse. However, they have so brazenly declined our offer."
 redgarhavn.3.a:0 "Let us teach them fear."

 redgarhavn.5.t:0 "Paying With Steel"
 redgarhavn.5.d:0 "Our reavers infiltrated Konungrhavn as merchants, and have now seized control of the city."
 redgarhavn.5.a:0 "All according to plan."

 redgarhavn.6.t:0 "Konungrhavn Plundered!"
 redgarhavn.6.d:0 "We plundered Konungrhavn for everything it had, including plenty of ships and building materials to expand our harbor. With all the chaos ensuing, the king of Bjarnrik offered our reavers the town of Drekkodr to settle in, just to make them leave."
 redgarhavn.6.a:0 "What a bargain!"

 redgarhavn.7.t:0 "Bal Vroren Plundered!"
 redgarhavn.7.d:0 "We plundered Bal Vroren for everything it had, including entire armories worth of military supplies. They have ceded Isle Vroren to us in a desparate attempt to get our reavers to leave and settle there."
 redgarhavn.7.a:0 "What a bargain!"

 redgarhavn.8.t:0 "Celmaldor Plundered!"
 redgarhavn.8.d:0 "We plundered Celmaldor for everything it had, including many trade routes and secrets they had hidden away in vaults. They have ceded Eyegard to us in a desparate attempt to get our reavers to leave and settle there."
 redgarhavn.8.a:0 "What a bargain!"

 avnkaup.1.t:0 "Troll Hunter Captain Recruited"
 avnkaup.1.d:0 "As the new company of troll hunters sets out, a distinguished veteran volunteers to lead them."
 avnkaup.1.a:0 "Lead the way."

 avnkaup.2.t:0 "An Adventurer's Treasure"
 avnkaup.2.d:0 "We discovered the ruins of an old town. There wasn't much worth bringing back home, save for a chest, intricately locked using magic, found buried behind a small cottage on the outskirts."
 avnkaup.2.a:0 "We must find the key!"

 avnkaup.3.t:0 "The Search in Sashkras"
 avnkaup.3.d:0 "We have arrived at the spot indicated on the map and found a chest sitting on a small island in the middle of a lake that we suspect may contain the key we're looking for. However, it seems we'll have to clear a path to it through the ogres that have settled here."
 avnkaup.3.a:0 "Can't be too different from fighting trolls, right?"

 avnkaup.4.t:0 "A Key Acquired!"
 avnkaup.4.d:0 "We cleared out the ogres and managed to grab the key we've been looking for. Now to bring it to the mages, and get that treasure chest open."
 avnkaup.4.a:0 "I wonder what's inside?"

 avnkaup.5.t:0 "The Big Reveal"
 avnkaup.5.d:0 "Inside the chest we found a pile of gold, and a very detailed manual filled with information about various beasts, tips for surviving in the wilderness, training regimens, and nutritional advice."
 avnkaup.5.a:0 "How Useful!"

