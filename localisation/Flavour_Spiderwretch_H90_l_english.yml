l_english:

  #Left Column
  spiderwretch_federation_of_talls_title: "Federation of Talls"
  spiderwretch_federation_of_talls_desc: "A direct connection with the tall lake-humans has been established via the river. They seem willing to trade, and that is something we will capitalize on. A quick exchange of goods and words will improve our partnership for the future."

  spiderwretch_civilized_power_title: "Civilized Power"
  spiderwretch_civilized_power_desc: "After a long period of successful trade and diplomacy, strengthened by our common foe, the lake-humans have shared some valuable knowledge with us. In exchange we will send more of our workers to our workshop-embassies."

  spiderwretch_teaching_our_ways_title: "Teaching our Ways"
  spiderwretch_teaching_our_ways_desc: "Expanding our workshop-embassies in Qirnualaroq and Jögghlumo has made them more open about their secrets. Our workers are not only just working, but also providing us with valuable information from the inside. To continue our show of goodwill, we shall indulge them with more goods and techniques of production."

  spiderwretch_united_federation_title: "United Federation"
  spiderwretch_united_federation_desc: "Our trade partners in the lakes have suddenly been united under one banner; how curious. Will this be a problem for our economic and technological cooperation? Let us hold a meeting to decide how to deal with this."

  #CenterLeft Column
  spiderwretch_claim_the_lightlands_title: "Claim the Lightlands"
  spiderwretch_claim_the_lightlands_desc: "Our forces are ready, the entrance to our Spiderdens fortified. The time has come; the vast swathes of lands under the blue banner of the lakes will be ours. Charge forward, dear spiders, and ensnare all you see."

  spiderwretch_valley_of_ogres_title: "Valley of Ogres"
  spiderwretch_valley_of_ogres_desc: "As our scouts previously reported, there are some ogrish nations close to the entrance of our Spiderdens. They seem dumb, but they possess valuable skills and power. That could make them useful to us."

  spiderwretch_large_man_power_title: "Large-Man-Power"
  spiderwretch_large_man_power_desc: "With our ogrish companions brought into the fold, we can start to discuss our common enemy; the centaurs, wild nomadic horse-men of the Lightlands. The ogres have been fighting them for longer than us, and now that our armies have been properly established we can learn some things from them. In return we can teach them some strategies of our own."

  spiderwretch_smalls_among_bigs_title: "Smalls Among Bigs"
  spiderwretch_smalls_among_bigs_desc: "Our cooperation in war and production has been a delight to us all, even if we are the ones who gain the most from the deal. They are not very good at keeping secrets, but we are generous, and in turn we will expand our shared production."

  spiderwretch_geniuses_in_brutality_title: "Geniuses in Brutality"
  spiderwretch_geniuses_in_brutality_desc: "The ogre valley used to be splintered, internal conflicts clogging their unity. Now that is no longer the case. In their unity, and our technological advances, we have found a new type of warfare. The bigger the cannon the bigger the boom, but if the big cannon is caught we lose the boom. But the ogres have massive mammoths, and they can even carry cannons of their own. Why don’t we try something similar?"

  spiderwretch_silken_cities_title: "Silken Cities"
  spiderwretch_silken_cities_desc: "Since our alchemists succeeded in the creation of a hardened silk, we can now pursue an old dream of ours. Cities hanging from the ceiling, made from silk and suspended high above the hard rock of the floor. Our people can now live in greater comfort, and enjoy increased productivity that stems from our new designs."

  spiderwretch_human_innovation_title: "Human Innovation"
  spiderwretch_human_innovation_desc: "With our new dwellings of silk, the technological advancement of our people, and our workshops in the lakes finding more success every day, we are truly prospering. We stand on top of the Lightlands, looking down on the lake-humans who dwell within them. Our innovations and ideas rival their brightest minds, and in many ways surpass them as the superior thought."

  #Center column
  spiderwretch_the_lands_of_light_title: "The Land of Light"
  spiderwretch_the_lands_of_light_desc: "As we migrated to the cave-delta of the Eastern Reach, we discovered the outside, a large flat landscape with blinding light coming from a blue roof. Our tribal leaders seemed keen to stay in that cave-delta, as it was ripe with small caves and crevices to live and farm in. While we settle, we must explore the potential of the Lightlands. Send out our trusted regiments of Spiderscouts, one in each direction."

  spiderwretch_unify_the_crawlers_title: "Unify the Crawlers"
  spiderwretch_unify_the_crawlers_desc: "Our clan might have settled, and built out our existence, but our fellow crawlers still live scattered and primitively in the rest of the spiderdens. With our clan strong and evolving, we shall integrate all crawlers under our banner."

  spiderwretch_a_taste_for_blood_title: "A Taste for Blood"
  spiderwretch_a_taste_for_blood_desc: "Through luck, but mostly the hard skill of our spiderriders, we have bested the four-legged enemy multiple times. We not only have the ambition, but clearly also the capacity to control the lightlands. Although we have paid in blood, we have become smarter in the way of the plains."

  spiderwretch_blood_revealed_opportunity_title: "Blood-revealed Opportunity"
  spiderwretch_blood_revealed_opportunity_desc: "Now that our initial goals are under our control, we realize that we can do much more. Til now we have used the river to contact the lake-humans, but with our spiders we should have a direct border instead. Not only that, the same river goes just as far the other direction; what spoils hide down there?"

  spiderwretch_masters_of_silk_and_venom_title: "Masters of Silk and Venom"
  spiderwretch_masters_of_silk_and_venom_desc: "Using the new breeding facility, we have improved our silk-making substantially. Our capital is flourishing, and therefore we shall establish a central silkguild, responsible for the oversight of all of our other silkproducers."

  spiderwretch_unhindered_growth_title: "Unhindered Growth"
  spiderwretch_unhindered_growth_desc: "Our market and our ambitions have grown larger, and the facility of Weballey is no longer large enough. Since we now control the open vast lightlands, we should exploit that advantage. Moving our facility to a new and larger location will un-cap our ambitions. Better, larger and faster spiders will be bred forth and tamed for pets, mounts and silk."

  spiderwretch_a_life_in_suspension_title: "A Life in Suspension"
  spiderwretch_a_life_in_suspension_desc: "New spiders out of the facility have brought forth new ideas and needs. Their silk is seemingly harder than other silk. This sparks an idea. Silk that is usable in armor, housing and much more. The more powerful goblins of Pauzhrad demand higher living standards as well. Proceed with experimenting."

  spiderwretch_silken_infrastructure_title: "Silken Infrastructure"
  spiderwretch_silken_infrastructure_desc: "With our new hardened silk used widely, we have realized the potential of this research. While we may control the lightlands, and our spiders themselves having no problem traversing them, wagons and goblins on foot struggle. The ground is dusty, dry and it's hard to navigate. If we can make silk into hard armour, could we make it into a central road system?"

  spiderwretch_the_silk_road_title: "The Silk Road"
  spiderwretch_the_silk_road_desc: "With our heartlands a dense metropolis, our trade going across the continent and the pavement for our roads developed, only one question remains. When do we start building?"

  spiderwretch_unsightly_facility_title: "Unsightly Facility"
  spiderwretch_unsightly_facility_desc: "As trade and wealth flows in and out of our Pauzhrad and the growing city just outside it, the massive breeding facility has become a sore sight. Some foreign traders do not appreciate the to-them-scary variations of spiders in there. Trading is one of our primary economic goals, so let's oblige them; it needed to be renewed anyway. Let us build one just outside the flows of traders, but not too far away for our government to supervise."

  #Centerright column
  spiderwretch_potential_in_every_crevice_title: "Potential in Every Crevice"
  spiderwretch_potential_in_every_crevice_desc: "The cavedelta of the eastern reach was indeed very ripe with hundreds if not thousands of smaller caves and crevices to explore and develop. After our adventurers fully cleared them all, we realized how blessed we were. The proximity to the lightlands combined with the moist caves has brought forth exceptionally good conditions to grow cavegoods."

  spiderwretch_the_silk_hold_title: "The Silk Hold"
  spiderwretch_the_silk_hold_desc: "The crawlers are finally united under one banner. Our capital is rapidly developing, yet its name is lacking. Inspired by our old oppressors, although they failed to completely do that, we shall name the same way. This will also signal to our people that we are now our own rulers."

  spiderwretch_centralized_breeding_title: "Centralized Breeding"
  spiderwretch_centralized_breeding_desc: "With a central government controlling the matters of the spiderdens, we now have clear overview. Til now, all of our spiders have been tamed and partially bred differently per group of crawlers. By organizing and centralizing the research into spiders and their potential, we can elevate theirs and our potential several times. Establish a facility near our capital; there we shall create the future."

  spiderwretch_caravan_spiders_title: "Caravan Spiders"
  spiderwretch_caravan_spiders_desc: "The increased size of our facility paid off. Breeding spiders is a fast process, as their lifecycles are very short. This allowed our breeders to bring forth an ungodly large spider. Some chemicals might have been added too. A spider so large that a small town could live on its back. It is quite slow, unfortunately, so our generals were left disappointed. Our kartel leaders and shamans looked at it with power in their eyes. They saw the potential. This could usher in a new era of trade."

  spiderwretch_cross_roads_title: "Cross Roads"
  spiderwretch_cross_roads_desc: "The trade flows across the large plains effortlessly. With our caravans going out, new trading hubs have emerged, especially at the meeting point between the Bulwari road and the Lake Federation roads. Furthermore, the Bulwari trade-market has even larger potential than the lakes. This could easily be accommodated with some further investments."

  spiderwretch_securing_the_lightlands_title: "Securing the Lightlands"
  spiderwretch_securing_the_lightlands_desc: "We did it. We cast the large lands of light under our banner. No one on this side of the mountains can compare. We did what the centaurs failed to do, despite their clear advantage in knowledge of the plains. Of course we will utilize that knowledge ruthlessly to our own advantage. We might have won, but not learning from our friends and especially foes is fatal to any future."

  #Right column
  spiderwretch_brewing_venom_title: "Brewing Venom"
  spiderwretch_brewing_venom_desc: "They say venombrew is the strongest drink in all the lands. ‘Til now it was mostly produced in small amounts. We can now establish a proper brewery and distribute venombrew, mostly to our shamans of course. Average goblins would not know what to do with the expanded conscience."

  spiderwretch_rumours_of_a_mother_title: "Rumours of a Mother"
  spiderwretch_rumours_of_a_mother_desc: "In the area our ancestors have called Yidab's Nest, our explorers recently discovered a new branch of caves, seemingly not inhabited by anything anymore. Organize a scouting party to clear and explore these caves. They could hold unimaginable loot or goods."

  spiderwretch_organizing_religious_structure_title: "Religious Structure"
  spiderwretch_organizing_religious_structure_desc: "The new worship of Muta Kroozpauz is spreading rapidly, but different interpretations can cause trouble. Our shamans will establish a relatively unified view of Muta Kroozpauz. This will also help in our efforts to become more civilized to the outside world."

  spiderwretch_spider_theocracy_title: "Spider Theocracy"
  spiderwretch_spider_theocracy_desc: "Our nation is equal to the rest of the world: with our beliefs unified and our nation reformed, we can emphasize our advantages. We should establish a more centralized culture revolving around our goddess Muta Kroozpauz. Our shamans will be the leading authority on most matters including trade, faith and production."

  spiderwretch_expanding_our_religion_title: "Expanding our Religion"
  spiderwretch_expanding_our_religion_desc: "With the belief in Muta Kroozpauz spreading across the lightlands, our desire to adapt to the world increases. Large distances can cause differences and rifts over time. To combat this let's expand our religious system, and even include the natives' gods. Of course, they are lesser versions and not worth worshipping. This will empower the status of our Muta Kroozpauz."

  spiderwretch_order_of_the_spider_title: "Order of the Spider"
  spiderwretch_order_of_the_spider_desc: "Massive spiders, wealth flowing and the dominant nation on the continent: this can only mean one thing. We are the chosen of Muta Kroozpauz. We are her will on Halann and as such we dedicate ourselves to it. The Caravan spider shall be her representative in our trading order. We will establish trade routes for our caravan spider to traverse and sell wares to."

  spiderwretch_kroozpauz_realm_title: "Kroozpauz' Realm"
  spiderwretch_kroozpauz_realm_desc: "We have spread the realm of Muta Kroozpauz across the world. Silk, venombrew and much else is being praised and valued everywhere. We have truly succeeded. We must never forget our roots, the small insignificant clan in the caves of the back-then dark spiderdens, because that will keep us smart. Let us set up a central place of worship in the location we first discovered the truth. This temple shall serve to unite our people across the nation."


  #Events
  
  flavour_spiderwretch_riverpath_human_spider_exchange.t: "Riverpath Human-Spider Exchange" #By Serra
  flavour_spiderwretch_riverpath_human_spider_exchange.d: "Ever since we came into contact with the human nations that lie next to the big lakes of the plains, there has been an active effort made from both sides to make our ties, both defensive and commercial, strong and healthy. A steady influx of human citizens arrive at our trade posts and cities in the planes, with some even coming into the Reach! Of course, the opposite is also true, with goblin traders and thinkers making way for the cities under the promise of riches, both material and philosophical. As our alliance grows stronger, so do we, and it is clearer by the day that it will last a long, long time."
  flavour_spiderwretch_riverpath_human_spider_exchange.a: "Civilized friends, how nice."

  flavour_spiderwretch_and_they_teach_theirs.t: "And They Teach Theirs"
  flavour_spiderwretch_and_they_teach_theirs.d: "Our silkworkers have successfully established themselves among our human partners, both as businessgobs and friends. We have even begun hiring humans as part of the silk production, at least the ones who didn’t run away after seeing our majestic spiders. Probably jealous of the fact they don’t have their own."
  flavour_spiderwretch_and_they_teach_theirs.a: "An exchange of friendship and information."
 
  flavour_spiderwretch_ogre_spider_exchange.t: "Ogre-Spider Exchange" #By Serra
  flavour_spiderwretch_ogre_spider_exchange.d: "Hunger. Insatiable, endless hunger. Our people are brought together by this feeling, but while the ogres feel the more literal version of the word,our hunger is more esoteric in nature. Be it hunger for riches or knowledge, we move to soothe this ache as best we can, and the Alliance with the ogre kingdoms of the north has very much helped sate the hunger. The trading network established between Maghargma and the Reach has had the effect of causing the movement of large masses of ogres, moving south to our cities seeking fulfillment. As for us, we have extracted great knowledge of our new allies, both on warfare and on survival on the rough terrain of the mountainside. Soon enough, a big ogre population will have arrived at our gates, and we will be able to offer them the fill of their lives, on the condition that they help us wage warfare against the enemy they hate so much…"
  flavour_spiderwretch_ogre_spider_exchange.a: "A large feast for large friends."

  flavour_spiderwretch_still_friends.t: "Still Friends?"
  flavour_spiderwretch_still_friends.d: "Our relations with the previous human nations were great, but now that a unified government controls them all, things are unsure. While our trade partners are still on good terms with us, the rest seem less willing to treat us the same way. The significant cultural differences between the south and north means there’s a great deal of opinions regarding what to do to the “stragglers” living in “their” plains, and not all agree that goblins belong here as much as humans do."
  flavour_spiderwretch_still_friends.a: "Pressure our friends to spread a good word."
  flavour_spiderwretch_still_friends.b: "We would probably be better at managing them anyway."

  flavour_spiderwretch_common_enemy.t: "Common Enemy"
  flavour_spiderwretch_common_enemy.d: "The ogres have a longer history of fighting centaurs than us. They were outnumbered before, but now with the alliance between our people, we have our numbers and intellect, and their strength and… more strength? Either way, the centaurs’ reign of terror is at an end."
  flavour_spiderwretch_common_enemy.a: "Those horses won't gallop their way out of this."

  flavour_spiderwretch_not_very_secretive.t: "Not Very Secretive"
  flavour_spiderwretch_not_very_secretive.d: "The silk production we set up in the valley has been a success. Although the size difference between ogre and goblin are massive, we have gotten along surprisingly well. The average ogre, after you get past the fear of being picked up and eaten whole, or stepped on by accident, or grabbed and used as a club, is actually quite the friendly talker, with many of our workers discovering trade secrets without even a bit of theft."
  flavour_spiderwretch_not_very_secretive.a: "An exchange of friendship and information."

  flavour_spiderwretch_spiders_of_mass_destruction.t: "Spiders of Mass Destruction"
  flavour_spiderwretch_spiders_of_mass_destruction.d: "The ogres are large and strong; this comes to the surprise of absolutely no one with eyes. What does come as a surprise is the amount of ogre fighters that just grab entire cannons and use them like we use rifles. While us doing the same is obviously impossible, the idea of doing something similar with our spiders has come to mind. Simply cover an entire spider with enough armor to make an ogre blush, and a cannon on top. If the giant armored spider doesn’t send our enemies running, the explosions will."
  flavour_spiderwretch_spiders_of_mass_destruction.a: "Glad we are not our own enemy."

  flavour_spiderwretch_goblinic_golden_age.t: "Goblinic Golden Age"
  flavour_spiderwretch_goblinic_golden_age.d: "Our realm prospers, our nation is recognized and respected and our people thrive. With new technologies and ideas flooding in through our trade and connections, we have evolved our society. This is truly a golden era for our nation."
  flavour_spiderwretch_goblinic_golden_age.a: "Let us revel in our Glory."
  flavour_spiderwretch_goblinic_golden_age.b: "Let's wait with this."

  flavour_spiderwretch_new_or_ancient_cult.t: "A New or Ancient Cult?"
  flavour_spiderwretch_new_or_ancient_cult.d: "After the discovery of an old nest housing the remains of a massive spider, the old folktales and myths have solidified into a fledgling cult of their own. Now more and more of us worship Muta Kroozpauz, the great broodmother."
  flavour_spiderwretch_new_or_ancient_cult.a: "How have we not worshipped this before?"

  #EventChains
  flavour_spiderwretch_scouting_parties.t: "Scouting Parties"
  flavour_spiderwretch_scouting_parties.d: "This land of light, with the bright blue roof and the endless plains must host potential riches. Send out three groups, one will follow the Serpentspine's edge to the west, and the other two will go out into the seemingly endless stretch of land, one to the north and the other to the east. Explore the Lightland, discover its secrets, and uncover its riches. Then, upon returning, you will be rewarded."
  flavour_spiderwretch_scouting_parties.a: "Send them out, the Lightland is ours!"

  flavour_spiderwretch_scouting_parties_ogre.t: "Large Fat 2-legged Beasts with Clubs"
  flavour_spiderwretch_scouting_parties_ogre.d: "Our brave scouts crossed across some forested hills, and encountered large troll-like beasts. Both parties were initially confused (or scared in our party’s case), but these weird fat trolls were not hostile. After some initial problems communicating, they found out these weren’t the fattest trolls we’ve ever seen, and that this new people were called ogres. They lived in the hills where it was safe from whatever a “centaur” is, and these ogres were lumberjacks, not warriors. The scouts were invited further in, where they exchanged a few formalities with the local chief. This is a well established society, with great strength and a love for construction, and they would be of great help for us, or a formidable foe."
  flavour_spiderwretch_scouting_parties_ogre.a: "Great, friends. Great friends."
  flavour_spiderwretch_scouting_parties_ogre.b: "Great... rivals."

  flavour_spiderwretch_scouting_parties_centaurs.t: "Shattered Returnees"
  flavour_spiderwretch_scouting_parties_centaurs.d: "Only a few severely injured and scared souls returned from this party. They report the existence of strange four legged beasts, with a hairless dwarf attached where the head would be in something natural, but these were clearly some sort of magical abomination, and possessed strength matching even an orc. They trampled over our scouting party, and the few survivors managed to live by hiding under the bodies of the others, and had to struggle fleeing back towards our caves, travelling mostly at night and laying low during the day, but even this wasn’t entirely successful as their numbers thinned even further, as the plains provided very few hiding spots, a far cry from the caves where we live in. The scouts quietly accepted their reward, and swore to never step onto the plains again. These vile creatures must be the centaurs the ogres warned us about."
  flavour_spiderwretch_scouting_parties_centaurs.a: "Horrid beasts!"

  flavour_spiderwretch_scouting_parties_humans.t: "Civilized Folk" #By Serra
  flavour_spiderwretch_scouting_parties_humans.d: "After months of nothing but solitude with sparse skirmishes with the centaur menace in the mix, the scout party we sent through the opening of the reach was overjoyed to find a river. Apart from a source of water, it meant they were bound to find life much more commonly than in their previous march. After following this river away from the southern regions of the plains, they eventually found themselves at the shore of the biggest mass of water they had ever seen. The biggest mass of water any of their ancestors had ever seen, perhaps. An almost endless sight of blue, only interrupted by floating husks on the lake, and what seemed like a pretty big city far in the horizon. \nSoon enough, they had found a passage through the water. A small piece of land that separated the gargantuan mass into two, still massive formations. Not before long the scouts found themselves at the gates of a city, and a regiment of what looked like taller dwarves came down from the walls to meet them. After a long conversation with the guard, and an even longer one with the “mayor” of the city, an agreement was made between the nations to open communications and trade. This exchange was celebrated at home, since it meant that, at long last, our clan had an ally against the overwhelming strength of the centaurs."
  flavour_spiderwretch_scouting_parties_humans.a: "An enemy of our enemy is a friend!"

  flavour_spiderwretch_scouting_parties_humans_tt: "\nFor the next §Y75 years§! you may establish §G2§! extra outposts at §Ghalf§! the cost, allowing the plains to be sedentarized faster"


  flavour_spiderwretch_hardening_silk.t: "Hardening Silk"
  flavour_spiderwretch_hardening_silk.d: "Silk is an extremely plentiful resource for us, so if we could use it for construction and armor, it would be really convenient. The issue is, the last smartass who tried to do it ended up finding out how to cocoon himself in front of a spider and get eaten rather than anything useful. Silk is lightweight and resistant, but it’s also hard to work with as it is. We should experiment and find out different ways of working with it besides just sticking it to stuff. Or ourselves, in the now infamous case of Gorbol Spiderfood. Can you believe he was named that before he got eaten?"
  flavour_spiderwretch_hardening_silk.a: "It will be fine as it is, just like hanging bridges?"
  flavour_spiderwretch_hardening_silk.b: "Combine it with different venomous solutions perhaps?"
  flavour_spiderwretch_hardening_silk.c: "Try making it more rocky?"

  flavour_spiderwretch_hardening_silk_pure.t: "Pure Silk"
  flavour_spiderwretch_hardening_silk_pure.d: "Alright, who was the genius responsible for this one? We invented clothes. We already had clothes. We literally just made clothes out of silk. This is useless. I just stabbed a guy straight through his new shirt. He’s bleeding out on the floor right now. Looks good though so I think I’ll take the shirt."
  flavour_spiderwretch_hardening_silk_pure.a: "Extremely unusable, funnily enough."

  flavour_spiderwretch_hardening_silk_venom.t: "Venom-Silk"
  flavour_spiderwretch_hardening_silk_venom.d: "The idea was solid, for like, the first few seconds. We mix the silk with our strongest poisons and that’d mean anyone who gets near our armor dies. Apparently we forgot the part where WE are near our armor, because the poor bastard that got to test our venom-silk armor died on the spot after a minute of turning green and  two of turning purple. I don’t think this makes good armor, but it’ll be excellent trap material."
  flavour_spiderwretch_hardening_silk_venom.a: "Fatal for friends and foes alike."

  flavour_spiderwretch_hardening_silk_alkaline.t: "Rock-Silk"
  flavour_spiderwretch_hardening_silk_alkaline.d: "The main issue with silk from webs is it’s sticky and soft. While we know how to move on it without getting stuck, covering ourselves in it is an entirely different problem. Even if we could move, the silk would just slide out of the way of any weapon (We did test this, rest in peace Glabob Emptyskull). So the solution is to make it assume a shape and stay in it, much like a rock. So we started mixing a bunch of rocks with our silk and reached a bunch of results, the funniest one being one that just made the silk glow green and pretty, but we also found a mix of rocks that made it able to deflect even a hammer swinging at it AND stay in the shape we gave to it. "
  flavour_spiderwretch_hardening_silk_alkaline.a: "Sturdy and lightweight."

  flavour_spiderwretch_silky_road.t: "Silky Road"
  flavour_spiderwretch_silky_road.d: "Our trade friends across the lakes have been complaining lately. While we have made the path between our caves and their cities safe from the centaur raids, they’re still completely unpaved, meaning their caravans lose too much time bouncing up and down rather than going forward. We offered to sell them some of our carrying spiders, but for some reason none of them took the offer, so we’ll have to settle for making a road for them, and what better way to honor Muta Kroozpauz than to make it out of silk? We’ve already learned how to make armor out of silk, how hard could it be to make a consistent flat surface across several weeks of travel across the plains that’s also resistant to the elements and the weight of all their goods? Don’t answer that or I’m feeding you to a spider."

  flavour_spiderwretch_silky_road.a1: "Perhaps binding stones with silk?"
  flavour_spiderwretch_silky_road.a2: "Let us go with the stones and silk despite the cost."
  flavour_spiderwretch_silky_road.b1: "Liquids are the flattest surface, what if our silk was that?"
  flavour_spiderwretch_silky_road.b2: "Let us go with the liquid solution."
  flavour_spiderwretch_silky_road.c1: "The rock-silk could work here too?"
  flavour_spiderwretch_silky_road.c2: "Let us go with the good old rock-silk."

  flavour_spiderwretch_silky_road_silkstone.t: "Silkstone Pavement"
  flavour_spiderwretch_silky_road_silkstone.d: "Similarly to the roads common in the humans’ bigger cities, we could just take rocks and form a path from our caves towards their lands, but then improve their design by using silk from our greatest spiders to stick them together. This would create a very beautiful road, although it’d be costly using this much pure silk."
  flavour_spiderwretch_silky_road_silkstone.a: "Way too expensive for large-scale use. Better to use decoratively."
  flavour_spiderwretch_silky_road_silkstone.b: "We don't mind the cost."

  flavour_spiderwretch_silky_road_liquid.t: "Liquid Spidersilk"
  flavour_spiderwretch_silky_road_liquid.d: "After some experimenting, our breeders managed to fail successfully. After trying to make drinkable silk so our shamans could approach Muta Kroozpauz even better, they succeeded in making spiders that produce liquid silk! That only lasts for a few hours before turning rock solid. The volunteers for the project did not have the greatest time, but our builders sure did after they realized this could be used to make smooth floors very fast. We could use these spiders to make a very boring, but effective, road very fast."
  flavour_spiderwretch_silky_road_liquid.a: "We might have other options to look at first."
  flavour_spiderwretch_silky_road_liquid.b: "Sounds good, let's get those spiders going."

  flavour_spiderwretch_silky_road_alkaline.t: "Rock and Roads"
  flavour_spiderwretch_silky_road_alkaline.d: "Since we already know how to make silk hard, why fix what isn’t broken? Sure, making a road out of rock-silk IS basically the same as having to forge a shield the width of 4 carriages side to side for the length of half a continent, and our builders ARE already dreading the amount of work involved, but just think about how cheap it would be! We already have facilities that produce mass amounts of rock-silk, we just need to expand them a bit and we can get to building!"
  flavour_spiderwretch_silky_road_alkaline.a: "Something else has got to be better."
  flavour_spiderwretch_silky_road_alkaline.b: "A bit of work, but it is quite usable."

  flavour_spiderwretch_lightland_claimer.t: "Lightland Claimer"
  flavour_spiderwretch_lightland_claimer.d: "Our unique position and ambitions extends to the plains of light, as well as the dark caves of the Serpentspine. Our people rally to the cause, as long as we follow it ourselves. Should we betray this mission, we will lose the support."
  flavour_spiderwretch_lightland_claimer.a: "We will claim it all with spiders and blood!"

  flavour_spiderwretch_lightland_claimer_lost.t: "Our Goal Lost!"
	flavour_spiderwretch_lightland_claimer_lost.desc: "Our people's ambitions have been betrayed by our actions. They no longer feel rallied to the cause."
  flavour_spiderwretch_lightland_claimer_lost.a: "How could we do such a thing!"


