  spiderwretch_T2_spider_warfare: "Ensnaring the Plains"
  spiderwretch_T2_spider_warfare_desc: "Our nation, unlike most others, extensively uses spiders in all matters, from military to production to even beverages. By implementing centaur ideas and tactics into our government and military, we can learn so much more than previously thought. Although we beat them, their knowledge is still useful in controlling the plains."

  

  caravan_to_bulwar: "Bulwari Caravan"
  caravan_to_bulwar_desc: "Send the caravan to the rich lands of Bulwar."

  caravan_to_ogre_valley: "Ogre Valley Caravan"
  caravan_to_ogre_valley_desc: "Send the caravan to the hulking ogres."

  caravan_to_lake_fed: "Yarikhoi Caravan"
  caravan_to_lake_fed_desc: "Send the caravan to the wealthy lakes of Yarikhoi"


  flavour_spiderwretch_caravan_arrival_event.t: "Caravan Arrives!"
  flavour_spiderwretch_caravan_arrival_event.desc: "Interaction, trading and war are the main factors of building civilization. The arrival of a trade caravan is an opportunity every nation wishes for. Bustling markets, fresh new wares and lots of information. For the common people a caravan is more of a little festival, but for people in charge, it smells of potential. Several factions have approached us for the more hidden kind of trading."
  flavour_spiderwretch_caravan_arrival_event.a: "Foreign local influence."
  flavour_spiderwretch_caravan_arrival_event.b: "Utilize the Caravan Spider for our hosts."
  flavour_spiderwretch_caravan_arrival_event.c: "Spider rampages."
  flavour_spiderwretch_caravan_arrival_event.d: "Tell us of your city."
  flavour_spiderwretch_caravan_arrival_event.e: "Naval rights, on sea and river."
  flavour_spiderwretch_caravan_arrival_event.f: "Welcome foreign land developers."
  flavour_spiderwretch_caravan_arrival_event.g: "Have our engineers cooperate."
  flavour_spiderwretch_caravan_arrival_event.h: "Insults to our way of life!"


  flavour_spiderwretch_caravan_pulse_eventstarter.t: "Caravan Pulse Starter"
  flavour_spiderwretch_caravan_pulse_eventstarter.desc: "Starts the 2 pulses during caravan. This event should be hidden."
  flavour_spiderwretch_caravan_pulse_eventstarter.a: "Either bad then good, or good then bad."

  flavour_spiderwretch_caravan_pulse_event_defaultbad.t: "Default Bad Pulse"
  flavour_spiderwretch_caravan_pulse_event_defaultbad.desc: "This one spawns 1 of the 3 bad events by default. If relations are good then it's a 50/50 between good and bad. This event should be hidden."
  flavour_spiderwretch_caravan_pulse_event_defaultbad.a: "Lake Federation"
  flavour_spiderwretch_caravan_pulse_event_defaultbad.b: "Bulwar"
  flavour_spiderwretch_caravan_pulse_event_defaultbad.c: "Ogre Valley"

  flavour_spiderwretch_caravan_pulse_event_defaultgood.t: "Default Good Pulse"
  flavour_spiderwretch_caravan_pulse_event_defaultgood.desc: "Spawns one of 3 good events by default. If relations are bad, then it's a 50/50 between good and bad events."
  flavour_spiderwretch_caravan_pulse_event_defaultgood.a: "Lake Federation"
  flavour_spiderwretch_caravan_pulse_event_defaultgood.b: "Bulwar"
  flavour_spiderwretch_caravan_pulse_event_defaultgood.c: "Ogre Valley"

  flavour_spiderwretch_caravan_bad_event1.t: "Caravan Assaulted!"
  flavour_spiderwretch_caravan_bad_event1.desc: "When travelling across the plains, it is normally hard to not spot everything far in advance. This time some bandits almost succeeded in surprising us. Our scouts on the high back of the giant spider spotted them in time to react. With only a few minutes to organize a response, our leaders wonder which is the right one"
  flavour_spiderwretch_caravan_bad_event1.a: "Bribe them into our ranks."
  flavour_spiderwretch_caravan_bad_event1.b: "Let them."
  flavour_spiderwretch_caravan_bad_event1.c: "Retreat momentarily."
  flavour_spiderwretch_caravan_bad_event1.d: "Retreat behind a nearby town."
  flavour_spiderwretch_caravan_bad_event1.e: "Retreat temporarily."
  flavour_spiderwretch_caravan_bad_event1.f: "Capture and force them into garrisons."
  flavour_spiderwretch_caravan_bad_event1.g: "Negotiate with them."

  flavour_spiderwretch_caravan_bad_event2.t: "Caravan Spider Sick"
  flavour_spiderwretch_caravan_bad_event2.desc: "As the traders woke up they noticed something was off about the caravan spider. When trying to load it, the spider resisted and behaved erratically. It seemed agitated. The tamers expressed concerns of a potential illness. As the early morning drew by with no progress on the caravan, the spider seemed increasingly aggressive as well. It might rampage. A spider of that size could level towns if it did that. Imagine 8 legs, each the size of a guard tower, running over a building. Each leg could destroy a house alone."
  flavour_spiderwretch_caravan_bad_event2.a: "Can't stop won't stop."
  flavour_spiderwretch_caravan_bad_event2.b: "We know just how to cure it."
  flavour_spiderwretch_caravan_bad_event2.c: "Contain it as much as possible."
  flavour_spiderwretch_caravan_bad_event2.d: "Trampled tradestations and traumatized traders."

  flavour_spiderwretch_caravan_bad_event3.t: "Corruption in our business"
  flavour_spiderwretch_caravan_bad_event3.desc: "Corruption is the downfall of many potential projects. Our caravan has suffered the same. A group of our merchants and their guards decided to snag some of the loot for themselves. Our caravan leaders wanted to immediately find and punish them, but feared it would cost important resources."
  flavour_spiderwretch_caravan_bad_event3.a: "Leave them be."
  flavour_spiderwretch_caravan_bad_event3.b: "Send out hunters."
  flavour_spiderwretch_caravan_bad_event3.c: "Legislate harder punishments."
  flavour_spiderwretch_caravan_bad_event3.d: "Hold the rest of caravan responsible."

  flavour_spiderwretch_caravan_good_event1.t: "Skilled People Join Our Caravan"
  flavour_spiderwretch_caravan_good_event1.desc: "As our caravan stopped at a smaller town to rest for the day, we encountered a small group of foreign traders and skilled civilians also laying camp. After a good night at the tavern, and plenty of business talk, they tell us they are looking for employment. As it so happens, our nation is open to skilled individuals. Give them a letter of approval, and let them integrate themselves."
  flavour_spiderwretch_caravan_good_event1.a: "They possess economic know-how."
  flavour_spiderwretch_caravan_good_event1.b: "Let their skilled guards join our garrisons."
  flavour_spiderwretch_caravan_good_event1.c: "Their knowledge will enrich us."
  flavour_spiderwretch_caravan_good_event1.d: "Let them settle along the Silk Road."
  flavour_spiderwretch_caravan_good_event1.e: "Integrate them into local communities."
  flavour_spiderwretch_caravan_good_event1.f: "Let them settle along the Silk Road."
  flavour_spiderwretch_caravan_good_event1.g: "These ogres sure know how to man (Ogre?) a turret."
  flavour_spiderwretch_caravan_good_event1.h: "Let them settle in the Silk Cities."

  flavour_spiderwretch_caravan_good_event2.t: "Smooth Journey"
  flavour_spiderwretch_caravan_good_event2.desc: "The journey proceeds well. Great weather, the wind in our backs and no accidents or mischief happened during travels. High moods across the board."
  flavour_spiderwretch_caravan_good_event2.a: "Prosperity for all."
  flavour_spiderwretch_caravan_good_event2.b: "Wars need fuel."
  flavour_spiderwretch_caravan_good_event2.c: "Treasure fleet passing by."
  flavour_spiderwretch_caravan_good_event2.d: "Arrange a festival!"
  flavour_spiderwretch_caravan_good_event2.e: "Sell to Golden Highway traders."
  flavour_spiderwretch_caravan_good_event2.f: "Elven artisans with spidersilk."
  flavour_spiderwretch_caravan_good_event2.g: "Silk for workers."

  flavour_spiderwretch_caravan_good_event3.t: "Another Caravan Encountered"
  flavour_spiderwretch_caravan_good_event3.desc: "Trade flows in multiple directions at once most of the time. So it did this time too. Our caravan encountered a different trade caravan, although without a massive spider like us, travelling in the opposite direction. They were initially scared by the massive spider, but after some communication their fear has vanished. They seem interested in our wares, and were planning to sell their own in the Silk Cities. Let's stop for the day and rest with them."
  flavour_spiderwretch_caravan_good_event3.a: "Can they handle venombrew?"
  flavour_spiderwretch_caravan_good_event3.b: "Merchants, no matter the race."
  flavour_spiderwretch_caravan_good_event3.c: "Humans really are a jack-of-all-trades."
  flavour_spiderwretch_caravan_good_event3.d: "Sailors, merchants... what's the difference?"
  flavour_spiderwretch_caravan_good_event3.e: "How to rally different causes into one."
  flavour_spiderwretch_caravan_good_event3.f: "Elves with centuries of trading experience."
  flavour_spiderwretch_caravan_good_event3.g: "Ogres really possess huge strength."
  flavour_spiderwretch_caravan_good_event3.h: "near and dear, but so easy to press prices with."



