l_english:

#Missions
 L22_the_return_to_sigilan_title: "The Return to Sigilan"
 L22_the_return_to_sigilan_desc: "We must return to our lost capital."

 L22_a_kingdoms_pride_title: "A Kingdom's Pride"
 L22_a_kingdoms_pride_desc: "Sigilan is the Pride of the Binwarji and it shall be the center of a new empire, we must make sure its greatness is shown."

 L22_jewel_of_fangaula_title: "Jewel of Fangaula"
 L22_jewel_of_fangaula_desc: "Ever since we recovered Sigiland we have done nothing but rebuild it to what it once was, but if it is to be the capital of a third empire then it must be even greater than before."

 L22_a_time_of_reunion_title: "A Time of Reunion"
 L22_a_time_of_reunion_desc: "After the civil war our estates have become very disloyal, if we are to rule we must regain their favor."

 L22_silver_blood_title: "Silver Blood"
 L22_silver_blood_desc: "The Silver Mine of Warijafara has remained closed for too long, we must re open it."

 L22_restore_the_atoners_title: "Restore the Atoners"
 L22_restore_the_atoners_desc: "The Original Gods Atoners served to control the Planetouched population. In an effort to mend the mistakes of our past we restore them in a new form."

 L22_to_earn_our_place_title: "To Earn Our Place"
 L22_to_earn_our_place_desc: "To forge a Third and Final Fangaula Empire, one to truly last, we must make sure it is united on the inside."

 L22_aros_pride_title: "Aro's Pride"
 L22_aros_pride_desc: "Aro forged the first Fangaulan Empire and remade our people into what we are now. And so, we must remake our kin anew so we will be worthy of ruling."

 L22_end_of_the_struggle_title: "End of the Struggle"
 L22_end_of_the_struggle_desc: "The times of struggle have come to an end and we are now beginning to rebuild our kingdom."

 L22_hear_all_evils_title: "Hear All Evils"
 L22_hear_all_evils_desc: "Our realms demise was not inevitable, if we were to listen and fix the issues that the people were having much could have been prevented."

 L22_sons_of_the_sands_title: "Sons of the Sands"
 L22_sons_of_the_sands_desc: "We have had a long and complicated history with the Ogres. The relations they have had with them proved problematic in the past."

 L22_her_lost_tribe_title: "Her Lost Tribe"
 L22_her_lost_tribe_desc: "Biakatas Tribe, the Mukarron, are still around. In an effort to truly become an Empire of all Fangaula we can seek to invite them into our land."

 L22_fit_for_an_empire_title: "Fit For An Empire"
 L22_fit_for_an_empire_desc: "To crown ourselves emperors we must first acquire a crown worthy of said title."

 L22_my_will_be_done_title: "My Will Be Done"
 L22_my_will_be_done_desc: "Here where the second Empire began is that we meet once more. Long have we come to restore our realm and now it is time for a new one to be born"

 L22_prince_of_no_land_title: "Prince of No Land"
 L22_prince_of_no_land_desc: "Our nobility, descendants from the one of the old Empire, lacks the land they claim to rule. If we are to reclaim set land we need to re-organize them."

 L22_secure_the_homeland_title: "Secure the Homeland"
 L22_secure_the_homeland_desc: "Janama has been the heartland of our realm and people for centuries, if we are to rebuild we must secure it against any and all threats."

 L22_heirs_to_the_chains_title: "Heirs to the Chains"
 L22_heirs_to_the_chains_desc: "We have had a long and complicated history with the Gnolls. The relations they have had with them proved problematic in the past."

 L22_wind_breakers_title: "Wind Breakers"
 L22_wind_breakers_desc: "Since the fall of the Empire Kubaci has become an area of rising warlordism, with the humans and gnolls of the wind fighting for dominance."

 L22_biakatas_might_title: "Biakata's Might"
 L22_biakatas_might_desc: "Like Biakata once did, we must now establish ourselves as not only the strongest nation in Fangaula but also our corner of the world."

 L22_a_claim_to_stake_title: "A Claim to Stake"
 L22_a_claim_to_stake_desc: "Our realm is secured so now we look outwards, to reclaim the lost land of the princes and the Empire itself."

 L22_across_the_jungle_title: "Across the Jungle"
 L22_across_the_jungle_desc: "Across the jungle the city of Kunolo lies, the other great jewel of Fangaula. If we are to truly crown ourselves emperors we must see it under our hand."

 #Events
 binwarji.1.t: "The Traveling Court"
 binwarji.1.d: "In our pursuit to make sure our realm does not crack again we have searched for ways to keep our populace content. What has been made obvious from the get go is that there are too many issues for the king and the court to listen to all at the same time.\n\nAs a solution to this various members of the estates have come together with a proposal, a traveling court that will listen to the demands of the people. The Heir is to travel with the court to receive the feedback, help the locals accordingly and boost his popularity among the locals."
 binwarji.1.a: "Good Idea"

 binwarji.2.t: "Biakata's Own"
 binwarji.2.d: "In our pursuit to make sure our realm does not crack again we have searched for ways to keep our populace content. What has been made obvious from the get go is that there are too many issues for the king and the court to listen to all at the same time.\n\nAs a solution to this various members of the estates have come together with a proposal, a traveling court that will listen to the demands of the people and elevate their most important requests to the king."
 binwarji.2.a: "Welcome Back"

 binwarji.3.t: "To Forge A Worthy Crown"
 binwarji.3.d: "We want to reforge the crown of Binwarji into a cool piece that can serve as the crown of a new empire."
 binwarji.3.a: "Reforge it"

 binwarji.4.t: "Meeting of the Twelve Spears"
 binwarji.4.d: "The high princes of Binwarji and the King meet at Tannifila Oka.\nHere a ceremony takes place where the king addresses what Binwarji has gone through, how much they have grown as a realm and the victories that lead them here.\n\nA procession marches forward to crown the king with the new Imperial Crown, giving birth to the Third Fangaula Empire"
 binwarji.4.a: "A New Age Has Come"


 #Court of Fangaula Events
 binwarji.100.t: "The Court of Fangaula"
 binwarji.100.d: "Were shall we locate the court and our heir (The heir is coming with them idk if that has been made clear)"
 binwarji.100.a: "Sigilan"
 binwarji.100.b: "Zitan Tomon"
 binwarji.100.c: "Woloso"
 binwarji.100.e: "Jiridese So"
 binwarji.100.f: "Sinjetaso"
 binwarji.100.g: "Izini"
 binwarji.100.h: "Kunolo"
 binwarji.100.i: "Jagab Faru"
 binwarji.100.j: "The court is fine where it is now"

 binwarji.102.t: "[Root.GetName] Ask for Investment"
 binwarji.102.d: "The people from [Root.GetName] want economic aid to help their city."
 binwarji.102.a: "Help them"
 binwarji.102.b: "We cannot afford to help them"

 binwarji.103.t: "Advisor Disrespects [Root.GetName]"
 binwarji.103.d: "The people of [Root.GetName] have come to ask us to fire (Advisor) because of his comments."
 binwarji.103.a: "Fire the Advisor"
 binwarji.103.b: "Try to reach a middle ground"
 binwarji.103.c: "Defend the Advisor"

 binwarji.104.t: "[Root.GetName] Priest Wants Help"
 binwarji.104.d: "Priest from [Root.GetName] want us to help them build a temple."
 binwarji.104.a: "Help them"
 binwarji.104.b: "Expand the city temple complex"
 binwarji.104.c: "Deny it, it is not needed"

 binwarji.105.t: "[Root.GetName] Upper Class Wants Jewelry"
 binwarji.105.d: "The upper class of [Root.GetName] wants us to secure them a route to a gem mine so they can produce jewelry."
 binwarji.105.a: "Sure"
 binwarji.105.b: "We cannot afford to help them"

 binwarji.106.t: "[Root.GetName] Garrison Wants Support"
 binwarji.106.d: "[Root.GetName] defenders want help enlisting people."
 binwarji.106.a: "Send them Men"
 binwarji.106.b: "Enlist Locals"
 binwarji.106.c: "We have no time for them"

 binwarji.107.t: "[Root.GetName] Wants Help With Food Supply"
 binwarji.107.d: "[Root.GetName] is starving, they need help."
 binwarji.107.a: "Help them get Supplies"
 binwarji.107.b: "Use our own supplies"
 binwarji.107.c: "We cannot help them"




 #Tooltips
 L22_binsplosion_ended_TT: "We have survived or prevented the '§YEnd of Authority§!' disaster"
 L22_healing_cracks_modifier_TT: "[Root.GetName] gets '§YHealing the Cracks§!' for §Y10§! years base and this duration is increased by §G5§! per break-away state we have managed to contain or defeat during the disaster, giving the following effect:\nYears of Separatism: §G-5§!\nManpower Recovery Speed: §G+10.0%§!"
 L22_avoided_disaster_yes_TT: "£yes£ Because we avoided the disaster entirely we get:"
 L22_avoided_disaster_no_TT: "£no£ If we had avoided the disaster entirely we would have gotten:\n§G+20§! Prestige.\n§G+200§! Splendor."
 L22_province_has_renaissance_TT: "If the §YRenaissance§! is present in Sigilan or adopted by our country we will gain §G15§! §YPrestige§! and §G100§! §YSplendor§!."
 L22_silver_blood_alt_reward_no_TT: "£no£ If we have upgraded the center of trade in §YWarjifara§! to at least level §Y2§! this reward will be §Gdoubled§!:"
 L22_silver_blood_alt_reward_yes_TT: "£yes£ Because we have upgraded the center of trade in §YWarjifara§! to level §Y2§! this reward will be §Gdoubled§!:"
 L22_free_planetouched_agenda_TT: "Completing this mission will count as resolving an §Yagenda§! §Gin favor§! of the §YPlanetouched§!."
 L22_agendas_give_PP_TT: "Completing §YEstate Agendas§! now grants §G20§! §YSplendor§! and §G10§! §YPower Projection§! decaying by §Y-2§! per year, up to §Y30§! Power Projection total."
 L22_full_idea_group_TT: "Has completed an §YIdea Group§!"
 L22_fangaula_court_removes_negative_trait_TT: "Once per ruler, completing at least §Y3§! Court of Fangaula requests will from now on §Gremove one of our rulers negative traits§!."
 L22_aro_worship_early_TT: "Unlock the ability to worship §YAro§! regardless of if we own [390.GetName]."
 L22_can_worship_god_earlier_TT: "Has gained the ability to worship this god regardless of owning their holy site"
 L22_enable_court_of_fangaula_TT: "Enable the §YCourt of Fangaula§! system.\n\nThe court will travel around §YFangaula§! to specific cities to talk with the locals, hear their troubles and return to us every §Y5§! years to inform us of what they have gathered, §Yit will be up to us to decide if we want to help them or not§!.\nEach city has its own §Ymodifier§! associated with it, moving the court to that city will grant it to us as well as an §Yarea buff§! for as long as the court remains there.\n\nUnlock a decision allowing us to migrate the court once every §Y10§! years."
 L22_court_of_fangaula_helped_TT: "§GThe Court of Fangaula helped the locals.§!"
 L22_architect_discount_TT: "§gBecause of our rulers eye of architecture this cost is §GHalfed§!.§!"
 L22_zealot_discount_TT: "§gBecause of our rulers dedication to the faith this reward is §GDoubled§!.§!"
 L22_leader_discount_TT: "§gBecause of our rulers ability to inspire the troops this cost is §GHalfed§!.§!"
 L22_ogres_settle_TT: "We will invite the Dunesole to settle down in our land."
 L22_ogre_embrace_TT: "Every owned or subject owned province with an §YOgre Population§! will gain '§YAn Embracing Crown§!' province modifier for §Y30§! years, giving the following effect:\n§G-2§! Local Unrest\n§G+2.0%§! Local Missionary Strenght"
 L22_janama_ogre_purge_TT: "The ogres of Janama will be rounded up and move to Makan."
 L22_if_ogre_tolerant_TT: "§YIf we decide to mend our relations with the Dunesole Ogres:§!"
 L22_if_ogre_racist_TT: "\n§YIf we decide to restore the old order over the Dunesole Ogres:§!"
 L22_the_return_of_the_mukarron_TT: "We will help the Mukarron people re-establish themselves in our land.\n§YDepending on our relations with the Gnoll they may get more or less land.§!\n\nAll §YMukarron§! culture provinces in the §YJanama Region§! will gain '§YThe Return of the Lost Tribe§!' for the rest of the game, giving the following effect:\n§G-10.0%§! Local Minimum Autonomy\n§G-15.0%§! Local Regiment Cost"
 L22_biakata_worship_early_TT: "Unlock the ability to worship §YBiakata§! regardless of if we own [6098.GetName]."
 L22_every_gnoll_province_TT: "Every owned or subject owned province with §YWindhowler Gnoll§! culture has a §Y50%§! chance of gaining §G+1§! §YBase Manpower Development§!."
 L22_every_ogre_province_TT: "Every owned or subject owned province with §YDunesole Ogre§! culture gains §G+1§! §YBase Production Development§!."
 L22_if_we_had_been_tolerant_gnolls_TT: "If we are tolerant to §YGnolls§! we will gain:"
 L22_if_we_had_been_tolerant_ogre_TT: "If we are tolerant to §YOgre§! we will gain:"
 L22_landless_nobility_TT: "Completing a §YNoble Estate Agenda§! will grant §G-5.0%§! §YLiberty Desire§! to all subjects for §Y10§! years or reset the duration, this modifier can be stacked up to a maximum §G-20.0%§! §YLiberty Desire§!."
 L22_heartland_secured_TT: "\nEvery province in the §YJanama Region§! will lose §G-20§! §YDevastation§! and gain '§YHeartland Under Control§!' province modifier for §Y25§! years, giving the following effects:\n§G-10.0§! Local Development Cost\n"
 L22_gnoll_embracing_crown_TT: "Every owned or subject owned province with Windhowler Gnoll culture will gain '§YAn Embracing Crown§!' province modifier for §Y30§! years, giving the following effect:\n§G-2§! Local Unrest\n§G+2.0%§! Local Missionary Strenght"
 L22_gnollish_purge_TT: "Purging §YGnolls§! is now §GFree§!.\nEvery non-Gnoll subject country will start purging §YGnolls§! for §GFree§!."
 L22_if_gnoll_tolerant_TT: "§YIf we decide to mend our relations with the Windhowler Gnolls:§!"
 L22_if_gnoll_racist_TT: "\n§YIf we decide to purge these lands of the Windhowler Gnolls:§!"
 L22_if_racist_purge_TT: "\n§YIf we have chosen to maintain hostile relations with the Gnolls we may purge them from Kubaci once and for all.§!"
 L22_restored_high_princes_TT: "Landless no longer, the §YHigh Princes§! of Fangaula will be restored.\n\nCompleting a §YCourt of Fangaula§! request now grants our subjects the '§YFairest Among All Kings§!' country modifier for §Y10§! years, giving the following effects:\n§G+25.0%§! Manpower Recovery Speed\n§G+20.0%§! Goods Produced Modifier\n"
 L22_fairest_king_effect_TT: "Every subject country gains the '§YFairest Among All Kings§!' country modifier for §Y10§! years, giving the following effects:\n§G+25.0%§! Manpower Recovery Speed\n§G+20.0%§! Goods Produced Modifier"
 L22_hollow_provinces_system_TT: "Enable the §YHollow Princes§! System.\nFrom now on, every subject country of §YWest Sarhaly§! culture will become a §YHollow Principality§! and lose any aggressive expansion and negative modifier from declaring war on them.\nHollow Principalities are §Ymonarchies ruled by Binwarji nobles§!, they contribute §Rless forcelimit§! and §Rno tributary income§! but are much §Gmore loyal§! and do §Gnot take up a diplomatic slot§!.\nHollow Principalities are illegitimate in nature and thus gain the following negative effects for themselves:\n§R+2.00§! Global Unrest\n§R-1§! Number of Accepted Cultures\n§R-1.00§! Yearly Legitimacy\n\nCompleting §YNoble Estate Agendas§! will grant us a §GSubjugation Casus Belli§! against a neighboring or subject neighboring country of §YWest Sarhaly§! culture.\n\nGain permanent claims on every province in the §YFangaula Superregion§! not owned by a §YWest Sarhaly§! culture country."
 L22_random_ndurubu_advisor_TT: "Gain a random skill §Y3§! military advisor for Ndurubu hereditage, this advisor is §G50%§! cheaper for your country to employ."
 L22_kubaci_purge_TT: "Every §YGnoll§! provinces in §YKubaci§! will be §RPurged§!, changing their culture to §YNdurubu§!, religion to §Yours§!, and gaining §R20§! §Ydevastation§!."
 L22_fangaulan_pantheon_aro_worship_TT: "Has worshiped §YAro§! at least once"
 L22_fangaulan_pantheon_biakata_worship_TT: "Has worshiped §YBiakata§! at least once"


