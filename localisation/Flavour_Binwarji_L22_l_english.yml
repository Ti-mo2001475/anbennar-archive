 estate_planetouched_L22_atoners_will_desc: "In an effort to repair the mistakes of the past the highest authority of Planetouched matters has been left to a Planetouched organization, the Gods Atoners."

 L22_estate_nobles_landless_nobility: "Landless Nobility"
 L22_estate_nobles_landless_nobility_desc: "The Princes of Binwarji descend from the Empire itself, they held claims to lands that they now do not hold.\nThis is where the title of "Hollow Princes" comes from.\nWe have made an agreement with this princes to help them regain their birthright in exchange of their loyalty."

