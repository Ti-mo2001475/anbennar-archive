 court_of_fangaula_decision_title: "Move the Court of Fangaula"
 court_of_fangaula_decision_desc: "In our pursuit to make sure our realm does not crack again we have search for ways to keep our populace content. What has been made obvious from the get go is that there are to many issues for the king and the court to listen to all at the same time.\n\n§gThe highlighted provinces are all those that we could choose to send the Court of Fangaula to should we own them."