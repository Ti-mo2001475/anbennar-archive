 L22_enable_court_of_fangaula_TT: "Enable the §YCourt of Fangaula§! system.\n\nThe court will travel around §YFangaula§! to specific cities to talk with the locals, hear their troubles and return to us at the end of the year to inform us of what they have gathered, §Yit will be up to us to decide if we want to help them or not§!.\nEach city has its own §Ymodifier§! associated with it, moving the court to that city will grant it to us as well as an §Yarea buff§! for as long as the court remains there.\n\nUnlock a decision allowing us to migrate the court once every §Y10§! years."
 L22_court_of_fangaula_helped_TT: "§GThe Court of Fangaula helped the locals.§!"
