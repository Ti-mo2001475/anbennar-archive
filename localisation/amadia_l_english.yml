 amadia_early_damestear: "Amadian Damestear" #Anb Event Modifiers
 
 amadia.3.t: "The God's Visage"
 amadia.3.desc: "When the Ruin of Aelantir split our lands apart, so did our gods. Fragmented into various visages by the Ruin, the gods now represent a fragment of their original form, each with their own personalities and motivations. Like many things in Amadia we must leave our chosen visage to the hands of fate and hope to deal with which we're given."
 amadia.3.a: "The Sun, the Moon, or something Beyond..."
 amadia.3.b: "We must better ourselves, no matter our form."
 amadia.3.c: "Will we flourish, wither, or change into something new?"
 amadia.3.d: "The ideal person is never truly out of reach."
 amadia.3.e: "The storms are never predictable."
 amadia.3.f: "Knowledge, but of what kind?"
 amadia.3.g: "Whose side shall we take?"
 amadia.4.t: "A New Name For A Strange Land"
 amadia.4.desc: "Some said we were mad, that the Shuvüüsh have never been a seafaring people. That our destiny laid in the conquest of Haless, not some trans-oceanic farce.\n\nThey were probably right. It was not easy to get to these strange lands, but we were determined. Who was going to tell us no? Travelers spoke of a land rich in gold, damestear, precursor relics and more. Why should these not be ours?\n\nOur storytellers recall our first meetings with the natives, following the Banche caravans inland to the great cities of Lake Chakantu. Perhaps it is these stories, warped beyond all recognition from the journey home, that inspired our great migration. Our ancestors had survived the Husuusing, the Ash March. Now we spoke of the Hekuudsuusing, the Great March. A new home for our people, richer than our wildest dreams.\n\nOf course, it was not quite as great as many had hoped. Our bird companions struggled with the new terrain, while our riders struggled to control them during their constant bickering with the Banche's own seabirds and vultures. Our traditional ways of life, while suitable in the more arid south, were hard to adapt to the jungles that stood between the coast and the wealth inland. Today we sit around fires and ask why we are here, so far from home. But for those who were born here, Haless is a distant concept.\n\nIn our tongue Guwaad means something foreign or strange, and never have we said it more than we do here. Amadia is the name this land has earned in most tongues. It is not known who came up with it first, but our nation here has become known by a new name."
 amadia.4.a: "We are Guwaamadia!"
 amadia.4.b: "I, for one, am fond of [Root.GetName]."
 
 amadia_flavour.1.t: "Shipwrecked Elves"
 amadia_flavour.1.d: "It was the break of dawn when we found it. It was a ship by the looks of it, but unlike any we had seen before. Bigger than five of our own, with multiple sails and rows of oars at its sides; the strange behemoth looked intimidating even as it stood wrecked against the stony shore.\n\nWhen we finally gathered the courage to come closer and investigate, we found something yet stranger. Crates and barrels of food, spices, and all manner of goods were littered all around the vessel; in a clearing not far from the shore, a small group of elves were attempting to make camp. Visibly well armed, but few in number, they looked damp and weathered from last night’s storm. Their skin was as blue as the ocean nearby, and their metal armor and spears glowed red with the morning sun.\n\nWhen the Blue Ones finally spotted us, they quickly came together and readied their weapons, but as it became apparent we meant them no harm, they attempted to speak with us. But try as we might to understand, we could not make sense of their strange tongue. “Key Dano”, they all kept saying, but then one young elf knelt down, took some sand in his hand, and started loudly blowing it from his palm. He then pointed to the blue skin on his forearm and the others pointed to the south, and then to the boat. At last we started to understand - they spoke of blue deathwinds in the south.\n\nIt took a lot of drawing in the sand, pointing fingers, and shouting, but we managed to piece together their story. The Blue Ones came from the lands in the south. They were shipping their cargo overseas when a sudden deathwind storm appeared. They attempted to flee for their lives and were blown off course far to the north, where their ship was wrecked on our shore.\n\nWhile the damage is fairly minor, the Blue Ones are too few to salvage the ship on their own. Their captain now stands before our [Root.Monarch.GetTitle] and asks for our help in repairing it so they can return to their home. After hearing their story, [Root.Monarch.GetName] looked at the blue elf for several long moments. Finally, [Root.Monarch.GetSheHe] turned to [Root.Monarch.GetHerHis] advisors.\n"
 amadia_flavour.1.a: "Help them repair the ship and send one navigator to guide them home."
 amadia_flavour.1.b: "These elves can’t be trusted. Kill them and take their armor and loot!"

 amadia_flavour.2.t: "The Blue Ones Return"
 amadia_flavour.2.d: "Nearly a year after their fated shipwreck, the marvelous ship of the Blue Ones was spotted on our shores once more. This time, however, the crew and cargo were much larger. Among the crew was the navigator who went with them, and he told us of the wonders he saw in their homeland.\n\nThe Blue Ones call themselves “Kheionai”, he said, and their people live on an island far to the south, in the lands where deathwinds are a common sight. Their stone cities are protected by some unknown magic, and are full of wonders unlike any he had ever seen. In the year he spent with them, he learned much of their language and customs, and of their love for sailing and trade.\n\nLikewise, when they learned of all the riches we Amadians possess - damestear, artifacts, and many exotic goods - they wanted to return and establish trade.\n\nTo sweeten the deal, they brought us weapons, spices, trinkets, and gold as gifts. And if a deal is struck, there will be much more where that came from."
 amadia_flavour.2.a: "Amazing!"

 amadia_flavour.3.t: "Trade with the Kheionai"
 amadia_flavour.3.d: "Amadia is a land filled with riches. Damestear, exotic plants, spices, and magical relics are goods our homeland has in abundance. But even so, we will not give them up free of charge.\n\nThe Kheionai are a mercantile people from the south who are willing to trek enormous distances in order to barter for those goods. They offer their own riches and gold in return, but also their knowledge, advancements, and advisors.\n\nYet we can always refuse them, should our [Root.Monarch.GetTitle] deem trade with fellow Amadians more lucrative."
 amadia_flavour.3.a: "Trade for knowledge."
 amadia_flavour.3.b: "Trade for gold."
 amadia_flavour.3.c: "Trade with local tribes instead."

