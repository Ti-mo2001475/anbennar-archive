 EVTNAME4199:0 "$COURT_MAGE$"
 EVTDESC4199:0 "One of our advisors, $COURT_MAGE$, has received great support for their efforts in developing new magical techniques and standardized procedures for crafting magical tools. [Root.Adm_Advisor.GetHerHisCap] most notable achievements include a more efficient process of storing mana in damestear."
 EVTOPTA4199:0 "[Root.Adm_Advisor.GetHerHisCap] efforts will be admired throughout the nation"
 EVTOPTB41204211:0 "[Root.Adm_Advisor.GetHerHisCap] reputation will reach further than our borders"
 court_mage_boost:0 "Magical Innovation"