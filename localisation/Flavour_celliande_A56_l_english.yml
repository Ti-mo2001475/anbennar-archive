 celliande.11.d: "TODO AME TODO"
 celliande.11.a: "They can serve as our local mage organization, but nothing more."
 celliande.11.b: "I never liked Magisterium anyways!"

 celliande.100.t: "Guidance of the Nameless"
 celliande.100.d: "TODO AME TODO"
 celliande.100.a: "Let them take the lead."
 celliande.100.att: "[Root.GetName] gets '§YGuidance of the Nameless§!' until the end of the exploration, giving the following effects:\nEstate Experience Modifier: §G+25%§!\nClergy loyalty: §R-5%§!\nNobility loyalty: §R-5%§!\nMerchant Guilds loyalty: §R-5%§!\nAdventurers loyalty: §R-5%§!"
