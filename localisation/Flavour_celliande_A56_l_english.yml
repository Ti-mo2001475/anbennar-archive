 celliande.7.t: "To Raise a Hero"
 celliande.7.d: "TODO AME TODO"
 celliande.7.a: "Aran sil Varlosen"
 celliande.7.b: "Bull of Kwinteme"
 celliande.7.c: "Serondor sil Sorncell"

 celliande.8.t: "On the Trail of a Hero: Homecoming"
 celliande.8.d: "TODO AME TODO"
 celliande.8.a: "We shall inter him in the Labyrinth of Sorncell, as an honored hero."
 celliande.8.b: "Let the Order of Serondor take him, and dedicate a grand mausoleum in his honor."

 celliande.9.t: "A Public Outcry"
 celliande.9.d: "TODO AME TODO"
 celliande.9.a: "The nobility do not dictate our diplomacy."
 celliande.9.b: "They are right, wexonards are dogs!"

 celliande.10.t: "From Beyond The Grave..."
 celliande.10.d: "TODO AME TODO"
 celliande.10.a: "Recognition? I was Milcori before they were!"
 celliande.10.tt: "Every Arannese or Wexonard province gets '§YMilcori Revival§!', giving the following effects:\nCultural Conversion Cost: §Y-50%§!\nCultural Conversion Speed: §G-50%%§!\n"

 celliande.11.t: "Enter, the Nameless"
 celliande.11.d: "TODO AME TODO"
 celliande.11.a: "They can serve as our local mage organization, but nothing more."
 celliande.11.b: "I never liked Magisterium anyways!"

 celliande.13.t: "...Milcorissia Rises"
 celliande.13.d: "TODO AME TODO"
 celliande.13.a: "Milcorissia lives again! Milcorissia will never die!"

 celliande.14.t: "On Trail of a Hero: Brasan"
 celliande.14.d: "TODO AME TODO"
 celliande.14.a: "It must be Serondor!"
 
 celliande.15.t: "Necromantic Fashion"
 celliande.15.d: "TODO AME TODO"
 celliande.15.a: "Milcori culture reigns supreme."

 celliande.16.t: "Labyrinthine Discoveries"
 celliande.16.d: "TODO AME TODO"
 celliande.16.a: "Milcori culture reigns supreme."

 celliande.17.t: "Milcorissia?"
 celliande.17.d: "TODO AME TODO"
 celliande.17.a: "Leverage it to improve our reputation."
 celliande.17.b: "Use it to legitimize our claims."

 celliande.100.t: "Guidance of the Nameless"
 celliande.100.d: "TODO AME TODO"
 celliande.100.a: "Let them take the lead."
 celliande.100.att: "[Root.GetName] gets '§YUnbalanced Humours§!' until the end of the exploration, giving the following effects:\nEstate Experience Modifier: §G+25%§!\nClergy loyalty: §R-5%§!\nNobility loyalty: §R-5%§!\nMerchant Guilds loyalty: §R-5%§!\nAdventurers loyalty: §R-5%§!"
 celliande.100.b: "They can send some delegates, the same as anyone else."
 celliande.100.btt: "[Root.GetName] gets '§YBalanced Humours§!' until the end of the exploration, giving the following effects:\nEstate Experience Modifier: §G+15%§!\nAll estates loyalty: §G+5%§!"

 celliande.101.t: "The Trek Deeper"
 celliande.101.d: "TODO AME TODO"
 celliande.101.a: "We have no choice but to press on."
 celliande.101.att: "[Root.GetName] gets '§YStrained Supplies§!' until the end of the exploration, giving the following effects:\nEstate Experience Modifier: §G+10%§!"
 celliande.101.b: "Mages can conjure supplies to make up for our losses."
 celliande.101.c: "Stone transmuted to flesh, while a bit grotesque, will be sufficient to feed the party."

 celliande.102.t: "The Diary of Aran sil Varlosen"
 celliande.102.d: "TODO AME TODO"
 celliande.102.a: "We will study this device, and honor the legacy of this hero who came before us."

 celliande.103.t: "The Empty Channels"
 celliande.103.d: "TODO AME TODO"
 celliande.103.a: "Our ruler will seek the guidence of those who came before, meditating in Milcori Shrine of Rhinmond."
 celliande.103.att: "[Root.GetName] gets '§YDreams of Salt§!' until the end of the exploration, giving the following effects:\nEstate Experience Modifier: §G+30%§!"
 celliande.103.b: "Scour the most comprehensive archives of the land."
 celliande.103.btt: "[Root.GetName] gets '§YReading in Halls§!' until the end of the exploration, giving the following effects:\nEstate Experience Modifier: §G+10%§!"

 celliande.104.t: "It Came to Me in a Dream"
 celliande.104.d: "TODO AME TODO"
 celliande.104.a: "I understand."
 celliande.104.b: "Some costs are too great."

 celliande.105.t: "A Sacrifice Worth the World"
 celliande.105.d: "TODO AME TODO"
 celliande.105.a: "No cost is too great for the glory of Milcorissia."

 celliande.106.t: "What Lies Below"
 celliande.106.d: "TODO AME TODO"
 celliande.106.a: "A dead tell tales, but only some have right to listen."
 celliande.106.tt: "'§YSpeak With Dead§!' mana penalty reduced to §R-0.1§!"

 celliande.107.t: "Sacrifice Upon Sacrifice"
 celliande.107.d: "TODO AME TODO"
 celliande.107.a: "[Root.Monarch.GetName] will rise our morale with a speech."
 celliande.107.att: "[Root.GetName] gets '§YRaised Spirits§!' until the end of the exploration, giving the following effects:\nEstate Experience Modifier: §G+10%§!\nLand Attrition: §G-15%§!"
 celliande.107.b: "Some of you might die, but that is a sacrifice I am willing to make."
 celliande.101.btt: "[Root.GetName] gets '§YDeath March§!' until the end of the exploration, giving the following effects:\nEstate Experience Modifier: §G+25%§!\nMorale of Armies: §R-10%§!"

 celliande.108.t: "The Hallowed Halls 'Neath Us'"
 celliande.108.d: "TODO AME TODO"
 celliande.108.a: "We must give ourselves over to the darkness to be embraced by the light."
 celliande.108.att: "[Root.GetName] gets '§YUnease of the Spirit§!' until the end of the exploration, giving the following effects:\nEstate Experience Modifier: §G+15%§!\nGlobal Unrest: §R+4§!"
 celliande.108.b: "Cling to the light, and let the dark lap at our mind."
 celliande.108.btt: "[Root.GetName] gets '§YStruggle§!' until the end of the exploration, giving the following effects:\nEstate Experience Modifier: §R-5%§!\nMStability Cost Modifier: §G-10%§!"

 celliande.109.t: "The Sanctum of the Last"
 celliande.109.d: "Kill them all"
 celliande.109.a: "You know what you must do."
 celliande.109.att: "Any worthy task requires a sacrifice."

 celliande.110.t: "Heir to Milcorissia"
 celliande.110.d: "TODO AME TODO"
 celliande.110.a: "Come, my new Prince."
 celliande.110.tt: "'§YSteal Vitality§!' now gives §G150%§! Monarch Lifespan and §G+1§! Hostile Attrition."
 
 celliande.150.t: "The Tower of Varlosen"
 celliande.150.d: "TODO AME TODO"
 celliande.150.a: "Use well-placed bribe."
 celliande.150.b: "Storm the tower and take it by force."

 celliande.151.t: "The Abandoned Laboratory"
 celliande.151.d: "TODO AME TODO"
 celliande.151.a: "Have the mages set up shop here."
 celliande.151.b: "Relics such as these are priceless, let our ruler take their pick and then sell them to highest bidder!"

 celliande.152.t: "Underground Resistance"
 celliande.152.d: "TODO AME TODO"
 celliande.152.a: "They know their way around, give them concessions to secure their aid."
 celliande.152.b: "Kill them all, their supplies will be aid enough."

 celliande.153.t: "Shadow-Wrought Corridor"
 celliande.153.d: "TODO AME TODO"
 celliande.153.a: "Proceed carefully and methodically dispelling the magic and dimantling the traps."
 celliande.153.b: "Rise the rebels as undead and have them lead the way."
 celliande.153.c: "Our new recruits know of a path around the corridor let them lead the way."

 celliande.154.t: "The Abyss Stares"
 celliande.154.d: "TODO AME TODO"
 celliande.154.a: "Push through by force, the whispering is surely nothing."
 celliande.154.b: "Nerat's faithful will be our aegis against this evil."

 celliande.155.t: "A Beast Within the Shadows"
 celliande.155.d: "TODO AME TODO"
 celliande.155.a: "They must surely know the secrets of this place, we should attempt to converse with them."
 celliande.155.b: "The beasts cannot be suffered to live."

 celliande.156.t: "An Old, Crumbled Place"
 celliande.156.d: "TODO AME TODO"
 celliande.156.a: "This place belongs to the clergy, allow them to consecrate it."
 celliande.156.b: "The bones here belong to the Milcori, and will find themselves back in the crypts of their descendants - for a price, of course."

 celliande.157.t: "The Tomb of Stone"
 celliande.157.d: "TODO AME TODO"
 celliande.157.a: "Let our mages study it and decipher its secrets."
 celliande.157.b: "None are more skilled at finding secrets than adventurers! Put out a call to Verne and Menibor."
 celliande.157.c: "An augury rite will help us find this mechanism."

 celliande.158.t: "The Sepulcher of the Bull"
 celliande.158.d: "TODO AME TODO"
 celliande.158.a: "Leave checkpoints behind as we progress, staffed by soldiers and stocked with supplies."
 celliande.158.b: "Leave a series of luminescent magical runes to mark our path."

 celliande.159.t: "A Golden Bull"
 celliande.159.d: "TODO AME TODO"
 celliande.159.a: " To battle!."

 celliande.160.t: "Triumph in the Dark"
 celliande.160.d: "TODO AME TODO"
 celliande.160.a: "This minotaur skeleton would look grand in my foyer!"
 celliande.160.b: "Compensate the families of the dead, and turn the Sepulcher of the Bull into a grand gathering hall."
 celliande.160.c: "Finance study of this specimen with the treasure, we must replicate this magic!"

 celliande.161.t: "The Great Necropolis of Nerat"
 celliande.161.d: "TODO AME TODO"
 celliande.161.a: "The support of the faithful is integral we must convince them our cause is just, even if it delays our progress."
 celliande.161.b: "They are an obstacle to truth, to our legacy, and we must not allow them to hinder us."

 celliande.162.t: "Secrets of the Catacombs"
 celliande.162.d: "TODO AME TODO"
 celliande.162.a: "Fool, the True King is obviously the greatest of Lich-Kings, Morgurax!"
 celliande.162.tt: "The mural rumbles, sliding into the ground..."

 celliande.163.t: "Deeds of the Lich-Kings"
 celliande.163.d: "TODO AME TODO"
 celliande.163.a: "Let us all feed the basin with our blood."
 celliande.163.b: "Feed the basin with the blood of this disrespectful heathen, that his life may amount to something."

 celliande.164.t: "The Antechamber of Nerat"
 celliande.164.d: "TODO AME TODO"
 celliande.164.a: "We shall dedicate this holy site to the greatest of gods, Nerat."
 celliande.164.b: "We will follow the example of the greatest kings, entombing our royal family within these vaunted halls."

