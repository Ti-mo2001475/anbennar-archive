 #Events
 nomsyulhan_gateway.10.t: "Across the Desert"
 nomsyulhan_gateway.10.d: "For many years we have heard the story of the great Gateway, an ancient structure build by a civilization long gone, yet now we find ourselves in a position to claim it for our own. How should we procede?"
 nomsyulhan_gateway.10.a: "Hire adventurers"
 nomsyulhan_gateway.10.b: "Send in the army"
 nomsyulhan_gateway.10.c: "Use spirits as guides"
 nomsyulhan_gateway.10.e: "Summon the shamans"
 nomsyulhan_gateway.10.f: "Perhaps in another moment"

 nomsyulhan_gateway.11.t: "The Rift Taken"
 nomsyulhan_gateway.11.d: "We have secured a stable route towards the Rift Bearer allowing us to finally control it."
 nomsyulhan_gateway.11.a: "This is only the beginning"



#Decisions
 take_the_rift_bearer_decision_title: "Take Control of the Rift Bearer"
 take_the_rift_bearer_decision_desc: "Across the deser the ruins of an ancient structure lie in the sands, we must make our hands with it to further study it."


