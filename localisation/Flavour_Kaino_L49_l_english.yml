#modifiers
 kaino_ironwood_weapons:0 "Ironwood Weapons"
 desc_kaino_ironwood_weapons:0 "During the Second Fangaulan Empire, the monks at Junansuar perfected the forging of ironwood blades that would define the empire’s rise. The secret knowledge has since been copied and adapted by the Kaino tribes."
 kaino_adze_poisoning:0 "Adze Poisoning"
 desc_kaino_adze_poisoning:0 "When one adze is spotted, more are sure to follow. Something must be done to contain this outbreak."
 kaino_curious_disease:0 "Curious Disease"
 desc_kaino_curious_disease:0 "Not all adze attack in a swarm. Sometimes it just needs one bite…"
 kaino_kainos_pledge:0 "Kaino’s Pledge"
 desc_kaino_kainos_pledge:0 "If life is suffering, then end all life."
 kaino_carrion_call_adze:0 "Carrion Call to the Adze"
 desc_kaino_carrion_call_adze:0 "Like the stench of carrion to a flock of vultures, the ringing of Kaino’s artefacts calls out to the adze."
 kaino_steward_of_kainos_vestiges:0 "Steward of Kaino's Vestiges"
 desc_kaino_steward_of_kainos_vestiges:0 "It is a great honour to guard the final artefacts of the Shadow Lich. His skull, cane, cloak, and a flute. The first three all pulse with a magical power, although nobody can make heads nor tails of the flute. Perhaps it holds no magical significance whatsoever?"
 kaino_modifier_servants_to_the_suffering_dead:0 "Servants to the Suffering Dead"
 desc_kaino_modifier_servants_to_the_suffering_dead:0 "Kaino teaches us that to raise a skeleton from the dead is to prolong its suffering. Once you do that, you have committed a great sin and must devote your life to the cause of ending all suffering."
 kaino_mercy_granted_lvl_3:0 "Mercy Granted - Lvl 3"
 desc_kaino_mercy_granted_lvl_3:0 "We used to suffer in silence. Now there is just silence."
 kaino_mercy_granted_lvl_2:0 "Mercy Granted - Lvl 2"
 desc_kaino_mercy_granted_lvl_2:0 "We used to suffer in silence. Now there is just silence."
 kaino_mercy_granted_lvl_1:0 "Mercy Granted - Lvl 1"
 desc_kaino_mercy_granted_lvl_1:0 "We used to suffer in silence. Now there is just silence."
 kaino_bones_into_ploughshares:0 "Bones into Ploughshares"
 desc_kaino_bones_into_ploughshares:0 "Not all skeletons are sent into battle. Many work back home in the mills and fields, primarily in cotton farming. The dead have no need for food or shelter."
 kaino_the_cleanse:0 "The Cleanse"
 desc_kaino_the_cleanse:0 "As the lands are cleansed of sorrow, a peace spreads across the plains. None will fear a future of suffering again."
 kaino_justification:0 "Justification"
 desc_kaino_justification:0 "This is just as the gods and heroes before us would have wanted. If we stop, we reveal the lie."
 kaino_monument_to_fangaulas_befoulment:0 "Monument to Fangaula's Befoulment"
 desc_kaino_monument_to_fangaulas_befoulment:0 "”An Empire of Suffering Once Stood Here”"
 kaino_temple_bonuses:0 "Lying to Those Left"
 desc_kaino_temple_bonuses:0 "A temple: A place one goes to be lied to."
 kaino_barracks_bonuses:0 "Undead Fields"
 desc_kaino_barracks_bonuses:0 "The skeletons work the fields."
 kaino_ayas_legacy:0 "Aya's Legacy"
 desc_kaino_ayas_legacy:0 "Map painting in its truest form."
 kaino_his_magic_healing:0 "His Magic Healing"
 desc_kaino_his_magic_healing:0 "Kaino’s mastery of magic is far beyond anything our mages can accomplish. Did you know you could use necromantic magic for its healing properties? To think we forbade any research into this most blessed of magical arts before…"
 kaino_ironwood_magic_regeneration:0 "Ironwood Magic Regeneration"
 desc_kaino_ironwood_magic_regeneration:0 "Mana flows through all things at different rates. The greater the resistance, the more mana is lost. Black Damestear completely blocks mana flow, hence its anti-magic properties. Ironwood, on the other hand, can be used to increase mana flow."
 kaino_artefacts_magic:0 "Artefact Magic"
 desc_kaino_artefacts_magic:0 "A horrific shadow lich beyond reckoning Kaino may have been, but we cannot deny that his prowess in the field of magical studies is something we could still learn from."
 kaino_building_slot:0 "Silent Lands"
 desc_kaino_building_slot:0 "The space freed by the end of suffering can be put to new use."
 kaino_adze_swarms:0 "Adze Swarms"
 desc_kaino_adze_swarms:0 "Beware the swarms, for they will take the shape of man."
 kaino_all_shall_take_the_name:0 "All Shall Take the Name"
 desc_kaino_all_shall_take_the_name:0 "Rejoice, for to be called Kaino no longer is a curse. It means you are part of Kaino’s grand undertaking to rid the world of suffering."
 kaino_koalition_temp_bonus:0 "The Laughable Final Stand"
 desc_kaino_koalition_temp_bonus:0 "Kaino's will shall be enforced"
 kaino_temporary_apotheosis_bonus:0 "Bringing Mercy"
 desc_kaino_temporary_apotheosis_bonus:0 "Bring them peace. By force."
 adaru_generals:0 "The Four Heroes"
 desc_adaru_generals:0 "We just need them to believe the prophecy is real, that they, too, have it in them to be heroes of the Kaino."
 kaino_lewd_cave:0 "Cave of Whispers"
 desc_kaino_lewd_cave:0 "N’kawara zhubali thom’kira, azawen kuluma tharaka, zulama zulama zulama ZULAMA ZULA-"
 kaino_marching_to_salvation:0 "Marching to Salvation"
 desc_kaino_marching_to_salvation:0 "Every moment we dither is a moment every person left continues to suffer"
 kaino_aya_pursuing_lichdom:0 "Aya's Goal"
 desc_kaino_aya_pursuing_lichdom:0 "Kaino wants me to become a lich"
 kaino_aya_is_too_smart:0 "Witch Queen Aya"
 desc_kaino_aya_is_too_smart:0 "She's too smart for her own good"
 kaino_necromancy_3_chronophage_mod:0 "Necromancy: Chronophage"
 desc_kaino_necromancy_3_chronophage_mod:0 "The end is coming."
 kaino_necromancy_1_contagion_local_mod:0 "Necromancy: Contagion"
 desc_kaino_necromancy_1_contagion_local_mod:0 "The skies go dark as the mosquitoes blot out the sun."
 kaino_magic_boost_adm:0 "Study Their Bones"
 desc_kaino_magic_boost_adm:0 "Bones hold life longer than anything. They are the most stubborn parts of the body, and this tenacity is why all liches keep their bones upon their ascent to immortality."
 kaino_magic_boost_dip:0 "Study Their Entrails"
 desc_kaino_magic_boost_dip:0 "The entrails of all dead beings tell the path that had been laid before them. Even the most basic diviner can read the entrails of a corpse."
 kaino_magic_boost_mil:0 "Study Their Brains"
 desc_kaino_magic_boost_mil:0 "The brain does not appear any more magical than any other part of the body, yet it is the part that seems to control its every move. Its very existence frustrates Kaino. He does not like that which he does not understand."
 

