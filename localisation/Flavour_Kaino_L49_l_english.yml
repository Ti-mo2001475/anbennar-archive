 #holy order

 kainos_grasp_holy_order:0 "Kaino’s Grasp"
 kainos_grasp_holy_order_desc:0 "Every living being contains some form of magic. The land itself pulses with a faint aura of magic. To tap into that stream and drain it for your own deeds takes magic circles of incredible size, covering vast acres of land stretching across multiple provinces. No one person can know the full design of the circle, they merely need to work on their own section. Only the Shadow Lich himself knows the complete design. Once placed, it is impossible to remove, and the fate of all inhabitants within its reach is sealed."

#reforms
 kainos_kingdom_reform:0 "Kaino’s Kingdom"
 kainos_kingdom_reform_desc:0 "In truth, Kaino does not have an all-seeing eye gazing out over everyone in the Kaino Federation. The unquestioning obedience to his commands is not driven by fear of Kaino, although his subjects tell themselves that it is. It is fear of themselves. Fear that they may have to face what has become of their home. It is easier to tell yourself Kaino will turn you into a skeleton if you disobey. Easier still to pretend that this is what you truly want."

#disaster
 kaino_adze_pandemic:0 "Adze Pandemic"

#decisions
 kaino_cure_adze_poisoning_title:0 "Find a Cure for the Adze"
 kaino_cure_adze_poisoning_desc:0 "The adze are one of the more terrifying beasts of the Dao Nako. They are often compared to werewolves or vampires for their ability to shapeshift, transforming between that of a bald man with lifeless eyes and into a swarm of mosquitoes. But a werewolf or vampire is capable of rational thought and holding a conversation. The adze only desires to feed. Their numbers are low, but once one gets a taste of human blood, it starts to draw in others. A powerful magical ward can be used to silence the arcane call the adze are being drawn to, and among Kaino’s old artefacts, we may have found something powerful enough to channel an adze ward through."
 kaino_study_remains_title:0 "Study the Remains"
 kaino_study_remains_desc:0 "The bodies of the dead can be examined before they are reanimated as soldiers in our undead army. By putting our resources towards studying their remains, it will undoubtedly assist in the expansion of our magical research."

#estate privileges

 estate_mages_kaino_dao_nako_magecraft:0 "Dao Nako Magecraft"
 estate_mages_kaino_dao_nako_magecraft_desc:0 "The jungles of the Dao Nako are rife with a latent magic that the Kaino mages have spent generations studying. They alone now truly understand how mana flows beneath the roots of the trees. One thing, however, you will not find beneath their roots are human skeletons, for the Kaino practice cremation. You cannot allow the jungle floor to be littered with potential foes should the Shadow Lich return and start raising the dead."
 estate_mages_kaino_shadow_lich_chosen:0 "The Shadow Lich’s Chosen"
 estate_mages_kaino_shadow_lich_chosen_desc:0 "Magical theory and practice is developed over centuries, and even then knowledge is often lost if a wizard does not make a habit of training multiple apprentices. Entire schools of magic can thus be lost if not practiced rigorously. Necromantic magic has been forbidden in the Dao Nako until now. A historic mistake, but when you have the most practiced master of necromancy in the history of humanity training your mages, that lost time will be made up very swiftly. "
 estate_mages_kaino_bringers_of_mercy:0 "Bringers of Mercy"
 estate_mages_kaino_bringers_of_mercy_desc:0 "To become a Bringer of Mercy, you must first take a solemn oath of silence. Your last words will be to swear to Kaino’s dream of eliminating sorrow before your tongue is torn out and your mouth is sewn shut. From then on you live solely on the mana drained from the soil as you labour to complete Kaino’s vision. It is not a long life. Those who choose it have decided that Kaino’s vision of a world without suffering is the only one they have left to believe in."

