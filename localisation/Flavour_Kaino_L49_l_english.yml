l_english:

 #formation
 kaino_nation_title:0 "Unite the Tribes"
 kaino_nation_desc:0 "The Kaino people were never welcome in the first Fangaulan Empire. The founder Aro banished us to the Dao Nako, cursed us with the name of the Shadow Lich our ancestors supported, forced us to eke out an existence in these accursed jungles.\n\nBut thrive we did. After centuries of being looked down upon, the Kaino people are ready to rise again. We no longer feel ashamed of our name, are no longer bound by our past, for we instead choose to seize the future. Not as yet another Fangaulan Empire, but as a Kaino Federation, greater than anything the other Fangaulan people could ever hope to build."

 #missions

 kaino_1_5_title:0 "Monument to Fangaula"
 kaino_1_5_desc:0 "Sigilan was the first capital of the Fangaulan Empire. Built by the stone golems of Aro in a single night, it has stood as a testament to their imperial rule and, by extension, their crimes. Both Aro’s first empire and Biakata’s second empire committed crimes against humanity so vile that no amount of atonement could rid the city of its stench.\n\nKaino agrees. He says he has plans to build a monument to Fangaula in Sigilan with all of its inhabitants. The city shall become silent as he brings an end to all suffering by Fangaula, in Fangaula, for Fangaula"
 kaino_1_8_title:0 "What of Their Bones"
 kaino_1_8_desc:0 "Being a mage under the purview of the Shadow Lich changes you. Bodies no longer appear to you as the remains of a once living being. You have been taught that life is a curse and any revulsion is pushed down. Bodies are merely objects, once cursed with life, now free for us to examine. Like any cursed object, they have an innate magical power. Life itself has magic imbued in its essence. Even once our examination is complete, the body can be put to use in our armies.\n\nThis system of supplying an undead army is remarkably efficient. The bodies generate the mana needed to raise the body to create an undead soldier, which goes out into the world to make more dead bodies to fuel the creation of the next undead soldier. Once it gets rolling, I do not see how this system can be stopped, so we simply accept our part in it."
 kaino_1_9_title:0 "Justification"
 kaino_1_9_desc:0 "Those who still live continue to follow the traditions and worship the Fangaulan Pantheon. They do not see any discrepancies between their actions and what their faith would have them do. Biakata, Aro, Kolo, they all simply fought for their people through whatever means was best for them. Perhaps we should have been more clear on what the tenets of our faith were. Not that it would have mattered. One’s mind will twist a thousand ways to justify their actions before they face the agonising truth that what they are doing is wrong."
 kaino_1_10_title:0 "End the Sorrow"
 kaino_1_10_desc:0 "Kaino has called the Mother’s Sorrow the “most perfectly named river in the world”. According to the myths of Khetism, the Sorrow was created by Elikhet, crashing through the barren desert, in an attempt to create a home for his people. To Kaino, there could be no greater sin. The Salahad was once devoid of life; therefore, in his words, perfect. Then Elikhet brought life, and in doing so brought sorrow. The greater the population grew, the greater the sorrow became. It would not matter what else Kheterata did over its history. No feat would erase the primordial sin of spreading sorrow.\n\nKaino plans to end this. We have been gathering at Lake Nirakhet, staying carefully away from any khet. A deep magic runs along the great river, one we have learned to tap into. And now we will use it to conduct a great ritual to spread along the river. Any one mage who takes part in this, no matter how miniscule, will share responsibility for the death of thousands upon thousands of people.\n\nThe river glows. There are no screams. The Sorrow is silent."
 kaino_2_5_title:0 "Kaino's Grasp"
 kaino_2_5_desc:0 "It is remarkable how quickly Kaino and the mages became intertwined. He has centuries upon centuries of magical knowledge. The adze clearing spell was just the start. He can cast a spell that will cause a cow to sprout mushrooms. Another can create a field of daisies. Another can drain the souls of all people within a magic circle. Another can wrench the ground in two and sprout tentacles of flame. Another can summon fireflies made of smoke and stars. And yet another can make all one’s fears and woes leave their mind for a brief moment of clarity and calm.\n\nHe calls the last one “a glimpse of death”."
 kaino_2_6_title:0 "Free Them of Woe"
 kaino_2_6_desc:0 "What are we building towards? Our goal of ending the suffering of the Kaino people is getting ever closer, but what we leave in the wake of our progress does not appear to be meant to build towards a great future. People are dying in the thousands. We exploit the land as we continue our expansion, but what we leave in our wake is not a great empire. Behind us lies woe. Ahead of us lies quiet. Is this better?"
 kaino_2_8_title:0 "Until the End"
 kaino_2_8_desc:0 "Kaino wants us to die. Yet he also raises us back from the dead - including the Kaino people, who were initially promised to be safe from the continued suffering of undeath. He told me that though it was regrettable, everyone should work together to end the suffering of the world. That it would be selfish to think that in death you should abandon this most noble goal. He has lived longer than any of us and therefore suffered more than any of us, yet he continues to endure this existence because he wants to save us. With his example to guide us, we are all here until the end."
 kaino_2_9_title:0 "Lying to What is Left"
 kaino_2_9_desc:0 "Children are still born in Fangaula. They are raised in a society where seeing hordes of skeletons march through their largely emptied villages is commonplace. Death is a part of life, but it is all-encompassing within the ever expanding borders of the Kaino Federation. These children will grow up and ask questions about the way our society is run. Teach them that this is the truth of existence. That what we are doing is good. Teach them to obey Kaino. It is better to live believing that."
 kaino_2_11_title:0 "Empty Future"
 kaino_2_11_desc:0 "What is the most powerful type of necromancy? The undead legions are certainly an impressive sight, but the actual spell is something any moderately experienced necromancer could accomplish. Commanding an army of the dead is more impressive as a feat of logistics than as a feat of powerful magic. Lichdom is much more involved, and what most necromancers eventually devote their life to master. It is a spell designed to break the laws of existence, the rules by which the universe runs by. To break these rules, you must break reality itself.\n\nBut the rarest feat of a necromancer, one only the most devoted to their craft can accomplish, is the theft of time itself. All necromancy steals from the future. It steals the dead from their sleep, steals the life of reality to extend their own, steals the energy you would have for tomorrow to push yourself today. But to take from time itself takes the deepest knowledge of the darkest of arts. Time is not eternal, so you are stealing from everything that ever lived and ever will live.\n\nTo Kaino, this is a boon."
 kaino_3_1_title:0 "Legacy of Banni"
 kaino_3_1_desc:0 "When the gnollish hordes of the Twin Xhaz rampaged through Fangaula, the nobles of Binwarji, the last vestiges of the second Fangaulan Empire, fortified their own lands and let the periphery of their empire be ravaged. One must imagine the emperor chortling in his chamber, delighted that he did not have to expend any effort to put down the Kaino that the Binwarji people despised so much. They practically paved the roads for the two Xhazobines to enter Dao Nako.\n\nBanni was an earth planetouched warrior who, even as a youth, stood bravely at the frontlines, armed with his ironwood spear, fighting the Kult horde as they besmirched the lands we called home, and in the end, together with the hero Diakarida, defeated the Twin Xhaz. After Diakarida was executed as reward for his heroic deeds, Banni used his powers to assassinate the entire imperial family, which sent that fetid empire into its long, pitiful decay. The empire is dead. Let us now take up the spears made of our native ironwood and plunge them deep into Binwarji’s fetid corpse."
 kaino_3_2_title:0 "Genie Worshippers"
 kaino_3_2_desc:0 "Before Aro and the first Fangaulan Empire, humans lived under the genies as slaves. We were manual labor in the palaces, playthings for when desires of flesh aroused them, and test subjects for when they wished to play gods. Their genie blood still flows through our veins, the number of planetouched born in Fangaula a lasting legacy of their crimes.\n\nYet there are those who desire to emulate the genies, worship the ground they stepped on. If our crime to side with a shadow lich over two millennia ago was so grievous that we still bear the shackles of his name, then the punishment to be enacted upon those who still worship genies today must be amplified a thousandfold."
 kaino_3_3_title:0 "The Federation"
 kaino_3_3_desc:0 "Out of the Dao Nako we rise. All tribes of the Kaino people stand as one beneath our banner. The rest of Fangaula thought us buried beneath the tangles, something to be safely ignored and forgotten. They believed our ancestors’ sin would shackle us here for eternity. We paid for those deeds long ago. They could have done the right thing and welcomed us back when it was us who defeated the reborn Shadow Lich in the chaotic decades after the Day of Ashen Skies.\n\nSince we repaid our dues, it is they who have been racking up transgressions against our people. Over a thousand years worth of mockery and oppression of the Kaino people. The Federation will teach them a lesson in how long it takes to repay that malfeasance."
 kaino_3_4_title:0 "Drive Out the Adze"
 kaino_3_4_desc:0 "Is this what happened to our ancestors as well? Kaino offered them salvation? Or is this the same Shadow Lich as the one from over a thousand years ago? Time changes a man - or a Shadow Lich. What scant records exist of Kaino do not describe him in such terms as we see him today. His sympathy and pain at the suffering of our people appears entirely genuine. Attempts to dispel any potential enchantment magic have found no such spell in place, or at least none we can detect.\n\nEven if there was deception at the heart of his promise, we cannot deny the effectiveness of the anti-adze spell he has taught our mages. It can be repurposed into magical traps and barriers to defend villages. Adze are not so numerous that it took long for our villages to be at least temporarily free of their horror. But have we just traded one horror of the Dao Nako for another?\n\nNo, this is a new era, and a new Kaino. We are a new Kaino. We are no longer bound by the sins of our past, and neither is Kaino the Shadow Lich. He, too, recognises the suffering that has been wrought upon us, and he, too, wishes to right that historic injustice. We share a goal now. It is time to let the rest of Fangaula know."
 kaino_3_5_title:0 "Suffering of the Dead"
 kaino_3_5_desc:0 "The Kaino people incinerate their dead so their corpses could no longer be raised as zombies for the Shadow Lich Kaino. The rest of Fangaula, lacking our wisdom, does not. This will be their downfall. Kaino has said he does not wish to use the Kaino people once they have passed on. Their suffering has ended, he says."
 kaino_3_6_title:0 "Tamajoba Soldiers"
 kaino_3_6_desc:0 "The Binwarji people were the center of the empire’s core, but the Tamajoba were the center of its war machine. Not just as soldiers, but as those who armed the soldiers with their meticulously crafted ironwood weaponry. Kaino says they are as much victims of suffering as we are, and that eventually he wishes to save them, too, but for now they must become part of our army and suffer for just a while longer. I thought this would mean they would form the front lines of our invasion force.\n\nThis is why I was surprised when the order came through to execute as many Tamajoba as we could. What good can they possibly do for us when they are dead?"
 kaino_3_7_title:0 "Kaino's Wish"
 kaino_3_7_desc:0 "When I was a young man I met a hypnotist who claimed she could make me do anything purely with the power of her voice. I was studying enchantment magic at the time, and thought I knew the counters to any spell this woman could cast and would be able to counterspell it as soon as she attempted magic. So I played along, danced when she played music, acted like a leopard when she clicked her fingers, waiting to dispel her magic when she tried. Then she announced the performance was over, bowed to the crowd, and my friends surrounded me asking what it was like to be hypnotised. I was never under any spell though. I definitely was not hypnotised and could have stopped, I was just going along.\n\nI do not think Kaino is going to end this performance."
 kaino_3_8_title:0 "Give Them Freedom"
 kaino_3_8_desc:0 "We have started to kill our own people. Kaino forbids us from calling it killing them though. He says we are granting them the greatest mercy. That, had we not, their opportunities for suffering would only continue to increase. That to live means to be bound to the inevitability of grief. We are not stripping them of anything but the continued pain of existence. What Kaino is doing is nothing less than the greatest act of compassion this world has ever seen. He will grant them freedom."
 kaino_3_9_title:0 "Skeleton Fields"
 kaino_3_9_desc:0 "You do not see people in the fields anymore. A skeleton does not need sustenance. So the fields grow wild and unkept, their purpose diminished. Lumber operations continue, as does ironwood smelting, for the skeletons need barracks to gather their weapons before they march to the next corner of this continent. But you will see neither hide nor hair of a human in these barracks. They live on the far corners of villages, maintaining a small patch of land, perhaps with a single cow. The skeletons pay them no heed, at least until they have spoken their last. Only then will they join the rest of their brethren, walk to the barracks, take up arms, and march on in silence."
 kaino_3_10_title:0 "Silence in Fangaula"
 kaino_3_10_desc:0 "When I was young, I told my grandmother of a dream I had. I had become queen and had a throne made of ironwood. I could control hydras and they would guard our cows from raiders. My grandmother hit me. Told me she never dreamed. Dreams were for fools who could not face reality. That I could dream when I was dead. I told her the dead don’t dream. She hit me again.\n\nI hated my grandmother.\n\nFor the first time in years, I dreamt. A nightmare about a bustling city, as large as Kheterat. It came under attack, burnt down by dragons flying overhead. A meteor dropped from the sky next to me and I awoke startled, drenched in sweat - a skeleton had bundled into the room, seemingly lost, it knocking over a table being the noise of the meteor from my dream. It walked into the wall, the door, the wall again, before standing in place and not moving. I asked if it ever dreamed.\n\nI did manage to fall back asleep again, although I did not dream. I long for the nightmares to return."
 kaino_3_12_title:0 "On Becoming a Shadow Lich"
 kaino_3_12_desc:0 "Long before the coven of Yezel Mora took hold in the Shadow Swamp, a different night hag took a living Kaino there. She taught him the trick to enter the empyreal and the ritual needed to become a shadow lich. She said she would never dare teach another night hag the method, for no night hag trusts another. That is why they form covens, she explained. A night hag’s coven is built off distrust. With three, there are always two watching the third. Kaino said he never understood that night hag. He did not understand why she taught him how to become a shadow lich, nor everything she said about the ritual. She kept telling him the secret ingredient was hope. \n\nI believe I know the answer to both.\n\nNight hags feed off misery, and misery lacks potency if it is not backed by hope. One must believe in a brighter future if the misery is to taste its sweetest. A shadow lich fueled by hope can create the most potent misery of them all.\n\nThat night hag must be long gone, for she has not returned to repair her creation. The fuel of hope is lost and without it he is erasing misery. It created me, and between us, we have gone further than she may ever have intended. My message to that distant night hag is that she need not worry. I will ensure misery will continue."
 kaino_4_1_title:0 "Fellow Foes of the Binwarji"
 kaino_4_1_desc:0 "The Ndurubu have not suffered under the yoke of the Fangaulan Empire like the Kaino people have. We have been forced into isolation in this cursed jungle for over two millennia for the pact our ancestors made with the Shadow Lich, while they enjoyed the wide, rich plains to raise their cattle. But we do share one thing in common: A hatred for the Binwarji.\n\nUnder the second Fangaulan Empire, their lands were even worse hit by the Twin Xhaz than our own, standing in the direct path of the demon-possessed gnollish hordes. It was Diakarida, a Ndurubu warrior, who slew the twins, with no help from the Fangaulan army, hiding as they did in the west. We can exploit that mutual hatred."
 kaino_4_2_title:0 "Dao Nako Magic"
 kaino_4_2_desc:0 "Aro knew what he was doing when he banished us to the Dao Nako. These jungles are rife with a hostile magic that warps the vegetation and produces terrifying monsters. Hydras are the most immediately dangerous, but there are fouler things roaming in the deep. Adze, the vampiric shapeshifting mosquitoes that can wipe out an entire village if an infestation goes undetected. Eloko, the bewitching spirit that devours people. Kadda, mutated ogres with mouths the size of an elephant and an insatiable hunger. Elementals, were-leopards, even the plants can come alive to attack you.\n\nBut we have lived here long enough to have learned how to utilise some of this latent magic for our own benefit. That same elemental magic that brings ironwood and gemstone fruits can be used by our mages to empower their magic and replenish their mana. The Dao Nako is dangerous, but it can be a weapon to be used against those who kept us down."
 kaino_4_3_title:0 "The Artefacts"
 kaino_4_3_desc:0 "After the Day of Ashen Skies the Shadow Lich Kaino rose again. He wrongfully believed that the Kaino people would gather to his side once again and inflict his suffering across Sarhal. Yet this time, his plans did not work out. Our people opposed him, destroyed his skeletal body, and drove his spirit from Fangaula. From his body our ancestors took a collection of artefacts - skull, staff and robe - for safekeeping and to limit his power should he ever try to return.\n\nEach of these relics is a powerful magical artefact in its own right, therefore each of the tribes tasked with guarding them kept them under close guard, for they feared their power. No single tribe was capable of mastering the magic hidden within the relics, thus they sealed them away. Though our mages are of a different, more ambitious breed. They have constructed an ironwood cage to host the relics, containing whatever magical powers lay dormant inside. Now that they are secure, we can finally properly examine the secrets buried within."
 kaino_4_5_title:0 "Steal Life"
 kaino_4_5_desc:0 "Necromancy is so much more than raising the dead. The same magic that animates a skeleton can steal from the future itself, or at least that is how Kaino explains it. What vitality you would have had tomorrow is taken and placed into the life you have today. This, too, is how raising the dead works. You take the time a soul will spend in death and bring it back to the present. Kaino calls it the reallocation of torment. You double the torment you experience today so that in the future you will be free of torment."
 kaino_4_6_title:0 "Execute His Plan"
 kaino_4_6_desc:0 "The past few months have been like a dream. The ones where you are aware you are dreaming. Where you have lost agency over what your own body is doing, and can only scream from deep within your own mind to stop engaging with Kaino. Stop participating in his magical experiments. The other mages seem to be in the same trance-like state, meekly following the Shadow Lich’s commands. When the children simply keeled over, no noise, no distress, almost serene in their final repose, we merely congratulated each other on successfully accomplishing the complex spell Kaino put together for us.\n\nIf I wake from this dream, the reality of what we are doing will hit me. I would not be able to deal with that reality. Thus I plan to dream a while longer."
 kaino_4_8_title:0 "Burn the Remains"
 kaino_4_8_desc:0 "We used to burn our dead. This way, if their skeletons were incinerated, they could not be raised back from the dead. Kaino will not let us do that anymore. We raise everyone back from the dead to continue the fight. Instead we burn their possessions. Their homes, their goods, their clothes. We burn what was left of their life. Memories are just another source of pain. There will be no pain when Kaino is done."
 kaino_4_9_title:0 "Give them Death"
 kaino_4_9_desc:0 "Revenge. That was our grandfather’s goal originally, was it not? Revenge on the people of Fangaula for forsaking our people. Branding us with a name signifying our treachery, banishing us to a harsh life deep within the Dao Nako. Kaino says he does not believe in revenge, for that would imply we have enacted something negative upon Fangaula. According to him, what we are doing is an act of compassion. We are granting them the gift of death. They now and forevermore have peace.\n\nThese were his words as he was overlooking a skeletal army numbering in the tens of thousands. I wonder if people lose all sense of irony once they age past the first two thousand years."
 kaino_4_11_title:0 "Our Message to All"
 kaino_4_11_desc:0 "To all of Sarhal: Rejoice! The armies of the Kaino Federation are on the march, and soon you shall be saved.\n\nDo not fear our arrival. There are only two things in your future that are certain. Suffering and Death. The former shall continue until the latter arrives. Given this grim truth, the only thing you should fear is the continuation of your suffering. The chains of life are all that keep you from eternal peace.\n\nWe shall shatter those chains. We shall be your salvation. Drop your weapons and await our arrival. We promise the day after you die will be the first you shall know true tranquility."
 kaino_5_1_title:0 "Kaino's Artefacts"
 kaino_5_1_desc:0 "We bear the name of the Shadow Lich Kaino. It is a punishment handed to us by Aro, the founder of the first Fangaulan Empire, for siding with the Shadow Lich as he threatened all of humanity. For that crime our lands were taken from our ancestors to house the Binwarji while we were cursed with the Shadow Lich’s name and banished to the hostile jungles of the Dao Nako.\n\nA punishment far too severe perhaps, but we have taken on the task of warding against the Shadow Lich’s return seriously. Each tribe guards an artefact of Kaino. His skull, his staff, his cowl, his flute. He has not attempted to retrieve them since the Day of Ashen Skies and it is unlikely he would do so now, after all these centuries. The least we can do to alleviate the plight of our people is to study these magical artefacts more thoroughly. Perhaps we can learn something from them."
 kaino_5_5_title:0 "Control the Swarms"
 kaino_5_5_desc:0 "I wonder if those mages that fled were correct. They said Kaino was the one who set the adze on us. That he orchestrated their sudden swarming so he could swoop in and act as the savior, ingratiating himself to us. I had pointed out that the adze only went into overdrive after we started experimenting on the artefacts, which Kaino himself had not touched since we defeated him after the Day of Ashen Skies, but that did not assuage their fears.\n\nI asked Kaino about this today. I mused that it was impossible to truly control the adze. He showed me how you could. You can direct their flight. He had glass jars filled with mosquitoes with magical charms preventing their shattering. I asked directly about whether he beset the adze on us. He says he did not. I do not know if I believe him. I do not know what I would do if those mages were correct. I am afraid."
 kaino_5_8_title:0 "Eternity Together"
 kaino_5_8_desc:0 "Kaino does not know that I like to paint. He does not ask, and I do not tell him. I let him know nothing about me. I have learned to completely hide the feelings on my face and mask my emotions. Not that Kaino is a master of human emotion. He is too selfish to recognise that. If he was not, he might have noticed that I used to struggle to prevent my feelings from overwhelming me. Most here drown their feelings of anger or fear to embrace his words, for to hold onto those feelings is too painful when you recognise your complicity.\n\nI cannot allow those feelings to overwhelm. I must hold onto this pain, for it is the only way I can keep my sanity. Even as his fingers brush my skin, I cannot scream. I hold onto the one feeling Kaino cannot understand. I must hold onto hope.\n\nAt least when my face is reduced to just its skeleton, masking that emotion will be much easier."
 kaino_5_9_title:0 "Understanding Hope"
 kaino_5_9_desc:0 "I know what I have done is beyond forgiveness. I do not seek any higher power to grant me salvation. I am doing it for myself. Perhaps I am similar to Kaino in that way. Where we differ is that he cannot recognise the pain in others. He only understands his own pain and projects it out onto everyone else. If he feels pain, so must everyone else. If he cannot understand hope, then nobody else possibly can. He cannot imagine a world without him. That will be his downfall."
 kaino_5_10_title:0 "Solace"
 kaino_5_10_desc:0 "As a lich, I cannot die. The reality that underpins death sees the soul and body as one while you live. A body without a soul is a corpse, so death shall ignore it. But if the container with my soul is destroyed - my phylactery - I shall die, for the universe will recognise both body and soul as being deceased.\n\nKaino speaks with me of his fear of the Red Reapers, a creation of the world to mend reality when something threatens its integrity, such as the bond of body and soul being torn. He fears they will one day discover the secret to kill a shadow lich. He fears many things. I have learned of them all, for he tells me of them.\n\nHe does not know any of my fears. He never asks. His fears are my fears as far as he is concerned. Yet he does not share everything with me. He still views me as something separate. I need him to see me as his solace. When he considers us as one, he will share the last of his fears. Once I have that, I will be able to kill the Shadow Lich. Then perhaps I will paint again."



# tag specific missions
 kaino_bokiya_1_title:0 "The Artefact of Bokiya"
 kaino_bokiya_1_desc:0 "The various Kaino tribes have been safeguarding the artifacts of the Shadow Lich for over a thousand years. We are unsure whether this artifact really belongs to Kaino or whether it has any magical power at all. Rather than keep it under lock and key, we should instead give it to the Jelli of Mausarjirad to study. If the wise men there cannot uncover its secrets, at the very least they can be relied upon to have a good story to tell."
 kaino_bokiya_3_title:0 "Power"
 kaino_bokiya_3_desc:0 "The shackles placed upon us by the Fangaulan Empire should be discarded entirely. Why not empower the Planetouched? They are a gift to the Kaino, and to Fangaula as a whole. We are bringing our vision of Fangaula to fruition, and in that vision, the Planetouched form the vanguard of the new Fangaula."
 kaino_bokiya_2_title:0 "Planetouched Forgiveness"
 kaino_bokiya_2_desc:0 "Bokiya was one of the Kaino tribes that were part of the Second Fangaula Empire for most of its history. Fangaula saw itself as an empire of authority, an authority that was bestowed at birth through heritage and lineage. Those subjects of the empire that were perceived as inferior, such as the Kaino, were expected to unquestioningly obey their Binwarji superiors.\n\nThe Planetouched existed in direct contradiction to that concept because the powers of a Planetouched were neither controllable nor hereditary. Therefore, Planetouched were banned from the wider society and required to join the God's Atoners, a paramilitary internal peacekeeping force under the direct command of the emperor himself. With the Second Fangaulan Empire gone, we no longer need to pay homage to these laws. We can welcome back the Planetouched as kin amongst our midst."
 kaino_adaru_1_title:0 "Sword of the Stranger"
 kaino_adaru_1_desc:0 "The Tamajoba people of Negefaama are a blight upon Fangaula, a scourge upon the Dao Nako. Rather than treat us Kaino as fellow dwellers of the Dao Nako, they threw in their lot with the accursed Fangaulan Empire and were rewarded with overlordship over the western parts of our shared home. For many centuries they lorded over us while we suffered, and even after the fall of the empire they still consider us their servants. They take our ironwood and with it craft weapons to intimidate or even kill us. Within their most secluded forge they are crafting a sword, one to rival the infamous Kinslayer Sword of the Second Fangaulan Empire. We shall deprive them of that sword, and use it against them."
 kaino_adaru_3_title:0 "The Skull of the Betrayer"
 kaino_adaru_3_desc:0 "The skull of Kaino was a clever fake. And yet, that does not mean it is not a powerful artifact. We will have to start uncovering its true origin, but its effect on Planetouched potency is without question. If a powerful Planetouched places their hand upon the skull, they are imbued with a force that amplifies their power to levels not seen in a Planetouched since Aro himself. This discovery will surely aid us in our future endeavours."
 kaino_adaru_2_title:0 "Four Destined Heroes"
 kaino_adaru_2_desc:0 "Adaru has a myth, a prophecy perhaps, of five great Planetouched heroes who will save the Kaino people. In this story, the first hero would inspire the remaining four. Banni, the hero who slew the Twin Xhaz only to be betrayed by the empire, clearly must have been that first hero. Prophecies are only as true as the faith you place in them. If we believe that there are four Planetouched who will save the Kaino people, then four Planetouched will come to us. We simply need to encourage the Planetouched to dare believe that they could be those heroes."
 kaino_maikirow_1_title:0 "Golden Opportunity"
 kaino_maikirow_1_desc:0 "Binwarji's secret power has always been their wealth. The minds of men are easily swayed by gold. The weakness at the heart of Binwarji's Fangualan Empire was buried beneath their ability to pay for mercenaries to fight on their behalf. Now, their gold mine at Warjifara is closed. The lords of the mine are furious at the recent lack of protection and the disdain with which their traditional privileges granted to them by the Binwarji nobility have been treated.  And as they control the mine, and thus control the flow of gold, Binwarji has not been able to force its reopening using the mercenaries they so frequently used to rely upon.\n\nBinwarji is on the brink of collapse without this gold. We can, and should, help it along, by keeping that mine closed by all means at our disposal. Our agents are already busy spreading rumors that the Binwarji plan to execute them all, even if they relent and reopen. This is barely even an exaggeration. The former lords of the empire consider themselves the rightful heirs of the land of authority and would never stand for such a challenge to their authority to remain unpunished."
 kaino_maikirow_3_title:0 "Sinister Whispers"
 kaino_maikirow_3_desc:0 "The Dao Nako rainforest holds many secrets. The artifacts of the Shadow Lich, the relentless buzzing of the adze. But some are even older. Older than Fangaula, older than the genies, older than humans. So old as to be unknowable. And one of these primordial mysteries whispers to us."
 kaino_maikirow_2_title:0 "The Empire's Failure"
 kaino_maikirow_2_desc:0 "The Second Fangaula Empire never cared about its subjects. They had a hierarchy. The Binwarji were at the top. The Kaino were at the bottom. For almost three millennia, the Kaino have been condemned to the bottom rung of Fangaulan society, an entire people condemned in perpetuity for the sins of their distant ancestors. We have now taken the first step to reversing that ancient injustice."


 #events

 flavour_kaino.1.t:0 "An Adze Swarm"
 flavour_kaino.1.d:0 "Elonga held his breath and bent down to place the wooden fuel around the corpse, his partner standing guard. The light cloth mesh cascaded down from his hat, protecting his body from the mosquitoes. A spark from his flint and the body started to burn. “There’s some more over by that tent, we can do those and call it a…oh, Ashen Skies, it’s here…”\n\nThe mosquito swarm had huddled together, forming the shadowy outline of a man, until a dark flash of light emerged from within the buzzing mass. And suddenly, a dark, bald man with lifeless eyes, one of the most feared monsters in the Dao Nako, stepped forward: an Adze.\n\nIt picked up one of the ironwood spears and flung it awkwardly at Elonga. Though the cloth hanging down from his hat hindered his movement, he was able to sidestep the attack and narrowly dodge the spear. “You missed, you bloodthirsty son of a…Oh - that’s not good."\n\nThe spear had missed his body, but it had torn through the mesh guarding him. With a faint popping sound, the adze disintegrated into thousands of mosquitoes and flew towards Elonga. He futilely tried to grab the two ripped pieces and tie them together, but the mosquitoes swarmed through the tear regardless. A thousand mosquito bites at once drained every drop of blood from his body in an instant."
 flavour_kaino.1.a:0 "We clearly aren’t getting those ironwood weapons back."
 flavour_kaino.2.t:0 "That Faint Buzzing"
 flavour_kaino.2.d:0 "The plan had been to hold a trial for those who started this most foul worship of genies. Though our military conquest had been completed years ago, there still remained stubborn pockets of those who worshipped the genies and plotted their return. Luckily, the last vestiges of their cult had been located, but the warriors who breached their encampment came back to report that they encountered naught but corpses and swarms of mosquitoes.\n\n”A mass suicide?” asked [Root.Monarch.GetName], pushing past some of the crudely constructed barricades. “Did they think they could summon a genie this way? All they appear to have summoned are swarms of mosquitoes”\n\nRight as [Root.Monarch.GetSheHe] said that, [Root.Monarch.GetSheHe] felt an arm grab [Root.Monarch.GetHerHis] shoulder and yank [Root.Monarch.GetHerHim] back - a Jelli, one of the wise men of their tribe. “Those aren’t normal mosquitoes. Mosquito swarms are not that dense. You need to get out of here now. This is the work of an adze, likely multiple, judging by the number of bodies.” \n\nThe warriors and advisors with [Root.Monarch.GetName] quickly recoiled. One started frantically swatting at the handful of mosquitoes around them until the Jelli intervened. “Swatting them won’t help. We need to back out. Take some hydra oil, alight our arrows and fire them en masse into this encampment. It is safe to assume that the genie cult is completely dead. We have bigger things to worry about now.”"
 flavour_kaino.2.a:0 "Kill those mosquitoes. Kill them with fire!"
 flavour_kaino.3.t:0 "Free of Sin, Full of Flames"
 flavour_kaino.3.d:0 "The air was humid as the crowd waited for [Root.Monarch.GetTitle] to speak. Hani slapped at a mosquito buzzing around her arm, then flashed a smile as the procession of senior warriors marched past her. It seemed representatives from every clan and tribe were present - at least those who did not still hold grudges against us.\n\n”We are free”, boomed the voice of [Root.Monarch.GetName], silencing the murmuring crowd suddenly until only the faint buzzing of mosquitoes remained. “We have been free of the sins of our ancestors for over a thousand years. This name is one we now bear with pride!”\n\nThe crowd cheered. Hani started coughing, slapping away another mosquito, before quickly excusing herself. She felt short of breath, the air felt too thick. “We are no empire of Fangaula. We are the federation of the Kaino people, and our spirits are finally ablaze after centuries of being left to fester in fetid waters. Now that we have caught fire, it is time for the rest of Fangaula to learn to repent for their own sins. The all-encompassing suffering of our people shall end, and soon they will…”\n\nHani could not hear [Root.Monarch.GetHerHim] anymore. The buzzing seemed to drown out the speaker. Her vision was darkening, her skin screamed in pain, her vision clouded with a black swarm."
 flavour_kaino.3.a:0 "A disease is spreading."
 flavour_kaino.4.t:0 "Safety in Death"
 flavour_kaino.4.d:0 "The Shadow Lich stood a fair distance away from the pyre. Most people did not wish to see a walking skeleton right after their loved ones died, not least one capable of making their remains walk again. The son, an apprentice mage, stayed behind after the rest of the mourners left and trudged up the hill to speak to Kaino. “I am surprised you still let us burn our dead. Are the rumours false that you plan to raise an undead army?”\n\n”Do you know why raising the dead is considered such an evil act, young acolyte? It is because you have bound a soul to continued torment in its former body. I cannot think of an act more cruel.” The mage sat down on the grass next to the lich, watching the sunset over the smouldering pyre. “I thought so. You don’t seem like you want to spread suffering. It’s hard to read your face due to…you know”. He gestured vaguely at Kaino’s fleshless visage. “But you have been quite clear that you want to end our suffering.”\n\nKaino sat down on the grass next to the apprentice mage. “We are indeed going to raise an army of the dead. But it will be composed of the bodies of those we kill, for this way we maintain a balance. To live is to suffer. When we strike them down, their suffering ends. To raise them back is to continue the suffering. If we had not killed them, their suffering would continue regardless. Only once we are done, then all shall find safety in death.”"
 flavour_kaino.4.a:0 "Sounds reasonable…I think?"
 flavour_kaino.6.t:0 "Coalition of the Willing"
 flavour_kaino.6.d:0 "It is not that the people of Fangaula did not believe that the Shadow Lich had returned. Condemnations had been flowing in from messengers - at least the ones we have not yet been crushed beneath the boots of our armies. But the first sight of an undead army marching out of the Dao Nako dramatically changed the resolve of those left that could oppose us. This fight, they say, is existential. Even if the chances of success are minuscule, they must resist us, for if they do not fight now, there will never be a chance to fight ever again."
 flavour_kaino.6.a:0 "Bring it on, then!"
 flavour_kaino.7.t:0 "The Coalition"
 flavour_kaino.7.d:0 "Kaino stood atop a hill, leaning on his staff. The assembled armies of Fangaula - what was left of them anyway - could be seen camping just below the horizon. Two mages made their stumbling way to the top of the hill behind him, Kaino having walked far ahead of them. One of them swung his staff angrily at an inquisitive ram, which retaliated by headbutting the offending wizard until he fell over. The other mage started to chant a simple drain life spell, but Kaino held out a bony palm to stop him. He tapped the ground twice and the ram shuffled its feet and sat down.\n\n”What purpose would have been served by killing this creature? You wish to prove you are stronger than it? That it caused you grave offence?” Kaino reached out and scratched under the ram’s chin. “Do not conduct acts of cruelty out of malice or anger. Do not take a life without a purpose.”\n\nKaino turned back to affix his gaze on the scattered Fangaulan armies. “They at least come here with a purpose. They believe their fear, their pain, their suffering, will end if they can strike me down. Were that true, I would let them. They could end this federation we have built and I would be overjoyed.\n\nHe tapped the ground with his staff again. The ram’s head dropped to the ground."
 flavour_kaino.7.a:0 "End them."
 flavour_kaino.8.t:0 "You Deserve Death"
 flavour_kaino.8.d:0 "[Root.Monarch.GetName] stared at the floor, not moving a muscle, while the Shadow Lich continued his speech. “We have come so far already, but the world is so much larger than I had thought. For every moment I feel elated at our progress, I am soon overwhelmed by the reminder of how many still suffer. You must feel it, too. The joy you feel now?” [Root.Monarch.GetName] did not move nor speak at all. “Yes, this joy is temporary. Soon enough, it shall all be consumed by grief, sorrow, and pain once again.”\n\nKaino continued to pace around and monologue, but the ringing in [Root.Monarch.GetName]’s ears started to drown out the Shadow Lich’s words. Nothing registered anymore. If only [Root.Monarch.GetSheHe] let [Root.Monarch.GetHerselfHimself] think, [Root.Monarch.GetSheHe] would surely become overwhelmed by the knowledge of what their realm was doing. Out of [Root.Monarch.GetHerHis] peripheral vision, they noticed Kaino had stopped moving and was speaking directly to [Root.Monarch.GetHerHim], although nothing he said registered.\n\n“...Your heir has already followed this fate. At this moment, when you feel at your greatest, it is when it should end. You have done so admirably by your people in pursuit of my dream. You deserve death.”\n\n[Root.Monarch.GetName]’s body did not move. The eyes stayed open. There was no visible change beyond their eyes. All that had changed was that [Root.Monarch.GetHerHis] heart stopped beating."
 flavour_kaino.8.a:0 "Our army has grown by two more."
 flavour_kaino.9.t:0 "Confide in Me"
 flavour_kaino.9.d:0 "“Why do these fools not understand!” A ball of lime-green fire burst forth from Kaino’s staff, causing Aya to wince as it arced through the air and crashed into a nearby abandoned house. “Do these people never consider anyone else? What they must go through? Why must I be surrounded by those utterly devoid of empathy.” He gripped Aya’s shoulder, his bony fingers digging into her shoulder. “They cannot be blind to the suffering we endure every single day. The knowledge that it will return means that there is no such thing as joy, for it is overwhelmed by the inevitability of grief.”\n\nKaino loosened his grip on Aya’s shoulder, leaving deep indents in her skin, her blood seeping out and staining her dress. Then he spun around and gripped her arms even stronger. “You understand me, don’t you? How our pain could end if we just stopped? The exhausting reality of existence, I can see it in everyone’s eyes. I can see it in yours, too.”\n\nHis grip softened and he brushed a strand of hair out of Aya’s impassive face. “I truly am sorry for putting you through this. It is my most fervent desire to grant you, too, the mercy of death, but you are the only one I can confide in. You are the only one who understands my vision. You cannot be allowed to relinquish your position guiding our project to completion; not yet anyway.”"
 flavour_kaino.9.a:0 "Aya’s face did not change."
 flavour_kaino.10.t:0 "Paradise Must Wait"
 flavour_kaino.10.d:0 "Kaino walked into the throne room and chased out the few acolytes bustling around that still wore their living flesh. Aya was instructed to stay, with the Shadow Lich directing her back to her throne. He walked slowly towards where she was seated, stumbling slightly on the uneven floor. Aya locked her face into the type of smile Kaino liked. The scars on her arms were a constant reminder of the smiles he did not.\n\n“I had wished to send you to paradise for the longest time, my dearest Aya. Every day I see this face of yours, I am reminded of the suffering I am putting you through by not allowing you to end your own life. Yet this realm needs a ruler like you who understands the ultimate goal. I need you. I…I need…”\n\nKaino fell to his knees and gripped Aya’s hands. Aya’s face did not move. “I may not have a heart, but I still feel love. I ache for the people of Halann, for my love for them is simply too great. It is that love that drives me. But for you, my love…” He raised his hand to her face and plucked a single grey hair from her head. “I simply cannot allow you to leave me. It is selfish, and doing so may only bring both you and I greater pain, but I feel I can no longer do this alone. Your suffering must continue. You must join me on my path. You must become a lich.”"
 flavour_kaino.10.a:0 "Aya’s face did not change."
 flavour_kaino.11.t:0 "What Lies Beyond Lichdom"
 flavour_kaino.11.d:0 "The two skeletal figures faced each other, the green dots behind their eyes the only signs that they were different from the thousand of skeletons that made up the armies of the Kaino Federation. Kaino stepped forward and lowered the hood of Aya’s robes, placing his bony hand on her skull.\n\n“I have been struck by many tragedies today. The first, most vain, is you have lost your outward beauty, but that was inevitable. Beauty is a joy, and like all joy, its only certainty is its inevitable loss. The second is that you must continue to live. You are a victim of my selfishness, but I know deep inside you wished for this, too. Even as you knew the pain would continue, you understood my plans, understood their fundamental importance.”\n\nKaino stepped back and let his gaze sweep over Aya’s new lich body. “The third tragedy is that even this may not be enough to keep you by my side. Lichdom theoretically allows for a permanent existence, but the world has many ways of restoring itself. When they realise your courageous deed, your ‘sin’, the Red Reapers will hunt you down. I could make you a shadow lich, but…”\n\nKaino started pacing around, muttering to himself. “...I could just fight the reapers…no, that is too risky…but I cannot allow the process of becoming a shadow lich to be known by more people…too dangerous, too dangerous…”\n\nKaino stopped pacing, nodded to himself, and turned back to Aya. “We shall just have to complete our plans before the Red Reapers notice the discrepancy in the weave of reality. It will likely take them a few centuries to mobilise. If someone were to capture you before we completed the shadow lich ritual, they could extract the knowledge and possibly destroy me, and that cannot be allowed to happen.” He stepped forward and placed his hands on Aya’s face once more. “We shall just have to save the entire world before then, my love.”"
 flavour_kaino.11.a:0 "Aya’s face did not change. It could never change again."
 flavour_kaino.12.t:0 "Carrion Call to the Adze"
 flavour_kaino.12.d:0 "What were we thinking? Did we really think using Kaino’s skull would somehow rid us of the adze? Instead they acted as a clarion call for death itself. Whatever latent magic lay in those artefacts did nothing more than summon the mosquitoes. Swarms upon swarms of them, the densest clouds coalescing into the Dao Nako’s most terrifying monster. The shapeshifting adze, disintegrating in an instant into thousands of mosquitoes that swarmed the mages and the artefacts they had so naively tried to study.\n\nThe adze did not just attack those studying the artefacts either. In their humanlike forms the adze walked the grasslands, their mosquito swarms hounded the towns and hamlets of the Dao Nako. It seemed every adze on the entire continent had been sent into a feeding frenzy, hunting for prey."
 flavour_kaino.12.a:0 "What have we done?"
 flavour_kaino.13.t:0 "An Infected Capital"
 flavour_kaino.13.d:0 "[Root.Capital.GetName] had become a ghost town. People only left their rooms shrouded in cloth. The faint buzzing of innumerable mosquitoes resonated through the entire city, dark clouds of the hovering pests obscuring the sun. Some adze wandered freely through the streets. They had swiftly learned that they just needed to swipe at the cloth with a sharp edge to cut it, at which point they would shapeshift back into their swarm form and descend upon their hapless victim. Soon, people were dying in their homes, too fearful to leave to even get water."
 flavour_kaino.13.a:0 "How do we stop their rampage?"
 flavour_kaino.14.t:0 "Mourning"
 flavour_kaino.14.d:0 "The windows were boarded shut. The child, only a few weeks past his sixth birthday, helped drag the wood to the great furnace. Usually a chief would command a grander funeral. But there were too many bodies and too little time to plan such an elaborate ceremony. They must all be burnt, and quickly at that, both so their bones could not be used as tools for the Shadow Lich, and because it was the only way to ensure that their corpse would not become a spawning ground for new adze.\n\nSo [Root.Monarch.GetName] burnt on the pyre. The child was guided out of the chamber as various entrances were unblocked to let the smoke escape. There was no time to mourn. The adze could return."
 flavour_kaino.14.a:0 "Another victim"
 flavour_kaino.15.t:0 "The Shadow Lich"
 flavour_kaino.15.d:0 "There were three people in the room, though only one still breathed. [Root.Monarch.GetName] stumbled away from the corpse of the recently deceased child, pointing a fire poker - the only weapon [Root.Monarch.GetSheHe] could find at that moment - at the skeletal figure walking in through the door. “This was all your doing. You brought them here. Have you come to curse our people again!?”\n\nThe robes fluttered as the figure stepped forward, revealing feet of pure white bone. “To live is a curse…” under the robe, a faint green glow emanated from bright green dots dancing in the hollow eye sockets of the skull. “Each day is another chance to suffer. At least this little one cannot suffer anymore.” He reached out a skeletal hand towards the deceased child. [Root.Monarch.GetName] leapt forward on instinct and swiped at the hand with the poker. Momentarily taken aback by [Root.Monarch.GetHerHis] own bravado, [Root.Monarch.GetSheHe] stood up straight and pointed the poker at the figure’s head. “Leave now, Shadow Lich. We have suffered enough.”\n\nA brief silence, interrupted only by an incessant mosquito buzzing growing louder. “You misunderstand. I have no desire to extend your suffering. I am here to-”\n\nThe door creaked open. A dark-skinned man with dead eyes stood in its frame, hand outstretched. It slowly dropped its hand, then with a faint popping sound, disintegrated into thousands of mosquitoes that started swarming towards [Root.Monarch.GetName]. [Root.Monarch.GetSheHeCap] dropped the poker and lifted [Root.Monarch.GetHerHis] hands in a futile attempt to protect [Root.Monarch.GetHerselfHimself], until suddenly the entire cloud burst into bright green flames. In the eerie afterglow stood the skeletal figure, its staff raised. “It took several hundred years to develop this spell, but it is easy to learn. I can teach your mages, it won’t take long until they have learned how to protect our people.” He dropped the staff, stepped forward and spread his arms. “I meant what I said. I can end the suffering of the Kaino people. Your people. My people.”"
 flavour_kaino.15.a:0 "The Shadow Lich Kaino has returned!"

 flavour_kaino.30.t:0 "Apotheosis of Mercy: Horashesh"
 flavour_kaino.30.d:0 "”In Horashesh there stands a great spire. It long predates my existence, for it was left for us by the gods themselves. Left by which gods, though, and for whom? Was it created for our people as a bridge to the afterlife? Was it left for the lizardfolk as a bridge to the stars? Perhaps it was left for the halflings as a beacon of light, calling them to leave their island and take back the mainland.”\n\n”I have lived long enough to know the answer is both all of these and yet none at the same time. The ambiguity is the point. It was left by the gods as a cruel joke to prolong our suffering. There will never be an equilibrium reached where every side is truly satisfied. We must continue to fight and war and see access to this cursed obelisk change hands over and over again.”\n\n”We can end this ceaseless cycle of war and pain. End all who try to take these lands and we can call time on the god’s joke.”"
 flavour_kaino.30.a:0 "To conquer Horashesh"
 flavour_kaino.31.t:0 "Apotheosis of Mercy: Horashesh"
 flavour_kaino.31.d:0 "“We are approaching the apotheosis of my plans. I do hope that while I have been distracted conducting this great magical project that our generals have not disappointed me.”"
 flavour_kaino.31.a:0 "About that…"
 flavour_kaino.31.b:0 "All has progressed as you commanded."
 flavour_kaino.32.t:0 "The Apotheosis"
 flavour_kaino.32.d:0 "Kaino stood in front of the great pillar of green light, his cloak billowing out behind him, the wind strangely silent despite its strength. “As the ages move, new ways to feel pain emerge. Old wounds in our collective psyche re-emerge. Generational trauma manifests in new ways. I have seen it. Time and time again I have seen a new age dawn, bringing with it new strife.”\n\n“I will end that. With the turning of a new age, I shall bring forth the truth of how to end it, once and for all. My ultimate mercy will arrive. Know this, all who receive this message. Your salvation is nigh.”"
 flavour_kaino.32.a:0 "The inexorable trek towards apotheosis begins."
 flavour_kaino.33.t:0 "Apotheosis of Mercy: Gnolls"
 flavour_kaino.33.d:0 "”They say gnolls were created by the genies”. Kaino inspected the bone of a long-deceased gnoll in his hands. “Regardless of the veracity of these claims, it was an abominable failure of a creation - though the creation of any lifeform that understands the pain of existence must be viewed as a catastrophic error. Many humans agree with this assessment, although they usually consider the failure to be tied to their demonic heritage.”\n\n”No, their greatest failing was in their ability to extend the suffering of those who died. You see, when a gnoll eats a dead body, part of the soul of the ingested person enters the soul of those who devoured them. It is but a faint whisper, like the memory of a memory, but it is there.” Kaino tossed the jawbone to the ground. “A soul that had finally managed to find freedom was torn asunder so that part of it may remain in the land of the living. I cannot think of a crueler fate. In granting our mercy, we can end this chain of suffering.”"
 flavour_kaino.33.a:0 "We devoutly march towards his apotheosis."
 flavour_kaino.34.t:0 "Apotheosis of Mercy: Gnolls"
 flavour_kaino.34.d:0 "“We are approaching the apotheosis of my plans. I do hope that while I have been distracted conducting this great magical project that our generals have not disappointed me.”"
 flavour_kaino.34.a:0 "About that…"
 flavour_kaino.34.b:0 "All has progressed as you commanded."
 flavour_kaino.35.t:0 "Our Apotheosis"
 flavour_kaino.35.d:0 "The hooded figures of the Bringers of Mercy formed rings around the bright, green light, wind billowing around them. As Kaino chanted the final words of his spell, the people began to fall. Their robes fell to the ground empty, whoever stood in them moments before disappearing into the wind. Kaino lowered his hands as the winds died, with only [Root.Monarch.GetName] left by his side. “I require new bodies to fill those robes for the final time I run this ritual. Our apotheosis is not yet complete.”"
 flavour_kaino.35.a:0 "Our apotheosis is nearing completion."
 flavour_kaino.36.t:0 "Apotheosis of Mercy: Kheterata"
 flavour_kaino.36.d:0 "Kaino stood on the banks of the Mother’s Sorrow, the river’s water lapping around his ankle bones, soaking the hems of his robes. “This is where it happened. Right here.” Kaino thrust his staff into the slick mud on the river bank. “The first empire of humankind. An Empire of Sorrow, built atop the backs of slaves. Even this river itself.”\n\nKaino looked back at [Root.Monarch.GetName] and tapped his cane beneath the river’s waters again. “Did you not know? Understandable, for I think very few alive today do know this truth. Even the khet do not understand where Elikhet got his power from. At the bottom of this river lie hundreds of trapped genies. The suffering of their continued existence seeps through these lands with a pain that suffuses their entire empire. In the past I have wondered if it is perhaps their fault that suffering is spread so freely across Sarhal. I now know this to be false. Suffering is fundamental to existence. Nevertheless…”\n\nKaino gazed out over the river again. “It would do us well to end the mistake that is Kheterata. It is the lynchpin of human existence. Without it, the truth may at last be unveiled to the world.”"
 flavour_kaino.36.a:0 "As you wish."
 flavour_kaino.37.t:0 "Apotheosis of Mercy: Kheterata"
 flavour_kaino.37.d:0 "“We are approaching the apotheosis of my plans. I do hope that while I have been distracted conducting this great magical project that our generals have not disappointed me.”"
 flavour_kaino.37.a:0 "About that…"
 flavour_kaino.37.b:0 "All has progressed as you commanded."
 flavour_kaino.38.t:0 "His Apotheosis"
 flavour_kaino.38.d:0 "As the winds died down and the green light faded, Kaino dropped his arms, standing still for a few seconds, then hurled his staff to one side. “I cannot make the world understand the truth! No matter how grand a ritual I conduct, I cannot reach those who do not already follow, who have not already opened their eyes to the truth. Their ignorance infuriates me. They determinedly close their minds to the path of mercy.”\n\nKaino collapsed to his knees and tore at the grass around him. “We must end them all. The punishment for their stubborn insolence will be their extra years of existence. My mercy is thwarted for I cannot kill all of them in an instance. There is no other option. Kill them all.”"
 flavour_kaino.38.a:0 "What was he trying to do?"

 flavour_kaino.42.t:0 "A Romantic Intermezzo"
 flavour_kaino.42.d:0 "Kaino shuffled his feet, dust kicking up between the bones in his feet, looking unusually awkward considering his typical assuredness. “I do not know why you are insisting on this. Do we not have greater things to worry about, Aya? My apotheosis is not yet complete, yet you insist on - oh…”. Kaino stopped in his tracks, spotting markings in a tree. His fingers traced their grooves. “How did you know about this place?” \n\n”In lichdom, it’s easy to find time to devote yourself to a project.” Aya laid her hand over Kaino’s on the tree markings. “If I am to devote my life to being your solace before the end, I wish to know everything about you. Tracing the echoes of your magic is how I found this. It is not that old, either, at least when compared to all the time you spent as a shadow lich.”\n\nKaino traced the symbol on the tree a few more times, before letting his hand drop to his side. Aya wrapped her bony fingers in between his and leant against him. “I used to work on a farm near here. The owner was blind so they did not see my skeletal figure, but they were kind and let me tend to the sheep. It was peaceful; the closest I had felt to tranquility ever.” \n\n”Her daughter had a child born with a head of flames. A fire planetouched, and a powerful one at that. The God’s Atoners of the Fangaulan Empire eventually took the child from the mother. When she resisted, they killed her, and the rest of her family. I did locate the child many years later, or at least their corpse. They had died during a training exercise.”\n\n”It was then that I realised the truth. The only true tranquility is found in death. If I had killed the blind farmer when I met her first, the suffering of her family and the pointless death of their grandchild would never have occurred. There is no world in which the joy of that child’s birth can match the pain felt in its death. The two simply are not equal.” Kaino gripped Aya’s hand harder. “Even as I stand with you now, feeling an indescribable joy, it will never match the suffering the future inevitably holds for us.”\n\nThe two stood in silence for a while, hand in hand, as the sun set over the empty farm. “But perhaps, for now, let me lie to myself and pretend this tranquility will last. At least for tonight."
 flavour_kaino.42.a:0 "A solemn yet intimate outing."
 flavour_kaino.43.t:0 "A Moonlit Date"
 flavour_kaino.43.d:0 "The full moon lit the various skeletal figures on the beach as they hauled a collection of instruments onto the beach. Multiple djembe - percussion instruments where sheepskin is pulled tight over a large wooden goblet - were set up with undead lightly tapping on them. A skeleton tapped pegs on a balafon - another percussion instrument - while a third strung a few strings on a kora. Aya stared around the nightlit beach in befuddlement. “I am failing to see what this has to do with your apotheosis.”\n\nKaino shuffled around the clearing surrounded by the impromptu necromantic band, kicking shells and driftwood out of the sand. “I used to play for festivals in my village before I became a lich. It took some practice to get these skeletons to play to my standards, and I am not fully pleased with the current performance, but I’m hoping the sounds of the waves will mask any imperfections.” He turned to Aya and held out his arm, the pale white bones of his hand reflecting the moonlight, as the skeleton band started playing an awkward, out of sync tune.\n\n“You brought me temporarily back to a time before I faced the truth of the world. I could, for that moment, live in the present, for I did care that the future held sorrow in store. Today I wish to go further back. Back when I had skin and flesh. Back when I had hope. I know it is a lie, but for now I ask of you: join me in this lie.”"
 flavour_kaino.43.a:0 "And so the two liches danced until the sun rose."
 flavour_kaino.44.t:0 "To Become a Shadow Lich"
 flavour_kaino.44.d:0 "”You can see it in their faces when they die. The clarity of imminent death grants them the revelation that finally they no longer have to suffer. Their futures are clear, and in that there is peace.” Aya cleared the last skeleton attendant out of the room as Kaino continued to monologue. “Yet until they find that clarity, their fight vexes me. I know it is not their fault, but I wish they could see things as I do.” Aya sat down next to Kaino and placed her hand on his lap.\n\n“They will all understand your vision soon enough” said Aya, her voice as soft as possible for a being reduced to bones. “But our future lacks the same clarity. I fear the Red Reapers may take me before I can see your plan through. But greater than that, I fear that not knowing if your plan succeeds will follow me past death, denying me the solace of peace. I need to be there with you at the end.”\n\nAya held both of Kaino’s hands. “Make me a shadow lich. Teach me the secret of your curse, so I can share it with you. I cannot in truth say we are as one as long as our destinies are not shared.”\n\nThe two sat in silence for several minutes, Kaino staring downwards. Aya never let go of the Shadow Lich’s hands. This was not the first time she had brought this up. Finally, Kaino spoke.\n\n”If you travel to the shadow plane, if you step out at the correct angle, you will enter the empyreal between planes. There you can place your soul and bind it to the plane itself. The Red Reapers would never think to look there, as they are bound by the reality in the planes themselves. Few even know how to get to that place.”\n\nAya placed her hand on the side of Kaino’s face and, keeping her voice as steady as possible, said: “Take me there. Lay our souls next to each other. Make me a shadow lich. Then, when we have completed our task and we are the final two beings in the whole of creation left who are capable of suffering, we can return and together end our shared suffering.”\n\nThe silence continued for even longer. The green dots in Kaino’s eyes flickered and shimmered, never fully looking back at Aya. But she remained still, holding her expression, knowing if she left, he would back out again. Until finally, in an almost inaudible whisper, he said…."
 flavour_kaino.44.a:0 "”I will take you there.”"

 flavour_kaino.50.t:0 "Kaino's Soul"
 flavour_kaino.50.d:0 "The swirling shadows gave way as Kaino and Aya stepped out into nothingness. “Even if the Red Reapers thought to look out here, it would be nearly impossible to find my soul,” said Kaino, leading Aya by the hand. “The empyreal is infinite - theoretically at least. But one’s soul is like a beacon. As you always know where your phylactery is, I, too, always know where my soul resides. Even when it is bound to this infinite void. See?”\n\nThe shadows beneath their feet briefly parted and bound in chains of wisps lay the body of a human. Gaunt, decrepit, a haunting countenance, the grooves beneath the skin marking the memory of a skeletal structure, but seemingly still breathing. Kaino knelt down beside it. “The process of becoming a lich was less advanced in those days. It was not as clear that the body itself did not need to live to keep the soul contained. Now you get to transport your soul in a small container. Convenient, and far less traumatic to experience, if you can believe it. Now take out your phylactery and I will start creating the bindings.”\n\nKaino turned around and reached into the shadows, muttering some ritual in an ancient, dead tongue. With his back turned, Aya reached into her sleeve, past the phylactery stored there, and grabbed hold of a dagger."
 flavour_kaino.50.a:0 "Stab Kaino."
 flavour_kaino.50.b:0 "Become a Shadow Lich."
 flavour_kaino.51.t:0 "Denial"
 flavour_kaino.51.d:0 "Kaino let out a scream that appeared to come from every direction at once. “No, what are you doing?! Where did you find that?! Stop, stop, stop!” He screamed again, convulsing, reaching out with his hand to try to pull the dagger out of the body. Aya tore it out before he reached it. The Shadow Lich placed his skeletal hand over his human body’s wound as it seeped out dark red, almost black blood, but the effort caused him to collapse. “Block the wound, block it please. It can still be stopped if you-”"
 flavour_kaino.51.a:0 "Stab Kaino."
 flavour_kaino.52.t:0 "Anger"
 flavour_kaino.52.d:0 "Kaino screeched again, but this time launched himself forward at Aya, wrapping his bony fingers around her neck. Not that this attack achieved anything, as there was no breath to strangle, but in that moment it seemed Kaino in his blind rage did not care. “I shall bind you inside the shadow plane itself. You shall experience the ultimate pain, where death is always present but never complete. You will see relief but never experience it. You will only know suffering, as I have!” Kaino’s grip slipped, his fingers stained red with the blood from his soul container, and he collapsed in a heap on the floor again, screeching incoherent obscenities."
 flavour_kaino.52.a:0 "Stab Kaino."
 flavour_kaino.53.t:0 "Bargaining"
 flavour_kaino.53.d:0 "”I can take you north to see the lights. You have never seen them, have you? We can dance beneath them as they dance across the sky.” Kaino pulled himself forward and grabbed onto the hem of Aya's robes. “I can take you to Amldihr, the greatest hold of Aul-Dwarov, and stand in the Hall of the Ancestors. We can hold a concert greater than any the dwarves have ever held, and stand atop a stage with an audience larger than any before.” He tried to pull Aya closer to him. “I can take you anywhere.”"
 flavour_kaino.53.a:0 "Stab Kaino."
 flavour_kaino.54.t:0 "Depression"
 flavour_kaino.54.d:0 "”The world is condemned by your hand, you realise that? We could have saved it.” Kaino lay motionless next to Aya as she pulled the knife out of the body again, blood covering her hand. Kaino barely even flinched after the fourth stab wound. “The suffering will continue. I was a fool to think there was a possible future without it. I allowed myself to hope. Joy is fleeting, while suffering is eternal, and eternity will always win.” His head turned and looked up at Aya. “Stab me again, and end me for my folly of believing the future could end.”"
 flavour_kaino.54.a:0 "Stab Kaino."
 flavour_kaino.55.t:0 "Acceptance"
 flavour_kaino.55.d:0 "”I love you”"
 flavour_kaino.55.a:0 "Stab Kaino."
 flavour_kaino.56.t:0 "Death of an Immortal"
 flavour_kaino.56.d:0 "The two green lights within the Shadow Lich’s sockets flickered one last time and disappeared. The skeleton dropped to the formless floor and instantly disintegrated into dust, whatever magic had held it together evaporated in an instant, leaving only his robes in a crumpled heap on the floor. Aya picked up the robes, shaking them to remove the bone dust, then laid them out flat onto the shadows. She dipped her finger into the open wound of the dead body below her and traced her finger along its back, leaving a red trail. Dipping her finger in again, she traced another line, and another. It was far from her best work. She was out of practice after all. But she was the only audience here, and she knew what it was, which was all that mattered."
 flavour_kaino.56.a:0 "Finally, a chance to paint."
 flavour_kaino.57.t:0 "Aya"
 flavour_kaino.57.d:0 "For the Kaino people, their name was a punishment. For siding with the ancient Shadow Lich, their future was condemned, their very names taken and replaced with the cursed name of the one that tried to destroy Fangaula. It was a message to everyone else: never trust one of these people. They were never allowed to relinquish these bonds that shackled them to their past, so they returned to the original sin of their ancestors, for it was the only direction left open to them.\n\nThe skeletons scattered across the empty lands of the federation no longer moved. It took a long time for those few left to figure out exactly what had happened, although they knew immediately the significance of the frozen skeletons. The Shadow Lich was dead. The shackles tying them to their past were gone. For the first time in almost three millennia, they could experience something new."
 flavour_kaino.57.a:0 "Hope"
 flavour_kaino.58.t:0 "Immortality in Shadow"
 flavour_kaino.58.d:0 "Aya reached into her robe to pull out her knife, but instead found herself grabbing her phylactery. A voice screamed at her inside her head as she watched Kaino finish the ritual preparations, yet it kept growing fainter. This was not the plan, it screamed. To do this would be to condemn the world to death. But she did not move. She barely even listened to Kaino as he explained the process. She handed him her phylactery and laid down in position. She felt divorced from proceedings, as though she no longer inhabited her own body. She was far above, watching over the ritual as if through a screen.\n\nWhy was she doing this? Did perhaps Kaino cast a spell on her that forced her will? No, she would have noticed that. Kaino was not uniquely powerful, despite his own convictions in that regard. Had she been won over by his argument? That life is not worth living? She thought about it some more…but no, that was not it either. Then what was it?\n\nShe wanted to see what happened. What if she took the other path? What happened when she became a Shadow Lich? None of this was real to her. The deaths were not real to her. It was all past the screen.\n\nAya stood up in her new form. She felt no different. Kaino was talking, but all Aya could gather was the ritual had worked. She was now a Shadow Lich, for whatever that was worth. Was it worth it? Was it worth doing this so she could simply see what it was like to exist on this path? Perhaps she could simply turn away from the screen now, for nothing past this moment meant anything anymore."
 flavour_kaino.58.a:0 "Congratulations."
 flavour_kaino.60.d:0 "Life is innately magical. This is why it is cursed. As Kaino explains, to create a cursed object you need magic. That magic withers when the body perishes. By creating enough dead bodies we can drain that magic for our own research purposes."
 flavour_kaino.60.dd:0 "Not now"


