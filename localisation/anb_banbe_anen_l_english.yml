#Tooltips
 banbe_anen_quest_for_reehanviza_TT: "The Quest for Reehanviza"
 quest_for_reehanviza_tutorial_TT: "For our ruler to achieve §TMastery§! in an aspect of our faith at the end of [Root.Monarch.GetHerHis] path [Root.Monarch.GetSheHe] must reach §Y7§! alignment towards it.\nHaving a §YFocus§! active at the end of the path will grant §G+2§! alignment for that focus.\nAchieving §YMastery§! will provide our ruler with a §GModifier§! until [Root.Monarch.GetHerHis] death as well as §TUpgrade§! the corresponding §YFervor§!.\n\n§gYou can keep track of your ruler's alignments by hovering over the icon in the religion tab.§!"
 quest_for_reehanviza_order_reward_TT: "\nMastering §YOrder§! will provide us with:\nTechnology Cost: §G-5.0%§!\nYearly Innovativeness: §G+0.25§!\nAll Estates Loyalty Equilibrium: §G+10.0%§!\nAs well as upgrade its corresponding §YFervor§! with §G-2.00§! Global Unrest."
 quest_for_reehanviza_chaos_reward_TT: "\nMastering §YChaos§! will provide us with:\nMana Regeneration: §G+0.20§!\nShock Damage: §G+10.0%§!\nSiege Ability: §G+10.0%§!\nAs well as upgrade its corresponding §YFervor§! with §G-0.02§! Monthly War Exhaustion."
 quest_for_reehanviza_gods_reward_TT: "\nMastering §YThe Household Gods§! will provide us with:\nDevelopment Cost: §G-5.0%§!\nBuilding Cost: §G-10.0%§!\nBuilding Time: §G-10.0%§!\nAs well as upgrade its corresponding §YFervor§! with §G+10.0%§! Production Efficiency."
 quest_for_reehanviza_realms_reward_TT: "\nMastering §YThe Outer Realms§! will provide us with:\nAggressive Expansion Impact: §G-20.0%§!\nMercenary Discipline: §G+5.0%§!\nVassal Force Limit Contribution: §G+100.0%§!\nAs well as upgrade its corresponding §YFervor§! with §G+10.0%§! Magical Experience."

