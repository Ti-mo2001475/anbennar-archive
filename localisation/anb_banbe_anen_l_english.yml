#Events
 flavour_banbe_anen.1.t: "Setting off for Reehanviza"
 flavour_banbe_anen.1.d: "Starting event that fires upon clicking the Meditate button. Basically, the ruler is leaving court to go on their sabbatical."
 flavour_banbe_anen.1.a: "I will seek to learn from the nature of reality"
 flavour_banbe_anen.1.b: "I will seek to learn from the unmaking of reality"
 flavour_banbe_anen.1.c: "I will seek to learn from higher powers"
 flavour_banbe_anen.1.e: "I will seek to learn what is beyond my reach"

 flavour_banbe_anen.2.t: "Village Celebration"
 flavour_banbe_anen.2.d: "A report from a village far away from court reports that our ruler had recently passed by, and…"
 flavour_banbe_anen.2.a: "The ruler partied hard and gave away many boons"
 flavour_banbe_anen.2.b: "The ruler went by without fanfare"
 flavour_banbe_anen.2.c: "The ruler lectured on the value of good work ethic"
 flavour_banbe_anen.2.e: "The ruler encouraged everyone to find their own way"
 flavour_banbe_anen.2.f: "The village was inspired by the ruler’s serenity"
 flavour_banbe_anen.2.g: "The ruler visited homes and showed care for the families"

 flavour_banbe_anen.3.t: "Ancient Relics, Ancient Whims"
 flavour_banbe_anen.3.d: "Ruler found a cool relic in an old Precursor site."
 flavour_banbe_anen.3.a: "Study it but don’t activate it"
 flavour_banbe_anen.3.b: "Carry it to take back home"
 flavour_banbe_anen.3.c: "Pull it apart to see how it works"

 flavour_banbe_anen.4.t: "Tragedy Striking When Not Secured"
 flavour_banbe_anen.4.d: "Ruler died. Oh. Rare, no longer able to fire after forming Nirenun Syul."
 flavour_banbe_anen.4.a: "Reehanviza ends early"

 flavour_banbe_anen.5.t: "Working Together for Order"
 flavour_banbe_anen.5.d: "Ruler sees some Ogres working and reflects on the past between their two peoples."
 flavour_banbe_anen.5.a: "Every species has their place"
 flavour_banbe_anen.5.b: "We increased Chaos by fighting them"
 flavour_banbe_anen.5.c: "Tshuriya is always in control"

 flavour_banbe_anen.6.t: "Wisdom, a Gift from the Past"
 flavour_banbe_anen.6.d: "Ruler finds a message left by a predecessor (carved into rock or something)."
 flavour_banbe_anen.6.a: "They say “Focus on teaching others”"
 flavour_banbe_anen.6.b: "They say “Focus on teaching yourself”"
 flavour_banbe_anen.6.c: "I do not need your lessons"
 flavour_banbe_anen.6.e: "A sudden vision of this past elder"







 flavour_banbe_anen.1000.t: "Our Ruler Returns"
 flavour_banbe_anen.1000.d: "His quest for enlightenment is over and..."
 flavour_banbe_anen.1000.a: "He has achieved mastery at last!"

