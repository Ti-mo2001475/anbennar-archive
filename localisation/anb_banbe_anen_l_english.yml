#Events

 #The Quest for Reehanviza

 #### Generic Events ###
 flavour_banbe_anen.1.t: "Setting Off for Reehanviza"
 flavour_banbe_anen.1.d: "Starting event that fires upon clicking the Meditate button. Basically, the ruler is leaving court to go on [Root.Monarch.GetHerHis] sabbatical."
 flavour_banbe_anen.1.a: "I will seek to learn from the nature of reality"
 flavour_banbe_anen.1.b: "I will seek to learn from the unmaking of reality"
 flavour_banbe_anen.1.c: "I will seek to learn from higher powers"
 flavour_banbe_anen.1.e: "I will seek to learn what is beyond my reach"

 flavour_banbe_anen.2.t: "Village Celebration"
 flavour_banbe_anen.2.d: "A report from a village far away from court reports that our ruler had recently passed by, and…"
 flavour_banbe_anen.2.a: "The ruler partied hard and gave away many boons"
 flavour_banbe_anen.2.b: "The ruler went by without fanfare"
 flavour_banbe_anen.2.c: "The ruler lectured on the value of good work ethic"
 flavour_banbe_anen.2.e: "The ruler encouraged everyone to find their own way"
 flavour_banbe_anen.2.f: "The village was inspired by the ruler’s serenity"
 flavour_banbe_anen.2.g: "The ruler visited homes and showed care for the families"

 flavour_banbe_anen.3.t: "Ancient Relics, Ancient Whims"
 flavour_banbe_anen.3.d: "Ruler found a cool relic in an old Precursor site."
 flavour_banbe_anen.3.a: "Study it but don’t activate it"
 flavour_banbe_anen.3.b: "Carry it to take back home"
 flavour_banbe_anen.3.c: "Pull it apart to see how it works"

 flavour_banbe_anen.4.t: "Tragedy Striking When Not Secured"
 flavour_banbe_anen.4.d: "Ruler died. Oh. Rare, no longer able to fire after forming Nirenun Syul."
 flavour_banbe_anen.4.a: "Reehanviza ends early"

 flavour_banbe_anen.5.t: "Working Together for Order"
 flavour_banbe_anen.5.d: "Ruler sees some Ogres working and reflects on the past between their two peoples."
 flavour_banbe_anen.5.a: "Every species has their place"
 flavour_banbe_anen.5.b: "We increased Chaos by fighting them"
 flavour_banbe_anen.5.c: "Tshuriya is always in control"

 flavour_banbe_anen.6.t: "Wisdom, a Gift from the Past"
 flavour_banbe_anen.6.d: "Ruler finds a message left by a predecessor (carved into rock or something)."
 flavour_banbe_anen.6.a: "They say “Focus on teaching others”"
 flavour_banbe_anen.6.b: "They say “Focus on teaching yourself”"
 flavour_banbe_anen.6.c: "I do not need your lessons"
 flavour_banbe_anen.6.e: "A sudden vision of this past elder"

 flavour_banbe_anen.7.t: "Nostalgia"
 flavour_banbe_anen.7.d: "Sudden memories of childhood that give hope."
 flavour_banbe_anen.7.a: "No matter what Chaos I see, there is hope for the future"
 flavour_banbe_anen.7.b: "I must protect our children, no matter the cost"
 flavour_banbe_anen.7.c: "The small memories are what shall sustain us"

 ### Order Events ###

 flavour_banbe_anen.21.t: "Time and Space and Light and Dark"
 flavour_banbe_anen.21.d: "Ruler comes across two scholars arguing about diametrically opposing concepts."
 flavour_banbe_anen.21.a: "Light prevails over dark. and time over space"
 flavour_banbe_anen.21.b: "Dark prevails over light, and space over time"
 flavour_banbe_anen.21.c: "Reconcile them"
 flavour_banbe_anen.21.e: "I see all things"

 flavour_banbe_anen.22.t: "What is Set"
 flavour_banbe_anen.22.d: "Ruler comes across a small child in a field, jumping and reaching towards the sky. “I am trying to fly,” says the child. “I can’t do magic, but if I believe hard enough, it will work!”"
 flavour_banbe_anen.22.a: "Tell the child to keep trying"
 flavour_banbe_anen.22.b: "Give them the cold hard truth"
 flavour_banbe_anen.22.c: "Through magic, all things are possible"

 flavour_banbe_anen.23.t: "Myriad Minds, One Purpose"
 flavour_banbe_anen.23.d: "Finding order in the way a group of insects go about their lives."
 flavour_banbe_anen.23.a: "They all know their place, as I must learn mine"
 flavour_banbe_anen.23.b: "I must rule absolutely, like their insect queen"
 flavour_banbe_anen.23.c: "Small and forgotten, but strong together"
 flavour_banbe_anen.23.e: "I am sure I can apply these lessons to ruling our realm"

 flavour_banbe_anen.24.t: "Teaching in Order to Learn"
 flavour_banbe_anen.24.d: "The ruler is giving a lecture to a group of villagers."
 flavour_banbe_anen.24.a: "You must let go of your greed and practice generosity"
 flavour_banbe_anen.24.b: "You must work as hard as you can to help our society flourish"
 flavour_banbe_anen.24.c: "Nurture your families, and we will be strong"
 flavour_banbe_anen.24.e: "Seek enlightenment wherever you can"

 ### Chaos Events ###

 flavour_banbe_anen.41.t: "The Last Age Of Order"
 flavour_banbe_anen.41.d: "The Ruler reflects and is dreading the fact that they might be needed to reach enlightenment to fix the wheel before the age of order ends."
 flavour_banbe_anen.41.a: "Kibyon Zangyu was chosen and I am his successor!"
 flavour_banbe_anen.41.b: "I have much further to strive"
 flavour_banbe_anen.41.c: "Remember, we am not alone in the cosmos"
 flavour_banbe_anen.41.e: "Enlightenment is a small price for salvation"

 flavour_banbe_anen.42.t: "Malleable Power"
 flavour_banbe_anen.42.d: "Ruler comes across a chance to increase their powers, but at a heavy cost and chance of insanity."
 flavour_banbe_anen.42.a: "I will take it"
 flavour_banbe_anen.42.b: "The risk is not worth it"
 flavour_banbe_anen.42.c: "The Wheel turns by small forces as well as big. I do not need this"

 flavour_banbe_anen.43.t: "Order is not Forever"
 flavour_banbe_anen.43.d: "Visions of the world overtaken by entropy."
 flavour_banbe_anen.43.a: "It seems so much bigger than we can fight alone"
 flavour_banbe_anen.43.b: "There have been many cycles before"
 flavour_banbe_anen.43.c: "There is power in Chaos to fight Entropy"
 flavour_banbe_anen.43.e: "Chaos leads to Entropy"

 flavour_banbe_anen.44.t: "Railing Against Vice"
 flavour_banbe_anen.44.d: "Encounter some sort of prophet with a group of followers saying everyone must change their ways."
 flavour_banbe_anen.44.a: "She’s right, I need to make drastic changes"
 flavour_banbe_anen.44.b: "We follow the path our ancestors did, as Soryrphi decrees"
 flavour_banbe_anen.44.c: "I know she is a false prophet!"
 flavour_banbe_anen.44.e: "This is a great time to restructure the economy!"

 flavour_banbe_anen.45.t: "Headhunter Amidst the Graves"
 flavour_banbe_anen.45.d: "Encounter a man near some tombs who has gone a bit crazy and attacking other people nearby."
 flavour_banbe_anen.45.a: "He is simply lost and needs guidance"
 flavour_banbe_anen.45.b: "Listen to the townsfolk and avoid him"
 flavour_banbe_anen.45.c: "A chance for evocation practice"
 flavour_banbe_anen.45.e: "He is possessed by a malign spirit - bind it to me"

 ### Household Gods ###

 flavour_banbe_anen.61.t: "Sweeping Away The Dust"
 flavour_banbe_anen.61.d: "Ruler finds a small tucked-away shrine that clearly hasn’t been visited in a while."
 flavour_banbe_anen.61.a: "Clean off the shrine"
 flavour_banbe_anen.61.b: "Leave it be - this spirit is clearly weak"
 flavour_banbe_anen.61.c: "Learn the name of this shrine’s spirit"
 flavour_banbe_anen.61.e: "Learn everything we can about the spirit"

 flavour_banbe_anen.62.t: "Tides Shifting Away"
 flavour_banbe_anen.62.d: "As the ruler stares over a cliff, they reminisce of the past pantheons and their diminished status as Household Gods."
 flavour_banbe_anen.62.a: "Everything has its own cycle, rising and falling"
 flavour_banbe_anen.62.b: "They can still teach us much"
 flavour_banbe_anen.62.c: "This is what the weak deserve"
 flavour_banbe_anen.62.e: "Perhaps in some other universe, they are still powerful"

 flavour_banbe_anen.63.t: "Wisdom of an Elder"
 flavour_banbe_anen.63.d: "Ruler has an enlightening conversation with a random old man in a village."
 flavour_banbe_anen.63.a: "No one is too humble to teach me something"
 flavour_banbe_anen.63.b: "Some of our people are losing hope - I must help"
 flavour_banbe_anen.63.c: "He is a great example to all of us"

 flavour_banbe_anen.64.t: "Nourishment of Crows"
 flavour_banbe_anen.64.d: "Animals provide the ruler with food or lead them to water."
 flavour_banbe_anen.64.a: "I am blessed by the gods and so are we all"
 flavour_banbe_anen.64.b: "I need no aid - I will master my body’s desires"
 flavour_banbe_anen.64.c: "The spirits surround us and protect us"

 ### Outer Realms ###

 flavour_banbe_anen.81.t: "To Venture Beyond Borders"
 flavour_banbe_anen.81.d: "A scroll, sent by a courier, detailing our ruler in the city of Bazuniezar and looking at all the cool relics. Made to sound like it's a postcard."
 flavour_banbe_anen.81.a: "I have learnt so much on my travels and I will miss this place"
 flavour_banbe_anen.81.b: "I cannot help but miss [Root.Capital.GetName] and look forward to returning"
 flavour_banbe_anen.81.c: "I’ve decided we must better order our relic study"
 flavour_banbe_anen.81.e: "Every individual I meet has been a blessing"

 flavour_banbe_anen.82.t: "Looking Below One’s Eyes"
 flavour_banbe_anen.82.d: "Ruler finds a relic that causes a psychedelic trip."
 flavour_banbe_anen.82.a: "Visions and pain - now I understand what is next"
 flavour_banbe_anen.82.b: "That was very relaxing"
 flavour_banbe_anen.82.c: "This could help the others find enlightenment!"
 flavour_banbe_anen.82.e: "This would be worth a lot of money"

 flavour_banbe_anen.83.t: "A Message from Beyond"
 flavour_banbe_anen.83.d: "A message from some kind of spirit that appears."
 flavour_banbe_anen.83.a: "Thank you for this wisdom"
 flavour_banbe_anen.83.b: "This weak spirit has nothing to offer me"
 flavour_banbe_anen.83.c: "A chance to increase my power through binding"
 flavour_banbe_anen.83.e: "The spirits know their place and so I will listen and learn"
 flavour_banbe_anen.83.f: "You are here to trick and test me!"

 flavour_banbe_anen.84.t: "A Voice in the Whirlwind"
 flavour_banbe_anen.84.d: "During a great thunderstorm, the ruler hears a voice."
 flavour_banbe_anen.84.a: "Even amidst the chaos, there is serenity"
 flavour_banbe_anen.84.b: "Throw your worst at us, we can handle it!"
 flavour_banbe_anen.84.c: "I understand the power I must claim"
 flavour_banbe_anen.84.e: "I will stand fast against the storm!"

 #Quest for Reehanviza End

 flavour_banbe_anen.101.t: "Our Ruler Returns"
 flavour_banbe_anen.101.d: "[Root.Monarch.GetHerHis] quest for enlightenment is over and..."
 flavour_banbe_anen.101.a: "[Root.Monarch.GetSheHe] has achieved enlightenment at last!"

 #Generic Events

 flavour_banbe_anen.103.t: "The Vision"
 flavour_banbe_anen.103.d: "Honansyul is a visionare and cool AF."
 flavour_banbe_anen.103.a: "Unc still got it"


