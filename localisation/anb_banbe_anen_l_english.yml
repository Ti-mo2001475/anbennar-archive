#Events
 flavour_banbe_anen.1.t: "Setting off for Reehanviza"
 flavour_banbe_anen.1.d: "Starting event that fires upon clicking the Meditate button. Basically, the ruler is leaving court to go on their sabbatical."
 flavour_banbe_anen.1.a: "I will seek to learn from the nature of reality"
 flavour_banbe_anen.1.b: "I will seek to learn from the unmaking of reality"
 flavour_banbe_anen.1.c: "I will seek to learn from higher powers"
 flavour_banbe_anen.1.e: "I will seek to learn what is beyond my reach"

 flavour_banbe_anen.2.t: "Village Celebration"
 flavour_banbe_anen.2.d: "A report from a village far away from court reports that our ruler had recently passed by, and…"
 flavour_banbe_anen.2.a: "The ruler partied hard and gave away many boons"
 flavour_banbe_anen.2.b: "The ruler went by without fanfare"
 flavour_banbe_anen.2.c: "The ruler lectured on the value of good work ethic"
 flavour_banbe_anen.2.e: "The ruler encouraged everyone to find their own way"
 flavour_banbe_anen.2.f: "The village was inspired by the ruler’s serenity"
 flavour_banbe_anen.2.g: "The ruler visited homes and showed care for the families"

 flavour_banbe_anen.3.t: "Ancient Relics, Ancient Whims"
 flavour_banbe_anen.3.d: "Ruler found a cool relic in an old Precursor site."
 flavour_banbe_anen.3.a: "Study it but don’t activate it"
 flavour_banbe_anen.3.b: "Carry it to take back home"
 flavour_banbe_anen.3.c: "Pull it apart to see how it works"

 flavour_banbe_anen.4.t: "Tragedy Striking When Not Secured"
 flavour_banbe_anen.4.d: "Ruler died. Oh. Rare, no longer able to fire after forming Nirenun Syul."
 flavour_banbe_anen.4.a: "Reehanviza ends early"

 flavour_banbe_anen.5.t: "Working Together for Order"
 flavour_banbe_anen.5.d: "Ruler sees some Ogres working and reflects on the past between their two peoples."
 flavour_banbe_anen.5.a: "Every species has their place"
 flavour_banbe_anen.5.b: "We increased Chaos by fighting them"
 flavour_banbe_anen.5.c: "Tshuriya is always in control"

 flavour_banbe_anen.6.t: "Wisdom, a Gift from the Past"
 flavour_banbe_anen.6.d: "Ruler finds a message left by a predecessor (carved into rock or something)."
 flavour_banbe_anen.6.a: "They say “Focus on teaching others”"
 flavour_banbe_anen.6.b: "They say “Focus on teaching yourself”"
 flavour_banbe_anen.6.c: "I do not need your lessons"
 flavour_banbe_anen.6.e: "A sudden vision of this past elder"

 flavour_banbe_anen.7.t: "Nostalgia"
 flavour_banbe_anen.7.d: "Sudden memories of childhood that give hope."
 flavour_banbe_anen.7.a: "No matter what Chaos I see, there is hope for the future"
 flavour_banbe_anen.7.b: "I must protect our children, no matter the cost"
 flavour_banbe_anen.7.c: "I do not need your lessons"
 flavour_banbe_anen.7.e: "The small memories are what shall sustain us"

 flavour_banbe_anen.41: "The Last Age Of Order"
 flavour_banbe_anen.41: "The Ruler reflects and is dreading the fact that they might be needed to reach enlightenment to fix the wheel before the age of order ends."
 flavour_banbe_anen.41: "Kibyon Zangyu was chosen and I am his successor!"
 flavour_banbe_anen.41: "I have much further to strive"
 flavour_banbe_anen.41: "Remember, we am not alone in the cosmos"
 flavour_banbe_anen.41: "Enlightenment is a small price for salvation"

 flavour_banbe_anen.42.t: "Malleable Power"
 flavour_banbe_anen.42.d: "Ruler comes across a chance to increase their powers, but at a heavy cost and chance of insanity."
 flavour_banbe_anen.42.a: "I will take it"
 flavour_banbe_anen.42.b: "The risk is not worth it"
 flavour_banbe_anen.42.c: "The Wheel turns by small forces as well as big. I do not need this"

 flavour_banbe_anen.43.t: "Order is not Forever"
 flavour_banbe_anen.43.d: "Visions of the world overtaken by entropy."
 flavour_banbe_anen.43.a: "It seems so much bigger than we can fight alone"
 flavour_banbe_anen.43.b: "There have been many cycles before"
 flavour_banbe_anen.43.c: "There is power in Chaos to fight Entropy"
 flavour_banbe_anen.43.e: "Chaos leads to Entropy"

 flavour_banbe_anen.44.t: "Railing Against Vice"
 flavour_banbe_anen.44.d: "Encounter some sort of prophet with a group of followers saying everyone must change their ways."
 flavour_banbe_anen.44.a: "She’s right, I need to make drastic changes"
 flavour_banbe_anen.44.b: "We follow the path our ancestors did, as Soryrphi decrees"
 flavour_banbe_anen.44.c: "I know she is a false prophet!"
 flavour_banbe_anen.44.e: "This is a great time to restructure the economy!"

 flavour_banbe_anen.45.t: "Headhunter Amidst the Graves"
 flavour_banbe_anen.45.d: "Encounter a man near some tombs who has gone a bit crazy and attacking other people nearby."
 flavour_banbe_anen.45.a: "He is simply lost and needs guidance"
 flavour_banbe_anen.45.b: "Listen to the townsfolk and avoid him"
 flavour_banbe_anen.45.c: "A chance for evocation practice"
 flavour_banbe_anen.45.e: "He is possessed by a malign spirit - bind it to me"





 flavour_banbe_anen.101.t: "Our Ruler Returns"
 flavour_banbe_anen.101.d: "His quest for enlightenment is over and..."
 flavour_banbe_anen.101.a: "He has achieved enlightenment at last!"

