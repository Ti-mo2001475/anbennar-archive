l_english: 
 sophocracy_republic: "Sophocracy"
 sophocracy_republic_desc: "Rule by the wise: elected magistrates governed not by birth but by demonstrated learning, drawn from the philosophical academies of the Kheionai."
 sophocracy_monarchy: "Sophocracy"
 sophocracy_monarchy_desc: "The crown itself answers to a council of scholars, who confirm and guide each ruler in matters of state."
 sophocracy_flavor_tt: "Upon re-election or the election of a new ruler, grants a level §G1/2/3§! random advisor with a §G25/50/75% cost reduction§!, depending on government rank."

 duumvirate: "Duumvirate"
 duumvirate_desc: "Power divided between the elected magistrate and a consort risen alongside them — one governs, the other commands the republic's armies."
 duumvirate_flavor_tt: "§YEnables Consorts.§! The consort always rises with exceptional martial skill and takes command as a general. A new consort automatically rises upon re-election, the death of the ruler, or the death of the consort."
 duumvirate.1.title: "The Second Chair"
 duumvirate.1.desc: "As is tradition among the Kheionai, the consort who rises beside the elected magistrate has proven their worth not in oratory, but on the field of battle."
 duumvirate.1.rise.tt: "A new duumvir rises, and takes command of the republic's armies."
 duumvirate.1.a: "So it shall be."