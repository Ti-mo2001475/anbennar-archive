l_english: 
#Sophocracy t2
 sophocracy_republic: "Sophocracy"
 sophocracy_republic_desc: "Wisdom is like courage: the best suited to judge wisdom are those already possessing it. Although the voting public must have the final say on who is chosen to lead the nation, our kheion has deemed it wise to create and maintain a council of our wisest citizens tasked with a special duty. They are tasked with ensuring that the chosen man is wise in all aspects of statecraft, or at the very least that he has competent advisors who can help him if he is not."
 sophocracy_advisor_tt: "Upon re-election or the election of a new ruler, grants a level §G1/2/3§! random advisor with a §G25/50/75% cost reduction§!, depending on government rank."

#Duumvirate t3
 duumvirate: "Duumvirate"
 duumvirate_desc: "A Duumvirate divides the Kheionai state between two Kylakes. The civilian Kylakas holds dominion over the economy, taxation, trade, and diplomacy. The other, the Dáftaterodegis, commands the fleets, marshals the armies, and leads men into battle – yet draws his coin from the first, just as the first governs only by the grace of the second's sword. Such is their balance of powers."
 duumvirate_tt: "Enables consorts — the consort is the Dáftaterodegis (\"Second General,\" also translated as \"Supreme Commander\"), who rises to power alongside the ruler. Dáftaterodegis always have high military stat and automatically become a general; such a general gains §Y+1§! to all stats and an additional §Y+1§! shock. The Dáftaterodegis is automatically re-elected upon their death or a change of ruler."
 DUUMVIR_KHEI: "Dáftaterodegis"
 
#Affirm the Absence of Divinity
 absence_of_divinity: "Affirm the Absence of Divinity"
 absence_of_divinity_desc: "We know well that the bharbhen have many superstitions, but the most backwards of them all is the belief in cosmic forces which are hidden from view yet control all things. For the people to truly be sovereign, it must be clear to all that there is no higher power pulling the strings. This superstitious reliance on the notion of divinity is likely why the societies of the Bharbhen are so underdeveloped: when they come across a problem they cannot answer, all they can do is pray to their gods for an answer which will never come. The civilized world has no need to cling to such foolish comforts! Our god shall be virtue, and we will be its heralds."
 absence_of_divinity_tt: "Kheionai holy orders, once established, grant additional benefits to the surrounding territory: reduced local autonomy, quelled rebel activity, or bolstered manpower — depending on the order's teachings. Each area may benefit from this only once every 5 years."

#System of Three Branches
 three_branches: "System of Three Branches"
 three_branches_desc: "The true foundational principle of the republic lies in the separation of powers. Neither person nor institution ought to be able to concentrate the whole might of governance in its hands. Thus three equal and independent branches - the legislative, which crafts the law; the judiciary, which interprets it and renders justice; and the executive, which carries the law's will into action - are endowed in equal measure with both power and restraint, and thus stand as the chief guarantors of the republic's survival. \nFor power, dispersed among many, serves the common good. But power, gathered into one hand, sooner or later turns against it."
 three_branches_tt: "Changing the national focus grants bonuses depending on its type:\n§YLegislative (Clergy):§! +10% clergy influence & loyalty, -10% states governing cost.\n§YJudicial (Burghers):§! +10% burghers influence & loyalty, -5 years of separatism, -20% harsh treatment cost.\n§YExecutive (Nobility):§! +10% nobility influence & loyalty, -10% minimum autonomy."
 three_branches_legislative_mod: "System of Three Branches (Legislative)"
 three_branches_judicial_mod: "System of Three Branches (Judicial)"
 three_branches_executive_mod: "System of Three Branches (Executive)"

#Xechtari above all
 xechtari_above_all: "Xechtari above all"
 xechtari_above_all_desc: "Xechtari in Kheionai, Zehktaers in the tongue of the Mteibhara tribes, or Alecand in the common… so many names has our homeland borne, the island that became our home. Harsh though this home may be, for every decade the blue death comes upon us from the north, and our soil is far from fertile, yet it is here that our great poleis rose, and it is our duty to raise them higher still. For this island is no mere patch of earth, but the mithérkheion of our civilization itself, and a beacon of enlightenment for all the rest of Aelantir."
 xechtari_above_all_tt: "If [Root.GetName] owns provinces only within §YAlecand region§!, all owned provinces in §YAlecand region§! gain:\n§Y-10%§! development cost\n§Y-25%§! local governing cost\n§Y-0.5§! monthly devastation\n§Y+0.03§! local prosperity growth"
 xechtari_above_all_ptm: "Xechtari above all"

#Tame the Storm
 tame_the_storm_title: "Tame the Storm"
 tame_the_storm_desc: "It is a rare occurrence in this world to find a ruinborn that is not filled with fear of the sea. Too dreadful is the ancestral memory handed down to us in legends of the death that came with the waves; of monstrous floods and swells seventy cubits high that crashed upon the shores. Such tales have driven all desire from our lesser-developed kin to venture out into open waters. \nYet we, the Kheionai, are exceptional even in this aspect: overcoming the primal fear of the abyss, we sailed the seas surrounding our homeland for many centuries, and in time we have become the foremost naval power in all of Aelantir."
 tame_the_storm_tt: ""