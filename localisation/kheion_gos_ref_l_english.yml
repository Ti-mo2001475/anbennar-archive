#Sophocracy t2
 sophocracy_republic: "Sophocracy"
 sophocracy_republic_desc: "Wisdom is like courage: the best suited to judge wisdom are those already possessing it. Although the voting public must have the final say on who is chosen to lead the nation, our kheion has deemed it wise to create and maintain a council of our wisest citizens tasked with a special duty. They are tasked with ensuring that the chosen man is wise in all aspects of statecraft, or at the very least that he has competent advisors who can help him if he is not."
 mechanic_sophocracy_yes: "Upon §YRe-Election§! or the §YElection§! of a new ruler, grants a skill §G1§!/§G2§!/§G3§! random advisor that is §G25%§!/§G50%§!/§G75%§! cheaper, depending on §YGovernment Rank§!."

#Duumvirate t3
 duumvirate: "Duumvirate"
 duumvirate_desc: "A Duumvirate divides the Kheionai state between two Kylakes. The civilian Kylakas holds dominion over the economy, taxation, trade, and diplomacy. The other, the Dáftaterodegis, commands the fleets, marshals the armies, and leads men into battle – yet draws his coin from the first, just as the first governs only by the grace of the second's sword. Such is their balance of powers."
 mechanic_duumvirate_yes: "The consort becomes the §YDáftaterodegis§! (\"Second General,\" also translated as \"Supreme Commander\"), rising to power alongside the ruler. The Dáftaterodegis always has a high military stat and automatically becomes a §YGeneral§! and gains §G+1§! All Leader Skills and an additional §G+1§! Shock. The Dáftaterodegis is §YAutomatically Re-Elected§! upon their death or a change of ruler."
 DUUMVIR_KHEI: "Dáftaterodegis"
 
#Affirm the Absence of Divinity
 absence_of_divinity_rep: "Affirm the Absence of Divinity"
 absence_of_divinity_rep_desc: "We know well that the bharbhen have many superstitions, but the most backwards of them all is the belief in cosmic forces which are hidden from view yet control all things. For the people to truly be sovereign, it must be clear to all that there is no higher power pulling the strings. This superstitious reliance on the notion of divinity is likely why the societies of the Bharbhen are so underdeveloped: when they come across a problem they cannot answer, all they can do is pray to their gods for an answer which will never come. The civilized world has no need to cling to such foolish comforts! Our god shall be virtue, and we will be its heralds."
 mechanic_absence_of_divinity_yes: "§YHoly Orders§! grant one of the following effects to every owned province in the area when placed (once every §Y10 years§!):\n Administrative Orders: §G-15.00%§! Local Autonomy\n Diplomatic Orders: §G+15.00§! Prosperity Progress\n Military Orders: §G-15§! Rebel Uprising Progress"

 absence_of_divinity_mon: "Affirm the Absence of Divinity"
 absence_of_divinity_mon_desc: "We know well that the bharbhen have many superstitions, but the most backwards of them all is the belief in cosmic forces which are hidden from view yet control all things. For the ruler to have full control, it must be clear to all that there is no higher power pulling the strings. This superstitious reliance on the notion of divinity is likely why the societies of the Bharbhen are so underdeveloped: when they come across a problem they cannot answer, all they can do is pray to their gods for an answer which will never come. The civilized world has no need to cling to such foolish comforts! Our god shall be virtue, and we will be its heralds."
 absence_of_divinity_unr: "Affirm the Absence of Divinity"
 kheios_gov_cd: "Affirm the Absence of Divinity cooldown"

#System of Three Branches
 three_branches: "System of Three Branches"
 three_branches_desc: "The true foundational principle of the republic lies in the separation of powers. Neither person nor institution ought to be able to concentrate the whole might of governance in its hands. Thus three equal and independent branches - the legislative, which crafts the law; the judiciary, which interprets it and renders justice; and the executive, which carries the law's will into action - are endowed in equal measure with both power and restraint, and thus stand as the chief guarantors of the republic's survival. \nFor power, dispersed among many, serves the common good. But power, gathered into one hand, sooner or later turns against it."
 mechanic_three_branches_yes: "§YNational Focus§! grants bonuses depending on its type:\n§YLegislative (Administrative)§!:\n   [Root.GetChurchOrFallbackName] Loyalty Equilibrium: §G+10.0%§!\n   [Root.GetChurchOrFallbackName] Influence: §G+10.0%§!\n   Autonomy Change Cooldown: §G-25.0%§!\n   State Maintenance: §G-25.0%§!\n§YJudicial (Diplomatic)§!:\n   [Root.GetBurghersOrFallbackName] Loyalty Equilibrium: §G+10.0%§!\n   [Root.GetBurghersOrFallbackName] Influence: §G+10.0%§!\n   Years of Separatism: §G-5§!\n   Harsh Treatment Cost: §G-20.0%§!\n§YExecutive (Military)§!:\n   [Root.GetNobilityOrFallbackName] Loyalty Equilibrium: §G+10.0%§!\n   [Root.GetNobilityOrFallbackName] Influence: §G+10.0%§!\n   War Taxes Cost: §G-100.0%§!\n   Monthly War Exhaustion: §G-0.04§!"
 three_branches_legislative_mod: "System of Three Branches (Legislative)"
 three_branches_judicial_mod: "System of Three Branches (Judicial)"
 three_branches_executive_mod: "System of Three Branches (Executive)"

#Xechtari above all
 xechtari_above_all: "Xechtari above all"
 xechtari_above_all_desc: "Xechtari in Kheionai, Zehktaers in the tongue of the Mteibhara tribes, or Alecand in the common… so many names has our homeland borne, the island that became our home. Harsh though this home may be, for every decade the blue death comes upon us from the north, and our soil is far from fertile, yet it is here that our great kheions rose, and it is our duty to raise them higher still. For this island is no mere patch of earth, but the mithérkheion of our civilization itself, and a beacon of enlightenment for all the rest of Aelantir."
 mechanic_xechtari_above_all_yes: "If [Root.GetName] only owns provinces within the §YAlecand Region§!, all owned provinces in the §YAlecand Region§! (excluding §YEltibhar§! culture provinces) gain:\n   Local Development Cost: §G-10.0%§!\n   Local Governing Cost: §G-25.0%§!\n   Monthly Devastation: §G-0.5§!\n   Local Prosperity Growth: §G+0.03§!\n\nDeveloping a province in the §YAlecand Region§! (excluding §YEltibhar§! culture provinces) has a §G15.0%§! chance to grant additional development.\nDeveloping a province in the §Y7 Kheions§! province group has a §G25.0%§! chance to grant additional development"
 xechtari_above_all_mod: "Xechtari above all"
 xechtari_above_all_mod_desc: ""

#Tame the Storm
 tame_the_storm: "Tame the Storm"
 tame_the_storm_desc: "The Kaydhano can be called the cornerstone of all life in Kheiós, indeed of the entire Kheionai culture: after all, even our skin bears the color of the Kaydhano Sea. For a Kheionai to abandon another Kheionai during a Death Storm is the gravest of crimes and the foremost taboo. \nYet though the Kaydhano is often associated with death and destruction, even for the sands of death a proper use can be found. The Kheionai of Arpediféri, for instance, craft from its blue sand Potídhano: a sky-blue and costly glass, while the rest of the Kheionai have learned to draw from the sands of Kaydhano the arcane energy needed to feed the growing demands of their fleet and their rapidly expanding cities."
 mechanic_tame_the_storm_yes: "§YMage Tower§! now gives §G-1§! §aDeathwinds§! Intensity\n\nAfter a §YKaydhano Storm§!, provinces with at least §Y5§! §TWindward§! Level gain the following for §Y5§! years:\n   Local Construction Time: §G-15.0%§!\n   Local Trade Power: §G+7.00§!\n   Local Goods Produced Modifier: §G+15.0%§!\n   Local Shipbuilding Time: §G-20.0%§!"
 tame_the_storm_ward_bonus: "Tame the Storm"

#Great Mariners and Merchants of the Ruinborn 
 great_mariners_ruinborn: "Great Mariners and Merchants of the Ruinborn"
 great_mariners_ruinborn_desc: "It is a rare occurrence in this world to find a ruinborn that is not filled with fear of the sea. Too dreadful is the ancestral memory handed down to us in legends of the death that came with the waves; of monstrous floods and swells seventy cubits high that crashed upon the shores. Such tales have driven all desire from our lesser-developed kin to venture out into open waters. \nYet we, the Kheionai, are exceptional even in this aspect: overcoming the primal fear of the abyss, we sailed the seas surrounding our homeland for many centuries, and in time we have become the foremost naval power in all of Aelantir."