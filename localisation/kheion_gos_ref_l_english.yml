l_english: 
#Sophocracy
 sophocracy_republic: "Sophocracy"
 sophocracy_republic_desc: "Rule by the wise: elected magistrates governed not by birth but by demonstrated learning, drawn from the philosophical academies of the Kheionai."
 sophocracy_monarchy: "Sophocracy"
 sophocracy_monarchy_desc: "The crown itself answers to a council of scholars, who confirm and guide each ruler in matters of state."
 sophocracy_flavor_tt: "Upon re-election or the election of a new ruler, grants a level §G1/2/3§! random advisor with a §G25/50/75% cost reduction§!, depending on government rank."

#Duumvirate
 duumvirate: "Duumvirate"
 duumvirate_desc: "Power divided between the elected magistrate and a consort risen alongside them — one governs, the other commands the republic's armies."
 duumvirate_flavor_tt: "§YEnables Consorts.§! The consort always rises with exceptional martial skill and takes command as a general. A new consort automatically rises upon re-election, the death of the ruler, or the death of the consort."
 DUUMVIR_KHEI: "Duumvir"
 
#Affirm the Absence of Divinity
 absence_of_divinity: "Affirm the Absence of Divinity"
 absence_of_divinity_desc: "The Kheionai formally reject the notion of divine rulership, placing reason and institution above the sanctity of gods absent from the world."
 absence_of_divinity_tt: "Kheionai holy orders, once established, grant additional benefits to the surrounding territory: reduced local autonomy, quelled rebel activity, or bolstered manpower — depending on the order's teachings. Each area may benefit from this only once every 5 years."

#System of Three Branches
 system_of_three_branches: "System of Three Branches"
 system_of_three_branches_desc: "Governance divided among legislative, judicial, and executive bodies — each drawing strength from whichever discipline the republic currently prioritizes."
 three_branches_flavor_tt: "Changing the national focus grants bonuses depending on its type:\n§YLegislative (Clergy):§! +10% clergy influence & loyalty, -10% states governing cost.\n§YJudicial (Burghers):§! +10% burghers influence & loyalty, -5 years of separatism, -20% harsh treatment cost.\n§YExecutive (Nobility):§! +10% nobility influence & loyalty, -10% minimum autonomy."
 three_branches_legislative_mod: "System of Three Branches (Legislative)"
 three_branches_judicial_mod: "System of Three Branches (Judicial)"
 three_branches_executive_mod: "System of Three Branches (Executive)"