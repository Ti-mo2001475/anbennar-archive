# Events
flavour_daayosakay.1.t: "United by the Song of the Seas"
flavour_daayosakay.1.d: "Lore about the Gataw and their many tribes, talking about how they chose to come live together under a united rule."
flavour_daayosakay.1.a: "Cool"

