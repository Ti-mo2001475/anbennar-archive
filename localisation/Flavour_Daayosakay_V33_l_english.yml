#Daayosakay Reforms
V33_federation_of_the_waves_reform: "Federation of the Waves"
V33_federation_of_the_waves_reform_desc: "A union of many Gataw tribes brought together under one ruler. They claim rule of both on land and sea."
V33_grand_council_of_the_seas: "Grand Council of the Seas"
V33_grand_council_of_the_seas_desc: "A dual electoral monarchy composed of a Land King and a Sea King. The state is ruled simultaneously by both in their respective domains."


