 #tooltips §
 I49_edeyne_alive_tooltip:0 "\nThunderborn gets '§YEdeyne's Insecurity§!' until the death of Edeyne Stormblessed, giving:\nYearly Horde Unity: §R-2.00§!\nMonstrous Tribes Loyalty Equilibrium: §R-20.0%§!\nMonthly Administrative Power: §R-3§!\nMonthly Diplomatic Power: §R-3§!\nMonthly Military Power: §R-3§!\nChance of New Heir: §R-1000.0%§!\n\n§REdeyne's insecurity§! is crippling, but can be alleviated over time through completing missions.\nIn order to complete the §YMission Tree§!, Edeyne must remain §Galive§!!"
 I49_no_forming_taryean_tooltip:0 "Only Edeyne can decide when she is ready"
 I49_wander_purpose_move_capital_tooltip:0 "\nUntil the end of the §YAge of Discovery§!, moving our capital will grant us §G25§! of each §YMonarch Power§! and give the province §G1§! §Yrandom development§!."
 I49_endless_plain_cb_tooltip:0 "\nGain §YSubjugation Casus Belli§! on all non-§MMalukhuga Sect§! centaur nations outside Nuzurbokh. Upon declaring war on a certain sect with this §YCasus Belli§!, we will §Rlose§! the §YCasus Belli§! against all other nations of that sect."
 I49_barter_thoughts_focused_practice_tooltip:0 "Has a non-§MMalukhuga Sect§! §YFocused Religious Practice§!"
 I49_non_malukhuga_celebration_tooltip:0 "\nUntil the end of the §YAge of Discovery§!, holding a Celebration with a non-§MMalukhuga Sect§! §YFocused Religious Practice§! selected will give §G2§! §YInnovativeness§! and give all subjects §G-10%§! §YLiberty Desire§!."
 I49_reckoned_with_seperatism_tooltip:0 "All owned and subject-owned provinces will lose §G5§! §YYears of Seperatism§!"
 I49_false_claimant_effect_tooltip:0 "If this mission was completed by insulting §YGreat Storm§!:\nThunderborn gains a §Ypermanent claim§! on the §YKalgazuur§! area\nThunderborn gets the §YAgainst the False King§! modifier for §Y5§! years, giving:\nSiege Ability: §G+25%§!\nMages Estate Loyalty Equilibrium: §G+5%§!\n\nIf this mission was completed through owning §YOyehosegh§!:\nGain §G10%§! Monstrous Tribes Loyalty Equilibrium\nGain §G20§! Prestige"
 I49_ferrous_persuasions_tooltip:0 "§YTwo§! provinces which meet the conditions gain §G1§! §YBase Production§! and begin constructing a §YWorkshop§! at §Y0%§! cost and §Y100%§! time."
 I49_step_by_step_celebration_tooltip:0 "Have completed at least §Y2§! Celebrations"
 I49_eye_storm_filustkhuga_tooltip:0 "Religious School is §OFilustkhuga Sect§!"
 I49_eye_storm_irdukhuga_tooltip:0 "Religious School is §TIrdukhuga Sect§!"
 I49_eye_storm_maslekhuga_tooltip:0 "Religious School is §lMaslekhuga Sect§!"
 I49_eye_storm_effect_tooltip:0 "Between the three non-§MMalakhuga Sect§! vassals, the one with the highest development will grant us the §Yhigher§! reward, and the other two will grant us the §Ylower§! reward:\n\n§OFilustkhuga Sect§!: §G15k§!/§G10k§! §YManpower§!\n§TIrdukhuga Sect§!: §G18§!/§G12§! §YMonths of Trade Income§! from our §YHome Node§!\n§lMaslekhuga Sect§!: §G150§!/§G100§! §YReligious Power§!"
 I49_to_be_true_province_tooltip:0 "Own §Y4§! of the following provinces, with §YTemples§! or §YCathedrals§! built in each of them:\n   §YOyehosegh§!\n   §YIinacneml§!\n   §YSighalhain§!\n   §YOyehdann§!\n   §YEynukhezamn§!\n   §YShingyuul§!"
 I49_to_be_true_celebration_tooltip:0 "Have completed at least §Y4§! Celebrations"
 I49_edge_everything_once_more_willpower_tooltip:0 "\nEdeyne's §TExceptional Willpower§! will be upgraded from §G75§! §Yyears§! to §G100§! §Yyears§!"
 I49_edge_everything_may_form_taryean_tooltip:0 "\nEdeyne now feels ready to proclaim §YTaryeanzamh§!!"
 I49_conduits_unlock_tooltip:0 "\nUnlock §YConduits§!:\nBeginning the next time we move our capital, all owned provinces within our §YNomadic Zone of Control§! will gain the §YConduit of Stormy Skies§! modifier for 3 years, giving:\nEstate Experience Modifier: §G+2.0%§!\nMana Regeneration Rate: §G+0.02§!"
 I49_conduits_upgrade_tooltip:0 "Our §YConduits§! are upgraded:\nBeginning the next time our capital is moved, owned provinces within our §YNomadic Zone of Control§! will instead gain the §YConduit of Tempestuous Thunder§! modifier for 3 years, giving:\nEstate Experience Modifier: §G+3.0%§!\nMana Regeneration Rate: §G+0.03§!\nMages Estate Loyalty Equilibrium: §G+2.0%§!"
 I49_to_be_conduit_magic_tooltip:0 "We are §SRenowned§! in any one §YSchool of Magic§!, or we are §ZProficient§! in any two §YSchools of Magic§!"
 I49_to_be_conduit_effect_tooltip:0 "\nGain §G10§! §MMana§! and §G10§! §YMagic Experience§! for every §G10§! §YArmy Tradition§! we have"
 I49_edge_endless_sea_magic_tooltip:0 "We are §ZProficient§! in any one §YSchool of Magic§!"
 I49_cover_thunder_devastation_ae_tooltip:0 "\nThe provinces of §YOrilgbulrek§!, §YKarnuyatushlaq§!, and §YYizuqkeyil§! will gain §R50§! §YDevastation§!, and their owners will gain §R25§! §YAggressive Expansion§! with §YThunderborn§! (only once per country)\n"
 I49_deciphered_wreckage_event_insight_tooltip:0 "\n§GEvent Insight:§!\nWe will discover §YFeudalism§!."
 I49_deciphered_wreckage_institution_tooltip:0 "Gain §G100§! progress towards §YFeudalism§! in our capital. If we have already embraced §YFeudalism§!, we will instead gain §G100§! of each §YMonarch Power§!"

