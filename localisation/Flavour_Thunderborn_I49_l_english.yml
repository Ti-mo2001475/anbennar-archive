 flavour_thunderborn.5.a:0 "report on discord pls"
 flavour_thunderborn.6.t:0 "The Third Darkening"
 flavour_thunderborn.6.d:0 "“ORDSIKAR!” I stand before the crowd of my ordsikar, my heart thumping in my chest. The sun is shining bright. “Long have we travelled across the plains, seeking glory wherever we ran. Long have we dreamt of reforming what was lost—we remember the Storm King, and we remember the unimaginable power he held. And yet—he died, and Taryeanzamh was lost to us. But we never stopped remembering—the latent power of the Storm King was held within all of us, and now the day has finally come. Taryeanzamh will be reborn!”\n\nMy throat suddenly feels dry. “But…but I have something else to tell you on this day of all days. Many years ago, the sky split in twain, and a raging storm swept across the land. On that day, I was born—the prophesied successor to the Storm King. However, there was one simple mistake—I am no Storm King. I am no King at all! I stand before you today, not as your Caehn, but as your Caehten! We shall proclaim Taryeanzamh on this day, and I, Edeyne Stormblessed, will be no Storm King, but a Storm QUEEN!”\n\nThere is silence among the crowd. Then one centaur scoffs. He stands up and leaves. Another follows. One by one, they all return to their tents, the soft rustle of hooves on grass the only noise. The last to remain, other than Zaya, is Thas’lan Plaintwister, son of Mon’velk. The first to kneel. He stands, begins to leave, then turns back to look at me. He looks, above all things…disappointed. He turns, and walks off into the endless plains. I am alone with Zaya, who has remained stonefaced.\n\nShe looks at me. I begin to feel the panic rising in my chest. The tears well up as they always do, and I begin to cry. Where did it all go wrong? This was supposed to be the moment, the one where I finally reveal myself, where I become who I’ve always been, and instead—"
 flavour_thunderborn.6.a:0 "It is too much. I flee."
 flavour_thunderborn.7.t:0 "At the Edge of Everything, Once More"
 flavour_thunderborn.7.d:0 "I run. I run. I run. I have never run this much. The world whirls by me, a blur that I have seen but never seen. Do I run for minutes? Hours? Days? Weeks? I cannot say. I do not register the beating of my heart, the burning of my legs, the feeling of the wind flowing through my hair—only that I must keep moving. I cannot stop moving.\n\nEventually, I become exhausted, and I collapse. I am on a rocky outcrop, a familiar one (or am I somewhere else entirely? I do not know). I lay there, too exhausted to move, and I weep. How did it all go so wrong? I am a failure. I always have been. I have never amounted to anything. I should just lay here, never move again, and waste away. That is the only fate I deserve. \n\nThen there is another beside me. I know her (or is it even her? I cannot say). She is cradling me in her arms. Perhaps I am not alone, after all.\n\n“Edeyne,” she says. “It is alright. Rest. The world hasn’t ended just yet.”\n\n“But it has—mine has, anyway.” My voice cracks in between words. The tears flow harder than they ever have. “I have nothing left. I have been rejected.”\n\n“I do not think you were rejected—at least, not in full. I remember what you said to me once, many years ago: that if you were to reveal yourself, you would be killed. At the time, I agreed with you—and yet, you have now revealed yourself, and here you still are. All is not lost, not yet.”\n\nThen the sun is blotted out by a great shape of unimaginable size. The woman beside me, who I have loved my whole life, lifts my head so I can see. The roc, the Stormbringer. It floats in the air in front of me. \n\n“Why?” I ask. “Why me?” In response, the roc lets out a great caw that shakes the mountains and blackens the sky. I am struck with a bolt of lightning, and I feel no pain. The energy surges through me, and I breathe it in. I feel a little lighter than before. The roc looks at me, and I see nothing in its expression. I feel a great gust of wind, and it flies away.\n\nThen the sky clears, and the sun blooms through the clouds once more. I stand, with my love by my side."
 flavour_thunderborn.7.a:0 "It is a beautiful day."
 flavour_thunderborn.8.t:0 "She Was Born of the Storm"
 flavour_thunderborn.8.d:0 "“What is the POINT, Zaya?” I ask. “I can talk to the shamans all I want, but they will never respect me.”\n\n“Do you know that for sure?” She returns. “I think they might not be as hostile as they first seem. You are the Stormblessed, after all. They are bound to support you.”\n\n“I…I don’t think I can talk to them,” I say. “It’s just…it’s too much.”\n\n“I understand, Edeyne. I’m here for you. I believe in you. You can do this. You are strong. You can win them over.”\n\nMy heart thumps against my chest. My breathing is erratic. The tears well up in my eyes. Before I know it, I am crying. The world feels like it’s about to end. I can’t I can’t I can’t I CAN’T I CAN’T “I CAN’T!” Zaya jumps back. I shrink away. \n\n“Nonono, I’m sorry, I’m sorry, I’m so so so so sorry Zaya, I didn’t mean to-” She is already at my side, already cradling my head in her hands.\n\n“Shh, shh, it’s alright, Edeyne. It’s okay. I can talk to them for you.” I sniffle.\n\n“I can’t even talk to the damn shamans—how am I supposed to lead this clan? I’m useless.”\n\n“You’re not useless, Edeyne. It’s alright not to be strong all the time. I can talk to the shamans. Why don’t you go for a run? I think you’ll feel a bit better.”"
 flavour_thunderborn.8.a:0 "“Yes, I think a run would be good. Thank you, Zaya.”"
 flavour_thunderborn.9.t:0 "hidden event"
 flavour_thunderborn.9.d:0 "u shouldnt be seeing this unless you just loaded a save"
 flavour_thunderborn.9.a:0 "report on discord pls"
 flavour_thunderborn.10.t:0 "Cerulean"
 flavour_thunderborn.10.d:0 "Zaya is sitting at the water’s edge, idly tossing a scepter recovered from Great Storm between her hands. I walk up and sit beside her.\n\n“What does it do?” I ask. She shrugs.\n\n“I’m really not sure,” she says. “It’s clearly magical; that much is obvious. It seems to have some sort of planar energy, but I don’t know the purpose. I’ve figured out that it can do this—” She flicks the scepter out towards the lakeshore, and a bolt of lightning shoots out, skipping over the water— “but it’s not like I can’t already do that.” She absentmindedly summons a small spark, which runs along her fingers. She pokes me, and I flinch at the light shock. She laughs.\n\n“Can I…see it?” I ask.\n\n“Oh, sure. Here,” she says, handing me the scepter.\n\n“So you, what? You just make a motion like this, and-” I flick the scepter out towards the water, just as she did, and instead the bolt travels backwards, up my arm and across my entire body, and I am wracked with pain, and I scream, and Zaya, eyes going wide, yells my name and reaches out to grab the scepter and instead pulls her hand away in shock, and the energy travels through me for what seems like an eternity until I am suddenly able to wrench my fingers open and drop the scepter. I lay there, breathing heavily.\n\n“EDENYE!” Zaya is already running her hands over my body. “Are you alright?” I realize I am not in pain at all. Instead, I feel…alive. My body courses with a new energy. I struggle to my feet.\n\n“Yes, I’m fine…somehow.” I turn my hands over, looking at them. There is a strength to them that I’d never felt before. Out of curiosity, I flick my hand out towards the ocean, like I’ve seen Zaya do a hundred times, and a bolt of lightning flies out across the ocean. I have never seen Zaya without words, until this moment.\n\n“I can do it now, too!” I say. Zaya laughs. She gives me a quick kiss on the cheek, before turning and staring out at the ocean, then back at me, then back at the ocean, then back at me. She smiles."
 flavour_thunderborn.10.a:0 "“This seems…useful.”"
 flavour_thunderborn.11.t:0 "Deciphered Wreckage"
 flavour_thunderborn.11.d:0 "“Look at this, Edeyne!” Zaya says. Pieces of parchment are strewn across the table, filled with scrawlings and symbols I cannot read—but Zaya has spent the last three years learning to understand their meaning. “This is so fascinating—their structure of government is so foreign, but now that I understand it, I cannot help but wonder how we have not come up with this ourselves!”\n\n“That’s all well and good, Zaya,” I replied, “but what IS that structure of government? Has the system we’ve used for thousands of years not been proven to work?”\n\n“But do the great Caehnates not always fall apart in the end?” She asks. “The Caehnate, as a system, is so…impermanent. The Triunics…they are on to something here.” She points at one piece of parchment. “See this one? It speaks of this thing called “taxation”. Rather than enforcing tribute via raw strength, a small amount of coin, or other goods, are collected from every individual subject. This is enforced through a consistent system, where appointed agents collect these “taxes” and bring them to the government in exchange for being given a reward of their own.”\n\n“But what stops the subjects from refusing to pay?”\n\n“Well, I suppose in that sense it’s still enforced via strength, isn’t it? But look here, this one says that…” She carries on for hours. I have never seen her this excited."
 flavour_thunderborn.11.a:0 "She presents me with a full plan the next day."
 flavour_thunderborn.12.t:0 "A Stumble, a Fall"
 flavour_thunderborn.12.d:0 "“ZAYA!” I cry, running over to her. She has fallen. She groans as I run my hands over her. “Where is it? Where is the wound?” She points at her right hind leg. It is twisted. She will survive, maybe even thrive—magic will ensure it—but she will never run again.\n\nI press my face to her body. Tears drip down our faces, for two very different kinds of pain."
 flavour_thunderborn.12.a:0 "To age is to wish you weren’t aging at all."
 flavour_thunderborn.13.t:0 "Cloud Cover"
 flavour_thunderborn.13.d:0 "I stand on the shore, the boat containing her body in front of me. The setting sun glitters across the sea. I am weeping.\n\nMany moons ago, she said she never wanted there to be a day where she woke up and I wasn’t there. I never expected that, instead, I would be the one having to wake up without her.\n\nThose eyes, the ones that knew the darkness and the light—they will never open again. She will never again rush up to me, kiss me, and show me whatever project she was working on that week. She will never again playfully shock me, laughing when I jump at her sudden touch. She will never again watch in adoration as I craft the tempest around me. She is gone, and I remain.\n\nI turn away—I can’t bear to look at her anymore. I nod to one of the assembled ordsikar behind me. He steps forward with a few others, and together they push the boat out into the sea. A moment passes, and then he calls out to the archers. They shoot in unison, arrows flaming, crashing down into the sea. The boat containing her body is lit aflame, and she sails off into the sunset. I do not speak. Nothing I could say would change anything."
 flavour_thunderborn.13.a:0 "The days are a little less vibrant now."
 flavour_thunderborn.14.t:0 "The Final Darkening"
 flavour_thunderborn.14.d1:0 "Edeyne Stormblessed, of the Thunderborn clan, is dead. The news ripples out across the land, and few weep, for what did she amount to?\n\nClouds darken the sky once again, for the sun cannot bear to look at its child. The hopes of the world were placed upon her shoulders, and she buckled under their weight. One person could not truly be expected to carry all that, now, could they?\n\nWho was she, anyway? A Caehn? A Caehten? A broken woman, unfit to rule? A second Storm King who was not to be? The ordsikar have already decided for themselves, and they are disappointed.\n\nHer funeral is small. The ship is sent off into the sea, but few attend the ceremony. The archers miss their first shot."
 flavour_thunderborn.14.d2:0 "The Stormblessed is dead. The news ripples out across the land, and all who knew of her weep, for one such as her will never come again.\n\nThe clouds part in honor of her legacy, and the sun shines across all Taryeanzamh once again. The weight of the world was placed upon her shoulders, and she may have bent, but she did not buckle. She was not alone—she had Zaya, and together they were a force to be reckoned with. Who would dare oppose them?\n\nWho was the Stormblessed? She was a Caehten. She was a woman of profound strength, to continue along despite everything the world threw at her. She was the wife of Zaya Hollowseeker, a legend in her own right. She was the very first Storm Queen. She took Thunderborn from obscurity, and crafted it into a weapon that none can withstand. Taryeanzamh is all the stronger because she ruled it.\n\nHer funeral is attended by everyone who has ever heard her name. The ship, grander than any that have ever been built before, is sent off into the setting sun. The archers, assembled en masse, strike true. She goes out in a blaze of glory."
 flavour_thunderborn.14.a:0 "She will not be remembered."
 flavour_thunderborn.14.b:0 "But can a legend ever really die?"
 flavour_thunderborn.15.t:0 "Sunbreak"
 flavour_thunderborn.15.d:0 "In the center of [Root.Capital.GetName], there is a weather-beaten statue. When the population packs their things up and moves, as is the centaur way, the statue goes with. Most who pass it do not spare it a glance, but occasionally, someone will stop in front of it to give a whispered prayer.\n\nToday, a small boy stands in front of the statue. He has heard many stories in his short life—he makes his mother tell him one before he goes to bed each night—but none have captured his imagination quite like the tale of the Stormblessed. He falls asleep dreaming of one day achieving the feats that she did—to rise from the ashes, to wield the power of the storm within her very being, to work hand in hand with another to achieve amazing things. His mother laughs when he tells her of his dream—she says the Stormblessed was like no one else who ever was, is, or will be—but the boy disagrees. There is something in those stories that he has let into himself, that he will carry for the rest of his life.\n\nTimes are changing—the boy understands this. His mother tells him of the way things used to be when she was but a young girl, how she was not allowed to do the things the boys did. The boy finds this silly, as his best friend is a girl, and they do EVERYTHING together. His best friend is so cool. Maybe he has a crush on her. Maybe that feeling is something else entirely (this thought does not pass through his head).\n\nThe boy looks up at the worn statue of the Stormblessed. He has never understood why some people glare at the statue as they pass it, why there has to be a guard posted to prevent it from being vandalized. He does not understand why so many people ignore the statue entirely—she is his hero, after all. He will not understand for many years why his body aches with a deep and unplaceable longing, why things never feel quite right, why every day feels a little harder than the last (when he finally does understand this, everything will change). Right now, however, he knows one thing for certain."
 flavour_thunderborn.15.a:0 "He wants to be like her when he grows up."
 

