l_english:
 I49_to_wander_with_purpose_title:0 "To Wander with Purpose"
 I49_to_wander_with_purpose_desc:0 "“When she runs through the plains, her hair floating in the wind…that is when she is truly free. I join her sometimes, when I need a break from everything. To run beside the one I most hold dear, to say nary a word. To feel my heart burning in my chest, my body urging me to stop, and choosing to press on anyway, knowing that this is strength—this is what it means to be a centaur. Migration is our way of life. The plains stretch ever onward, and we follow them. This is the way of things.”"

 I49_edge_of_the_endless_plain_title:0 "Edge of the Endless Plain"
 I49_edge_of_the_endless_plain_desc:0 "“She asked me, once, when we were much younger, if the plains ever ended—to the north were the frigid woods, to the east was the great Stone Gate, and mountains cradled the south. But to the west, did they go on forever? ‘Of course not,’ I said, ‘for the world has to end eventually.’ She got a look on her face, one I’ve seen many times since, and cocked her head. ‘But what if they don’t?’ she said. ‘What if they never end? What if our ancestors asked this same question, and thought that we would be the ones to find the answer?’\n\nI admit her question caught me off guard. If I’d never seen the edge of the plains, how could I know for sure that edge existed? It was an interesting question. Perhaps, one day, we will find the edge of the world.”"

 I49_bring_them_to_heel_title:0 "Bring Them to Heel"
 I49_bring_them_to_heel_desc:0 "“She has trouble enough getting her own clan to listen to her. I wonder, then, how she will deal with the free clans—the ones who refuse to bow to the leadership of any caehnate. They are a thorn in her side, but if they could be brought under her rule, they would prove most useful. \n\nBut she has been consolidating power. Slowly, ever so slowly, things begin to change. The things the ordsikar say about her are different now. I would not call it loyalty, but a reluctant respect. Perhaps, as they fall in line, the free clans might begin to follow?”"

 I49_to_begin_she_begins_title:0 "To Begin, She Begins"
 I49_to_begin_she_begins_desc:0 "“She is destined for greatness. For centuries, the shamans have spoken of the day that lightning shall crack earth in twain, the day that a child is born who will wield that lightning and lead the Thunderborn to greatness. That day came. She is that child.\n\nBut it is hard for her to see the end of the journey when she is only at the beginning. She cannot see who she is, who she will be—only who she is not. But I see. I have always seen. The world will be reshaped under her hand. She only has to start.”"

 I49_barter_for_your_thoughts_title:0 "Barter for Your Thoughts"
 I49_barter_for_your_thoughts_desc:0 "“I see her as she speaks with the other caehns, who, by all rights, should hate her with their very being. And, at first, they do. She enters their dwelling, flanked by guards. The room is tense—she has subjugated them, after all. They were caehns, and now they are but ordsikar. But then she begins to discuss with them. She listens, hears their point of view, their way of life, the things they hold dear. The air in the room softens. They laugh. She laughs. The guards are sent away. By the end of the second hour, they are friends.”"

 I49_to_be_reckoned_with_title:0 "To Be Reckoned With"
 I49_to_be_reckoned_with_desc:0 "“It is one thing to win a battle. Anyone could. That is not what makes her special.\n\nIt is another thing to lose a battle with grace. Not everyone could, but that is still not what makes her special.\n\nTo win, to defeat your opponent, and have them be honored to be defeated because they are in such awe of your strength—THAT is what makes her special.”"

 I49_the_false_claimant_title:0 "The False Claimant"
 I49_the_false_claimant_desc:0 "“She is often angry, but that anger is…undirected. She laments the world, her circumstances, the life she’s been given and the one she wishes she had, but not often is that anger pointed at a specific group.\n\nVranulk Windbearer and his witless son, though…I think she might truly hate them. She may not believe in her ability to carry out her destiny, but she does understand that that destiny is hers. She sees this man, who believes his son to be the one who will claim the Storm King’s legacy, and she sees in both of them imposters. Pretenders. Challengers.\n\nBesides, I’ve heard tell on the wind that Great Storm is in possession of some most intriguing artifacts, and I simply must get my hands on them.”"

 I49_ferrous_persuasions_title:0 "Ferrous Persuasions"
 I49_ferrous_persuasions_desc:0 "“The Great Incursion died for many reasons, but one of them was that the centaurs’ arms were simply…inferior. The humans were fighting with weapons of quality we had never seen before. Despite the staggering loss the Incursion suffered, most centaurs are content to keep the outdated weaponry they’ve used for centuries.\n\nBut she understands that we cannot continue like this. Our ordsiwyn need weapons befitting a force as honed as them, and the plains have scant iron deposits. We must mine. We will have the tools we need to achieve our goals. Her goals.”"

 I49_step_by_step_title:0 "Step by Step"
 I49_step_by_step_desc:0 "“Many a caehnate has risen—such is the cycle of the plains. Many a charismatic leader has united the ordsiwyn behind them, ensured the loyalty of the ordsikar, and struck out across the world, seeking glory and riches. And every single one of them fell apart in the end.\n\nShe is building something different. Something meant to last. Beyond her. Beyond me. Beyond us all. One step at a time, the plains will be united. This time, for good.”"

 I49_eye_of_the_storm_title:0 "Eye of the Storm"
 I49_eye_of_the_storm_desc:0 "“To stand amongst the rubble, to see the destruction with your own eyes, to see the dead bodies littering the streets, the ones who could not escape their fates—there is a strange sense of calm in that moment. Nothing is moving. The sun is shining. But there is nothing to do except carry on, to come together and help each other rebuild.\n\nShe promises them—the battered, beaten, and broken—she promises them aid, no matter who they are. She is there with them, digging through the wreckage. She does not, for a second, prioritize her own. Everyone is equal in the eyes of the storm, and everyone is equal in its aftermath.”"

 I49_to_be_true_title:0 "To Be True"
 I49_to_be_true_desc:0 "“She told me yesterday that she thinks it’s time. I hope, for their sake, that she’s right. I hope, for her sake, that she’s right.”"

 I49_approach_the_shamans_title:0 "Approach the Shamans"
 I49_approach_the_shamans_desc:0 "“She has no one. The clans reject her, decry her as a worthless leader. The shamans whisper behind her back, saying that a leader who fears leading is no leader at all. Without the storm’s blessing, she would not have a caehnate to command. She cannot even bear to believe in herself.\n\nBut I do. I believe in her. I know her like no one else does. They will see. They will understand.”"

 I49_skies_darken_rain_falls_title:0 "Skies Darken, Rain Falls"
 I49_skies_darken_rain_falls_desc:0 "“Even for her, it is impossible to do everything alone. She has me, but I am only one other person. The shamans, who have finally thrown their weight behind her—they are equally important. I listened, then, when one of them came to me with an idea. I told her, and she listened as well. We must work together if we are to accomplish anything. This is the base principle of the storm—alone, we are defenseless. Together, we are strong.”"

 I49_to_be_the_conduit_title:0 "To Be the Conduit"
 I49_to_be_the_conduit_desc:0 "“I have witnessed her, when she stands in the middle of the tempest. The other shamans pull away, fearful she will lose control. I know better. Her expression is not one of unbridled ego, of power shamelessly wielded, but of pure concentration. She will not lose control. She could never stand to let herself fail. She stands at the center of everything, and it is there she commands absolutely.”"

 I49_crook_of_the_mountain_title:0 "Crook of the Mountain"
 I49_crook_of_the_mountain_desc:0 "“We have, at various points in our lives, spent some time in the cliffs of Oyehdann. Up there, above the plains, is a wonderful sort of peace. They say the roc lives in the mountains of Nuzurbokh, and every time we are there, I wonder in the back of my head if it will reveal itself. It never does. I have never asked if she wonders the same.”"

 I49_edge_of_the_endless_sea_title:0 "Edge of the Endless Sea"
 I49_edge_of_the_endless_sea_desc:0 "“It occurred to me, when we crested the hill, that she had never seen the sea before. She has seen small ponds, of course, but they do not compare. To stand at the edge of it, and realize you cannot see the other side—it is a most fascinating feeling. We stood on the shore for a while, in silence, before she said something I was not expecting.\n\n‘It reminds me of the plains,’ she said. ‘The way they seem, especially in the south, to stretch onward endlessly—no matter the distance you go, you never reach the end—they are not dissimilar.’ I have to say, I think she may be right.”"

 I49_under_cover_of_thunder_title:0 "Under Cover of Thunder"
 I49_under_cover_of_thunder_desc:0 "“It seems impossible that the Triunics have not spotted us on the shore, but we carry on anyway. They may know we are here, but they could not possibly expect what we are about to do.\n\nI meant the idea half as a joke initially, but she latched onto it. The Triunic ships, you see—some of them must have valuables on board. Not the kind she thought I meant, but knowledge. Secrets. They defeated the Great Incursion—they must know something we don’t.”"


 flavour_thunderborn.1.t:0 "At the Edge of Everything"
 flavour_thunderborn.1.d:0 "“You are more than that, Edeyne,” Zaya says. “You can be more than that. More than you are today. More yourself.”\n\nThe two of us sit on a cliff overlooking the plains, as the sun breaks through the clouds. She is slightly to my right and behind me, so that I have to turn my head to look at her. Every time I do, her soft green eyes are locked on mine. She is braiding my hair. \n\n“How am I supposed to be ANYTHING, Zaya?” I ask. “I am stuck here, in this role I am unprepared for, in this body that I hate, surrounded by people who do not, will not, will NEVER understand me, and I’m supposed to just…ignore all that? Carry on? Pretend everything is fine and fulfill my duty to the shamans, to the ordsikar? The ordsikar who refuse to grant me the slightest bit of grace, who talk behind my back and in front of me as if I don’t exist, who loudly grumble every time they are issued an order, who would KILL me if they knew who I really wa-”\n\n“Edeyne.” Her gentle voice still makes me flinch. I turn to look at her, noticing that the sun has once again been obscured by clouds. I realize I am crying. \n\n“Fuck, Zaya, I’m sorry,” I say. “I shouldn’t have said anythi-” She puts a hand on my shoulder to stop me.\n\n“No, Edeyne, don’t apologize.” She cups my cheek and pulls my head towards hers. “Look at me.” I do as she asks, staring into her eyes—Irdaeos, I could get lost in them (and I have, many times). “Do you understand who you are? You are the Stormblessed. You are the Storm King’s successor. On the day of your birth, the sky was split in twain, and the whole of the Thunderborn clan wept, for the day of reckoning had finally come. It does not matter if you think you are unprepared, because it is not true. You are prepared. You were born prepared. You have me. I will help you. If the rest of the clan cannot see it, then you will make them. Do you understand?” \n\nI choke back a sob. “Yes, Zaya, I understand. I know who I am. I know what I’m destined to do.”"
 flavour_thunderborn.1.a:0 "“...maybe someday I’ll believe it.”"
 flavour_thunderborn.2.t:0 "The First to Kneel"
 flavour_thunderborn.2.d:0 "The aging centaur who requested this audience is not who I expected—Mon’velk Plaintwister, leader of one of the free clans.\n\n“Good afternoon and well tidings to you, Caehn,” he says. \n\n“Much the same to you,” I reply, stealing a glance at Zaya. That title feels so wrong. “For what reason have you come to see me today?”\n\n“For a reason that you may not expect,” he says, kneeling. “I wish to declare my loyalty to you.”\n\nI raise an eyebrow. “Oh? Well, I’m glad to hear that, but tell me—why?”\n\n“My son, he talked about you,” he says. “You remember him—Thas’lan. He grew up with you. He said you were brilliant, every bit the one the stories talked about; that you would do everything the legends said and more, if only you could get over yourself. And I got to thinking, maybe I was wrong about you: maybe you’re the kind of Caehn I can throw my weight behind. I know a lot of the other clan leaders—friendly with them, you see. Maybe I can get them to do the same.” He stands. “You’re a good man, you know.”\n\nI smile, hiding the flash of pain that shudders through me. “Thank you, Mon’velk. I accept your offer of subservience." He turns to leave, then looks back at me, nodding."
 flavour_thunderborn.2.a:0 "“You’re a good man.”"
 flavour_thunderborn.3.t:0 "The Grandest Celebration"
 flavour_thunderborn.3.d:0 "“I mean, I’ve been to so many of these, but this is unlike any other,” I say, as Zaya and I move through the throngs of people. We had elected to forgo an entourage, at her suggestion—she felt that it would defeat the purpose of this celebration: to bring people together. Therefore, I should be among them.\n\nWe pass an open market, filled with chaotic yelling as centaurs hawk their wares. We pass a ring, with two centaurs engaged in a whirling dance—the Rite of Staves. We pass two centaurs sparring, their bodies covered in ritual scarification.\n\n“Will you be joining the tournament?” Zaya asks. I shake my head.\n\n“I am no fighter,” I say. \n\n“Mmm, perhaps not a combatant,” she replies, “but you are a fighter in your own way. We all are. We all have our own fights.”\n\n“Could you stop dispensing wisdom?” I laugh. “We have a festival to enjoy.”\n\nWe pass a small child, who proudly presents a very small silk shirt. “Caehn, Caehn! Look what I got!” I wince, but manage what I hope is a smile. The child cocks his head, confirming I was unsuccessful. “What’s wrong, Caeh—” I wince again. It’s involuntary. The child’s eyes light up. “Ohhhhh, does that word hurt you?” I’m sorry!” He hugs my waist. “Okay, I’m going to go show my mom this shirt now!” He runs off. I sigh, turning to Zaya. \n\n“Come, Edeyne,” she says to me, placing her hand on my back. “The sun is setting—it is almost time for the bonfire.”"
 flavour_thunderborn.3.a:0 "I carry on, my spirits a little lower than they were before."
 flavour_thunderborn.4.t:0 "It's Dark Outside"
 flavour_thunderborn.4.d:0 "I wrap the blanket around me, grateful that this is one of those rare nights where I don’t have to sleep standing up. It is raining outside the tent. I sigh and settle in, ready for another night of restless slumber, when I am caught off-guard by a quiet noise from the blanketed shape next to me. Then another. Then another. They are sobs.\n\n“Zaya?” I whisper. The shape stirs, and a soft whine escapes from it. I pull the blanket back to reveal her. She looks up at me, her eyes wet with tears.\n\n“Edeyne, please…” she whimpers. “Please, hold me.” I wrap my arms around her, rocking her back and forth slowly.\n\n“Shh, shh, Zaya,” I soothe, “it’s alright. I’m here. You’re safe.”\n\n“I’m scared, Edeyne,” she says, her voice cracking. “What if I die tomorrow? What if you die tomorrow? I don’t want to lose you. I don’t want you to lose me.” She rests her head on my chest. “I don’t want anything bad to happen to us. I don’t want there to be a day where I wake up and you aren’t there. I wish I could just be with you forever. I wish I knew how to make you love yourself. I wish I knew how to make you happy. I wish I knew how to make everyone see you for who you are. I want them to see Edeyne, but they never do. When you accomplish your destiny, I want it to be Edeyne’s destiny, not the lie you have to live. I want you to be you…and I want you to love me. Please…”\n\n“Zaya, look at me.” She does. “I will always be there for you. I promise you.”\n\n“But you can’t promise me that.”\n\n“I know. I’m promising it anyway. I will never leave you, Zaya.” I place my lips upon hers, a deep, sorrowful kiss. I stare into her eyes, the ones that have seen the darkness in my soul, and hold her as she cries into the early hours of the morning."
 flavour_thunderborn.4.a:0 "We fall asleep together as the sun begins to rise."
 flavour_thunderborn.5.t:0 "hidden event"
