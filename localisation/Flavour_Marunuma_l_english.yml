 N93_stonescrawl_guidance: "Stonescrawl Guidance"
 N93_stonestory_guidance: "Stonestory Guidance"
 N93_lineage_0: "Lineage of Mudobari"
 N93_lineage_0_desc: "Mudobari, the Stonewall. A general whose military intellect and brave leadership led to one of the strongest Marunuman kingdoms."
 N93_lineage_1: "Lineage of Bibari"
 N93_lineage_1_desc: "Bibari, the Dreamer. A thinker, a planner, a dreamer. Bibari constantly envisioned a better future for his people, implementing many reforms and progressive ideas, the effects of which still can be felt to this day."
 N93_lineage_2: "Lineage of Tagaku"
 N93_lineage_2_desc: "Tagaku, the Stoneblood. Tagaku personally oversaw the many budgets and expenditures in the kingdom. An unbalanced budget would never make it past her eyes. “Easier to squeeze blood from stone, than to convince Tagaku to spend a wasted coin”, was a common saying in those days."
 N93_lineage_3: "Lineage of Lekatu"
 N93_lineage_3_desc: "Lekatu, the Starved. When the Great Plateau was struck by a plague, starvation quickly followed. Abandoning comfort, Lekatu starved alongside his people. When the other rulers fed themselves while their peoples hungered, Lekatu walked among his people. When the plague ended, Lekatu introduced new farming practices and food storage techniques to ensure another famine would never burden his people."
 N93_lineage_4: "Lineage of Parunda"
 N93_lineage_4_desc: "Parunda, the Waterworker. She was innovative and always pushing the limits of what was considered possible. Parunda’s ideas for hydraulic constructions were ingenious. Unfortunately, most of her creations were lost to disrepair and destruction over the centuries, but her plans still paved the way for many of the hydraulic wonders of today."
 N93_lineage_5: "Lineage of Dimdan"
 N93_lineage_5_desc: "Dimdan, the Stonetruth, or the One Who Stepped Down. Truthful to a fault, Dimdan never told a lie. And the court respected him for that. However, Dimdan was the only Marunuman ruler to step down instead of dying on the throne, before the natural end of his rule was even near. Seeing promise and talent in his successor, he willingly gave up the throne. And his people revered him for that."
 N93_lineage_6: "Lineage of Taswari"
 N93_lineage_6_desc: "Taswari, the Rolling Storm. Charismatic and ambitious, Taswari set her sights on the Great Plateau. And the recruits flocked to her banner, following her from victory to victory."
 N93_lineage_7: "Lineage of Dewari"
 N93_lineage_7_desc: "Dewari, the Brave. Ruling over Marunuma at one of its lowest points in history, Dewari did not give up. He emboldened his people, asking them to sacrifice for the future. And he was willing to give just as much as they were asked to do. He fell on the battlefield, but Marunuma valiantly marched forward in his absence."
 N93_lineage_8: "Lineage of Giidoku"
 N93_lineage_8_desc: "Giidoku, the Seer. Somehow, someway, Giidoku always knew. She knew the true hearts of men. She knew the hidden thoughts of schemers. She knew all the plans of her enemies - sometimes even before they did."
 N93_lineage_9: "Lineage of Ipudari"
 N93_lineage_9_desc: "Ipudari, the Final Arbiter. Advisors cluttered Ipudari’s palace. Constant discussions were held in rooms and hallways. Countless ideas and decisions were debated between officials. But in the end, Ipudari always had the last say."
 N93_lineage_10: "Lineage of Kendotu"
 N93_lineage_10_desc: "Kendotu, the Stonetongue. Straightforward and a little clumsy. Kendotu never minced words and got straight to the point. His candor was rather refreshing and gained him many a friend in unexpected places."
 N93_lineage_11: "Lineage of Mabaga"
 N93_lineage_11_desc: "Mabaga, the Merciful. Strict and stonefaced. His title might seem ill-fitting at first, but Mabaga always offered everyone a second chance. Yet only a fool would dare expect a third chance from the Merciful."
 N93_lineage_12: "Lineage of Dombilas"
 N93_lineage_12_desc: "Dombilas, the Stonehand. While not quite an iron grip, her hand was solid enough to firmly hold the reins of Marunuma, nonetheless. Her rule was strict but fair. And the people listened and responded earnestly to her commands."
 N93_lineage_13: "Lineage of Togeo"
 N93_lineage_13_desc: "Togeo, the Riversong. Togeo’s words flowed just like the rivers of the Great Plateau, freely and smoothly. He built a rapport with and received promises of support from many other realms through his eloquence and charm. The fact that he often reneged on his promises or found a loophole in the deals he agreed to may tarnish his reputation somewhat, but the beneficial results of his rule cannot be denied."
 N93_lineage_14: "Lineage of Dzaseli"
 N93_lineage_14_desc: "Dzaseli, the Fifteenth. The Skyfall Ogres have finally joined the Fourteen Lineages. They put forward the founding family of Dzaseli to represent the Clan-Guilds. Their ancestors were known for their benevolence. The clan today still continues that tradition, but no one dares mistake this kindness for weakness."

