 N93_override_name_tt: "Upon fully upgrading Kakunor and forming a new country, we will retain our glorious name."
 N93_enable_ogre_ruler_tt: "The Clan-Guilds will represent their own Lineage with a Skyfall Ogre Candidate during elections."
 N93_until_ruler_death_tt: "until the death of our §Yruler§!"

 N93_insight_0_tt: "The ruler of Marunuma is elected from one of the families representing the Fourteen Lineages. Each comes from a different background, bringing their own unique strengths and insights to the throne."
 N93_insight_1_tt: "Borpari was once the capital of the ancient kingdom of First Marunuma. The Stone Library still remains today, containing history of Marunuma's past glory.\n\nSecrets of institutional knowledge lurk deep within the Library's records."
 N93_insight_2_tt: "Marunuma and Sirimadsik have exchanged much knowledge and gifts between each other. The kobolds, as newcomers to the plateau, have always relied on our aid to adapt to this land. It's time that we send them an offer to advance this relationship further."
 N93_insight_3_tt: "The Sirimadsik prove themselves eager to integrate within Marunuman society. Perhaps we should dissolve the borders and barriers between our two countries?"
 N93_insight_4_tt: "Claiming Kakunor is one of the final steps to restoring Marunuma's past glory. To see the ancient kingdom alive once more... but Marunuma could not have made it this far without the contribution of the Clan-Guilds."
 N93_insight_5_tt: "Marunuma is the rightful ruler of the Great Plateau. The Fourteen Lineages and Clan-Guilds have long awaited this moment. These two groups were united in this goal, but will this alliance last now that their goal has been achieved?"
