# country
 bina_marunuma: "Bina Marunuma"
 bina_marunuma_ADJ: "Bina Marunuman"
# missions
 N93_stonescrawls_origin_title: "Stonescrawl's Origin"
 N93_stonescrawls_origin_desc: "Ancient Marunuman mages were the pioneers behind the great advancements in Utubodi magic. They were great manipulators of nature and the land, capable of shaping stone itself. Large stone chariots animated by their sorceries would hurtle towards enemy ranks and crush their unfortunate opponents. Together with the rune magic brought by the Skyfall Ogres to the plateau, Marunuma’s magical advancements would become indispensable in the creation of what is known as Stonescrawl magic, which now pervades the plateau.\n\nYet over the centuries, most of the plateau has become our equals in Stonescrawl expertise. This cannot be allowed to continue. We shall fund and sponsor our mages to further their studies into innovative new applications of Stonescrawl so that we may prove ourselves as not just the progenitors but the future of Stonescrawl."
 N93_lineage_of_marunuma_title: "Lineage of Marunuma"
 N93_lineage_of_marunuma_desc: "The scholars of the Great Plateau know of the existence of only a single kingdom before the Century of Storms, Bina Marunuma - Great Marunuma. Our ancestors once ruled over the entire southern half of the Great Plateau before their realm was devastated by the Century of Storms. Unfortunately, the surviving records of that great legacy are fragmentary. Fourteen powerful families have claimed a link to one of the ancient kings and heroes of Bina Marunuma. Unable to agree upon a true heir to the throne, these Fourteen Lineages instead agreed to elect a ruler from amongst their families. The constant change between ruling lineages has led to incessant maneuvering and political games that rapidly intensify whenever a reigning monarch appears close to death, but it has also allowed each Lineage to utilize their own unique strengths for the good of Marunuma whenever they occupied the throne."
 N93_rise_of_the_clan_guilds_title: "Rise of the Clan-Guilds"
 N93_rise_of_the_clan_guilds_desc: "When Kakunor fell, Marunuma was one of the first realms to embrace the newcomers emerging from the crashed Cloud City, the Skyfall Ogres. Quickly integrating within Marunuman society, the ogres proved themselves to be experts in production and trade. However, the Fourteen Lineages refused to allow the ogres to join their august families due to the biological incompatibility between ogre and human. Eventually, the ogres would therefore form powerful families of their own, the Clan-Guilds.\n\nToday, the Fourteen Lineages and Clan-Guilds match each other in power and influence, though the human aristocrats would never admit that. The Clan-Guilds have proven their willingness to cooperate for the sake of Marunuma, but only time will tell if the Fourteen Lineages will be able to overcome their nature and do the same."
 N93_kobold_kneighbors_title: "Kindly Kobold Neighbors"
 N93_kobold_kneighbors_desc: "The Sirimadsik Kobolds are the latest arrivals to the Great Plateau. A quiet folk, they had long kept themselves isolated from the rest of the plateau inhabitants. Yet this so-called Quiet Age of theirs came to an end after their ruling council was overthrown, triggering a protracted civil war. Marunuma, their closest neighbor, has gladly welcomed the diminutive newcomers into their lands. And like all good guests, the kobolds brought with them a gift, the practice of Stonestory, quickly embraced by local mages.\n\nSirimadsik is no longer as isolated as it once was. Let us rekindle these old bonds and share the knowledge of our formidable magical traditions."
 N93_rushing_stone_title: "Rushing Stone"
 N93_rushing_stone_desc: "While we were the creators of the original Stonescrawl Chariots, the large vehicles have long spread to the rest of the Great Plateau. But one crucial aspect sets ours apart from the rest - their massive size. Many have compared them to small fortresses, capable of crushing armies beneath the weight of a thousand stones. With improved Stonescrawl foundations, we should be able to supply our armies with even larger versions of these Mobile Fortresses."
 N93_stone_library_title: "The Stone Library"
 N93_stone_library_desc: "The Stone Library is one of the few remaining structures on the Great Plateau from before the Century of Storms. Built in Borpari, the old capital during the times of Bina Marunuma, the records of royal lineages and Bina Marunuma’s history were all contained within this ancient library. Though the current center of power in Marunuma has long moved to Sebuhkay, the prosperous heart of Kaganu, and its powerful Clan-Guilds, the Fourteen Lineages still consider Borpari their seat of power. Unfortunately, time has left its mark on the old records kept within the Stone Library. The Clan-Guilds have agreed to fund its restoration as a sign of harmony with the Fourteen Lineages. It is only right and proper that we expand the library and see its beauty and prestige rise to new heights."
 N93_the_thorn_title: "The Thorn in our Side..."
 N93_the_thorn_desc: "Gor’Auri, filled with militaristic would-be conquerors obsessed with their self-declared destiny to rule over the Great Plateau, had already twice controlled much of the Great Plateau, once under Yerema and once again under Isonas. Under their authoritarian rule, Marunuma had gained much prestige by opposing them and their iron grip.\n\nNowadays, they have been reduced to a weak thorn in our side, irritating but ultimately harmless. We still make the occasional use out of the little nuisances by using them as scapegoats, but they have outlived their usefulness. The people of Marunuma grow weary of their existence, and we are more than happy to oblige them."
 N93_kobold_kinship_title: "Kobold Kinship"
 N93_kobold_kinship_desc: "The Sirimadsik have shown themselves to be eager to deepen our cooperation. Through extensive exchanges of our magical traditions of Stonescrawl and Stonestory, we have grown ever closer. Yet the kobolds are still unfamiliar with the rest of the inhabitants of the Great Plateau. Perhaps, we can bind them even closer to us, and extend an offer of patronage and protection to further deepen our relationship."
 N93_hydraulic_works_title: "Hydraulic Works"
 N93_hydraulic_works_desc: "Marunuma contains many stoneworks built with Stonescrawl sorcery and sophisticated hydraulic mechanics. The Locks of Taronano control downriver trade and the famed Basalt Bridges connect the various districts of Sebuhkay.\n\nWith new techniques based on advances in Stonescrawl, we can erect similar marvels in the rest of our territory, improving our prosperity and strengthening our claim as the preeminent hydraulic engineers of the Plateau. And who better to oversee the vital river connections of the plateau than us?"
 N93_removed_from_our_side_title: "...Removed at Last"
 N93_removed_from_our_side_desc: "We have shown those little troublemakers in Gor’Auri their rightful place. Yet, despite our suppression of the most vocal amongst the dissidents, many undesirables in these rough borderlands still grumble at our new rule. Perhaps we can ‘volunteer’ some of them to establish new frontier outposts. The Clan-Guilds consider this as an excellent opportunity to both expand into new territory at little cost and get rid of the malcontent rabble.\n\nHowever, the Fourteen Lineages are not so eager to hand these opportunities to our longtime rivals. Arguing for direct control, they wish for Marunuma to seize the land and settle the frontier for themselves."
 N93_kobold_kuestion_title: "The Kobold Question"
 N93_kobold_kuestion_desc: "“Ah, faithful Sirimadsik, you were at my side all along. My true friend. My loyal companion.” - Ledwaga, of Kendotu, giving a speech during a grand joint celebration of the bond between Sirimadsik and Marunuma\n\nThe loyal kobolds have proven themselves true friends to the Marunuman cause. Our ties have grown far closer than we had anticipated, closer than we dared hope. There have been whispers among Sirimadsik and Marunumans both on the subject of their eventual integration in the greater Marunuma polity. Perhaps it is time to openly pose this question."
 N93_seize_the_rivers_title: "Seize the Rivers"
 N93_seize_the_rivers_desc: "The great rivers of the Great Plateau flow from its center to its northern or southern border, bringing trade and commerce along their course. If we can control the rivers, then we control the very commercial lifeblood of the Plateau. With our hydraulic construction techniques, we can build basalt bridges connecting opposing riverbanks across the rushing waters, allowing for quicker transportation across the Great Plateau."
 N93_seize_the_source_title: "Seize the Source"
 N93_seize_the_source_desc: "The mighty Daowati River running through our lands stems mainly from one source, Ci-Tanih. If we can claim this province, then all trade along the river would be in our hands. The Locks of Taronano have long been a wonder of construction as well as one of the main foundations behind the Clan-Guilds’ economical dominance. Recreating this marvel in Ci-Tanih would surely amaze the rest of the Great Plateau."
 N93_marunuman_legitimacy_title: "Marunuma Legitimacy"
 N93_marunuman_legitimacy_desc: "Bina Marunuma and much of its storied history was wiped out by the Century of Storms. Kakunor, the Cloud City, is a constant reminder of our ancient kingdom’s tragic downfall. If we wish to restore at least some of the former glory of Marunuma and establish ourselves as legitimate claimants to the role of hegemon of the Great Plateau, we will need to claim Kakunor. Let us show all others that the Rushing Stone of Marunuma can be stopped by no one."
 N93_marunuma_rightful_rulers_title: "Rightful Rulers of the Plateau"
 N93_marunuma_rightful_rulers_desc: "More than a millennium has passed since Marunuma has controlled the better part of the Great Plateau. We have truly proven to live up to the lofty example of our ancestors, and maybe even surpassed them, all thanks to our inventive new construction techniques and unstoppable Mobile Fortresses.\n\nBut our way back to the illustrious position of hegemon was not a solitary journey. We would not have made it this far without the steadfast cooperation between human, ogre, and kobold. Both the Fourteen Lineages and Clan-Guilds have contributed much to the glorious rise of Marunuma. And now it is time to pay to repay our debt to them."
# events
 flavour_marunuma.0.t: "The Lineages of the Fourteen Heroes"
 flavour_marunuma.0.desc: "“Bah! You are a fool if you think you could gain anyone’s vote here.”\n“Careful. You insult me, you insult my lineage.”\n“We all have lineages, you numbskull. That’s the only reason why I bother wasting my time on you.”\n\nElection times are always high-strung affairs in Marunuma. Fourteen families have tied their bloodline to the kings and heroes of ancient Marunuma. Unfortunately, much of the records of the old kingdom have been lost in the chaotic aftermath of the Century of Storms. Ever since, no single royal bloodline has managed to press their dynastic claim on the throne of Marunuma.\n\nInstead, the patriarchs of the Fourteen Lineages have selected the heir of each deceased monarch from amongst their ranks, often after rather spirited debates and political maneuvers, establishing a centuries-old elective monarchy.\n\nSadly, what should be a meeting of great minds and leaders often results in petty squabbles and vicious intrigues. Despite the infighting and lack of decorum, the rulers eventually selected by the Lineages usually prove themselves to be somewhat capable monarchs, once seated upon the throne. Each brings a wealth of specialized knowledge with them that helps guide their rule."
 flavour_marunuma.0.a: "That does not make their incessant bickering any less annoying."

 flavour_marunuma.1.t: "Where It All Began"
 flavour_marunuma.1.desc: "One cannot mention Marunuma without thinking of the ancient kingdom of Bina Marunuma, or “Great Marunuma.” Borpari, the old capital of the ancient kingdom, was devastated by the destruction during the Century of Storms. For many of its palaces and marvels, only ruins were left behind; yet the Stone Library managed to remain standing.\n\nAfter much effort, we have restored beauty to both the Stone Library and the old capital at large. The Fourteen Lineages have always held their meetings in Borpari, clinging to past glory. With the new renovations complete, they have eagerly made the suggestion of returning the seat of governance there, designating Borpari as the capital once again.\n\nHowever, the Clan-Guilds have made their home in Sebuhkay, the capital of the Kaganu province. To disregard the preeminent role that Sebuhkay currently plays for our realm in this manner would no doubt displease the powerful merchant ogres. They argue that the Marunuma of today is different from that of the distant past, and the new capital of Sebuhkay is an inevitable consequence of that profound change."
 flavour_marunuma.1.a: "Return the court to the old capital, Borpari."
 flavour_marunuma.1.b: "Maintain the current capital, [Root.Capital.GetName]."

 flavour_marunuma.2.t: "A Marunuman Offer"
 flavour_marunuma.2.desc: "Marunuma has sent us an offer of vassalization. Nowadays, the relationship between Sirimadsik and Marunuma is very close. And clearly, they think they can protect us from threats both within and beyond the Great Plateau. Now we need to decide: do we accept their offer or remain on equal footing?"
 flavour_marunuma.2.a: "Yeah, they’re probably right. We need their protection."
 flavour_marunuma.2.b: "We have managed matters quite well on our own, and will keep doing so."

 flavour_marunuma.3.t: "A Question of Cooperation"
 flavour_marunuma.3.desc: "Gone are the days of Sirimadsik isolation. Kobolds now wander freely throughout the stone-cobbled streets of Kaganu, having proven themselves to be eager participants in the wider Marunuman society. Ogres and Utubodi, on the other hand, regularly travel along the rivers into Sirimadsik, bringing their trade goods and traditions with them.\n\nShould we take this relationship one step further? Do we wish to join their lands with ours? The Fourteen Lineages are eager to expand their direct control over the Great Plateau and claim new lands. However, the Clan-Guilds would rather reward the kobolds’ loyalty with a continued treaty of alliance and protection, turning Sirimadsik into an autonomous march of Marunuma."
 flavour_marunuma.3.a: "All these lands belong together, under one name."
 flavour_marunuma.3.b: "Let these little guys do their own thing."

 flavour_marunuma.4.t: "Marunuma's Glorious Return"
 flavour_marunuma.4.desc: "Kakunor, the Cloud City of the Giants, was strangely quiet today. Its inhabitants were hushed, anticipating what was to come. After what felt like an eternity, the expectant silence was broken by the sound of rumbling. As the rumbling grew louder, the inhabitants of the metropolis spotted a number of shapes swiftly growing in the distance. Gasps of shock and awe spread throughout the crowd, but even those quickly died down when it became clear what had arrived at the gates of Kakunor.\n\nThe rumbling grew louder as the source of the reverberating noise revealed itself. Large wheels rolling across ground, the very surface itself trembling under the weight. Massive stone fortresses were doing the unthinkable. They were moving towards the city.\n\nOn this day, Kakunor received a small demonstration of the terrifying might that had struck fear into the rest of the Great Plateau. The towering Mobile Fortresses of Marunuma had arrived, massive Stonescrawl Chariots that almost reached the height of the very walls of Kakunor.\n\nGiven this demonstration of military superiority, the surrender was a mere formality. And with Kakunor falling into their hands, Marunuma had come one step closer to proving itself the true ruler of the Great Plateau.\n\nAfter this unmitigated triumph, the Fourteen Lineages are eager to pay homage to their hallowed ancestors. It is time to reclaim the name of Bina Marunuma. Or maybe Marunuma should demonstrate its respect for the changes that have enabled its return to preeminence, and recognize the invaluable contributions of the Clan-Guilds. The ogres have aided Marunuma every step of the way for over a millennium. Perhaps the powerful merchant clans should finally be granted a position amongst the ruling families."
 flavour_marunuma.4.a: "Witness the rebirth of Bina Marunuma!"
 flavour_marunuma.4.b: "Let the Clan-Guilds become the Fifteenth Lineage!"

 flavour_marunuma.5.t: "The Rightful Rulers of the Plateau"
 flavour_marunuma.5.desc.a: "It was a glorious day. The capital was full of celebration and joy. The people freely feasted on the delicacies provided by street vendors, all paid for by the largesse of the Fourteen Lineages, of course. Giant Stonescrawl sculptures rolled across the paved streets, carved in the appearances of the glorious heroes of old. Party boats floated across the rivers and canals.\n\nIt was a tragic night. Spurned at every turn, the Clan-Guilds struck when it was least expected. Drunken soldiers and guards were unprepared for the sudden uprising, only barely managing to prevent a full-scale takeover of the capital.\nThis futile act of rebellion must be shut down. It is truly a shame that the ogres could not see their true purpose on the journey towards Marunuma’s golden destiny. Perhaps, in another world, the Clan-Guilds could have ruled alongside the Heroic Lineages."
 flavour_marunuma.5.desc.b: "It was a glorious day. The capital was full of celebration and joy. The citizens freely feasted on the delicacies provided by street vendors, all paid for by the generosity of the Clan-Guilds, of course. Giant Stonescrawl sculptures rolled across the paved streets, carved in beautiful renditions of great marvels of construction and important paragons of mercantile acumen. Party boats floated across the rivers and canals.\n\nIt was a tragic night. Spurned at every turn, the Fourteen Lineages struck when it was least expected. Drunken soldiers and guards were unprepared for the sudden uprising, only barely managing to prevent a full-scale takeover of the capital.\nThis futile act of rebellion must be shut down. It is truly a shame that the noble families could not accept the rise of the Clan-Guilds as the true rulers of Marunuma. Perhaps, in another world, the Fourteen Lineages could have ruled alongside the Clan-Guilds."
 flavour_marunuma.5.desc.c: "It was a glorious day. The capital was full of celebration and joy. The citizens freely feasted on the delicacies provided by street vendors, all paid for by the rulers of Marunuma, of course. Giant Stonescrawl sculptures rolled across the paved streets, carved in beautiful renditions of both great marvels of construction and ancient heroes. Party boats floated across the rivers and canals.\n\nIn the end, it was a quiet night. The celebrations slowly died down. Citizens fell fast asleep in their beds, bellies full and veins flush with the essence of intoxicating beverages. In the throne room, the newly formed Fifteen Lineages gathered. Ogre and human were at long last united in rule, and Marunuma was all the better off for it."
 flavour_marunuma.5.a: "But, alas, this is not that world."
 flavour_marunuma.5.b: "What a wonderful world this turned out to be."

