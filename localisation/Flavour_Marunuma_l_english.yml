 N93_define_random_dip_advisor_tt: "Gain a random skill §Y1§! Diplomatic Advisor, of §YSkyfall Ogre§! culture. This advisor is §G75%§! cheaper for your country to employ."
 N93_unlock_mobile_fortress_tt: "\nUnlock the §JMobile Fortress§!, a mercenary company that gains additional modifiers based on the Abjuration Level of the [This.GetMagesName].\n\n§ZProficient§!: Reduced Fire and Shock Damage Taken\n§sRenowned§!: Cavalry Shock\n§yLegendary§!: Morale Damage\n\nEach Abjuration Level also increases the power of previous modifiers.\n\n§RWARNING§!: Advancing an Abjuration Level will disband any hired §JMobile Fortress§!."
