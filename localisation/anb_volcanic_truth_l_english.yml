l_english:

#Events
 flavour_volcanic_truth.1.t:0 "A Newborn Island"
 flavour_volcanic_truth.1.d:0 "In a tremendous explosion of steam and burning rock, a new island has been born in the ocean near [newborn_island_province.GetName].\nWhile the Magmascryers are excited about this spectacular event, they are divided about how to interpret it. \nSome claim that this is an omen from Quahopilo, the Twin God associated with violent change. They see the conflagration that birthed this island as a portent of conflict, and that we must be ready for such an occasion.\nOthers see it as a sign from Muatlaqua, the Twin God associated with gradual change. They argue that this is merely one more step in a vast process, one which began ages ago on the seafloor and will continue far into the future. To them, this is not an omen, but a reminder to be adaptive."
 flavour_volcanic_truth.1.a:0 "Proclaim a month of celebration."
 flavour_volcanic_truth.1.b:0 "Dedicate the island to Quahopilo."
 flavour_volcanic_truth.1.c:0 "Dedicate the island to Muatlaqua."
 flavour_volcanic_truth.1.e:0 "Profit from the mass of pilgrims."
 
 island_dedication_quahopilo:0 "Dedicated to Quahopilo"
 island_dedication_muatlaqua:0 "Dedicated to Muatlaqua"

 flavour_volcanic_truth.2.t:0 "Visions of Glory"
 flavour_volcanic_truth.2.d:0 "A small volcano in [visions_of_glory_province.GetName] is going to erupt soon. The nearby villages have already been evacuated and no serious damage is expected, but [Root.Heir.GetTitle] [Root.Heir.GetName] has come forward with an ambitious proposal. [Root.Heir.GetSheHeCap] claims to have received a vision from the sacred volcano Muatlaqua. In this vision, [Root.Heir.GetName] carries a small turtle safely through volcanic fire, and emerges burned and scarred but crowned in glory. Galvanised by this vision, [Root.Heir.GetName] requests permission to brave the eruption.\nLong ago the legendary hero Ula'ahi braved a volcanic eruption in order to convince three Dragon Turtles to flee - is Muatlaqua calling on [Root.Heir.GetName] to repeat that storied feat?"
 flavour_volcanic_truth.2.a:0 "Allow it."
 flavour_volcanic_truth.2.b:0 "Forbid it."
 flavour_volcanic_truth.2.c:0 "Allow it, with suitable arcane safeguards."
 flavour_volcanic_truth.2.e:0 "Allow it, with flawless arcane safeguards."
 flavour_volcanic_truth.2.f:0 "Commission the artificers to create suitable protection for [Root.Heir.GetHerHim]."
 flavour_volcanic_truth.2.g:0 "The [Root.GetClergyName] have rituals that may help, but they are not cheap."
 
maintaining_volcanic_spells:0 "Maintaining Spells"
maintaining_volcanic_artifice:0 "Maintaining Artificery"

 flavour_volcanic_truth.3.t:0 "A Gift From the Volcano?"
 flavour_volcanic_truth.3.d:0 "While performing a ritual near a lava-filled caldera in [volcano_reward_province.GetName] our Magmascryers noticed something unusual. A boulder of solid pale rock floating in the lava lake, tantalizingly close to the shore. While bubbles of semi-solid lava regularly find their way to the surface, this one is quite unusual, both for its size and its longevity - most such formations last for a few minutes at most. Yet this one appears to be stable in the midst of the bubbling lava.\nThe Magmascryers are convinced that this boulder is a gift from the volcano - that either the stone itself is precious or that it hides some kind of treasure inside it. Retrieving the strange rock will be neither cheap nor safe, but the Magmascryers insist that to refuse the gift would be sacrilegious."
 flavour_volcanic_truth.3.a:0 "We cannot risk it."
 flavour_volcanic_truth.3.b:0 "Retrieve it with sorcerous means."
 flavour_volcanic_truth.3.c:0 "Have the artificers rig up a contraption to retrieve the rock."
 flavour_volcanic_truth.3.e:0 "They will not like it, but task the army to haul it in."
 flavour_volcanic_truth.3.f:0 "Hire some daring adventurers to retrieve it."
 
 flavour_volcanic_truth.4.t:0 "Treasures from Fire"
 flavour_volcanic_truth.4.d.1:0 "Once the strange boulder was hauled to safety, the Magmascryers excitedly investigated it. They soon determined that the rock itself was nothing special, but something special was embedded deep within. Cracking it open, they found a massive geode filled with beautiful crystals, glittering in shades of blue and violet. The Magmascryers are ecstatic at this sacred gift and demand that it be accorded all due respect."
 flavour_volcanic_truth.4.d.2:0 "Once the strange boulder was hauled to safety, the Magmascryers excitedly investigated it. They soon determined that the rock itself was nothing special, but something special was embedded deep within. Cracking it open, they found the bones of some strange creature, all tumbled together deep inside the rock. It is impossible to tell if they are the remains of an animal or a person. The Magmascryers are unsure what to make of this, but recommend that they be treated with the utmost dignity."
 flavour_volcanic_truth.4.d.3:0 "Once the strange boulder was hauled to safety, the Magmascryers excitedly investigated it. They soon determined that the rock itself was nothing special, but something special was embedded deep within. Cracking it open, they found a sphere of pure bronze, totally mundane except for being as scorchingly hot as though it had just been pulled from the forge. Even days later it had not lost the heat, which appears to be a permanent magical effect."
 flavour_volcanic_truth.4.d.4:0 "Once the strange boulder was hauled to safety, the Magmascryers excitedly investigated it. They soon determined that the rock itself was nothing special, but something special was embedded deep within. Cracking it open, they found a small spirit of orange flame, roughly spherical but fuzzy at the edges. It seems friendly and mostly harmless - so long as no one accidentally touches its fiery body"
 flavour_volcanic_truth.4.d.5:0 "Once the strange boulder was hauled to safety, the Magmascryers excitedly investigated it. They soon determined that the rock itself was nothing special, but something special was embedded deep within. Cracking it open, they found damestear! A damestear crystal of incredible purity and potency, glowing a radiant teal-blue."
 flavour_volcanic_truth.4.d.6:0 "Once the strange boulder was hauled to safety, the Magmascryers excitedly investigated it. They soon determined that the rock itself was nothing special, but something special was embedded deep within. Cracking it open, they found a strange artifact made of some unknown pale metal - like a children's puzzle box but vastly more intricate."
 flavour_volcanic_truth.4.d.7:0 "Once the strange boulder was hauled to safety, the Magmascryers excitedly investigated it. They soon determined that the rock itself was nothing special, but something special was embedded deep within. Cracking it open, they found a live fish, utterly mundane. Those assembled watched in bafflement as it flopped around in the air for a few minutes, then died."
 flavour_volcanic_truth.4.d.8:0 "Once the strange boulder was hauled to safety, the Magmascryers excitedly investigated it. They soon determined that the rock itself was nothing special, but something special was embedded deep within. Cracking it open, they found pearls, or at least something very much like them. Their iridescent sheen is colored in shades of red and orange rather than the more familiar white and pink, but the texture of nacre is unmistakable. The Magmascryers have declared them sacred and demand that they be treated as such."
 flavour_volcanic_truth.4.d.9:0 "Once the strange boulder was hauled to safety, the Magmascryers excitedly investigated it. They soon determined that the rock itself was nothing special, but something special was embedded deep within. Cracking it open, they found gold! Gleaming warm and brilliant, a true gift from the depths of the mountain."
 flavour_volcanic_truth.4.d.10:0 "Once the strange boulder was hauled to safety, the Magmascryers excitedly investigated it. They soon determined that the rock itself was nothing special, but something special was embedded deep within. Cracking it open, they found what at first appeared to be liquid lava, but on contact with air it rapidly crystallized into fractal shapes resembling flowers - each one glowing like white-hot fire but cool to the touch."
 flavour_volcanic_truth.4.d.11:0 "Once the strange boulder was hauled to safety, the Magmascryers excitedly investigated it. They soon determined that the rock itself was nothing special, but something special was embedded deep within. Cracking it open, they found some kind of poisonous gas - invisible and viscous but incredibly potent. Those present were able to escape without permanent damage, but the poison soon rolled down the side of the volcano, damaging crops and forcing the nearby villages to evacuate. It will be some years before the area recovers."

