 flavour_volcanic_truth.4.a:0 "Build a new shrine and have this find displayed prominently!"
 flavour_volcanic_truth.4.b:0 "If the Magmascyers want it so much, let them pay for it."
 flavour_volcanic_truth.4.c:0 "Declare them a holy relic."
 flavour_volcanic_truth.4.e:0 "Return them respectfully to the fiery depths of the volcano."
 flavour_volcanic_truth.4.f:0 "Use them as ingredients for magical rituals."
 flavour_volcanic_truth.4.g:0 "Equip our most accomplished soldiers with it."
 flavour_volcanic_truth.4.h:0 "Our smiths can surely make good use of this metal."
 flavour_volcanic_truth.4.i:0 "What a rare opportunity for elemental studies."
 flavour_volcanic_truth.4.j:0 "Let it do as it pleases, it is a sign of the gods' blessing."
 flavour_volcanic_truth.4.k:0 "The find of a century!"
 flavour_volcanic_truth.4.l:0 "Reserve it for the Artificers."
 flavour_volcanic_truth.4.m:0 "Sell it to the highest bidder!"
 flavour_volcanic_truth.4.n:0 "Study it."
 flavour_volcanic_truth.4.o:0 "Display it."
 flavour_volcanic_truth.4.p:0 "What?"
 flavour_volcanic_truth.4.q:0 "A clear sign of divine favor!"
 flavour_volcanic_truth.4.r:0 "Use them as magical reagents."
 flavour_volcanic_truth.4.s:0 "A great boon for the treasury!"
 flavour_volcanic_truth.4.u:0 "Build a garden filled with these miraculous 'magma flowers'"
 flavour_volcanic_truth.4.v:0 "Plant them in our existing magma flower garden."
 flavour_volcanic_truth.4.w:0 "Study how they manage to change form like this."
 flavour_volcanic_truth.4.x:0 "Auction them off to the highest bidder."
 flavour_volcanic_truth.4.y:0 "Curses!"
