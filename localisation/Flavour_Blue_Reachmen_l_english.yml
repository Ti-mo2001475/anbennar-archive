# events
 flavour_blue_reachmen.3.t: "Lessons of Malliath"
 flavour_blue_reachmen.3.desc: "Greed is good. And Malliath was pretty greedy. Even good come from evil. Or something like that."
 flavour_blue_reachmen.3.a: "Nods head in understanding."

 flavour_blue_reachmen.4.t: "Serpent's Protection"
 flavour_blue_reachmen.4.desc: "We're having troubs. Serpentgard says they can take over."
 flavour_blue_reachmen.4.a: "Sure."
 flavour_blue_reachmen.4.b: "Nope."

 flavour_blue_reachmen.5.t: "Elven Marriage"
 flavour_blue_reachmen.5.desc: "Humans and elves like each other. They start fucking."
 flavour_blue_reachmen.5.a: "Good for them."

 flavour_blue_reachmen.6.t: "Increase in Half-Elven Population"
 flavour_blue_reachmen.6.desc: "[Root.GetName] is experiencing a boom in Half-Elven population."
 flavour_blue_reachmen.6.a: "Five! Big! Booms!."

 flavour_blue_reachmen.7.t: "The Body"
 flavour_blue_reachmen.7.desc: "Aeril found Maldorian's body. But his blade's gone. There's a McDonald's receipt here for Grimace Shake(TM). The location is the Frostbridges area."
 flavour_blue_reachmen.7.a: "The clues point to Frostbridges."
 flavour_blue_reachmen.7.b: "We already got Frostbridges."

 flavour_blue_reachmen.8.t: "The Blade"
 flavour_blue_reachmen.8.desc: "Aeril found the sword. He's a pretty swell guy."
 flavour_blue_reachmen.8.a: "He's got my vote."

 flavour_blue_reachmen.9.t: "Kobold Governance"
 flavour_blue_reachmen.9.desc: "The kobolds have proven themselves worthy of joining our Knightly order. We can integrate them directly, or perhaps let them have some self-governance."
 flavour_blue_reachmen.9.a: "Let them have autonomy."
 flavour_blue_reachmen.9.b: "Dun care, gib land."

 flavour_blue_reachmen.11.t: "Kobolds Return to [Root.GetName]!"
 flavour_blue_reachmen.11.desc: "The kobolds return to their homes."
 flavour_blue_reachmen.11.a: "Yippee!"
 flavour_blue_reachmen.11.b: "Yippee! (But hide these events henceforth)"

 flavour_blue_reachmen.15.t: "Celmaldor Accepts"
 flavour_blue_reachmen.15.desc: "Serpentgard is big dog now."
 flavour_blue_reachmen.15.a: "Woof"

 flavour_blue_reachmen.16.t: "Celmaldor Rejects"
 flavour_blue_reachmen.16.desc: "Serpentgard remains subject."
 flavour_blue_reachmen.16.a: "Gonna have to do this the hard way."
