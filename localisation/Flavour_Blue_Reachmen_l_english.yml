l_english:
# missions
 BR_reaching_out_title: "Reaching Out"
 BR_reaching_out_desc: "We should use any opportunity to secure allies within our league. Now that Celmaldor and Bayvic are losing their grip, we could guarantee their neutrality or even convince them to support us as a league leader."
 BR_something_is_stirring_title: "Something is Stirring..."
 BR_something_is_stirring_desc: "The borders of the Reach are becoming increasingly dangerous. Celmaldor and Bayvic are seemingly failing to keep the League safe. It is time for us to take the initiative by preparing our forces."
 BR_4_2_swap_title: "[GetBRMissionCol4Row2Title]"
 BR_4_2_swap_desc: "[GetBRMissionCol4Row2Desc]"
 BR_under_new_management_title: "Under New Management"
 BR_under_new_management_desc: "We have won and proven our superiority. It is our time to lead the League into a better future."
 BR_reaching_in_title: "Reaching In"
 BR_reaching_in_desc: "Now that we find ourselves in a role of the League's leader, it is important to cement our connections with other cities."
 BR_expand_the_city_borders_title: "Expand the City Borders"
 BR_expand_the_city_borders_desc: "Leading the League requires us to be richer and stronger than other cities. As we find ourselves scrutinized by other league members, it is ripe time for us to expand the city borders."
 BR_one_league_one_dream_title: "One League, One Dream"
 BR_one_league_one_dream_desc: "Finally, all of the Reach's cities are under one league and one leadership. We are a step closer to realizing our dream."
 BR_adshaws_title: "Adshaws"
 BR_adshaws_desc: "Adshaws were once the great dynasty ruling over all of the Reach, but now they are a rump state boxed between Gawed and the Reach cities. Maybe we should do something about it."
 BR_blue_seaway_title: "Blue Seaway"
 BR_blue_seaway_desc: "Sea trade isa crucial part of the Reach's culture. Commerce flows from one port to another, enriching the region. We should build infrastructure to support it."
 BR_economic_unison_title: "Economic Unison"
 BR_economic_unison_desc: "As our League expands to encompass more and more of Reach cities, it is our prerogative to establish a unified market."
 BR_dream_reached_title: "Dream Reached"
 BR_dream_reached_desc: "The Reach is United and the dream of the Reach Nationhood is nearly fulfilled."
