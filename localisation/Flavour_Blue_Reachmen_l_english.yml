# serpentgard
# missions
 Z21_centralize_the_order_title: "Centralize the Order"
 Z21_centralize_the_order_desc: "The Knights of the Serpent are too spread out, without a central citadel to congregate in. We can change that by housing the main branch of the order in our capital. That would allow us to form sister branches both domestically and abroad."
 Z21_equestrian_traditions_title: "Equestrian Traditions"
 Z21_equestrian_traditions_desc: "Serpentheader Horses are one of the most values commodities of the Serpentgard. Their hardy nature with strong builds makes them perfect for the local climate. So much so that they see wide use all over the Reach both for war and agriculture."
 BR_knightly_oversight_title: "Knightly Oversight"
 BR_knightly_oversight_desc: "As Celmaldor is struggling at war, it is our responsibility to step up as their shield."
 Z21_reaching_in_title: "Reaching In"
 Z21_reaching_in_desc: "Now that we find ourselves in a role of the League's leader, it is important to cement our connections with other cities."
 Z21_expand_the_city_borders_title: "Expand the City Borders"
 Z21_expand_the_city_borders_desc: "Leading the League requires us to be richer and stronger than other cities. As we find ourselves scrutinized by other league members, it is ripe time for us to expand the city borders."
 Z21_maldorians_harbour_title: "Maldorian's Harbour"
 Z21_maldorians_harbour_desc: "Maldorian's Landing changed the trajectory of the region and transformed Serpentgard into the order that it is now. Now that we hold direct control over his harbour, that would surely bring about new changes."
 Z21_knights_assemble_title: "Knights, Assemble!"
 Z21_knights_assemble_desc: "Although Knights of the Serpent operate all around the Reach, they are always ready to answer our call and return to their homeland."
 Z21_maldorians_heirs_title: "Maldorian's Heirs"
 Z21_maldorians_heirs_desc: "Lore about half-elf named Aeril 'Silmaldorian' Serpentsgard. He petitions the state to sponsor an investigation of the Maldorian's body's whereabouts."
 Z21_self_education_title: "Self-Education"
 Z21_self_education_desc: "Study Malliath and his failures. Learn from his mistake and gain appreciation of his sacrifice."
 Z21_northern_raiders_title: "Northern Raiders"
 Z21_northern_raiders_desc: "Lore about Bjarnrik's previous attempts to conquer our homeland and general threat of the Gerudians."
 Z21_reaffirm_our_mission_title: "Reaffirm Our Mission"
 Z21_reaffirm_our_mission_desc: "Knights of the Serpent safeguarded the Reach from monsters of all sorts. Now that the borders of the Reach came in contact with the Kobolds, we must fulfill our purpose and defend the Second Head of the Great Serpent."
 Z21_knights_proclamation_title: "Knight's Proclamation"
 Z21_knights_proclamation_desc: "As the Order grew increasing the number of branches, the necessity to reform administration arose. As the Knights of the Serpent protect the whole Reach, we make a solmen vowto keep the peace and guard it."
 Z21_smart_kobold_pious_kobold_title: "Smart Kobold, Pious Kobold"
 Z21_smart_kobold_pious_kobold_desc: "Kobold hordes brought great devastation to the lands they conquered. At first, they seemed no better han Sea Trolls, but unlike the latter, they possesed commendable ingenuity and willingness to be educated."
 Z21_guardians_of_the_two_heads_title: "Guardians of the Two Heads"
 Z21_guardians_of_the_two_heads_desc: "Malliath was fabled to have two heads, one previously being overrun by Kobold hordes. Now that we see their potential, it is our duty to edcuate them and guard them from those who wish misfortune upon them."
