cb_busilar_rav_war: "War for Gods truth"

#tooltips
A29_will_set_you_free_tt: "Every province in a Trade Node where §YPropagate Religion§! is active has a chance to flip to Ravelian equal to half your trade share in that node.\n\nEvery Nation meeting the mission conditions with less than §Y200§! Development will convert to Ravelian."
A29_rav_dev_effect_tt: "For every Development click done in a province with a §YRavelian Society§! prior to completing this mission, gain §G0.5§! Innovativeness, up to §G10§! total. Currently: [Root.busilar_rav_dev_clicks.GetValue]"
A29_haven_mission_reward_tt: "Our Reward will depend on if we follow the §YRegent Court§! or §YCorinite§! Faith."
A29_corinite_haven_reward_tt: "Harmful Deluge events will now provide beneficial effects."
A29_win_religious_league_tt: "If we complete this mission by winning the §YLeague War§!"
A29_the_emperor_tt: "If we complete this mission whilst being the §YEmperor of Anbennar§!:\nGain §Y1§! Imperial Authority per Imperial province in the Borders region."
A29_not_the_emperor_tt: "If we complete this mission whilst not being the §YEmperor of Anbennar§!:\nRemove all provinces in the borders from the Empire. For each province removed this way gain §G10§! Admin, Diplomatic and Military Points."
A29_planetouched_unlock_tt: "Has happened:\nGain access to the §YPlanetouched§! Estate in the §YScattered§! Organisation."
A29_missionary_strength_tt: "Administrative Advisors now provide an additional §G0.5%§! Global Missionary Strength per level."
A29_land_and_sea_1_tt: "If you have more §YBarracks§! than §YDocks§!"
A29_land_and_sea_2_tt: "If you have more §YDocks§! than §YBarracks§!"
A29_land_and_sea_3_tt: "If you have an equal number of §YBarracks§! and §YDocks§!, but less than §Y5§! of each"
A29_land_and_sea_4_tt: "If you have at least §Y5§! §YBarracks§! and §YDocks§!"
A29_emperors_mantle_privilege_tt: "Unlocks the §YEmperor's Mantle§! privilege for the §YPlanetouched§! Estate.\n"
A29_mantle_oppressed_tt: "If we complete this mission whilst the §YPlanetouched§! are §YOppressed§!:\nGain access to the §YTree of Tales§! Monument"
A29_mantle_empowered_tt: "If we complete this mission whilst the §YPlanetouched§! are §YEmpowered§!:\nGain access to the §YGrand Imperial Arena§! Monument"
A29_mantle_state_tt: "If we complete this mission whilst the §YPlanetouched§! are §YState Controlled§!:\nGain access to the §YDendugma Monastery§! Monument"
A29_two_crowns_reforms_tt: "Unlocks the §YImperial Right§! and §YHorasheshi Tribute§! Stewardship Reforms."
A29_imperial_right_tt: "Gain §G-20%§! Province Warscore Cost for §Y5§! years when declaring War."
A29_boons_of_the_society_tt: "Enables the §YBoons of the Society§! privilege for the §YArtificer§! Estate."
A29_lions_arsenal_tt: "For every province with a §YWeapons Manufactory§!, §YBarracks§! and §YRegimental Camp§!, gain §G0.5%§! War Artificer Forcelimit, up to a maximum of §G12.5%§!."
A29_arty_regiment_req_tt: " War Artificer Inventions Equipped"
A29_warrior_automata_buff_tt: "Using the Warrior Automata Rectorate Action will grant §G1%§! Discipline per active War Artificer Invention, up to a maximum of §G5%§!"
A29_warrior_automata_buff_effect_tt: "\nGrants §G1%§! Discipline per active War Artificer Invention, up to a maximum of §G5%§!\n"
A29_faster_genepillar_tt: "§YGene Pillar§! Expeditions will be §G25%§! faster!"
A29_gene_pillar_hp_tt: "§YGene Pillar§! Expedition parties will have §G1§! more health"
A29_refund_papal_influence_tt: "Rectorate actions will refund §Y1/4th§! of their cost on use."
A29_trade_companies_torture_me_tt: "Adding provinces to trade companies grants §Y+1§! Base Production, if they have a Center of Trade gain §G1§! Mercantilism.\nThis effect applies retroactively."
A29_not_at_all_problematic_tt: "Exploiting Development on provinces outside of Cannor, Fanguala, Kheterata and Bahar grants the modifier §YEfficient Extraction§!, giving the following effects:\n§G25%§! Goods Produced for §Y20§! years." 
A29_mechanim_exploitation_tt: "§YAutomatories§! will now provide §G0.2§! Goods Produced in the province and all neighboring provinces."
A29_develop_castle_tt: "The §YExpand The Fortifications§! Privilege will no longer block the Nobility from losing Crownland from Development."
A29_temples_give_tax_dev_tt: "Building a §YTemple§! or §YCathedral§! in a province will grant the province §G1§! £adm£ §Ydevelopment§!. This development will be §Rremoved§! if we destroy the building.\nThis effect applies retroactively.\n\n§GIf we spread the development across our Empire, we may gain bonuses later...§!" #todo check colour
A29_enlightenment_spawn_tt: "Busilar will spawn §Genlightenment§! once it is enabled"
A29_embracement_or_prosperity_tt: "All provinces with both a §YCathedral§! and a §YUniversity§! will gain §Y50§! progress to any unembraced institution or Propserity if there is none."
A29_taking_next_tech_tt: "Taking the next Technology in each category will refund §Y100§! of its corresponding Monarch Points."
A29_planetouched_production_unlock_tt: "Unlocks the §YPlanetouched Production§! estate privilege which grants §G10%§! Production Efficiency"
A29_nurture_people_tt: "Up to §Y5§! provinces fufilling the conditions gain §G25§! Prosperity and §G2§! Base Manpower."
A29_league_war_complete: "The §YLeague War§! has ended or never occured."
A29_owned_ironwood_tt: "Gain §Y2§! years of income from production in §YIronwood§! Provinces."
A29_busilar_is_so_cool_tt: "Gain the bonuses of the other two §YHegemonies§! at half strength.\n\nNo other country will ever claim §YHegemony§!!"
A29_ardimya_investment: "For each province meeting the conditions, a random coastal province in the Businor region gets the permanent province modifier §YArdimyan Investments§! until the end of the game, giving the following effects:\n§G+1000§! Local Sailors\n§G-50%§! Shipbuilding Time\n§G-1%§! Naval Maintenance\n\nThis may be applied to up to §Y15§! Provinces."
A29_might_mandate_tt: "Winning Wars against Rivals or Great Powers grants §Y5§! Mandate"
A29_palace_economy_unlock_tt: "Unlocks the §YRepurpose the Brotherhoods§! and §YPalace Economy§! Stewardship Reforms"
A29_palace_economy_tt: "Gain §G0.5§! Mandate and §G0.05§! Hedonism Yearly per §YTrade Good§! you have the §GTrading In§! Bonus for."
A29_i_deleted_ananoma_hungry_tt: "We have dismantled an §YAnanoma.§!"
A29_mural_discovered_tt: "We have discovered the §YMural of Castellos§!"
A29_ahead_tech_tt: "We are ahead of time in all §Ytechnologies§!."
A29_weird_rain_tt: "The Crimson Deluge has begun."
A29_religion_wars_tt: "§RThe wars of religion will be re-ignited in the Empire.§!"
has_won_at_least_75_battles: "Have won at least §Y75§! battles."
A29_holohana_kill_tt: "We have §Yfelled§! one of Insyaa's §RHolohana§!."
A29_bionicle_sets_tt: "Have unlocked at least one Insyaan §YGene Pillar Artificery Invention.§!"
A29_valuable_goods_tt: "Is producing one of: §YCoal§!, §YDamestear§!, §YMithril§!, §YCloves§!, §YPaper§!, §YPrecursor Relics§!, §YCoffee§!, §YChinaware§!, §YCopper§!, §YCloth§!, §YGlass§!, §YDyes§!, §YSilk§!, §YCocoa§!, §YIvory§!, §YSlaves§!, §YSalt§!, §YFur§! or §YCotton§!."
A29_trade_company_torture_me_more_tt: "Has at least 3 §Yinvestments§! in the Yetshelok trade node"
A29_wex_rival_verne_tt: "The Emperor will §Rrival§! Verne!"
A29_colonial_settler_increase: "Has §G90§! Global Settler Increase, excluding Settlers from Technology."
A29_dev_on_trade_company_tt: "Building trade company investments will grant §G1§! production dev in all provinces of the area!"
A29_narawen_1_or_greater_tt: "Have §YNarawen's Wake§! §GI§! or higher."
A29_narawen_2_or_greater_tt: "Have §YNarawen's Wake§! §GII§! or higher."
A29_narawen_3_or_greater_tt: "Have §YNarawen's Wake§! §GIII§! or higher." 
A29_hinuifire_upgrade: "This modifier will increase by §G1%§! with each successive §YHolohana§! kill, up to a maximum of §G20%§!."
A29_propogate_tt: "The §YPropogate Religion§! trade policy will now only require §G25%§! Trade Power in the node."
A29_gnolls_revolt_tt: "Gnollish §RRebels§! will rise up in a random province in the Khenak Range!"
A29_i_am_a_khetist_tt: "We will be able to claim the §YStewardship of the Sorrow§!!"
A29_rose_wow_tt: "We have at least §G2§! allies who were members of the §YRose Party§!."
A29_we_ate_the_island_tt: "The cost of accepting §YTefori§! culture will be §Yrefunded§! and turned into a free slot."
