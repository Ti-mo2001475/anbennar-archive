#tooltips
A29_rav_dev_effect_tt: "For every development click done to provinces with a §YRavelian Society§!, gain §G0.5§! Innovativeness, up to 10 total."
A29_haven_mission_reward_tt: "Our Reward will depend on if we follow the §YRegent Court§! or §YCorinite§! Faith."
A29_corinite_haven_reward_tt: "Harmful Deluge events will now provide beneficial effects."
A29_win_religious_league_tt: "If we complete this mission by winning the §YLeague War§!"
A29_the_emperor_tt: "If we complete this mission whilst being the Emperor of Anbennar:\nGain one Imperial Authority per Imperial province in the Borders region."
A29_not_the_emperor_tt: "If we complete this mission whilst not being the Emperor of Anbennar:\nRemove all provinces in the borders from the Empire. For each province owned by Busilar or its Allies removed this way gain 10 Admin, Diplomatic and Military Points."
A29_planetouched_unlock: "Has happened:\nGain access to the §YPlanetouched§! Estate in the §YScattered§! Organisation."
A29_missionary_strength_tt: "Administrative Advisors now provide an additional §G0.5%§! Global Missionary Strength per level."
A29_land_and_sea_tt: "If you have more Barracks than Docks, gain the Permanent Modifier §Y'Land Focus'§! until the end of the game, giving:\n §G+10%§! Land Morale.\n\nIf you instead have more Docks than Barracks, gain the Permanent Modifier §Y'Naval Focus'§! until the end of the game, giving:\n §G+10%§! Naval Morale.\n\nIf you have an equal number of Barracks and Docks, gain the Permanent Modifier §Y'Interservice Balance'§! until the end of the game, giving:\n §G+7.5%§! Land Morale and §G+7.5%§! Naval Morale."
A29_emperors_mantle_privilege_tt: "Unlocks the §YEmperor's Mantle§! privilege for the §YPlanetouched§! Estate."
A29_mantle_oppressed_tt: "If we complete this mission whilst being the §YPlanetouched§! are §YOppressed§!:\nGain access to the §YTree of Tales§! Monument"
A29_mantle_empowered_tt: "Alternatively, if we complete this mission whilst being the §YPlanetouched§! are §YEmpowered§!:\nGain access to the §YGrand Imperial Arena§! Monument"
A29_mantle_state_tt: "Alternatively, if we complete this mission whilst being the §YPlanetouched§! are §YState Controlled§!:\nGain access to the §YDendugma Monastery§! Monument"
A29_two_crowns_reforms_tt: "Unlocks the §YImperial Right§! and §YHorasheshi Tribute§! Stewardship Reforms."
A29_imperial_right_tt: "Gain §G20%§! Province Warscore Cost for §Y5§! years when declaring War."
A29_boons_of_the_society_tt: "Enables the §YBoons of the Society§! privilege for the §YArtificer§! Estate."
A29_faster_genepillar_tt: "Gene pillar expeditions will be 25% faster!
A29_gene_pillar_hp_tt: "Gene Pillar expedition parties will have 1 more health
A29_refund_papal_influence_tt: "Rectorate actions will refund 1/4th of their cost on use."