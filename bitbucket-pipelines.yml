image: atlassian/default-image:3

pipelines:
  default:
    - step:
        name: Sync GitHub Mirror
        image: alpine/git:latest
        clone:
          enabled: false
        script:
          - git clone --bare git@bitbucket.org:JayBean/anbennar-eu4-fork-public-build.git
          - cd anbennar-eu4-fork-public-build.git
          - git push --mirror git@github.com:JayBean/Anbennar-PublicFork.git
    - parallel:
      - step:
          name: 'Encoding & Syntax Checks'
          condition:
              changesets:
                includePaths:
                  - "decisions/*.txt"
                  - "events/*.txt"
                  - "missions/*.txt"
                  - "common/**/*.txt"
                  - "localisation/*.yml"
          script:
            - echo "Running encoding and syntax checks..."
            - /bin/bash scripts/encoding.sh -t -l -i
      - step:
          name: 'Loc key collision check'
          condition:
              changesets:
                includePaths:
                  - "localisation/*.yml"
          script:
            - echo "Checking loc key collisions..."
            - python3 hash_collision_detect.py            

