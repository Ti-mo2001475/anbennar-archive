image: alpine:latest

# Several different things combine to make keeping this validation logic in CI
# untenable for Anbennar right now
# 1. Gitlab requires that any user who initiates a gitlab-hosted CI job is
# "verified", which for some can require submitting their phone number or credit
# card details
# 2. If a user fails this check, it produces a "failed job" marker that confuses
# contributors, **no matter if the job would even qualify for the workflow
# rules** (so even the initial-phase "only run CI for maintainer merges"
# produces these confusing "failed job" markers)
# 3. One way we could get around the verification requirement would be to
# qualify for an open source project, but that is not currently possible since
# we don't publish under an OSI license.
# 4. Another way could be to simply buy some CI minutes for the project, but
# this doesn't remove the requirement for contributors to be verified
#
# Links:
# - https://docs.gitlab.com/security/identity_verification/
# - https://docs.gitlab.com/ci/debugging/#error-identity-verification-is-required-in-order-to-run-ci-jobs
# - https://about.gitlab.com/solutions/open-source/join/

variables:
    GIT_DEPTH: "1"
    GIT_FETCH_EXTRA_FLAGS: --quiet --no-tags

before_script:
    - apk add --no-cache file bash python3 grep git
    - git config --global maintenance.auto false

workflow:
    rules:
        - if: ($CI_COMMIT_BRANCH == "new-master" || $CI_COMMIT_BRANCH == "steam" || $CI_COMMIT_BRANCH == "GitlabPRPipeline") && $CI_PIPELINE_SOURCE == "push" && $CI_PROJECT_PATH == "anbennar/anbennar-eu4-dev"
        - when: never

.validate: # "." is special syntax to disable the job
    script:
        - git fetch --filter=blob:none --no-tags --depth=1 origin "$CI_COMMIT_BEFORE_SHA"
        - |
            # --- detect changed files ---
            if [ "$CI_COMMIT_BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
              CHANGED_TXT=$(git diff-tree --no-commit-id --name-only -r HEAD | grep -E '\.txt$' || true)
              CHANGED_YML=$(git diff-tree --no-commit-id --name-only -r HEAD | grep -E '^localisation/.*\.yml$' || true)
            else
              CHANGED_TXT=$(git diff --name-only --diff-filter=ACMR "$CI_COMMIT_BEFORE_SHA..$CI_COMMIT_SHA" | grep -E '\.txt$' || true)
              CHANGED_YML=$(git diff --name-only --diff-filter=ACMR "$CI_COMMIT_BEFORE_SHA..$CI_COMMIT_SHA" | grep -E '^localisation/.*\.yml$' || true)
            fi

            FAIL=0
        - |
            # --- encoding & indentation (.txt) ---
            #!/bin/bash
            if [ -n "$CHANGED_TXT" ]; then
              echo "=== Checking encoding and indentation for changed .txt files ==="
              IFS=$'\n'
              echo "$CHANGED_TXT"
              set -f
              set -- $CHANGED_TXT
              set +f
              ./scripts/encoding.sh -t -i "$@" || FAIL=1
            else
              echo "--- No .txt files changed, skipping ---"
            fi

        - |
            # --- encoding (.yml) ---
            #!/bin/bash
            if [ -n "$CHANGED_YML" ]; then
              echo "=== Checking encoding for changed .yml files ==="
              echo "$CHANGED_YML"
              IFS=$'\n'
              set -f
              set -- $CHANGED_YML
              set +f
              scripts/encoding.sh -l "$@" || FAIL=1
              echo "=== Checking key collisions (all localisation files, to catch collisions with unchanged keys) ==="
              python3 scripts/hash_collision_detect.py || FAIL=1
            else
              echo "--- No localisation files changed, skipping ---"
            fi

        - |
            if [ $FAIL -eq 1 ]; then exit 1; fi
