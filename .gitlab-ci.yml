image: alpine:latest

before_script:
  - apk add --no-cache file bash python3 grep git

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "new-master" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "steam")
    - when: never

validate:
  script:
    - |
      CHANGED_TXT=$(git diff --name-only --diff-filter=ACMR "$CI_MERGE_REQUEST_DIFF_BASE_SHA..HEAD" | grep -E '\.txt$' || true)
      CHANGED_YML=$(git diff --name-only --diff-filter=ACMR "$CI_MERGE_REQUEST_DIFF_BASE_SHA..HEAD" | grep -E '^localisation/.*\.yml$' || true)

      FAIL=0

      # --- encoding & indentation (.txt) ---
      if [ -n "$CHANGED_TXT" ]; then
        echo "=== Checking encoding and indentation for changed .txt files ==="
        echo "$CHANGED_TXT"
        bash scripts/encoding.sh -t -i $CHANGED_TXT || FAIL=1
      else
        echo "--- No .txt files changed, skipping ---"
      fi

      # --- encoding (.yml) ---
      if [ -n "$CHANGED_YML" ]; then
        echo "=== Checking encoding for changed .yml files ==="
        echo "$CHANGED_YML"
        bash scripts/encoding.sh -l $CHANGED_YML || FAIL=1

        echo "=== Checking key collisions (all localisation files, to catch collisions with unchanged keys) ==="
        python3 scripts/hash_collision_detect.py || FAIL=1
      else
        echo "--- No localisation files changed, skipping ---"
      fi

      if [ $FAIL -eq 1 ]; then exit 1; fi
